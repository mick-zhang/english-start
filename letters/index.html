<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字母读音对比</title><style>body{font-family:system-ui;max-width:720px;margin:24px auto;padding:0 16px;background:#f6f8f7;color:#17211f}h1{font-size:20px}p{color:#5d6b67}table{width:100%;border-collapse:collapse}td{padding:8px 6px;border-bottom:1px solid #d9e1de;vertical-align:middle}td.l{font:700 26px system-ui;width:44px}button{border:1px solid #d9e1de;background:#fff;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;min-width:84px}button:hover{border-color:#0f6b5c}.all{background:#0f6b5c;color:#fff;border-color:#0f6b5c;margin:8px 4px 16px 0}</style></head><body><h1>A–Z 读音对比</h1><p>每个字母有两个版本。听完告诉我：“全部用 1” / “全部用 2”，或者列出哪些字母要用 2（例如 “A E I 用 2，其余用 1”）。</p><button class="all" onclick="all(1)">▶ 连播全部版本 1</button><button class="all" onclick="all(2)">▶ 连播全部版本 2</button><table><tr><td class="l">A</td><td><button onclick="p('A_bare.mp3')">版本 1</button></td><td><button onclick="p('A_spell.mp3')">版本 2</button></td></tr><tr><td class="l">B</td><td><button onclick="p('B_bare.mp3')">版本 1</button></td><td><button onclick="p('B_spell.mp3')">版本 2</button></td></tr><tr><td class="l">C</td><td><button onclick="p('C_bare.mp3')">版本 1</button></td><td><button onclick="p('C_spell.mp3')">版本 2</button></td></tr><tr><td class="l">D</td><td><button onclick="p('D_bare.mp3')">版本 1</button></td><td><button onclick="p('D_spell.mp3')">版本 2</button></td></tr><tr><td class="l">E</td><td><button onclick="p('E_bare.mp3')">版本 1</button></td><td><button onclick="p('E_spell.mp3')">版本 2</button></td></tr><tr><td class="l">F</td><td><button onclick="p('F_bare.mp3')">版本 1</button></td><td><button onclick="p('F_spell.mp3')">版本 2</button></td></tr><tr><td class="l">G</td><td><button onclick="p('G_bare.mp3')">版本 1</button></td><td><button onclick="p('G_spell.mp3')">版本 2</button></td></tr><tr><td class="l">H</td><td><button onclick="p('H_bare.mp3')">版本 1</button></td><td><button onclick="p('H_spell.mp3')">版本 2</button></td></tr><tr><td class="l">I</td><td><button onclick="p('I_bare.mp3')">版本 1</button></td><td><button onclick="p('I_spell.mp3')">版本 2</button></td></tr><tr><td class="l">J</td><td><button onclick="p('J_bare.mp3')">版本 1</button></td><td><button onclick="p('J_spell.mp3')">版本 2</button></td></tr><tr><td class="l">K</td><td><button onclick="p('K_bare.mp3')">版本 1</button></td><td><button onclick="p('K_spell.mp3')">版本 2</button></td></tr><tr><td class="l">L</td><td><button onclick="p('L_bare.mp3')">版本 1</button></td><td><button onclick="p('L_spell.mp3')">版本 2</button></td></tr><tr><td class="l">M</td><td><button onclick="p('M_bare.mp3')">版本 1</button></td><td><button onclick="p('M_spell.mp3')">版本 2</button></td></tr><tr><td class="l">N</td><td><button onclick="p('N_bare.mp3')">版本 1</button></td><td><button onclick="p('N_spell.mp3')">版本 2</button></td></tr><tr><td class="l">O</td><td><button onclick="p('O_bare.mp3')">版本 1</button></td><td><button onclick="p('O_spell.mp3')">版本 2</button></td></tr><tr><td class="l">P</td><td><button onclick="p('P_bare.mp3')">版本 1</button></td><td><button onclick="p('P_spell.mp3')">版本 2</button></td></tr><tr><td class="l">Q</td><td><button onclick="p('Q_bare.mp3')">版本 1</button></td><td><button onclick="p('Q_v2.mp3')">版本 2</button> <button onclick="p('Q_v3.mp3')">版本 3</button> <button onclick="p('Q_v4.mp3')">版本 4</button></td></tr><tr><td class="l">R</td><td><button onclick="p('R_bare.mp3')">版本 1</button></td><td><button onclick="p('R_spell.mp3')">版本 2</button></td></tr><tr><td class="l">S</td><td><button onclick="p('S_bare.mp3')">版本 1</button></td><td><button onclick="p('S_spell.mp3')">版本 2</button></td></tr><tr><td class="l">T</td><td><button onclick="p('T_bare.mp3')">版本 1</button></td><td><button onclick="p('T_spell.mp3')">版本 2</button></td></tr><tr><td class="l">U</td><td><button onclick="p('U_bare.mp3')">版本 1</button></td><td><button onclick="p('U_spell.mp3')">版本 2</button></td></tr><tr><td class="l">V</td><td><button onclick="p('V_bare.mp3')">版本 1</button></td><td><button onclick="p('V_spell.mp3')">版本 2</button></td></tr><tr><td class="l">W</td><td><button onclick="p('W_bare.mp3')">版本 1</button></td><td><button onclick="p('W_spell.mp3')">版本 2</button></td></tr><tr><td class="l">X</td><td><button onclick="p('X_bare.mp3')">版本 1</button></td><td><button onclick="p('X_spell.mp3')">版本 2</button></td></tr><tr><td class="l">Y</td><td><button onclick="p('Y_bare.mp3')">版本 1</button></td><td><button onclick="p('Y_spell.mp3')">版本 2</button></td></tr><tr><td class="l">Z</td><td><button onclick="p('Z_bare.mp3')">版本 1</button></td><td><button onclick="p('Z_spell.mp3')">版本 2</button></td></tr></table><script>let a;function p(f){if(a)a.pause();a=new Audio(f);a.play();return a;}
async function all(v){const s=v===1?"_bare":"_spell";for(const L of "ABCDEFGHIJKLMNOPQRSTUVWXYZ"){await new Promise(r=>{const x=p(L+s+".mp3");x.onended=r;x.onerror=r;});await new Promise(r=>setTimeout(r,350));}}</script></body></html>
