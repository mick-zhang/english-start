{ id:"l4c3", lv:4, title:"条件句：如果……就……", goal:"能用三种条件句谈真实可能、假设和遗憾，掌握 If 句的时态搭配。",
  intro:"“如果……就……”是表达计划、建议、假设和遗憾的核心结构。英语有三种：<b>第一条件句</b>（真实可能：If it rains, I'll stay home）、<b>第二条件句</b>（现在的假设：If I had a car, I would drive）、<b>第三条件句</b>（过去的遗憾：If I had known, I would have come）。关键是<b>时态搭配</b>：If 后面的时态要“往后退一步”，主句用 will / would / would have。中国学习者最常见的错误是在 If 后面用 will。",
  learn:[{h:"第一条件句：真实可能",p:"If + 现在时，will + 动词原形。",items:[
   {en:"If it rains tomorrow, I'll stay home.", ipa:"", zh:"如果明天下雨，我就待在家。", tip:"If 后面用 rains（现在时），不是 will rain。"},
   {en:"If you need help, just call me.", ipa:"", zh:"如果你需要帮助，打电话给我就行。", tip:"主句可以是命令句。"},
   {en:"You'll miss the bus if you don't hurry.", ipa:"", zh:"你不快点就赶不上公交了。", tip:"If 句也可以放后面。"},
   {en:"If I have time, I'll come to the party.", ipa:"", zh:"如果有时间我就来参加派对。", tip:"真实可能发生的事。"}]},
   {h:"第二条件句：现在的假设",p:"If + 过去时，would + 动词原形。说的是“不太可能”或“并非事实”。",items:[
   {en:"If I had a car, I would drive to work.", ipa:"", zh:"如果我有车，我就开车上班。（但我没有）", tip:"had 不是过去，是“假设”。"},
   {en:"If I were you, I would take the job.", ipa:"", zh:"如果我是你，我会接受这份工作。", tip:"给建议的经典句。If I were you，用 were 不用 was。"},
   {en:"What would you do if you won the lottery?", ipa:"", zh:"如果你中了彩票会做什么？", tip:"would 读 /wʊd/，l 不发音。"},
   {en:"I'd travel the world if I had the money.", ipa:"", zh:"如果有钱我会环游世界。", tip:"I'd = I would。"}]},
   {h:"第三条件句：过去的遗憾",p:"If + had + 过去分词，would have + 过去分词。",items:[
   {en:"If I had known, I would have come.", ipa:"", zh:"如果我早知道，我就来了。（但我不知道，所以没来）", tip:"would have 口语读 “would-ə”。"},
   {en:"If you had called me, I would have helped you.", ipa:"", zh:"你要是给我打电话，我就帮你了。", tip:"带一点责备。"},
   {en:"I would have passed if I had studied more.", ipa:"", zh:"我多学点就能及格了。", tip:"典型的遗憾句。"}]}],
  drills:[["If it rains tomorrow, I'll stay home.","If + 现在，will"],["If you need help, just call me.","If + 命令"],["If I were you, I would take the job.","If I were you"],["What would you do if you won the lottery?","would 的 l 不发音"],["If I had known, I would have come.","would-ə"],["I would have passed if I had studied more.","遗憾"]],
  ex:[
   {t:"mc",q:"哪句是对的？",opts:["If it rains, I'll stay home.","If it will rain, I'll stay home.","If it rains, I stay home will.","If it rained, I'll stay home."],a:0},
   {t:"mc",q:"给朋友建议“如果我是你，我会去看医生”，说？",opts:["If I were you, I would see a doctor.","If I am you, I will see a doctor.","If I was you, I see a doctor.","If I be you, I would see a doctor."],a:0},
   {t:"listen",q:"听一听，这是真实可能、现在假设，还是过去遗憾？",say:"If I had known, I would have come.",opts:["过去的遗憾","真实可能","现在的假设","将来的计划"],a:0},
   {t:"listen",q:"听一听，他会做什么？",say:"If I had the money, I'd buy a house.",opts:["买房子（假设有钱）","已经买了房子","明天去买房子","不想买房子"],a:0},
   {t:"type",q:"翻译：如果你需要帮助，打电话给我就行。",a:"If you need help, just call me.",alt:["If you need help, just call me","If you need help, call me.","If you need help call me"]},
   {t:"type",q:"听写这句话。",say:"If I were you, I would take the job.",a:"If I were you, I would take the job.",alt:["If I were you, I would take the job","If I were you I would take the job","If I were you, I'd take the job."]}],
  hw:[["三句假设","用三种条件句各写一句关于自己的真话：一件可能发生的事、一个假设、一个遗憾。"],["If I were you","今天对一个人用 “If I were you, I would…” 给一条建议。"],["中彩票问题","问一位朋友 “What would you do if you won the lottery?”，听懂并复述对方的答案。"]]
},
{ id:"l4c4", lv:4, title:"被动语态：事情被怎样了", goal:"能理解和使用被动语态，读懂通知、新闻和说明里的被动句。",
  intro:"通知、新闻、产品说明里到处是被动句：<b>The store is closed. / The meeting was cancelled. / Made in Canada.</b> 被动语态的结构是 <b>be + 过去分词</b>，重点在<b>事情本身</b>，而不是谁做的。中国学习者容易漏掉 be（说成 “The meeting cancelled”），或者把过去分词用错。本章先学会<b>读懂</b>被动句，再学在<b>不知道或不重要谁做的</b>时候用它。",
  learn:[{h:"被动语态的结构",p:"be 的时态变，过去分词不变。",items:[
   {en:"The store is closed on Sundays.", ipa:"", zh:"商店周日关门。", tip:"is + closed。"},
   {en:"The meeting was cancelled.", ipa:"", zh:"会议被取消了。", tip:"was + cancelled。谁取消的不重要。"},
   {en:"The package will be delivered tomorrow.", ipa:"", zh:"包裹明天送到。", tip:"will be + delivered。"},
   {en:"The room has been cleaned.", ipa:"", zh:"房间已经打扫过了。", tip:"has been + cleaned。"},
   {en:"My car is being repaired.", ipa:"", zh:"我的车正在修。", tip:"is being + repaired：正在被……"}]},
   {h:"生活里的被动句",p:"",items:[
   {en:"Made in Canada. / Sold out. / Closed for renovation.", ipa:"", zh:"加拿大制造。/ 售完。/ 装修中暂停营业。", tip:"标牌上常省略 be。"},
   {en:"Your order has been shipped.", ipa:"", zh:"您的订单已发出。", tip:"网购邮件必见。"},
   {en:"Masks are required. / Dogs are not allowed.", ipa:"", zh:"须戴口罩。/ 禁止带狗。", tip:"required = 必须；not allowed = 不许。"},
   {en:"I was born in Shanghai.", ipa:"", zh:"我在上海出生。", tip:"“出生”永远是被动：was born。"},
   {en:"English is spoken here.", ipa:"", zh:"这里说英语。", tip:"spoken 是 speak 的过去分词。"}]},
   {h:"主动 vs 被动",p:"",items:[
   {en:"Someone stole my bike. → My bike was stolen.", ipa:"", zh:"有人偷了我的自行车。→ 我的自行车被偷了。", tip:"不知道谁偷的，用被动更自然。"},
   {en:"They built this bridge in 1950. → This bridge was built in 1950.", ipa:"", zh:"这座桥建于 1950 年。", tip:"谁建的不重要。"},
   {en:"The bike was stolen by a teenager.", ipa:"", zh:"自行车被一个青少年偷了。", tip:"要说谁做的，加 by。"}]}],
  drills:[["The store is closed on Sundays.","is + closed"],["The meeting was cancelled.","was + cancelled"],["The package will be delivered tomorrow.","will be + delivered"],["Your order has been shipped.","has been + shipped"],["I was born in Shanghai.","was born"],["My bike was stolen. My car is being repaired.","两种时态"]],
  ex:[
   {t:"mc",q:"“会议被取消了。” 哪句对？",opts:["The meeting was cancelled.","The meeting cancelled.","The meeting is cancel.","The meeting has cancel."],a:0},

   {t:"mc",q:"“Dogs are not allowed.” 意思是？",opts:["禁止带狗","狗没有被允许离开","狗不喜欢","这里有狗"],a:0},
   {t:"listen",q:"听一听，发生了什么？",say:"My phone was stolen yesterday.",opts:["手机被偷了","手机修好了","买了新手机","手机送到了"],a:0},
   {t:"type",q:"翻译：我在北京出生。",a:"I was born in Beijing.",alt:["I was born in Beijing","i was born in beijing"]},

{ id:"l4c5", lv:4, title:"看懂新闻：标题、结构与高频词", goal:"能看懂英文新闻标题和导语，掌握新闻英语的特殊语法和 30 个高频词。",
  intro:"新闻英语是一种<b>特殊方言</b>：标题省略 be 和冠词、用现在时讲过去的事、用短词代替长词（<b>cut</b> 代替 reduce，<b>bid</b> 代替 attempt）。但新闻的<b>结构非常固定</b>：标题 → 导语（第一段，回答谁、什么、哪里、何时）→ 细节 → 背景。所以读新闻的办法是：<b>先读标题和第一段</b>，懂了就够了，后面都是补充。本章教你解码标题，再给你 30 个新闻高频词。",
  learn:[{h:"标题的语法",p:"",items:[
   {en:"City to Build New Hospital", ipa:"", zh:"= The city is going to build a new hospital. 市政府将建新医院", tip:"to + 动词 = 将要。省略 the、a、is going。"},
   {en:"Prices Rise as Rent Hits Record High", ipa:"", zh:"= Prices are rising as rent has hit a record high. 物价上涨，房租创新高", tip:"现在时讲最近发生的事。"},
   {en:"Three Injured in Highway Crash", ipa:"", zh:"= Three people were injured in a highway crash. 高速车祸三人受伤", tip:"省略 be：Injured = were injured。"},
   {en:"PM Announces Tax Cut", ipa:"", zh:"= The Prime Minister has announced a tax cut. 总理宣布减税", tip:"PM = Prime Minister。cut 代替 reduction。"}]},
   {h:"新闻高频词（一）",p:"",items:[
   {en:"announce, report, confirm, deny, claim", ipa:"", zh:"宣布、报道、确认、否认、声称", tip:"deny 重音在后：de-NY。"},
   {en:"increase, decrease, rise, fall, drop", ipa:"", zh:"增加、减少、上升、下降、下跌", tip:"数字新闻的五个动词。"},
   {en:"government, minister, mayor, official, police", ipa:"", zh:"政府、部长、市长、官员、警方", tip:"official 重音在 FI。"},
   {en:"economy, inflation, interest rate, unemployment", ipa:"", zh:"经济、通胀、利率、失业", tip:"inflation 重音在 FLA。"}]},
   {h:"新闻高频词（二）",p:"",items:[
   {en:"according to, due to, as a result, meanwhile", ipa:"", zh:"据……、由于、结果、与此同时", tip:"according to = 根据某人/机构说。"},
   {en:"a record high, a sharp drop, a slight increase", ipa:"", zh:"创纪录的高、急剧下降、略微增加", tip:"形容幅度的三种说法。"},
   {en:"According to the report, unemployment fell to five percent last month.", ipa:"", zh:"据报告，上月失业率降至 5%。", tip:"典型导语句。"},
   {en:"The mayor confirmed that the project will be delayed due to costs.", ipa:"", zh:"市长确认项目将因成本推迟。", tip:"confirmed that + 完整句子。"}]}],
  drills:[["City to Build New Hospital","标题：to = 将要"],["Three Injured in Highway Crash","省略 be"],["announce, confirm, deny, claim","新闻动词"],["increase, decrease, rise, fall, drop","数字动词"],["According to the report, unemployment fell to five percent last month.","导语句"],["The mayor confirmed that the project will be delayed due to costs.","confirmed that"]],
  ex:[
   {t:"mc",q:"标题 “City to Build New Hospital” 的意思是？",opts:["市政府将建新医院","市政府已建成新医院","市政府反对建新医院","新医院建在城市里"],a:0},
   {t:"mc",q:"标题 “Three Injured in Crash” 里省略了什么？",opts:["were（被动的 be）","to","will","the three"],a:0},

   {t:"mc",q:"“according to the police” 意思是？",opts:["据警方说","为了警方","和警方一起","反对警方"],a:0},
   {t:"type",q:"听写这个词（“宣布”）。",say:"announce",a:"announce"},
   {t:"type",q:"把标题补成完整句：“Prices Rise”",a:"Prices are rising.",alt:["Prices are rising","The prices are rising.","Prices rise.","Prices are rising"]}],
  hw:[["每日一标题","每天读 3 个英文新闻标题（CBC、CTV 网站），把每个标题补成完整句子。坚持一周。"],["读一段导语","选一篇新闻只读第一段，回答：谁？做了什么？在哪？什么时候？"],["讲给别人","用三句英语把一条新闻讲给朋友：According to ___, ___ . 对方能听懂就算成功。"]]

{ id:"l4c6", lv:4, title:"讨论观点：同意、不同意与说明理由", goal:"能在讨论中表达观点、礼貌地不同意、给出理由和举例，不只是说 yes 或 no。",
  intro:"到了中级，能不能<b>参与讨论</b>是分水岭。北美文化里，有不同意见是正常的，但<b>怎么说</b>很重要：直接说 “You're wrong” 很冒犯；说 “I see your point, but…” 就得体。本章给你一套完整工具：<b>表达观点</b>（I think / In my opinion）→ <b>同意</b>（Exactly / I agree）→ <b>部分不同意</b>（That's true, but…）→ <b>给理由</b>（because / the reason is）→ <b>举例</b>（For example）→ <b>总结</b>（So, overall）。",
  learn:[{h:"表达观点",p:"",items:[
   {en:"I think / I believe / In my opinion, ___.", ipa:"", zh:"我认为 / 我相信 / 在我看来", tip:"三种开头，In my opinion 最正式。"},
   {en:"Personally, I prefer working from home.", ipa:"", zh:"就我个人而言，我更喜欢在家工作。", tip:"Personally 表示“这只是我的看法”。"},
   {en:"It seems to me that prices are too high.", ipa:"", zh:"我觉得价格太高了。", tip:"It seems to me 比 I think 更委婉。"},
   {en:"The way I see it, we have two options.", ipa:"", zh:"在我看来，我们有两个选择。", tip:"口语常用。"}]},
   {h:"同意与不同意",p:"",items:[
   {en:"Exactly. / I totally agree. / That's a good point.", ipa:"", zh:"没错。/ 我完全同意。/ 说得好。", tip:"三种程度的同意。"},
   {en:"I see your point, but I'm not sure I agree.", ipa:"", zh:"我明白你的意思，但我不太同意。", tip:"最礼貌的不同意：先肯定，再 but。"},

{ id:"l4c7", lv:4, title:"第四级结业：5 分钟工作汇报", goal:"能做一个 5 分钟的结构化口头汇报：背景、做了什么、结果、下一步，并回答一两个提问。",
  intro:"工作汇报是中级英语最实用的输出。它比闲聊容易，因为<b>结构是固定的</b>，你可以提前准备。标准结构：<b>开场</b>（说明主题和时长）→ <b>背景</b>（为什么做）→ <b>做了什么</b>（过去时）→ <b>结果</b>（数字 + 完成时）→ <b>下一步</b>（将来时）→ <b>提问</b>。关键技巧：<b>路标词</b>（First / Next / Finally）让听众知道你讲到哪了；每部分不超过四句。",
  learn:[{h:"开场与路标词",p:"",items:[
   {en:"Good morning, everyone. Today I'd like to give you a quick update on the new website.", ipa:"", zh:"大家早上好。今天我想简短汇报一下新网站的进展。", tip:"一句话说主题。update on = 关于……的进展。"},
   {en:"I'll cover three things: the background, what we did, and the next steps.", ipa:"", zh:"我会讲三点：背景、我们做了什么、下一步。", tip:"先告诉听众结构。"},
   {en:"First, / Next, / Then, / Finally,", ipa:"", zh:"首先 / 接着 / 然后 / 最后", tip:"每换一部分就用一个。"},
   {en:"Let me move on to the results.", ipa:"", zh:"我接着说结果。", tip:"move on to = 转到。"}]},
   {h:"背景、行动、结果",p:"",items:[
   {en:"The problem was that customers couldn't find the contact page.", ipa:"", zh:"问题是客户找不到联系页面。", tip:"背景：The problem was that…"},
   {en:"So we redesigned the menu and added a search bar.", ipa:"", zh:"所以我们重新设计了菜单，加了搜索栏。", tip:"行动：过去时。"},
   {en:"As a result, calls to support have dropped by thirty percent.", ipa:"", zh:"结果，客服电话减少了 30%。", tip:"结果：数字 + 完成时。dropped by = 下降了（幅度）。"},
   {en:"We've also received positive feedback from users.", ipa:"", zh:"我们也收到了用户的正面反馈。", tip:"feedback 不可数，不加 s。"}]},
   {h:"下一步与提问",p:"",items:[
   {en:"Next, we're going to test it on mobile.", ipa:"", zh:"接下来我们要在手机上测试。", tip:"下一步：将来时。"},
   {en:"We expect to finish by the end of the month.", ipa:"", zh:"我们预计月底前完成。", tip:"by = 不迟于。"},
   {en:"That's all from me. Any questions?", ipa:"", zh:"我就说这些。有问题吗？", tip:"结尾固定句。"},
   {en:"Good question. Let me check and get back to you.", ipa:"", zh:"好问题。我查一下再回复你。", tip:"回答不了时的万能句。"},
   {en:"If I understand correctly, you're asking about the cost?", ipa:"", zh:"如果我理解得对，你是问成本？", tip:"没听清问题时先确认。"}]}],
  drills:[["Today I'd like to give you a quick update on the new website.","开场"],["I'll cover three things: the background, what we did, and the next steps.","说结构"],["The problem was that customers couldn't find the contact page.","背景"],["As a result, calls to support have dropped by thirty percent.","结果"],["Next, we're going to test it on mobile. We expect to finish by the end of the month.","下一步"],["That's all from me. Any questions? Good question. Let me check and get back to you.","结尾 + 应答"]],
  ex:[
   {t:"mc",q:"汇报开场应该先说？",opts:["主题和要讲的几点","自己的英语不好","详细的数字","谢谢大家"],a:0},
   {t:"listen",q:"听一听，结果是什么？",say:"As a result, sales have increased by twenty percent.",opts:["销售额增加了 20%","销售额减少了 20%","成本增加了 20%","客户减少了 20%"],a:0},
   {t:"mc",q:"被问到一个答不上来的问题，说？",opts:["Good question. Let me check and get back to you.","I don't know.","No.","Next question."],a:0},
   {t:"listen",q:"听一听，他接下来要讲什么？",say:"Let me move on to the next steps.",opts:["下一步","背景","结果","问题"],a:0},
   {t:"type",q:"翻译：我就说这些。有问题吗？",a:"That's all from me. Any questions?",alt:["That's all from me. Any questions","That's all. Any questions?","That's all from me, any questions?"]},
   {t:"type",q:"听写这句话。",say:"We expect to finish by the end of the month.",a:"We expect to finish by the end of the month.",alt:["We expect to finish by the end of the month","we expect to finish by the end of the month"]}],
  hw:[["写汇报稿","选一件你最近做的事（工作项目、家里的事都可以），按“开场 → 背景 → 做了什么 → 结果 → 下一步”写一份 5 分钟的稿子。"],["计时练习","对着手机录像讲一遍，计时。超过 6 分钟就删内容，不到 4 分钟就加例子。练到不看稿。"],["结业汇报（必做）","对至少一个真人做这个 5 分钟汇报（同事、朋友、语言伙伴），请对方提两个问题，你当场回答。"]]

{ id:"l5c1", lv:5, title:"口音打磨：北美音的细节", goal:"掌握北美口音的四个标志性特征，让你的英语听起来更自然、更容易被听懂。",
  intro:"到了第五级，你的发音已经“正确”了。现在追求的是<b>自然</b>。北美口音有几个标志：① <b>闪音 t</b>：water 读成 “wadder”，better 读成 “bedder”；② <b>卷舌 r</b>：car、hard、work 的 r 都要卷；③ <b>鼻音前的元音</b>：can't、man 带一点鼻音；④ <b>句尾 t 的吞音</b>：what、that 的结尾 t 不完全释放。这些不是“必须”，但做到了会让母语者<b>不用费力就能听懂你</b>——这才是口音的意义。",
  learn:[{h:"闪音 t：两个元音之间的 t 读成轻快的 d",p:"",items:[
   {en:"water, better, little, city", ipa:"", zh:"水、更好、小、城市", tip:"wadder, bedder, liddle, ciddy。舌尖轻轻弹一下。"},
   {en:"What a beautiful day!", ipa:"", zh:"多美的一天！", tip:"What a → “wadda”；beautiful → “byoodiful”。"},
   {en:"I got it. / Get out of here.", ipa:"", zh:"我明白了。/ 出去。", tip:"got it → “goddit”；out of → “oudda”。"},
   {en:"Put it on the table.", ipa:"", zh:"把它放在桌上。", tip:"Put it on → “pudidon”。"}]},
   {h:"卷舌 r 与吞音 t",p:"",items:[
   {en:"car, far, hard, park, start", ipa:"", zh:"车、远、硬、公园、开始", tip:"北美音 r 一定要卷：舌头后缩、不碰任何地方。英式音不卷，北美音必须卷。"},
   {en:"work, word, world, first, nurse", ipa:"", zh:"工作、词、世界、第一、护士", tip:"/ɜːr/ 全程带 r，world 的 rl 最难，慢慢来。"},
   {en:"What? / That's right. / I don't know.", ipa:"", zh:"什么？/ 对。/ 我不知道。", tip:"句尾的 t 和 n't 的 t 不释放：喉头轻轻一卡就停。"},
   {en:"button, mountain, certain", ipa:"", zh:"按钮、山、确定", tip:"t 后面是 n 时，t 变成喉塞音：“bu'n”、“moun'n”。"}]},
   {h:"整句模仿",p:"先听三遍，再影子跟读。",items:[
   {en:"I'd better get a little water before we start.", ipa:"", zh:"开始前我最好喝点水。", tip:"better、little、water 三个闪音 t；start 卷舌。"},
   {en:"What are you doing later? Wanna get a bite to eat?", ipa:"", zh:"你一会儿干什么？想去吃点东西吗？", tip:"Whaddaya、lader、bide to eat。"},
   {en:"It's not that hard once you get the hang of it.", ipa:"", zh:"一旦掌握了窍门就不难了。", tip:"not that → 两个吞音 t；get the hang of it = 掌握窍门。"}]}],
  drills:[["water, better, little, city","闪音 t"],["What a beautiful day!","wadda byoodiful"],["car, far, hard, work, world","卷舌 r"],["button, mountain, certain","喉塞音 t"],["I'd better get a little water before we start.","整句"],["It's not that hard once you get the hang of it.","吞音 + 短语"]],
  ex:[
   {t:"listen",q:"听一听，这个词的 t 读成了什么？",say:"better",opts:["轻快的 d（闪音）","清楚的 t","没读","s"],a:0},
   {t:"mc",q:"北美口音里，car 的 r 应该？",opts:["卷舌，舌头后缩不碰任何地方","不发音","像中文的“日”","像 l"],a:0},
   {t:"listen",q:"听一听，他说的是？",say:"Put it on the table.",opts:["把它放在桌上","把它拿下来","桌子上有东西","放在哪儿"],a:0},

   {t:"type",q:"听写这句话。",say:"What a beautiful day!",a:"What a beautiful day!",alt:["What a beautiful day","what a beautiful day"]},

{ id:"l5c2", lv:5, title:"演讲技巧：开场、结构与停顿", goal:"能设计并发表一场有结构、有停顿、有互动的演讲，掌握开场钩子和结尾升华。",
  intro:"好的演讲不是流利，而是<b>节奏和结构</b>。母语者讲得好的秘诀：① <b>开场有钩子</b>（一个问题、一个数字、一个故事）；② <b>三段结构</b>（听众只记得住三点）；③ <b>停顿</b>（重要的话之前停两秒，比大声更有力）；④ <b>互动</b>（反问、举手）；⑤ <b>结尾回到开头</b>。本章先给你这些工具的英文说法，再练一个 3 分钟的小演讲。记住：<b>说慢、停顿，是自信的表现，不是英语不好</b>。",
  learn:[{h:"开场钩子",p:"",items:[
   {en:"Raise your hand if you've ever forgotten someone's name.", ipa:"", zh:"如果你曾忘过别人的名字，请举手。", tip:"举手式开场，立刻让听众参与。"},
   {en:"Three years ago, I couldn't order a coffee in English.", ipa:"", zh:"三年前，我连用英语点咖啡都不会。", tip:"故事式开场，用自己的经历。"},
   {en:"Did you know that most people forget 90 percent of what they hear within a week?", ipa:"", zh:"你知道吗，大多数人一周内会忘掉听到的 90%。", tip:"数字式开场。Did you know that…"},
   {en:"Today I want to share three simple ideas with you.", ipa:"", zh:"今天我想和你们分享三个简单的想法。", tip:"钩子之后，马上告诉听众结构。"}]},
   {h:"过渡与强调",p:"",items:[
   {en:"That brings me to my second point.", ipa:"", zh:"这就引出我的第二点。", tip:"过渡句。"},
   {en:"Here's the thing: it's not about talent.", ipa:"", zh:"关键是：这和天赋无关。", tip:"Here's the thing 后面停两秒，再说重点。"},
   {en:"Let me say that again.", ipa:"", zh:"我再说一遍。", tip:"强调重点的方法：重复一次。"},
   {en:"Think about that for a second.", ipa:"", zh:"想一想。", tip:"给听众两秒停顿。"},
   {en:"And this is the part that surprised me.", ipa:"", zh:"而这是让我惊讶的部分。", tip:"制造期待。"}]},
   {h:"结尾",p:"",items:[
   {en:"So, to sum up: start small, practise daily, and don't be afraid to make mistakes.", ipa:"", zh:"总结一下：从小处开始、每天练、别怕犯错。", tip:"三点总结，和开头呼应。"},
   {en:"Remember that coffee I couldn't order? Last week, I gave a presentation in English.", ipa:"", zh:"还记得我点不了的那杯咖啡吗？上周，我用英语做了一场演讲。", tip:"回到开头的故事，这是最有力的结尾。"},
   {en:"I'll leave you with one question: what will you try this week?", ipa:"", zh:"最后留给大家一个问题：这周你会尝试什么？", tip:"I'll leave you with = 最后给大家留下。"},
   {en:"Thank you. I'm happy to take any questions.", ipa:"", zh:"谢谢。欢迎提问。", tip:"结尾固定句。"}]}],
  drills:[["Raise your hand if you've ever forgotten someone's name.","举手式开场"],["Three years ago, I couldn't order a coffee in English.","故事式开场"],["Today I want to share three simple ideas with you.","说结构"],["Here's the thing: it's not about talent.","停顿再说重点"],["That brings me to my second point.","过渡"],["I'll leave you with one question: what will you try this week? Thank you.","结尾"]],
  ex:[
   {t:"mc",q:"演讲开场最有效的是？",opts:["一个问题、数字或故事（钩子）","道歉自己英语不好","念出全部提纲","直接讲第一点"],a:0},
   {t:"listen",q:"听一听，这是哪种开场？",say:"Did you know that most people forget 90 percent of what they hear?",opts:["数字式","故事式","举手式","道歉式"],a:0},

   {t:"listen",q:"听一听，他要做什么？",say:"That brings me to my second point.",opts:["转到第二点","结束演讲","回答问题","重复第一点"],a:0},

{ id:"l5c3", lv:5, title:"复杂语法：定语从句与间接引语", goal:"能用 who / which / that 把句子连成复杂句，能转述别人说的话。",
  intro:"高级英语的句子不是更长的单句，而是<b>把几个意思连成一句</b>。两个最重要的工具：<b>定语从句</b>——用 who / which / that / where 把两句合并（The man who lives next door is a doctor）；<b>间接引语</b>——转述别人说的话（She said she was tired）。间接引语有一个中国学习者常忽略的规则：<b>时态往后退一步</b>（“I am tired” → she said she <b>was</b> tired），人称也要换。",
  learn:[{h:"定语从句：把两句合成一句",p:"",items:[
   {en:"The man who lives next door is a doctor.", ipa:"", zh:"住在隔壁的那个人是医生。", tip:"who 指人。= The man is a doctor. He lives next door."},
   {en:"This is the phone that I bought last week.", ipa:"", zh:"这是我上周买的手机。", tip:"that 指物。口语里 that 常省略：the phone I bought。"},
   {en:"The restaurant where we met has closed.", ipa:"", zh:"我们相遇的那家餐厅关门了。", tip:"where 指地方。"},
   {en:"My sister, who lives in Calgary, is visiting next week.", ipa:"", zh:"我姐姐（她住在卡尔加里）下周来看我。", tip:"有逗号的从句只是补充信息，可以去掉不影响意思。"},
   {en:"That's the reason why I moved here.", ipa:"", zh:"那就是我搬来这里的原因。", tip:"the reason why 固定搭配。"}]},
   {h:"间接引语：转述别人的话",p:"时态退一步，人称换掉。",items:[
   {en:"\"I'm tired.\" → She said she was tired.", ipa:"", zh:"“我累了。”→ 她说她累了。", tip:"am → was，I → she。"},
   {en:"\"I'll call you.\" → He said he would call me.", ipa:"", zh:"“我会给你打电话。”→ 他说他会给我打电话。", tip:"will → would，you → me。"},
   {en:"\"I've finished.\" → She told me she had finished.", ipa:"", zh:"“我做完了。”→ 她告诉我她做完了。", tip:"have → had。told 后面要有人（told me），said 后面不用。"},
   {en:"\"Where do you live?\" → He asked me where I lived.", ipa:"", zh:"“你住哪？”→ 他问我住哪。", tip:"转述问句：不再倒装，do 消失。"},
   {en:"\"Can you help?\" → She asked if I could help.", ipa:"", zh:"“你能帮忙吗？”→ 她问我能不能帮忙。", tip:"Yes/No 问句用 if。"}]},

{ id:"l5c4", lv:5, title:"地道表达：习语、委婉与幽默", goal:"听懂并恰当使用 30 个北美高频习语，掌握委婉表达和轻松幽默的分寸。",
  intro:"你能说正确的英语了，但母语者说的不是“正确的英语”，而是<b>地道的英语</b>：“It's a piece of cake”（小事一桩）、“Let's touch base”（我们碰一下）。习语不能硬背全部，<b>只学高频的</b>。另外两个高级技能：<b>委婉</b>——北美人很少直接说 no，而说 “I'll think about it”；<b>自嘲式幽默</b>——拿自己的口音、自己的失误开玩笑，立刻拉近距离。本章的原则：<b>先听懂，确定场合对了再用</b>。",
  learn:[{h:"工作场合高频习语",p:"",items:[
   {en:"Let's touch base tomorrow.", ipa:"", zh:"我们明天碰一下（简短沟通）。", tip:"touch base = 简短联络。"},
   {en:"I'm on the same page.", ipa:"", zh:"我们想法一致。", tip:"on the same page = 看法一致。"},
   {en:"Let's not reinvent the wheel.", ipa:"", zh:"别重复造轮子。", tip:"= 用现成的办法。"},
   {en:"That's a piece of cake.", ipa:"", zh:"小事一桩。", tip:"= 很容易。"},
   {en:"I'll keep you in the loop.", ipa:"", zh:"我会随时告诉你进展。", tip:"in the loop = 知道情况。"},
   {en:"It's a win-win.", ipa:"", zh:"双赢。", tip:"直接用。"}]},
   {h:"日常高频习语",p:"",items:[
   {en:"It's up to you.", ipa:"", zh:"你决定。", tip:"up to you = 由你定。"},
   {en:"I'm under the weather today.", ipa:"", zh:"我今天有点不舒服。", tip:"比 I'm sick 轻。"},
   {en:"Hang in there.", ipa:"", zh:"坚持住。", tip:"安慰别人。"},
   {en:"It cost an arm and a leg.", ipa:"", zh:"贵得要命。", tip:"= 非常贵。"},
   {en:"Let's play it by ear.", ipa:"", zh:"看情况再说。", tip:"= 不提前定。"},
   {en:"Break a leg!", ipa:"", zh:"祝你成功！（演出、面试前）", tip:"不是真的断腿，是祝好运。"}]},
   {h:"委婉与幽默",p:"",items:[
   {en:"I'll think about it. / Let me get back to you.", ipa:"", zh:"我考虑一下。/ 我再回复你。", tip:"北美式的“不”。听到这两句，多半是拒绝。"},
   {en:"That's an interesting idea, but I'm not sure it's the right fit.", ipa:"", zh:"想法很有意思，但我不确定合适。", tip:"interesting 在这里常常是委婉的“不行”。"},
   {en:"Sorry, my English is still a work in progress.", ipa:"", zh:"抱歉，我的英语还在“施工中”。", tip:"自嘲式幽默，对方一定会笑着说 Your English is great。"},
   {en:"I'm still getting used to the cold. Ask me again in ten years.", ipa:"", zh:"我还在适应这里的冷。十年后再问我。", tip:"关于天气的自嘲，加拿大人最爱。"},
   {en:"No worries. / No big deal.", ipa:"", zh:"没事。/ 不是什么大事。", tip:"别人道歉时的轻松回应。"}]}],
  drills:[["Let's touch base tomorrow. I'll keep you in the loop.","工作习语"],["That's a piece of cake. It's a win-win.","两个常用"],["It's up to you. Let's play it by ear.","日常习语"],["I'm under the weather today. Hang in there.","身体 + 安慰"],["I'll think about it. Let me get back to you.","委婉的不"],["Sorry, my English is still a work in progress.","自嘲"]],
  ex:[
   {t:"listen",q:"听一听，他的意思是？",say:"Let's touch base tomorrow.",opts:["明天简短沟通一下","明天去打棒球","明天碰面吃饭","明天别联系"],a:0},
   {t:"mc",q:"“It cost an arm and a leg.” 意思是？",opts:["贵得要命","受了伤","很便宜","付了手脚的钱"],a:0},

{ id:"l5c5", lv:5, title:"专业英语与谈判", goal:"能在专业场合清晰表达需求、提出条件、礼貌拒绝和达成一致，掌握谈判的语言套路。",
  intro:"谈判不只是商务：谈薪水、和房东谈租金、和装修工谈价格、和学校谈孩子的安排，都是谈判。英语谈判的风格是<b>软语气、硬内容</b>：用 “I was hoping…”、“Would it be possible…” 这样柔软的句子，提出明确的要求。本章给你完整的谈判语言：<b>开场定调</b> → <b>提出需求</b> → <b>讨价还价</b>（If you…, we could…）→ <b>礼貌拒绝</b> → <b>达成一致</b>。",
  learn:[{h:"开场与提出需求",p:"",items:[
   {en:"Thanks for taking the time to meet. I'd like to discuss the rent.", ipa:"", zh:"感谢你抽时间见面。我想谈谈房租。", tip:"先感谢，再一句说主题。"},
   {en:"I was hoping we could talk about my salary.", ipa:"", zh:"我希望我们能谈谈我的薪水。", tip:"I was hoping 是最柔软的开场。"},
   {en:"Would it be possible to start a week later?", ipa:"", zh:"有可能晚一周开始吗？", tip:"Would it be possible to = 最礼貌的请求。"},
   {en:"What I'm looking for is a two-year lease at the current rate.", ipa:"", zh:"我想要的是按现在的价格签两年。", tip:"What I'm looking for is = 明确说出需求。"},
   {en:"Based on my research, the market rate is around sixty thousand.", ipa:"", zh:"根据我的调查，市场价大约是六万。", tip:"用数据支撑。"}]},
   {h:"讨价还价",p:"",items:[
   {en:"If you can include utilities, I could sign today.", ipa:"", zh:"如果你能包水电，我今天就能签。", tip:"If you…, I could… 是谈判的核心句型。"},
   {en:"I understand your position, but that's a bit higher than I expected.", ipa:"", zh:"我理解你的立场，但这比我预期的高一些。", tip:"a bit higher 比 too high 柔和。"},
   {en:"Could you meet me halfway?", ipa:"", zh:"我们各让一步？", tip:"meet halfway = 折中。"},
   {en:"What would it take to get to fifteen hundred?", ipa:"", zh:"要怎样才能做到 1500？", tip:"把问题抛给对方。"},
   {en:"I'm not comfortable with that, I'm afraid.", ipa:"", zh:"恐怕我不太能接受。", tip:"礼貌但明确的拒绝。"},
   {en:"Let me think it over and get back to you by Friday.", ipa:"", zh:"让我考虑一下，周五前回复你。", tip:"不当场答应，给自己时间。"}]},
   {h:"达成一致",p:"",items:[
   {en:"That works for me. Let's go with that.", ipa:"", zh:"我可以接受。就这么定。", tip:"go with = 选择、采用。"},
   {en:"Just to confirm: twelve hundred a month, utilities included, starting March first.", ipa:"", zh:"确认一下：每月 1200，包水电，3 月 1 日开始。", tip:"口头达成后一定要重复确认。"},
   {en:"Could you put that in writing?", ipa:"", zh:"能写下来吗？", tip:"in writing = 书面。重要的事一定要。"},
   {en:"I appreciate your flexibility. I think we have a deal.", ipa:"", zh:"感谢你的灵活。我想我们成交了。", tip:"结尾感谢 + we have a deal。"}]}],
  drills:[["I was hoping we could talk about my salary.","柔软开场"],["Would it be possible to start a week later?","礼貌请求"],["If you can include utilities, I could sign today.","If…, I could…"],["I understand your position, but that's a bit higher than I expected.","柔和反对"],["Could you meet me halfway?","折中"],["Just to confirm: twelve hundred a month, utilities included. Could you put that in writing?","确认 + 书面"]],
  ex:[
   {t:"mc",q:"谈薪水最柔软的开场是？",opts:["I was hoping we could talk about my salary.","Give me more money.","My salary is too low.","I want a raise now."],a:0},
   {t:"listen",q:"听一听，他提的条件是？",say:"If you can include parking, I could sign today.",opts:["包停车位就今天签","今天不签","不要停车位","明天再谈"],a:0},
   {t:"mc",q:"“Could you meet me halfway?” 意思是？",opts:["我们各让一步","在半路见面","你能来接我吗","你走一半"],a:0},
   {t:"listen",q:"听一听，他接受了吗？",say:"I'm not comfortable with that, I'm afraid.",opts:["没接受（礼貌拒绝）","接受了","还在考虑","没听懂"],a:0},
   {t:"type",q:"翻译：能写下来吗？（用 in writing）",a:"Could you put that in writing?",alt:["Could you put that in writing","Can you put that in writing?","Could you put it in writing?"]},
   {t:"type",q:"听写这句话。",say:"That works for me.",a:"That works for me.",alt:["That works for me","that works for me"]}],
  hw:[["写谈判脚本","选一件你真要谈的事（租金、薪水、价格、安排），按“开场 → 需求 → 条件 → 拒绝句 → 确认”写脚本。"],["角色扮演","请朋友扮演对方，谈 10 分钟。目标：至少用一次 If you…, I could… 和一次礼貌拒绝。"],["真实谈判（必做）","进行一次真实的英语谈判（和房东、商家、雇主、学校）。结束后记录：结果如何？哪句话最有用？"]]
},
{ id:"l5c6", lv:5, title:"第五级结业：正式文件与 15 分钟演讲", goal:"能读懂并起草正式文件（合同要点、正式信函、投诉信），并完成结业任务：一场 15 分钟的英语演讲加问答。",
  intro:"这是整个课程的最后一章。两件事：第一，<b>正式书面英语</b>——合同、正式信函、投诉信的结构和用语，这是你在加拿大维护自己权益的工具；第二，<b>结业演讲</b>——15 分钟演讲加问答。从一个字母都不会读，到站着用英语讲 15 分钟——这就是你走过的路。演讲的主题由你定，但建议讲<b>你最懂的事</b>：你的专业、你的经历、你的文化。你懂的事，英语会跟上。",
  learn:[{h:"读懂合同：高频词",p:"",items:[
   {en:"The tenant shall pay the rent on the first day of each month.", ipa:"", zh:"租户须在每月一日支付房租。", tip:"shall = 必须（法律用语）；tenant = 租户；landlord = 房东。"},
   {en:"Either party may terminate this agreement with sixty days' written notice.", ipa:"", zh:"任何一方可提前 60 天书面通知终止本协议。", tip:"party = 一方；terminate = 终止；notice = 通知。"},
   {en:"This offer is valid until March thirty-first.", ipa:"", zh:"本报价有效期至 3 月 31 日。", tip:"valid until = 有效至。"},
   {en:"The employee is entitled to two weeks of paid vacation.", ipa:"", zh:"员工享有两周带薪假。", tip:"be entitled to = 有权享有。"},
   {en:"Please read the terms and conditions carefully before signing.", ipa:"", zh:"签字前请仔细阅读条款。", tip:"terms and conditions = 条款。"}]},
   {h:"正式信函与投诉信",p:"",items:[
   {en:"To Whom It May Concern,", ipa:"", zh:"敬启者：（不知道收信人姓名时）", tip:"正式信的万能称呼。"},
   {en:"I am writing to formally request a refund for order number 4471.", ipa:"", zh:"我写信正式要求退还订单 4471 的款项。", tip:"正式信里不用缩写：I am，不是 I'm。"},
   {en:"Despite two phone calls, the issue has not been resolved.", ipa:"", zh:"尽管打过两次电话，问题仍未解决。", tip:"Despite + 名词。"},
   {en:"I would appreciate a response within ten business days.", ipa:"", zh:"希望在十个工作日内收到回复。", tip:"business days = 工作日。给出明确期限。"},
   {en:"Please find attached copies of the receipt and our previous correspondence.", ipa:"", zh:"随信附上收据和之前通信的副本。", tip:"correspondence = 往来信件。"},
   {en:"Sincerely, / Yours truly,", ipa:"", zh:"敬上（正式结尾）", tip:"正式信用这两个，不用 Thanks。"}]},
   {h:"15 分钟演讲与问答",p:"结业任务的语言工具。",items:[
   {en:"Before I begin, let me tell you why this topic matters to me.", ipa:"", zh:"开始之前，让我说说为什么这个话题对我重要。", tip:"个人联系，让听众在意。"},
   {en:"I'll be speaking for about fifteen minutes, and then we'll have time for questions.", ipa:"", zh:"我会讲大约 15 分钟，然后留时间提问。", tip:"告诉听众时长。"},
   {en:"That's a great question, and it's one I've thought about a lot.", ipa:"", zh:"这是个好问题，也是我想过很多的问题。", tip:"问答时先肯定问题。"},
   {en:"I'm not sure I have a complete answer, but here's my view.", ipa:"", zh:"我不确定有完整的答案，但这是我的看法。", tip:"诚实但不退缩。"},
   {en:"Thank you all for listening. It's been a privilege.", ipa:"", zh:"感谢大家的聆听。这是我的荣幸。", tip:"privilege 读 PRIV-lij。"}]}],
  drills:[["The tenant shall pay the rent on the first day of each month.","合同句"],["Either party may terminate this agreement with sixty days' written notice.","terminate / notice"],["I am writing to formally request a refund.","正式信开头"],["I would appreciate a response within ten business days.","期限"],["Before I begin, let me tell you why this topic matters to me.","演讲开场"],["That's a great question, and it's one I've thought about a lot. Thank you all for listening.","问答 + 结尾"]],
  ex:[
   {t:"mc",q:"合同里 “shall” 的意思是？",opts:["必须（法律义务）","可能","将来会","应该（建议）"],a:0},
   {t:"listen",q:"听一听，提前多久通知可以终止？",say:"Either party may terminate this agreement with thirty days' notice.",opts:["30 天","60 天","13 天","3 天"],a:0},
   {t:"mc",q:"不知道收信人姓名的正式信，称呼用？",opts:["To Whom It May Concern,","Hi there,","Hey,","Dear friend,"],a:0},

   {t:"type",q:"翻译：我写信正式要求退款。（I am writing to formally…）",a:"I am writing to formally request a refund.",alt:["I am writing to formally request a refund","I'm writing to formally request a refund.","I am writing to request a refund."]},
   {t:"type",q:"听写这句话。",say:"Thank you all for listening.",a:"Thank you all for listening.",alt:["Thank you all for listening","thank you all for listening"]}],
  hw:[["读一份真合同","找出你签过的一份英文合同（租房、工作、手机），用本章的词读懂关键条款：付款、终止、通知期。写下三条中文摘要。"],["写一封正式信","就一件真实的事写一封正式信或投诉信（退款、维修、申诉），用本章的结构和用语。可以请老师帮你检查后发出。"],["结业演讲（必做）","准备并发表一场 15 分钟的英语演讲，主题自选，之后回答至少三个问题。至少三位听众。讲完后，回到本课堂的第 1 章，听一遍字母表——你会发现自己走了多远。"]]
},

{ id:"l6c1", lv:6, title:"入籍考试是什么：流程、权利与责任", goal:"了解加拿大入籍考试的流程，能用英语说出公民的权利和责任。",
  intro:"加拿大入籍考试：<b>20 道选择题，答对 15 道通过，30 分钟</b>，18 到 54 岁的申请人必须参加，题目全部来自官方手册《Discover Canada》。考试本身不难，难在<b>用英语读题</b>。本级六章把手册的重点用中英对照过一遍，每章的练习都是考试题的样子。第一章先学最常考的部分：<b>公民的权利和责任</b>。",
  learn:[{h:"考试与申请的关键词",p:"",items:[
   {en:"citizenship test, citizenship ceremony, oath of citizenship", ipa:"", zh:"入籍考试、入籍仪式、入籍宣誓", tip:"oath 读 /oʊθ/，结尾 th。"},
   {en:"permanent resident, applicant, eligible", ipa:"", zh:"永久居民、申请人、符合资格", tip:"eligible 重音在 EL。"},
   {en:"You must pass the test with at least fifteen out of twenty.", ipa:"", zh:"你必须在 20 题中至少答对 15 题。", tip:"out of = 其中。"},
   {en:"The test is based on the guide Discover Canada.", ipa:"", zh:"考试内容来自手册《发现加拿大》。", tip:"based on = 基于。"}]},
   {h:"公民的权利",p:"来自《权利与自由宪章》（1982 年）。",items:[
   {en:"freedom of conscience and religion", ipa:"", zh:"良心和宗教自由", tip:"conscience 读 CON-shens。"},
   {en:"freedom of thought, belief, opinion and expression", ipa:"", zh:"思想、信仰、意见和表达自由", tip:"考试常问“哪一项不是宪章权利”。"},
   {en:"freedom of peaceful assembly and association", ipa:"", zh:"和平集会和结社自由", tip:"assembly = 集会。"},
   {en:"mobility rights: the right to live and work anywhere in Canada", ipa:"", zh:"迁徙权：在加拿大任何地方居住和工作的权利", tip:"mobility 读 mo-BIL-ity。"},
   {en:"Aboriginal peoples' rights and official language rights", ipa:"", zh:"原住民权利和官方语言权利", tip:"加拿大有两种官方语言：英语和法语。"}]},
   {h:"公民的责任",p:"手册列出六项，考试几乎必考。",items:[

{ id:"l6c2", lv:6, title:"加拿大历史（一）：原住民、探险者与新法兰西", goal:"掌握加拿大早期历史的关键名字和年代，能读懂考试里的历史题。",
  intro:"历史是考试里<b>题目最多</b>的部分，也是中国学习者最头疼的部分，因为名字和年代多。办法是<b>只记手册强调的</b>：谁最先在这里、谁来“发现”、谁和谁打仗、哪一年。本章覆盖从原住民到英法争夺的时期。记住几个大锚点：<b>1497 Cabot，1534 Cartier，1608 Champlain，1759 Plains of Abraham，1763 英国接管</b>。",
  learn:[{h:"原住民",p:"",items:[
   {en:"Aboriginal peoples: First Nations, Inuit, and Métis", ipa:"", zh:"原住民：第一民族、因纽特人、梅蒂斯人", tip:"三个群体，考试必考。Métis 读 may-TEE。"},
   {en:"The Inuit live in the Arctic.", ipa:"", zh:"因纽特人生活在北极地区。", tip:"Inuit 读 IN-oo-it。"},
   {en:"The Métis are descended from Aboriginal and European parents.", ipa:"", zh:"梅蒂斯人是原住民和欧洲人的后代。", tip:"descended from = 是……的后代。"},
   {en:"Residential schools were a dark chapter in Canadian history.", ipa:"", zh:"寄宿学校是加拿大历史上黑暗的一章。", tip:"2008 年政府正式道歉。"}]},
   {h:"探险者与新法兰西",p:"",items:[
   {en:"John Cabot reached the east coast in 1497.", ipa:"", zh:"约翰·卡博特在 1497 年到达东海岸。", tip:"Cabot：第一个绘制加拿大大西洋海岸地图的欧洲人。"},
   {en:"Jacques Cartier claimed the land for France in 1534.", ipa:"", zh:"雅克·卡蒂埃在 1534 年为法国宣示主权。", tip:"“Canada”这个名字来自 Cartier 听到的原住民词 kanata（村庄）。"},
   {en:"Samuel de Champlain founded Quebec City in 1608.", ipa:"", zh:"尚普兰在 1608 年建立了魁北克城。", tip:"founded = 建立。"},
   {en:"The fur trade was the basis of the economy.", ipa:"", zh:"毛皮贸易是经济的基础。", tip:"Hudson's Bay Company 1670 年成立，做毛皮生意。"},
   {en:"The British defeated the French on the Plains of Abraham in 1759.", ipa:"", zh:"1759 年英军在亚伯拉罕平原击败法军。", tip:"defeated = 击败。1763 年新法兰西归英国。"},
   {en:"The Quebec Act of 1774 allowed religious freedom for Catholics.", ipa:"", zh:"1774 年《魁北克法案》允许天主教徒的宗教自由。", tip:"并保留了法国民法。"}]}],
  drills:[["First Nations, Inuit, and Métis","三个群体"],["John Cabot reached the east coast in 1497.","1497"],["Jacques Cartier claimed the land for France in 1534.","1534"],["Samuel de Champlain founded Quebec City in 1608.","1608"],["The fur trade was the basis of the economy.","毛皮贸易"],["The British defeated the French on the Plains of Abraham in 1759.","1759"]],
  ex:[
   {t:"mc",q:"Who are the three Aboriginal groups in Canada?",opts:["First Nations, Inuit, and Métis","French, English, and Inuit","First Nations, Acadians, and Métis","Inuit, Loyalists, and Métis"],a:0},
   {t:"mc",q:"Who founded Quebec City in 1608?",opts:["Samuel de Champlain","John Cabot","Jacques Cartier","Sir John A. Macdonald"],a:0},
   {t:"listen",q:"听一听，这是哪一年？",say:"John Cabot reached the east coast in 1497.",opts:["1497","1534","1608","1759"],a:0},
   {t:"mc",q:"Where does the name 'Canada' come from?",opts:["The Iroquoian word kanata, meaning village","A French word for cold","The name of an explorer","A Latin word for north"],a:0},
   {t:"type",q:"听写这个词（“毛皮”）。",say:"fur",a:"fur"},
   {t:"type",q:"填空：The ___ live in the Arctic.（因纽特人）",a:"Inuit",alt:["inuit","The Inuit"]}],
  hw:[["时间线","在一张纸上画时间线，标出 1497、1534、1608、1670、1759、1763、1774，每个写一句英语。"],["读手册","读《Discover Canada》的 Canada's History 前半部分（到 1800 年前），每段画出一个关键名字。"],["讲给别人","用英语把“谁最先在这里、法国人来了、英国人赢了”讲给家人听，三分钟。"]]
},
{ id:"l6c3", lv:6, title:"加拿大历史（二）：联邦、扩张与两次大战", goal:"掌握 1867 年联邦以来的关键事件、人物和年份。",
  intro:"这一章的锚点是 <b>1867 年 7 月 1 日：联邦（Confederation）</b>——四个省（安大略、魁北克、新斯科舍、新不伦瑞克）组成加拿大自治领，第一任总理是 <b>Sir John A. Macdonald</b>。之后是铁路、西部扩张、女性投票权、两次世界大战、1965 年的枫叶旗、1982 年的宪法回归。考试喜欢问<b>“谁是第一个……”、“哪一年……”</b>。",
  learn:[{h:"联邦与早期",p:"",items:[
   {en:"Confederation took place on July 1, 1867.", ipa:"", zh:"联邦成立于 1867 年 7 月 1 日。", tip:"这就是 Canada Day 的来历。"},
   {en:"Sir John A. Macdonald was Canada's first prime minister.", ipa:"", zh:"约翰·A·麦克唐纳爵士是加拿大第一任总理。", tip:"他的头像在 10 元纸币上（旧版）。"},
   {en:"The Fathers of Confederation created the Dominion of Canada.", ipa:"", zh:"联邦之父们创建了加拿大自治领。", tip:"Dominion 读 do-MIN-yun。"},
   {en:"The Canadian Pacific Railway was completed in 1885.", ipa:"", zh:"加拿大太平洋铁路于 1885 年完工。", tip:"许多华工参与修建，很多人牺牲。"},
   {en:"Louis Riel led the Métis and is seen as a father of Manitoba.", ipa:"", zh:"路易·里尔领导梅蒂斯人，被视为曼尼托巴之父。", tip:"Riel 读 ree-EL。"}]},
   {h:"二十世纪",p:"",items:[
   {en:"Women won the right to vote in federal elections in 1918.", ipa:"", zh:"1918 年女性获得联邦选举投票权。", tip:"Agnes Macphail：1921 年第一位女性国会议员。"},
   {en:"In the First World War, Canadians fought at Vimy Ridge in 1917.", ipa:"", zh:"一战中，加拿大人 1917 年在维米岭作战。", tip:"Vimy Ridge 是加拿大的骄傲，4 月 9 日纪念。"},
   {en:"Remembrance Day is on November 11.", ipa:"", zh:"阵亡将士纪念日是 11 月 11 日。", tip:"人们戴红色的罂粟花（poppy）。"},
   {en:"In the Second World War, Canadians landed at Juno Beach on D-Day, 1944.", ipa:"", zh:"二战中，加拿大人在 1944 年诺曼底登陆日登上朱诺海滩。", tip:"Juno 读 JOO-no。"},
   {en:"The maple leaf flag was adopted in 1965.", ipa:"", zh:"枫叶旗于 1965 年启用。", tip:"adopted = 采用。"},
   {en:"The Constitution was patriated in 1982 with the Charter of Rights and Freedoms.", ipa:"", zh:"1982 年宪法回归，附带《权利与自由宪章》。", tip:"patriated = 从英国收回。"}]}],
  drills:[["Confederation took place on July 1, 1867.","1867"],["Sir John A. Macdonald was Canada's first prime minister.","第一任总理"],["Women won the right to vote in federal elections in 1918.","1918"],["Remembrance Day is on November 11.","11 月 11 日"],["The maple leaf flag was adopted in 1965.","1965"],["The Constitution was patriated in 1982 with the Charter of Rights and Freedoms.","1982"]],
  ex:[
   {t:"mc",q:"When did Confederation take place?",opts:["July 1, 1867","July 1, 1982","November 11, 1918","June 24, 1534"],a:0},
   {t:"mc",q:"Who was Canada's first prime minister?",opts:["Sir John A. Macdonald","Sir Wilfrid Laurier","Louis Riel","Pierre Trudeau"],a:0},
   {t:"listen",q:"听一听，这是哪一年？",say:"The maple leaf flag was adopted in 1965.",opts:["1965","1867","1982","1918"],a:0},
   {t:"mc",q:"What do Canadians wear on Remembrance Day?",opts:["A red poppy","A maple leaf pin","A white ribbon","A blue flower"],a:0},
   {t:"type",q:"听写这个词（“联邦”）。",say:"Confederation",a:"Confederation",alt:["confederation"]},
   {t:"type",q:"填空：Canadians fought at Vimy ___ in 1917.",a:"Ridge",alt:["ridge"]}],
  hw:[["年份卡","做 8 张卡片：1867、1885、1917、1918、1944、1965、1982、2008，正面年份、背面英语一句话。每天过一遍。"],["读手册","读《Discover Canada》的 Canada's History 后半部分和 Modern Canada。"],["去一个地方","去一个有历史牌子的地方（公园、老建筑、纪念碑），读上面的英文，拍照，用英语说一句它讲了什么。"]]
},
{ id:"l6c4", lv:6, title:"政府如何运作：三级政府与选举", goal:"理解联邦、省、市三级政府，议会的组成，以及怎么投票。",
  intro:"这部分考试题多但<b>逻辑清楚</b>。加拿大是<b>君主立宪制、议会民主制</b>：国家元首是国王（由总督代表），政府首脑是总理。议会有三部分：<b>国王、参议院、众议院</b>。三级政府：<b>联邦</b>（国防、外交、移民）、<b>省</b>（教育、医疗、公路）、<b>市</b>（垃圾、公交、消防）。选举：18 岁以上公民可以投票，联邦大选至少每四年一次。",
  learn:[{h:"国家结构",p:"",items:[
   {en:"Canada is a constitutional monarchy and a parliamentary democracy.", ipa:"", zh:"加拿大是君主立宪制和议会民主制国家。", tip:"monarchy 读 MON-ar-kee。"},
   {en:"The King is the head of state; the Governor General represents the King in Canada.", ipa:"", zh:"国王是国家元首；总督在加拿大代表国王。", tip:"head of state ≠ head of government。"},
   {en:"The Prime Minister is the head of government.", ipa:"", zh:"总理是政府首脑。", tip:"总理是众议院多数党的领袖。"},
   {en:"Parliament has three parts: the Sovereign, the Senate, and the House of Commons.", ipa:"", zh:"议会有三部分：君主、参议院和众议院。", tip:"Sovereign 读 SOV-rin。"},
   {en:"Members of Parliament are elected; senators are appointed.", ipa:"", zh:"众议员是选出来的；参议员是任命的。", tip:"elected vs appointed，常考。"},
   {en:"The Lieutenant Governor represents the King in each province.", ipa:"", zh:"省督在各省代表国王。", tip:"加拿大读 lef-TEN-ant，不是 loo-TEN-ant。"}]},
   {h:"三级政府与选举",p:"",items:[
   {en:"The federal government is responsible for defence, foreign policy, and immigration.", ipa:"", zh:"联邦政府负责国防、外交和移民。", tip:""},
   {en:"The provinces are responsible for education, health care, and highways.", ipa:"", zh:"省负责教育、医疗和公路。", tip:""},
   {en:"Municipal governments handle garbage, transit, and fire services.", ipa:"", zh:"市政府管垃圾、公交和消防。", tip:"municipal 读 myoo-NIS-i-pl。"},
   {en:"Canadian citizens who are eighteen or older can vote.", ipa:"", zh:"18 岁或以上的加拿大公民可以投票。", tip:""},
   {en:"Federal elections must be held at least every four years.", ipa:"", zh:"联邦大选至少每四年举行一次。", tip:"at least = 至少。"},
   {en:"You vote by marking an X on the ballot, and your vote is secret.", ipa:"", zh:"你在选票上画 X 投票，投票是保密的。", tip:"ballot = 选票；secret ballot = 不记名投票。"}]}],
  drills:[["Canada is a constitutional monarchy and a parliamentary democracy.","两个大词"],["The Prime Minister is the head of government.","政府首脑"],["Parliament has three parts: the Sovereign, the Senate, and the House of Commons.","三部分"],["Members of Parliament are elected; senators are appointed.","elected / appointed"],["Canadian citizens who are eighteen or older can vote.","18 岁"],["Federal elections must be held at least every four years.","四年"]],
  ex:[
   {t:"mc",q:"Who is Canada's head of state?",opts:["The King","The Prime Minister","The Governor General","The Speaker"],a:0},
   {t:"mc",q:"What are the three parts of Parliament?",opts:["The Sovereign, the Senate, and the House of Commons","The Prime Minister, the Cabinet, and the Senate","The King, the Governor General, and the Prime Minister","The Senate, the Supreme Court, and the House of Commons"],a:0},
   {t:"listen",q:"听一听，哪一级政府负责这些？",say:"education, health care, and highways",opts:["省政府","联邦政府","市政府","法院"],a:0},
   {t:"mc",q:"How often must federal elections be held?",opts:["At least every four years","Every year","Every two years","Every five years"],a:0},
   {t:"type",q:"听写这个词（“选票”）。",say:"ballot",a:"ballot"},
   {t:"type",q:"填空：The ___ General represents the King in Canada.",a:"Governor",alt:["governor"]}],
  hw:[["找出你的议员","上网查出你所在选区的联邦议员（MP）、省议员（MPP/MLA）和市议员的名字，用英语写下：My MP is ___ ."],["读手册","读《Discover Canada》的 How Canadians Govern Themselves 和 Federal Elections。"],["看一次议会","在 YouTube 搜 “Question Period Canada”，看 5 分钟，记下你听懂的三个词。"]]

{ id:"l6c5", lv:6, title:"地理、经济与国家象征", goal:"认识加拿大的地区、省份和首府，主要经济产业，以及国家象征。",
  intro:"地理题一般是送分题：<b>十个省、三个地区</b>，首都是<b>渥太华</b>，五大地区：<b>大西洋地区、中部、草原、西海岸、北部</b>。经济题考三大产业：<b>服务业、制造业、自然资源</b>，以及加拿大最大的贸易伙伴是美国。象征题考<b>枫叶、海狸、国歌、皇家骑警、皇冠</b>。本章把这些一次过完。",
  learn:[{h:"地区与省份",p:"",items:[
   {en:"Canada has ten provinces and three territories.", ipa:"", zh:"加拿大有十个省和三个地区。", tip:"territories 读 TER-i-tor-eez。"},
   {en:"The capital of Canada is Ottawa.", ipa:"", zh:"加拿大的首都是渥太华。", tip:"不是多伦多！"},
   {en:"The five regions: the Atlantic, Central Canada, the Prairies, the West Coast, and the North.", ipa:"", zh:"五大地区：大西洋、中部、草原、西海岸、北部。", tip:"Prairies 读 PRAIR-eez。"},
   {en:"Ontario and Quebec are in Central Canada; Toronto is the largest city.", ipa:"", zh:"安大略和魁北克在中部；多伦多是最大城市。", tip:"安省首府 Toronto，魁省首府 Quebec City。"},
   {en:"Alberta, Saskatchewan and Manitoba are the Prairie provinces.", ipa:"", zh:"阿尔伯塔、萨斯喀彻温和曼尼托巴是草原省份。", tip:"Saskatchewan 读 sas-KATCH-e-wan。"},
   {en:"British Columbia is on the Pacific coast; Vancouver is its largest city.", ipa:"", zh:"不列颠哥伦比亚在太平洋岸；温哥华是最大城市。", tip:"BC 首府是 Victoria，不是温哥华。"}]},
   {h:"经济与象征",p:"",items:[
   {en:"The three main types of industry are service, manufacturing, and natural resources.", ipa:"", zh:"三大产业类型：服务业、制造业和自然资源。", tip:"manufacturing 读 man-yoo-FAK-cher-ing。"},
   {en:"The United States is Canada's largest trading partner.", ipa:"", zh:"美国是加拿大最大的贸易伙伴。", tip:""},
   {en:"The maple leaf and the beaver are symbols of Canada.", ipa:"", zh:"枫叶和海狸是加拿大的象征。", tip:"beaver 在 5 分硬币上。"},
   {en:"O Canada is the national anthem; God Save the King is the royal anthem.", ipa:"", zh:"《啊，加拿大》是国歌；《天佑国王》是皇室颂歌。", tip:"anthem 读 AN-them。"},
   {en:"The RCMP, the Mounties, are the national police force.", ipa:"", zh:"皇家骑警是国家警察部队。", tip:"RCMP = Royal Canadian Mounted Police。"},
   {en:"Canada Day is July 1; Victoria Day honours the Sovereign's birthday.", ipa:"", zh:"加拿大日是 7 月 1 日；维多利亚日纪念君主生日。", tip:"honours 加拿大拼法带 u。"}]}],
  drills:[["Canada has ten provinces and three territories.","10 和 3"],["The capital of Canada is Ottawa.","渥太华"],["the Atlantic, Central Canada, the Prairies, the West Coast, and the North","五大地区"],["The United States is Canada's largest trading partner.","贸易伙伴"],["The maple leaf and the beaver are symbols of Canada.","象征"],["O Canada is the national anthem.","国歌"]],
  ex:[
   {t:"mc",q:"What is the capital city of Canada?",opts:["Ottawa","Toronto","Montreal","Vancouver"],a:0},
   {t:"mc",q:"How many provinces and territories does Canada have?",opts:["Ten provinces and three territories","Twelve provinces and one territory","Nine provinces and four territories","Thirteen provinces"],a:0},
   {t:"listen",q:"听一听，这是哪个省的描述？",say:"British Columbia is on the Pacific coast.",opts:["不列颠哥伦比亚","安大略","魁北克","新斯科舍"],a:0},
   {t:"mc",q:"Which animal is a symbol of Canada?",opts:["The beaver","The moose","The eagle","The bear"],a:0},
   {t:"type",q:"听写这个词（“国歌”）。",say:"anthem",a:"anthem"},
   {t:"type",q:"填空：The ___ States is Canada's largest trading partner.",a:"United",alt:["united"]}],
  hw:[["地图练习","打印一张加拿大空白地图，写上 10 个省、3 个地区和每个的首府（英语）。"],["读手册","读《Discover Canada》的 Canada's Regions、Canada's Economy 和 Canadian Symbols。"],["唱国歌","在网上找《O Canada》的歌词，跟着唱三遍。入籍仪式上要唱。"]]

{ id:"l6c6", lv:6, title:"第六级结业：模拟考试、面试与宣誓", goal:"完成一次 20 题模拟考试，掌握入籍面试的常见问题，会读宣誓词。",
  intro:"最后一章做三件事：① <b>模拟考试</b>——本章练习就是 6 道考试格式的题，加上前五章的 30 道，你已经做了一整套；② <b>面试</b>——有些申请人会被叫去和官员面谈，问的是你的申请和在加拿大的生活，不是历史；③ <b>宣誓</b>——仪式上全体一起朗读誓词，然后唱国歌。结业任务：<b>在真人面前完整地完成一次模拟面试</b>。",
  learn:[{h:"考试当天",p:"",items:[
   {en:"Please bring your notice, your permanent resident card, and two pieces of ID.", ipa:"", zh:"请带上通知、永久居民卡和两份身份证件。", tip:"notice = 考试通知。"},
   {en:"You have thirty minutes to answer twenty questions.", ipa:"", zh:"你有 30 分钟回答 20 道题。", tip:""},
   {en:"You'll get your results right after the test.", ipa:"", zh:"考完马上出结果。", tip:"没过可以再考一次。"}]},

{ id:"l7c1", lv:7, title:"认识新朋友：开场与自我介绍", goal:"能在聚会、活动、健身房等场合自然地开始和陌生人交谈，并把一次对话变成一个联系方式。",
  intro:"在加拿大交朋友，最大的障碍不是英语，而是<b>没人会主动来认识你</b>——你得先开口。好消息是，北美人对陌生人搭话很习惯，只要<b>开场轻、问题开放、结尾留下联系方式</b>。本章学三件事：怎么开场（环境、活动、共同点）、怎么介绍自己让别人记住、怎么自然地交换联系方式。",
  learn:[{h:"开场",p:"从你们共同所在的环境说起，最自然。",items:[
   {en:"Hi, I don't think we've met. I'm Wei.", ipa:"", zh:"嗨，我们好像没见过。我是伟。", tip:"最经典的开场，任何场合都能用。"},
   {en:"Is this your first time here?", ipa:"", zh:"你是第一次来这里吗？", tip:"健身房、课程、聚会都适用。"},
   {en:"How do you know Sarah?", ipa:"", zh:"你怎么认识 Sarah 的？", tip:"聚会上问这句，对方一定有话说。"},
   {en:"Mind if I join you?", ipa:"", zh:"介意我加入吗？", tip:"Mind if = Do you mind if，随意场合。"},
   {en:"That's a great jacket. Where did you get it?", ipa:"", zh:"这件外套真好看，哪里买的？", tip:"夸一件具体的东西，再问一个问题。"}]},
   {h:"让人记住的自我介绍",p:"不只说职业，说一件有意思的事。",items:[
   {en:"I moved here from Shanghai three years ago. Still getting used to the winters.", ipa:"", zh:"我三年前从上海搬来。还在适应这里的冬天。", tip:"一个事实 + 一句自嘲。"},
   {en:"I'm a nurse by day and a terrible badminton player by night.", ipa:"", zh:"我白天是护士，晚上是糟糕的羽毛球选手。", tip:"by day / by night 的幽默句式。"},
   {en:"I'm trying to meet more people outside of work.", ipa:"", zh:"我想在工作之外多认识些人。", tip:"直接说出来，对方会帮你。"},
   {en:"What about you? What brings you here?", ipa:"", zh:"你呢？你怎么来这里的？", tip:"What brings you here = 你来这里的原因。"}]},
   {h:"交换联系方式",p:"",items:[
   {en:"It was really nice talking to you. Are you on WhatsApp or Instagram?", ipa:"", zh:"和你聊天真开心。你用 WhatsApp 还是 Instagram？", tip:"北美年轻人更常用 Instagram，工作圈用 LinkedIn。"},
   {en:"We should grab a coffee sometime.", ipa:"", zh:"我们找时间喝杯咖啡吧。", tip:"grab a coffee = 喝杯咖啡，很随意。"},
   {en:"Here, let me give you my number.", ipa:"", zh:"来，我给你我的号码。", tip:""},
   {en:"I'll text you. Let's make it happen.", ipa:"", zh:"我给你发消息。咱们说定了。", tip:"make it happen = 真的去做，不只是客套。"}]}],
  drills:[["Hi, I don't think we've met. I'm Wei.","开场"],["How do you know Sarah? Is this your first time here?","两个问题"],["I moved here from Shanghai three years ago. Still getting used to the winters.","自我介绍"],["What about you? What brings you here?","抛回去"],["It was really nice talking to you. Are you on WhatsApp?","要联系方式"],["We should grab a coffee sometime. I'll text you.","约下次"]],
  ex:[
   {t:"mc",q:"在聚会上想认识一个人，最自然的开场是？",opts:["Hi, I don't think we've met. I'm Wei.","What is your name and age?","Hello. I am Chinese.","Do you want to be my friend?"],a:0},
   {t:"listen",q:"听一听，对方问的是？",say:"What brings you here?",opts:["你来这里的原因","你怎么来的（交通）","你带了什么","你是谁"],a:0},
   {t:"mc",q:"“We should grab a coffee sometime.” 的意思是？",opts:["我们找时间一起喝咖啡吧","我们应该去抢咖啡","你应该多喝咖啡","咖啡店在哪"],a:0},
   {t:"listen",q:"听一听，他是怎么介绍自己的？",say:"I'm a nurse by day and a terrible badminton player by night.",opts:["白天护士，晚上打羽毛球","白天打羽毛球，晚上做护士","他是羽毛球教练","他晚上工作"],a:0},
   {t:"type",q:"翻译：介意我加入吗？（用 Mind if）",a:"Mind if I join you?",alt:["Mind if I join you","Do you mind if I join you?","Do you mind if I join you"]},
   {t:"type",q:"听写这句话。",say:"It was really nice talking to you.",a:"It was really nice talking to you.",alt:["It was really nice talking to you","it was really nice talking to you"]}],

{ id:"l7c2", lv:7, title:"约人出来：邀请、答应与拒绝", goal:"能发出邀请、接受邀请、礼貌拒绝并改约，用消息和当面都行。",
  intro:"认识之后最难的一步是<b>约出来</b>。中国学习者常常等对方约，或者邀请说得太正式、太重。北美的邀请很轻：<b>“Wanna grab lunch Thursday?”</b>——一个活动、一个时间，就够了。被拒绝也正常，对方说 “I can't this week” 不是不想见你，是真的没空；关键是<b>有没有提另一个时间</b>。本章学邀请的轻重、接受、拒绝和改约。",
  learn:[{h:"发出邀请",p:"一个活动 + 一个时间。",items:[
   {en:"Wanna grab lunch on Thursday?", ipa:"", zh:"周四一起吃午饭？", tip:"最轻的邀请，熟人之间用。"},
   {en:"A few of us are going hiking on Saturday. You should come!", ipa:"", zh:"我们几个周六去徒步。你也来吧！", tip:"集体活动最容易约，压力小。"},
   {en:"Are you free this weekend? I was thinking of checking out the night market.", ipa:"", zh:"这周末有空吗？我在想去逛逛夜市。", tip:"check out = 去看看。"},
   {en:"Would you like to come over for dinner sometime?", ipa:"", zh:"你想找时间来我家吃晚饭吗？", tip:"come over = 来我家。请人回家吃饭在北美是很重的友好信号。"},
   {en:"I've got an extra ticket for the game on Friday. Interested?", ipa:"", zh:"我周五的比赛多一张票。有兴趣吗？", tip:"Interested? 一个词就是问句。"}]},
   {h:"接受与拒绝",p:"",items:[
   {en:"Sounds great! What time?", ipa:"", zh:"太好了！几点？", tip:"接受就马上问细节。"},
   {en:"I'd love to. Count me in.", ipa:"", zh:"我很愿意。算我一个。", tip:"Count me in = 算我一个。"},
   {en:"I'd love to, but I can't this week. How about next Tuesday?", ipa:"", zh:"我很想去，但这周不行。下周二怎么样？", tip:"拒绝 + 另一个时间 = 我真的想见你。"},
   {en:"Sorry, I've already got plans that day.", ipa:"", zh:"抱歉，那天我已经有安排了。", tip:"got plans = 有安排。不用解释是什么。"},
   {en:"Can I get back to you tomorrow? I need to check with my wife.", ipa:"", zh:"我明天回复你可以吗？我得问问我太太。", tip:"check with = 和……确认。"},
   {en:"Rain check? Something came up.", ipa:"", zh:"改天行吗？临时有事。", tip:"rain check = 改期；came up = 突然发生。"}]},
   {h:"确认与当天",p:"",items:[
   {en:"Still on for tomorrow?", ipa:"", zh:"明天还照计划吗？", tip:"前一天发这句确认，北美人很常做。"},
   {en:"Running ten minutes late, sorry!", ipa:"", zh:"晚十分钟到，抱歉！", tip:"迟到一定要提前说。"},
   {en:"I'm here. I got us a table by the window.", ipa:"", zh:"我到了。订了靠窗的桌子。", tip:""},
   {en:"This was fun. Let's do it again soon.", ipa:"", zh:"今天很开心。很快再约。", tip:"结束时说，下次就容易了。"}]}],
  drills:[["Wanna grab lunch on Thursday?","轻邀请"],["A few of us are going hiking on Saturday. You should come!","集体邀请"],["Sounds great! What time? Count me in.","接受"],["I'd love to, but I can't this week. How about next Tuesday?","拒绝 + 改约"],["Still on for tomorrow? Running ten minutes late, sorry!","确认 / 迟到"],["This was fun. Let's do it again soon.","结束"]],
  ex:[
   {t:"mc",q:"朋友约你但你那天没空，又真的想见面，最好说？",opts:["I'd love to, but I can't that day. How about Friday?","No.","I am busy.","Maybe."],a:0},
   {t:"listen",q:"听一听，他的意思是？",say:"Rain check? Something came up.",opts:["改天吧，临时有事","下雨了，不去了","检查一下天气","我来了"],a:0},
   {t:"mc",q:"“Count me in.” 意思是？",opts:["算我一个","数一下我","把我算进账单","我进来了"],a:0},
   {t:"listen",q:"听一听，这是什么邀请？",say:"Would you like to come over for dinner sometime?",opts:["来我家吃晚饭","去餐厅吃晚饭","一起做饭","晚上打电话"],a:0},
   {t:"type",q:"翻译：明天还照计划吗？（用 Still on）",a:"Still on for tomorrow?",alt:["Still on for tomorrow","Are we still on for tomorrow?","Are we still on for tomorrow"]},
   {t:"type",q:"听写这句话。",say:"Let's do it again soon.",a:"Let's do it again soon.",alt:["Let's do it again soon","let's do it again soon"]}],
  hw:[["发一条邀请","给一位认识的人发一条英语邀请消息：一个活动 + 一个时间。不管对方答不答应。"],["拒绝一次练习","写三种拒绝的回复（有安排、改约、明天回复），各读三遍。"],["真实见面（必做）","和一位新认识或不太熟的人见一次面（咖啡、午饭、散步），全程英语。前一天发 Still on for tomorrow?"]]

{ id:"l7c3", lv:7, title:"聊得更深：兴趣、经历与价值观", goal:"能从闲聊进入真正的交流：聊兴趣、分享经历、谈看法，让关系从认识变成朋友。",
  intro:"认识容易，变成朋友难，原因是对话停在<b>天气和工作</b>。朋友是在<b>聊到真正在乎的事</b>时产生的：你喜欢什么、经历过什么、怎么看一件事。本章教你三层深入：<b>兴趣</b>（What are you into?）→ <b>经历</b>（讲一个小故事）→ <b>看法</b>（我觉得……你呢？）。还有最重要的技能：<b>自我暴露</b>——先说一点自己的，对方才会说他的。",
  learn:[{h:"聊兴趣",p:"",items:[
   {en:"What are you into these days?", ipa:"", zh:"你最近在迷什么？", tip:"be into = 喜欢、沉迷。比 What's your hobby 自然得多。"},
   {en:"I'm really into hiking. There's a trail near Hamilton I keep going back to.", ipa:"", zh:"我很喜欢徒步。汉密尔顿附近有条步道我一直去。", tip:"说兴趣 + 一个具体细节。"},
   {en:"Have you seen anything good lately?", ipa:"", zh:"最近看了什么好的（剧、电影）？", tip:"万能话题。"},
   {en:"I've been getting into cooking Sichuan food. It's harder than it looks.", ipa:"", zh:"我最近开始学做川菜。比看起来难。", tip:"getting into = 开始喜欢上。"},
   {en:"You should try it sometime. I could show you.", ipa:"", zh:"你应该试试。我可以教你。", tip:"把兴趣变成下次见面的理由。"}]},
   {h:"分享经历",p:"讲一个 30 秒的小故事：背景、发生了什么、感受。",items:[
   {en:"When I first got here, I went to Tim Hortons and had no idea what a double-double was.", ipa:"", zh:"我刚来时去 Tim Hortons，完全不知道 double-double 是什么。", tip:"初来乍到的故事，每个加拿大人都爱听。double-double = 两糖两奶。"},
   {en:"The funniest thing happened last week.", ipa:"", zh:"上周发生了件最好笑的事。", tip:"故事的开头，让对方准备听。"},
   {en:"Long story short, I ended up at the wrong wedding.", ipa:"", zh:"长话短说，我最后去错了婚礼。", tip:"long story short = 长话短说；ended up = 最终。"},
   {en:"That was the moment I felt like I actually lived here.", ipa:"", zh:"那一刻我觉得自己真的住在这里了。", tip:"说感受，故事才完整。"}]},
   {h:"谈看法与自我暴露",p:"",items:[
   {en:"Honestly, I find it hard to make friends as an adult.", ipa:"", zh:"说实话，我觉得成年后交朋友很难。", tip:"先承认一点脆弱，对方会放松。"},
   {en:"I used to think that too, but I've changed my mind.", ipa:"", zh:"我以前也这么想，但我改变看法了。", tip:"used to = 以前。"},
   {en:"What's something you've changed your mind about?", ipa:"", zh:"有什么事你改变过看法？", tip:"一个能聊很久的问题。"},
   {en:"I really miss my parents. Do you have family here?", ipa:"", zh:"我很想我父母。你家人在这边吗？", tip:"分享 + 问，对方多半会讲他的。"},
   {en:"That means a lot. Thanks for sharing that.", ipa:"", zh:"这对我意义很大。谢谢你告诉我。", tip:"对方说了私人的事，这样回应。"}]}],
  drills:[["What are you into these days?","be into"],["I'm really into hiking. There's a trail near Hamilton I keep going back to.","兴趣 + 细节"],["When I first got here, I had no idea what a double-double was.","初来故事"],["Long story short, I ended up at the wrong wedding.","long story short"],["Honestly, I find it hard to make friends as an adult.","自我暴露"],["What's something you've changed your mind about?","深问题"]],
  ex:[
   {t:"mc",q:"问对方的兴趣，最自然的说法是？",opts:["What are you into these days?","What is your hobby?","Do you have interests?","What do you like?"],a:0},
   {t:"listen",q:"听一听，他的意思是？",say:"Long story short, I missed the flight.",opts:["长话短说，我错过了航班","故事很短，航班很长","我讲了一个关于航班的长故事","我喜欢短途航班"],a:0},
   {t:"mc",q:"“I've been getting into cooking.” 意思是？",opts:["我最近开始喜欢上做饭","我进了厨房","我一直在做饭","我做饭做够了"],a:0},

{ id:"l7c4", lv:7, title:"约会：从第一次见面到表达心意", goal:"能在约会软件上开始对话、安排第一次见面、约会中自然交流、并清楚表达自己的想法。",
  intro:"约会文化差异很大。在北美：① <b>第一次见面很轻</b>（咖啡、散步一小时），不是正式的“相亲”；② <b>AA 很常见</b>，但提出请客也很好；③ <b>直接但礼貌</b>——喜欢就说，不喜欢也要说，不说是最不礼貌的；④ 身体接触和进展速度<b>要问</b>，不要猜。本章覆盖：软件上开场、安排见面、约会中的话题、表达心意或礼貌退出。",
  learn:[{h:"软件上开场",p:"针对对方资料里的一个细节。",items:[
   {en:"I see you're into climbing. Indoor or outdoor?", ipa:"", zh:"看到你喜欢攀岩。室内还是户外？", tip:"针对细节的问题，回复率最高。"},
   {en:"Your dog is adorable. What's his name?", ipa:"", zh:"你的狗真可爱。叫什么名字？", tip:"adorable 读 a-DOR-a-bl。"},
   {en:"I'd love to hear more about that. Want to grab a coffee this week?", ipa:"", zh:"我想多听听。这周喝杯咖啡？", tip:"聊了几轮就约出来，别一直在线上聊。"},
   {en:"How about Thursday around six at the café on Queen Street?", ipa:"", zh:"周四六点左右，皇后街的咖啡店怎么样？", tip:"给具体的时间地点。"}]},
   {h:"第一次见面",p:"",items:[
   {en:"You look just like your photos. That's a good thing!", ipa:"", zh:"你和照片一样。这是好事！", tip:"轻松的开场。"},

{ id:"l7c5", lv:7, title:"维持友谊：关心、道歉与边界", goal:"能主动维系友谊、在朋友困难时表达支持、为自己的错误道歉、并温和地设定边界。",
  intro:"友谊靠<b>维护</b>：很久不联系，关系就淡了。北美朋友之间的维护很轻但很勤：一条 “Thinking of you”、一句 “How did the interview go?”。本章教四个场景：<b>日常关心</b>、<b>朋友遇到困难</b>（生病、失业、分手）、<b>道歉</b>（迟到、忘了、说错话）、<b>边界</b>（不想借钱、不想帮某个忙）。中国学习者最难的是最后一个——学会说“不”而不伤感情。",
  learn:[{h:"日常关心",p:"",items:[
   {en:"Hey, how did the interview go?", ipa:"", zh:"嘿，面试怎么样？", tip:"记住朋友说过的事，之后问一句。这是友谊的核心。"},
   {en:"Just checking in. How have you been?", ipa:"", zh:"问候一下。你最近怎么样？", tip:"check in = 问候、看看情况。"},
   {en:"Saw this and thought of you.", ipa:"", zh:"看到这个想到你了。", tip:"发一张图或链接时用。"},
   {en:"It's been too long! We need to catch up.", ipa:"", zh:"太久没见了！我们得聚聚。", tip:"catch up = 叙旧。"}]},
   {h:"朋友遇到困难",p:"不要急着给建议，先表达在乎。",items:[
   {en:"I'm so sorry to hear that. That sounds really hard.", ipa:"", zh:"听到这个我很难过。听起来真的很难。", tip:"第一句永远是共情。"},
   {en:"Is there anything I can do?", ipa:"", zh:"有什么我能做的吗？", tip:""},
   {en:"I'm here if you want to talk. No pressure.", ipa:"", zh:"你想聊的话我在。不勉强。", tip:"No pressure = 不给压力。"},
   {en:"I'm dropping off some soup tomorrow. Don't argue.", ipa:"", zh:"我明天送点汤过去。别推辞。", tip:"北美朋友生病时常送食物。Don't argue 是亲切的玩笑。"},
   {en:"You're going to get through this.", ipa:"", zh:"你会挺过去的。", tip:"get through = 挺过。"}]},
   {h:"道歉与边界",p:"",items:[
   {en:"I'm sorry I missed your call. It was a crazy day. How are you?", ipa:"", zh:"抱歉没接到你电话。那天太忙了。你怎么样？", tip:"道歉 + 简短原因 + 转回对方。"},
   {en:"I shouldn't have said that. I was out of line.", ipa:"", zh:"我不该那么说。我过分了。", tip:"out of line = 过分、越界。"},
   {en:"I wish I could, but I'm not able to lend money right now.", ipa:"", zh:"我也想，但我现在没法借钱。", tip:"借钱是友谊杀手。这句温和但清楚。"},
   {en:"I'm not comfortable with that, but thank you for asking me.", ipa:"", zh:"我不太能接受那个，但谢谢你想到我。", tip:"不解释原因也可以。"},
   {en:"I need some time to myself this weekend. Let's do next week?", ipa:"", zh:"这周末我需要自己待着。下周可以吗？", tip:"说出自己的需要是正常的。"}]}],
  drills:[["Hey, how did the interview go?","记住并追问"],["Just checking in. How have you been?","check in"],["I'm so sorry to hear that. That sounds really hard.","共情第一"],["I'm here if you want to talk. No pressure.","支持"],["I shouldn't have said that. I was out of line.","道歉"],["I wish I could, but I'm not able to lend money right now.","边界"]],
  ex:[
   {t:"mc",q:"朋友告诉你他失业了，第一句应该说？",opts:["I'm so sorry to hear that. That sounds really hard.","You should find a new job.","Why did they fire you?","That's life."],a:0},
   {t:"listen",q:"听一听，他的意思是？",say:"I was out of line.",opts:["我过分了","我排错队了","我不在线","我出局了"],a:0},
   {t:"mc",q:"朋友想借钱，你不想借，最好说？",opts:["I wish I could, but I'm not able to lend money right now.","No. Never.","Ask someone else.","I have no money."],a:0},
   {t:"listen",q:"听一听，这是什么意思？",say:"It's been too long! We need to catch up.",opts:["太久没见，我们得聚聚","太长了，我们得赶上","时间太长，我们得追","我们迟到太久了"],a:0},
   {t:"type",q:"翻译：有什么我能做的吗？",a:"Is there anything I can do?",alt:["Is there anything I can do","is there anything I can do"]},
   {t:"type",q:"听写这句话。",say:"You're going to get through this.",a:"You're going to get through this.",alt:["You're going to get through this","You are going to get through this.","You are going to get through this"]}],
  hw:[["三条关心","给三位朋友各发一条英语关心消息：追问一件他们提过的事、或一句 Just checking in。"],["练习说不","写下你最近想拒绝但没拒绝的一件事，用本章句式写出英语的拒绝，读三遍。"],["支持一个人","这周对一位遇到困难的人（朋友、同事、邻居）说一句共情的话，并提出一个具体的帮助。"]]
},
{ id:"l7c6", lv:7, title:"第七级结业：办一次小聚会", goal:"能策划、邀请、主持一次小型聚会（4 到 8 人），照顾客人、带动对话、做好结尾。",
  intro:"交朋友最快的方法是<b>当主人</b>：请人到家里（或公园、餐厅），你决定谁来、聊什么。结业任务就是<b>办一次小聚会</b>。本章教主人要说的话：<b>邀请</b>（时间、带什么、忌口）、<b>迎接</b>（接外套、介绍客人互相认识）、<b>主持</b>（带动对话、照顾安静的人）、<b>结尾</b>（送客、感谢、下次）。北美聚会的几个规矩：问客人忌口；客人常问 What can I bring?——给一个具体答案；告别时每个人都要说到。",
  learn:[{h:"邀请",p:"",items:[
   {en:"I'm having a few people over on Saturday around five. Would you like to come?", ipa:"", zh:"周六五点左右我请几个人来家里。你来吗？", tip:"have people over = 请人来家里。"},
   {en:"Nothing fancy, just dumplings and board games.", ipa:"", zh:"不讲究，就是饺子和桌游。", tip:"Nothing fancy 降低对方的压力。"},
   {en:"Any allergies or things you don't eat?", ipa:"", zh:"有过敏或不吃的东西吗？", tip:"北美主人必问。"},
   {en:"Just bring yourself! Or a drink if you want.", ipa:"", zh:"人来就行！想带的话带瓶饮料。", tip:"客人问 What can I bring 时的标准回答。"},
   {en:"Feel free to bring a friend.", ipa:"", zh:"可以带朋友来。", tip:"Feel free to = 随意。"}]},
   {h:"迎接与介绍",p:"",items:[
   {en:"Come in, come in! Let me take your coat.", ipa:"", zh:"快进来！我帮你拿外套。", tip:"冬天必说。"},
   {en:"Make yourself at home. Drinks are in the kitchen.", ipa:"", zh:"别客气，当自己家。饮料在厨房。", tip:""},
   {en:"Have you two met? Anna, this is Jun. Jun just moved into the building.", ipa:"", zh:"你们俩认识吗？Anna，这是俊。俊刚搬进这栋楼。", tip:"介绍时给一个话题（刚搬来、也喜欢爬山），他们就能聊。"},
   {en:"Jun, Anna's the one who recommended that hiking trail.", ipa:"", zh:"俊，Anna 就是推荐那条步道的人。", tip:"把客人联系起来。"}]},
   {h:"主持与结尾",p:"",items:[
   {en:"Help yourselves, there's plenty more.", ipa:"", zh:"随便吃，还有很多。", tip:"Help yourselves = 自己拿。"},
   {en:"Mei, you were telling me about your trip. How was it?", ipa:"", zh:"梅，你之前跟我说你的旅行。怎么样？", tip:"把安静的客人拉进对话。"},
   {en:"Okay, who's up for a game?", ipa:"", zh:"好，谁想玩游戏？", tip:"up for = 想做。"},

   {en:"Get home safe! Text me when you're back.", ipa:"", zh:"路上小心！到家发消息。", tip:"北美告别的标准句。"},
   {en:"Let's do this again. Next time at Anna's?", ipa:"", zh:"下次再聚。下次去 Anna 家？", tip:"把聚会变成轮流的习惯。"}]}],
  drills:[["I'm having a few people over on Saturday around five. Would you like to come?","邀请"],["Nothing fancy, just dumplings and board games. Any allergies?","降压 + 忌口"],["Come in, come in! Let me take your coat. Make yourself at home.","迎接"],["Have you two met? Anna, this is Jun. Jun just moved into the building.","介绍"],["Help yourselves, there's plenty more. Who's up for a game?","主持"],["Thanks so much for coming. Get home safe! Text me when you're back.","送客"]],

   {t:"type",q:"听写这句话。",say:"I'm so glad you made it.",a:"I'm so glad you made it.",alt:["I'm so glad you made it","I am so glad you made it.","I am so glad you made it"]}],

{ id:"l9c1", lv:9, title:"手机套餐：选、办、换", goal:"能在手机店或电话里比较套餐、办理新号、转网、看懂账单。",

{ id:"l9c2", lv:9, title:"家里的网络：装宽带、Wi-Fi 和路由器", goal:"能办理家庭宽带、预约安装、设置 Wi-Fi、解决断网问题。",
  intro:"搬家后第一件事就是装网。办理过程和手机套餐类似，但多了<b>安装预约</b>（technician、installation window）和<b>设备</b>（modem、router）。断网时打客服，他们会让你做一套固定动作：<b>重启、检查灯、检查线</b>。本章把这套话学会，你就能自己解决 80% 的问题。",

{ id:"l9c3", lv:9, title:"手机和电脑的日常：设置、App 与账号", goal:"能看懂英文系统界面和常见提示，设置账号，处理密码和双重验证，描述手机问题。",
  intro:"手机和电脑的界面是你每天看最多的英语，但很多人靠图标猜。本章把<b>最常见的界面词</b>（Settings、Allow、Update、Sign in）和<b>提示语</b>（Your storage is almost full）学一遍；再学<b>账号安全</b>：密码、双重验证、钓鱼邮件——这是新移民最常被骗的地方。最后学<b>描述问题</b>，方便去店里修或打客服。",

   {en:"Update available. Install now or later?", ipa:"", zh:"有更新。现在安装还是稍后？", tip:""},

   {en:"Enable location services? Turn on Bluetooth.", ipa:"", zh:"开启定位服务？打开蓝牙。", tip:"enable = turn on。"}]},
   {h:"账号与安全",p:"",items:[

{ id:"l9c4", lv:9, title:"网购与数字支付", goal:"能在英文网站购物、看懂运费和退货、处理订单问题，使用 e-Transfer、Apple Pay 等支付工具。",

{ id:"l9c5", lv:9, title:"视频通话、语音助手与 AI 工具", goal:"能用英语参加视频会议、使用语音助手、和 AI 聊天工具高效沟通。",

{ id:"l10c1", lv:10, title:"加拿大医疗系统：健康卡、家庭医生与去哪看病", goal:"理解加拿大医疗系统的结构，能办健康卡、找家庭医生，知道不同情况去哪里看病。",
  intro:"加拿大医疗<b>免费但要等</b>，而且<b>去哪看病有规矩</b>：小病找<b>家庭医生</b>（family doctor）或<b>免预约诊所</b>（walk-in clinic），急病去<b>急诊</b>（ER），不确定打<b>811</b>（护士热线）。没有家庭医生是新移民最大的问题，本章教你怎么找。另外，<b>药、牙科、眼科大多不免费</b>，需要工作保险或自费。",
  learn:[{h:"系统与词汇",p:"",items:[

   {en:"walk-in clinic, urgent care, emergency room (ER), Telehealth 811", ipa:"", zh:"免预约诊所、紧急护理中心、急诊室、811 护士热线", tip:"urgent care 介于诊所和急诊之间。"},

{ id:"l10c2", lv:10, title:"看家庭医生：描述症状与听懂医生", goal:"能预约、描述症状的位置、程度、时长和变化，听懂医生的问题、诊断和建议。",
  intro:"看医生只有 10 到 15 分钟，所以<b>描述要准</b>。医生会按固定顺序问：<b>哪里</b>（Where does it hurt?）、<b>什么样</b>（sharp or dull?）、<b>多久了</b>、<b>多严重</b>（1 到 10 分）、<b>什么时候更糟</b>。本章教你提前准备这五个答案，再学听懂医生的<b>诊断</b>（It looks like…）和<b>建议</b>（I'm going to prescribe…）。最后一句最重要：<b>What should I do if it gets worse?</b>",
  learn:[{h:"预约与开场",p:"",items:[
   {en:"I'd like to book an appointment with Dr. Lee. It's not urgent, but I'd like to be seen this week.", ipa:"", zh:"我想预约 Lee 医生。不急，但希望这周能看。", tip:"be seen = 被接诊。"},
   {en:"What brings you in today?", ipa:"", zh:"今天来看什么？", tip:"医生的第一句。"},
   {en:"I've had a sore throat and a fever for three days.", ipa:"", zh:"我喉咙痛、发烧三天了。", tip:"I've had + 症状 + for + 时间。"},
   {en:"It started on Monday and it's getting worse.", ipa:"", zh:"周一开始的，越来越严重。", tip:"getting worse / getting better。"}]},
   {h:"描述症状",p:"",items:[
   {en:"Where does it hurt? — Here, on the right side, under my ribs.", ipa:"", zh:"哪里疼？——这里，右边，肋骨下面。", tip:"用手指，加 right / left / upper / lower。"},
   {en:"Is the pain sharp or dull? — It's a dull ache, but sometimes it's sharp.", ipa:"", zh:"是刺痛还是钝痛？——是隐隐作痛，有时刺痛。", tip:"sharp = 尖锐；dull = 钝；ache = 持续的痛。"},
   {en:"On a scale of one to ten, how bad is it? — About a six.", ipa:"", zh:"1 到 10 分，有多痛？——大概 6 分。", tip:""},
   {en:"Does anything make it better or worse? — It's worse after I eat.", ipa:"", zh:"有什么让它好转或加重？——吃完饭更严重。", tip:""},
   {en:"I feel nauseous and dizzy. I've been throwing up.", ipa:"", zh:"我恶心、头晕。一直在吐。", tip:"nauseous 读 NAW-shus；throw up = 呕吐。"},

{ id:"l10c3", lv:10, title:"药房：处方、非处方药与药剂师", goal:"能取处方药、听懂用药说明、买非处方药、向药剂师咨询，看懂药品标签。",
  intro:"药剂师（pharmacist）是加拿大<b>最容易接触、最有用的医疗专业人士</b>：不用预约、免费咨询、能开一些处方（如续药、小病）。本章教<b>取药</b>（drop off / pick up）、<b>听懂说明</b>（with food、every six hours、as needed）、<b>买非处方药</b>（over-the-counter）、<b>看标签</b>（warnings、side effects）。药费：安省 24 岁以下和 65 岁以上大多免费，其他人靠工作保险或自费。",
  learn:[{h:"取处方药",p:"",items:[
   {en:"I'd like to fill this prescription. / I'm here to pick up a prescription for Wang.", ipa:"", zh:"我想配这张处方。/ 我来取王的处方药。", tip:"fill = 配药；pick up = 取药。"},

{ id:"l10c4", lv:10, title:"牙科、眼科与化验检查", goal:"能看牙医和验光师，听懂治疗建议和费用，完成血检、X 光等检查，理解结果。",

{ id:"l10c5", lv:10, title:"急诊、住院与心理健康", goal:"能在急诊描述紧急情况、理解分诊流程，处理住院和出院，并能为心理健康求助。",
  intro:"急诊的流程是<b>分诊（triage）</b>：护士先评估严重程度，重的先看，所以等几小时很正常。你要做的是<b>准确说出最严重的症状</b>——这决定你的优先级。住院会遇到很多人：护士、医生、社工，要会问<b>“我现在是什么情况、下一步是什么、什么时候能出院”</b>。最后是<b>心理健康</b>：在加拿大，焦虑、抑郁和看牙一样正常，家庭医生就能帮你，还有免费热线。",
  learn:[{h:"急诊与分诊",p:"",items:[
   {en:"I need to see a doctor right away. I'm having severe chest pain.", ipa:"", zh:"我需要马上看医生。我胸口剧痛。", tip:"severe = 严重的。说最重的症状。"},
   {en:"My son fell and hit his head. He vomited twice and he's very sleepy.", ipa:"", zh:"我儿子摔倒撞到头。吐了两次，现在很困。", tip:"头部受伤 + 呕吐 + 嗜睡 = 优先级高。"},

{ id:"l10c6", lv:10, title:"第十级结业：做家人的医疗翻译", goal:"能陪家人看病并做翻译：预约、描述、听懂医生、复述给家人、问清后续，并整理成医疗记录。",
  intro:"很多新移民家庭里，<b>英语最好的人就是全家的医疗翻译</b>——这是责任，也是本级的结业任务。做翻译有三个难点：① <b>准确</b>：医生说 twice a day 不能翻成“一天一次”；② <b>完整</b>：不要替家人省略症状；③ <b>追问</b>：家人不好意思问的，你替他问。本章教翻译者的语言：<b>向医生说明你的角色</b>、<b>请医生慢一点</b>、<b>确认理解</b>、<b>要书面材料</b>。",
  learn:[{h:"说明角色与请求",p:"",items:[
   {en:"I'm her son. I'll be translating for her today.", ipa:"", zh:"我是她儿子。今天我为她翻译。", tip:"一开始说明。"},
   {en:"Could you speak a bit slower and pause so I can translate?", ipa:"", zh:"能说慢一点、停一下让我翻译吗？", tip:"医生很习惯这个请求。"},
   {en:"Let me check with her. One moment.", ipa:"", zh:"我问一下她。稍等。", tip:""},
   {en:"She says the pain started two weeks ago, and it's worse at night.", ipa:"", zh:"她说疼痛两周前开始，晚上更严重。", tip:"She says + 完整句。"},
   {en:"She wants to know if this medication has side effects.", ipa:"", zh:"她想知道这个药有没有副作用。", tip:"She wants to know if…"}]},
   {h:"确认与追问",p:"",items:[
   {en:"Just to confirm: one tablet, twice a day, with food, for ten days. Is that right?", ipa:"", zh:"确认一下：一片，一天两次，随餐，十天。对吗？", tip:"用药说明必须复述确认。"},
   {en:"What does that word mean? Could you spell it?", ipa:"", zh:"那个词是什么意思？能拼一下吗？", tip:"病名、药名让医生拼出来。"},
   {en:"Is this condition serious? What happens if it's not treated?", ipa:"", zh:"这个病严重吗？不治会怎样？", tip:"家人不好意思问的，你问。"},
   {en:"Are there any other options besides surgery?", ipa:"", zh:"除了手术还有别的选择吗？", tip:"besides = 除了。"},
   {en:"Could you write that down for us? / Could we get a copy of the test results?", ipa:"", zh:"能帮我们写下来吗？/ 能给我们一份检查结果的复印件吗？", tip:"书面材料回家可以慢慢查。"},
   {en:"Is there an interpreter service available for next time?", ipa:"", zh:"下次有翻译服务吗？", tip:"大医院有免费电话翻译，你不在时家人可以用。"}]},
   {h:"整理记录",p:"",items:[
   {en:"Date, doctor, diagnosis, medication, next appointment.", ipa:"", zh:"日期、医生、诊断、用药、下次预约。", tip:"每次看诊记这五项。"},
   {en:"Dr. Patel, March third. Diagnosis: high blood pressure. Started amlodipine, five milligrams daily. Follow-up in one month.", ipa:"", zh:"Patel 医生，3 月 3 日。诊断：高血压。开始吃氨氯地平，每天 5 毫克。一个月后复诊。", tip:"一条完整记录的样子。"}]}],
  drills:[["I'm her son. I'll be translating for her today.","说明角色"],["Could you speak a bit slower and pause so I can translate?","请慢"],["She says the pain started two weeks ago, and it's worse at night.","转述"],["Just to confirm: one tablet, twice a day, with food, for ten days. Is that right?","确认用药"],["Is this condition serious? What happens if it's not treated?","追问"],["Could you write that down for us? Could we get a copy of the test results?","要书面"]],
  ex:[
   {t:"listen",q:"听一听，翻译者在做什么？",say:"She wants to know if this medication has side effects.",opts:["替她问药有没有副作用","说她有副作用","拒绝吃药","问药多少钱"],a:0},
   {t:"mc",q:"医生说了用药方法，翻译者应该？",opts:["复述一遍确认：Just to confirm…","直接翻给家人","点头","记在心里"],a:0},
   {t:"listen",q:"听一听，这条记录的诊断是？",say:"Diagnosis: high blood pressure. Follow-up in one month.",opts:["高血压，一个月后复诊","糖尿病，一周后复诊","高血压，一年后复诊","感冒"],a:0},

   {t:"type",q:"翻译：除了手术还有别的选择吗？（用 besides）",a:"Are there any other options besides surgery?",alt:["Are there any other options besides surgery","Are there other options besides surgery?","Is there any other option besides surgery?"]},
   {t:"type",q:"听写这个词（“诊断”）。",say:"diagnosis",a:"diagnosis"}],

{ id:"l11c1", lv:11, title:"加拿大人怎么说话：eh、sorry 和客气的艺术", goal:"听懂并自然使用加拿大英语的标志性词汇和说话方式，理解“客气”背后的规则。",
  intro:"加拿大英语和美国英语 95% 一样，但那 5% 很有辨识度：<b>eh</b>（是吧？）、<b>sorry</b>（一天说二十次）、<b>washroom</b>（不说 bathroom 或 toilet）、<b>toque</b>（毛线帽）、<b>loonie / toonie</b>（一元 / 两元硬币）。更重要的是<b>说话方式</b>：加拿大人非常<b>间接</b>——“That's interesting” 可能是“我不同意”，“I'm not sure that works” 是“不行”。本章教你听懂这些弦外之音。",
  learn:[{h:"标志性词汇",p:"",items:[
   {en:"eh: Nice day, eh? / It's cold, eh?", ipa:"", zh:"是吧：天气不错，是吧？/ 很冷，是吧？", tip:"句尾升调，邀请对方同意。不要每句都加。"},
   {en:"sorry: Sorry, excuse me. / Oh, sorry! (when someone bumps into you)", ipa:"", zh:"抱歉：（挤过去时）/（别人撞到你时你也说）", tip:"加拿大的 sorry 很多时候不是道歉，是礼貌的“打扰了”。读 SOR-ee，不是 SAR-ee。"},
   {en:"washroom, toque, parkade, hydro, runners", ipa:"", zh:"洗手间、毛线帽、停车楼、电费、运动鞋", tip:"hydro 在加拿大指电（Hydro bill = 电费账单）。toque 读 /tuːk/。"},
   {en:"loonie, toonie, two-four, mickey, double-double", ipa:"", zh:"一元硬币、两元硬币、24 瓶装啤酒、小瓶烈酒、两糖两奶咖啡", tip:"double-double 是 Tim Hortons 的点法。"},
   {en:"Timmies, the 6ix, the GTA, out west, down east", ipa:"", zh:"Tim Hortons、多伦多、大多伦多地区、西部、东部沿海", tip:"the 6ix 是 Drake 给多伦多起的外号。"}]},
   {h:"客气的弦外之音",p:"加拿大人说的 vs 真正的意思。",items:[
   {en:"That's interesting. → I'm not sure I agree.", ipa:"", zh:"“有意思。”→ 我不太同意。", tip:""},
   {en:"I'm not sure that would work. → No.", ipa:"", zh:"“我不确定那行得通。”→ 不行。", tip:""},
   {en:"We should get together sometime! → (maybe, maybe not)", say:"We should get together sometime!", ipa:"", zh:"“我们找时间聚聚！”→（可能是客套）", tip:"没有具体时间就是客套。有具体时间才是真约。"},
   {en:"No worries! / No problem! → You're welcome. / It's fine.", ipa:"", zh:"“没事！”→ 不客气 / 没关系。", tip:"回应 thank you 和 sorry 都用。"},
   {en:"If you don't mind… / Would it be possible to… → (a real request)", say:"If you don't mind. Would it be possible to.", ipa:"", zh:"“如果你不介意……/ 有可能……吗？”→（这是真的要求）", tip:"越客气的句式，越是认真的要求。"},
   {en:"I'll let you go. → I want to end this conversation.", ipa:"", zh:"“我不耽误你了。”→ 我想结束对话了。", tip:"听到这句就该说再见。"}]}],
  drills:[["Nice day, eh? It's cold, eh?","eh"],["Sorry, excuse me. Oh, sorry!","sorry 的两种"],["washroom, toque, parkade, hydro","加拿大词"],["loonie, toonie, double-double","钱和咖啡"],["That's interesting. I'm not sure that would work.","弦外之音"],["No worries! I'll let you go.","回应 + 结束"]],
  ex:[
   {t:"listen",q:"听一听，这句话里的 eh 是什么作用？",say:"Pretty cold out there, eh?",opts:["邀请对方同意（是吧？）","表示疑问（什么？）","表示惊讶","没有意思"],a:0},
   {t:"mc",q:"同事说 “I'm not sure that would work.”，最可能的意思是？",opts:["不行","他不确定，需要再想想","他同意","他不懂"],a:0},
   {t:"listen",q:"听一听，这是什么？",say:"Can I get a large double-double?",opts:["大杯两糖两奶咖啡","两杯大咖啡","双份浓缩","大杯黑咖啡"],a:0},
   {t:"mc",q:"“Hydro bill” 在加拿大指？",opts:["电费账单","水费账单","燃气费账单","手机账单"],a:0},
   {t:"type",q:"翻译：没事！（回应 thank you）",a:"No worries!",alt:["No worries","no worries","No problem!"]},
   {t:"type",q:"听写这个词（“洗手间”，加拿大说法）。",say:"washroom",a:"washroom"}],
  hw:[["数 sorry","今天在公共场合数一数你听到多少次 sorry，哪几次是真道歉。"],["用一次 eh","对一个加拿大人说一句带 eh 的话（天气最安全），看对方怎么接。"],["翻译弦外之音","回想最近三次别人对你说的客气话，用英语写下它们的“真正意思”。"]]
},
{ id:"l11c2", lv:11, title:"冰球、Tim Hortons 与国民话题", goal:"能聊加拿大人最爱的话题：冰球、咖啡、天气、Costco，并知道哪些话题要小心。",
  intro:"每个国家都有“国民话题”——陌生人之间一说就热络。加拿大的是：<b>冰球</b>（Leafs 又输了）、<b>Tim Hortons</b>、<b>天气</b>（永远可以聊）、<b>Costco</b>、<b>房价</b>、<b>去美国买东西</b>。本章给你每个话题的几句“入场券”，不用真懂冰球，会说两句就能加入。也教你<b>哪些话题要小心</b>：收入、宗教、政治、体重、年龄。",
  learn:[{h:"冰球",p:"不用懂规则，会这几句就够。",items:[
   {en:"Did you catch the game last night?", ipa:"", zh:"昨晚的比赛看了吗？", tip:"catch the game = 看比赛。周一早上的万能开场。"},

   {en:"My kid just started playing. Early morning practices are brutal.", ipa:"", zh:"我孩子刚开始打。早上的训练太折磨人了。", tip:"hockey parent 是一种身份。brutal = 残酷。"}]},
   {h:"咖啡、天气与 Costco",p:"",items:[

{ id:"l11c3", lv:11, title:"节日与习俗：从感恩节到 Boxing Day", goal:"了解加拿大全年的节日和习俗，知道每个节日怎么说、怎么做、怎么祝福。",

{ id:"l11c4", lv:11, title:"日常俚语：年轻人和同事都在说的话", goal:"听懂北美日常对话中最常见的 40 个俚语和口语表达，并在随意场合恰当使用。",
  intro:"课本英语和真人英语的差距，一半在俚语。<b>sick</b> 可能是“超棒”，<b>I'm dead</b> 是“笑死了”，<b>no cap</b> 是“不骗你”。俚语更新快，本章只学<b>流行了好几年、各年龄都懂</b>的那些。原则：<b>先听懂，确定场合对了再用</b>——面试、正式邮件绝对不用；和同事朋友随意聊天可以用一两个，用多了反而怪。",
  learn:[{h:"评价与反应",p:"",items:[
   {en:"That's sick! / That's awesome! / That's fire!", ipa:"", zh:"太棒了！", tip:"sick 和 fire 偏年轻。awesome 最安全。"},
   {en:"I'm dead. / That's hilarious.", ipa:"", zh:"笑死我了。/ 太好笑了。", tip:"I'm dead 常用在文字里。"},
   {en:"No way! / Shut up! (= I can't believe it)", ipa:"", zh:"不会吧！/ 真的假的！", tip:"Shut up 在这里不是“闭嘴”，是惊讶。只对熟人用。"},
   {en:"That sucks. / That's rough. / Brutal.", ipa:"", zh:"真糟糕。/ 太惨了。", tip:"听到坏消息的回应。"},
   {en:"It's a vibe. / Good vibes only.", ipa:"", zh:"氛围很好。/ 只要好氛围。", tip:"vibe = 氛围、感觉。"},
   {en:"Fair enough. / Makes sense.", ipa:"", zh:"有道理。/ 说得通。", tip:"接受对方解释时说。"}]},
   {h:"描述人和事",p:"",items:[
   {en:"He's chill. / She's super sweet. / They're a bit extra.", ipa:"", zh:"他很随和。/ 她人很好。/ 他们有点夸张。", tip:"chill = 放松、好相处；extra = 戏多。"},
   {en:"I'm swamped this week. / I'm beat.", ipa:"", zh:"我这周忙死了。/ 我累瘫了。", tip:"swamped = 被淹没（工作）；beat = 累。"},
   {en:"It's a no-brainer. / It's a long shot.", ipa:"", zh:"不用想都知道。/ 希望不大。", tip:"no-brainer = 明显的选择。"},
   {en:"That's sketchy. / That's legit.", ipa:"", zh:"那很可疑。/ 那是真的（靠谱）。", tip:"sketchy = 可疑、不安全；legit = 正规、真的。"},
   {en:"I'm down. / I'm in. / Hard pass.", ipa:"", zh:"我愿意。/ 算我一个。/ 坚决不要。", tip:"I'm down = 我参加（不是“我情绪低落”）。"},
   {en:"My bad. / No cap. / For real.", ipa:"", zh:"我的错。/ 不骗你。/ 真的。", tip:"My bad 是最轻的道歉。"}]},
   {h:"工作场合的口语",p:"同事之间可以用，邮件里不用。",items:[
   {en:"Let's circle back on that. / I'll ping you.", ipa:"", zh:"我们回头再说这个。/ 我会发消息给你。", tip:"circle back = 回头再谈；ping = 发个消息。"},
   {en:"Can you give me a heads-up before you send it?", ipa:"", zh:"发之前能提前跟我说一声吗？", tip:"heads-up = 提前通知。"},
   {en:"That's above my pay grade.", ipa:"", zh:"那不是我能决定的。", tip:"幽默地说“这事太大”。"},
   {en:"We're slammed today. Can it wait till tomorrow?", ipa:"", zh:"我们今天忙疯了。能等到明天吗？", tip:"slammed = 极忙。"},
   {en:"Nailed it! / You crushed it!", ipa:"", zh:"搞定了！/ 你太棒了！", tip:"夸同事做得好。"}]}],

  ex:[

{ id:"l11c5", lv:11, title:"餐桌、小费与社交规矩", goal:"掌握加拿大的社交规矩：小费、排队、守时、做客、礼物、拥抱与握手。",
  intro:"规矩不说出来，但做错了别人会记住。本章把<b>最容易踩的坑</b>列出来：<b>小费</b>（餐厅 15 到 20%，外卖、理发、出租车也要）；<b>排队</b>（插队是大忌）；<b>守时</b>（约会准时，做客晚 10 分钟正好）；<b>做客</b>（脱鞋、带东西、不要空手）；<b>身体接触</b>（握手、拥抱什么时候用）；<b>餐桌</b>（AA 很正常，不要抢着付）。每条都给你一句对应的英语。",
  learn:[{h:"小费与付账",p:"",items:[
   {en:"The standard tip is fifteen to twenty percent at a sit-down restaurant.", ipa:"", zh:"堂食餐厅标准小费 15 到 20%。", tip:"刷卡机会让你选百分比。"},
   {en:"Tip your hairdresser, your taxi driver, and the delivery person too.", ipa:"", zh:"理发师、出租车司机、送餐员也要给小费。", tip:"理发 15 到 20%，外卖 10 到 15%。"},
   {en:"Let's split it. / I've got this one, you get the next one.", ipa:"", zh:"我们 AA。/ 这次我请，下次你请。", tip:"不要抢账单，加拿大人会不舒服。"},
   {en:"Can we get separate bills?", ipa:"", zh:"能分开结账吗？", tip:"点餐时就可以说。"}]},
   {h:"排队、守时与做客",p:"",items:[
   {en:"Are you in line? / Sorry, the line starts back there.", ipa:"", zh:"你在排队吗？/ 抱歉，队尾在那边。", tip:"line 也叫 lineup。永远先问 Are you in line。"},
   {en:"Being on time means being on time. Text if you're running late.", ipa:"", zh:"守时就是准时。要迟到就发消息。", tip:"约会、工作、预约都准时。做客可以晚 10 分钟。"},
   {en:"Should I take my shoes off?", ipa:"", zh:"我要脱鞋吗？", tip:"加拿大大多数家庭进门脱鞋，问一下最保险。"},
   {en:"Never show up empty-handed. Bring wine, dessert, or flowers.", ipa:"", zh:"永远不要空手上门。带酒、甜点或花。", tip:"empty-handed = 空手。"},
   {en:"RSVP by Friday. / Regrets only.", ipa:"", zh:"周五前回复是否参加。/ 不来才需要回复。", tip:"RSVP = 请回复。收到邀请一定回。"}]},
   {h:"身体接触与礼物",p:"",items:[
   {en:"A handshake for business, a hug for friends. When in doubt, offer a handshake.", ipa:"", zh:"商务握手，朋友拥抱。不确定就伸手握手。", tip:"when in doubt = 不确定时。"},
   {en:"Keep about an arm's length of personal space.", ipa:"", zh:"保持大约一臂的个人空间。", tip:"比中国的距离大。"},
   {en:"Open the gift in front of the giver and say thank you.", ipa:"", zh:"在送礼人面前打开礼物并道谢。", tip:"和中国相反：当面打开是礼貌。"},
   {en:"You shouldn't have! This is lovely.", ipa:"", zh:"你太客气了！真好。", tip:"收礼物的标准反应。"},
   {en:"Hold the door for the person behind you.", ipa:"", zh:"为后面的人扶门。", tip:"小事，但加拿大人很在意。"},
   {en:"Thank the bus driver when you get off.", ipa:"", zh:"下车时谢谢公交司机。", tip:"真的，很多人都这么做。"}]}],
  drills:[["The standard tip is fifteen to twenty percent at a sit-down restaurant.","小费"],["Let's split it. Can we get separate bills?","AA"],["Are you in line? Sorry, the line starts back there.","排队"],["Should I take my shoes off? Never show up empty-handed.","做客"],["When in doubt, offer a handshake.","握手"],["You shouldn't have! This is lovely.","收礼"]],
  ex:[
   {t:"mc",q:"堂食餐厅的标准小费是？",opts:["15 到 20%","5%","不用给","50%"],a:0},
   {t:"listen",q:"听一听，他在说什么规矩？",say:"Never show up empty-handed. Bring wine or dessert.",opts:["做客不要空手","餐厅要给小费","排队不要插队","准时到"],a:0},
   {t:"mc",q:"收到礼物，加拿大的礼貌做法是？",opts:["当面打开并道谢","收起来回家再开","推辞三次","马上回礼"],a:0},
   {t:"listen",q:"听一听，这是什么意思？",say:"RSVP by Friday.",opts:["周五前回复是否参加","周五来","周五取消","周五付款"],a:0},
