/* ===== 第十七级 · 驾照与路上 Driving Test & the Road ===== */
{ id:"l17c1", lv:17, title:"驾照体系：G1、G2、G 与换照", goal:"理解安省（及其他省类似）的分级驾照制度，知道换照规则，能预约笔试并看懂手册的关键词。",
  intro:"安省驾照分三级：<b>G1</b>（笔试通过，必须有老司机陪）→ <b>G2</b>（路考一，可独自开）→ <b>G</b>（路考二，高速）。中国驾照可以<b>换照</b>，但要<b>驾龄证明</b>（翻译件）；两年以上驾龄可直接考 G，否则要等。本章教体系、换照流程和<b>手册里最常考的词</b>。笔试有中文版，但路考考官只说英语。",
  learn:[{h:"驾照体系",p:"",items:[
   {en:"G1: you must be with a fully licensed driver with at least four years of experience, and have zero blood alcohol.", ipa:"", zh:"G1：必须和有至少四年经验的正式驾照持有人同车，血液酒精为零。", tip:"晚上 12 点到 5 点不能上路（除非陪同的是教练）。"},
   {en:"G2: you can drive alone, but still zero alcohol, and passenger limits for drivers under twenty.", ipa:"", zh:"G2：可以独自驾驶，但仍然零酒精，20 岁以下有乘客限制。", tip:"G1 到 G2 要等 12 个月（上驾校 8 个月）。"},
   {en:"G: full licence. The G test includes highway driving.", ipa:"", zh:"G：正式驾照。G 路考包括高速。", tip:"G2 到 G 要等 12 个月。G2 五年内不考 G 要重来。"},
   {en:"learner's permit, probationary licence, full licence, demerit points, licence suspension", ipa:"", zh:"学习驾照、试用驾照、正式驾照、扣分、吊销", tip:"suspension = 吊销。"}]},
   {h:"换照",p:"",items:[

   {en:"With more than two years of experience, you can take the G test directly after passing the written test.", ipa:"", zh:"有两年以上驾龄，通过笔试后可以直接考 G。", tip:"驾龄证明是关键文件。"},
   {en:"With less than two years, you'll get a G1 and can take the G2 test after the waiting period.", ipa:"", zh:"不足两年，你会拿到 G1，等待期后可以考 G2。", tip:""},

   {en:"speed limit, school zone, pedestrian crossing, stop sign, four-way stop", ipa:"", zh:"限速、学校区域、人行横道、停车标志、四向停车", tip:"four-way stop：先到先走，同时到右边先走。"},
   {en:"Come to a complete stop at a stop sign.", ipa:"", zh:"在停车标志前完全停下。", tip:"complete stop = 车轮完全不动。没完全停是路考最常见的挂科原因。"},

{ id:"l17c2", lv:17, title:"路考：考官的指令与常见扣分", goal:"听懂路考考官的每一个指令，知道常见扣分点，并能在考前考后和考官沟通。",
  intro:"路考<b>只有英语指令</b>，而且考官说得快、不重复：<b>Turn left at the next intersection</b>、<b>Pull over and park</b>、<b>Change lanes when it's safe</b>。听错一个指令可能直接挂。本章把<b>所有指令</b>列出来反复听；再学<b>常见扣分点</b>（没过肩检查、没完全停、速度不稳、三点掉头、平行泊车）；最后是<b>考试前后的对话</b>——包括<b>Could you repeat that?</b> 是可以问的。",
  learn:[{h:"考官指令",p:"每条听五遍，直到不用想。",items:[
   {en:"Please start the car and pull out when it's safe.", ipa:"", zh:"请启动车，安全时驶出。", tip:"pull out = 驶出（停车位）。"},
   {en:"Turn left at the next intersection. / Turn right at the lights.", ipa:"", zh:"在下一个路口左转。/ 在红绿灯右转。", tip:"intersection = 路口。"},
   {en:"Change lanes to the left when it's safe.", ipa:"", zh:"安全时换到左车道。", tip:"打灯 → 看镜 → 过肩 → 换道。"},
   {en:"Pull over to the right and stop. / Pull over and park behind the blue car.", ipa:"", zh:"靠右停车。/ 停在蓝色车后面。", tip:"pull over = 靠边停。"},
   {en:"Make a three-point turn here. / Do a U-turn when it's safe.", ipa:"", zh:"在这里做三点掉头。/ 安全时掉头。", tip:"three-point turn：前进、倒退、前进。"},
   {en:"Parallel park behind that car. / Back into this parking spot.", ipa:"", zh:"在那辆车后面平行泊车。/ 倒进这个车位。", tip:"back into = 倒车进入。"},
   {en:"Merge onto the highway and stay in the right lane. Take the next exit.", ipa:"", zh:"并入高速，保持右车道。下一个出口下。", tip:"G 考试的高速部分。"},
   {en:"Go straight through. / Continue straight. / Follow the road.", ipa:"", zh:"直行通过。/ 继续直行。/ 沿路走。", tip:""}]},
   {h:"常见扣分",p:"",items:[
   {en:"Failing to shoulder check before turning or changing lanes.", ipa:"", zh:"转弯或换道前没有过肩检查。", tip:"考官专门看你的头有没有转。夸张一点。"},
   {en:"Rolling through a stop sign instead of coming to a complete stop.", ipa:"", zh:"在停车标志前滑行通过而不是完全停下。", tip:"rolling stop = 没停稳。自动挂。"},
   {en:"Driving too slowly or too fast for conditions.", ipa:"", zh:"相对路况开得太慢或太快。", tip:"太慢也扣分。"},
   {en:"Not checking mirrors every five to eight seconds.", ipa:"", zh:"没有每 5 到 8 秒看镜子。", tip:""},
   {en:"Stopping past the stop line or in the crosswalk.", ipa:"", zh:"停过了停止线或停在人行横道上。", tip:""},
   {en:"Failing to yield to pedestrians.", ipa:"", zh:"没有让行人。", tip:"行人永远优先。"}]},
   {h:"考试前后",p:"",items:[
   {en:"Good morning. Here's my licence and the vehicle registration and insurance.", ipa:"", zh:"早上好。这是我的驾照、车辆登记和保险。", tip:"考前检查文件。"},
   {en:"Could you repeat that, please? / Did you say left or right?", ipa:"", zh:"能再说一遍吗？/ 你说的是左还是右？", tip:"问不扣分，做错才扣。"},
   {en:"I'm going to check my mirrors and my blind spot now.", ipa:"", zh:"我现在要看镜子和盲区。", tip:"有的考生边做边说，让考官知道你在做。可以。"},
   {en:"Congratulations, you passed. / Unfortunately, you didn't pass today. Here's your report.", ipa:"", zh:"恭喜，你通过了。/ 很遗憾，今天没通过。这是你的报告。", tip:"没过可以再约，看报告改。"},
   {en:"Could you tell me what I need to work on?", ipa:"", zh:"能告诉我需要改进什么吗？", tip:""}]}],
  drills:[["Please start the car and pull out when it's safe.","开始"],["Turn left at the next intersection. Change lanes to the left when it's safe.","转弯 + 换道"],["Pull over to the right and stop. Parallel park behind that car.","停车"],["Make a three-point turn here.","三点掉头"],["Merge onto the highway and stay in the right lane. Take the next exit.","高速"],["Could you repeat that, please? Did you say left or right?","确认"]],
  ex:[
   {t:"listen",q:"听一听，考官要你做什么？",say:"Pull over to the right and stop behind the white car.",opts:["靠右停在白车后面","左转","换到右车道","倒车入位"],a:0},
   {t:"listen",q:"听一听，考官要你做什么？",say:"Change lanes to the left when it's safe.",opts:["安全时换到左车道","左转","靠左停","掉头"],a:0},
   {t:"mc",q:"“rolling stop” 是？",opts:["没完全停下就通过停车标志（自动挂）","慢慢停车","停在坡上","正确的停车方式"],a:0},
   {t:"listen",q:"听一听，考官说什么？",say:"Make a three-point turn here.",opts:["在这里三点掉头","右转三次","前进三米","停三秒"],a:0},
   {t:"type",q:"翻译：你说的是左还是右？",a:"Did you say left or right?",alt:["Did you say left or right","did you say left or right","Left or right?"]},
   {t:"type",q:"听写这个词（“路口”）。",say:"intersection",a:"intersection"}],
  hw:[["听指令","把本章八条指令录成一段音频（或让 AI 读），开车时（或坐车时）随机播放，立刻说出要做的动作。"],["扣分自查","开一次车，让同车的人用英语记下你有没有六个常见扣分点。"],["一节英语课","上一节英语授课的驾驶课（或请会英语的朋友陪练一小时），只用英语指令。"]]
},
{ id:"l17c3", lv:17, title:"买车与保险：新车、二手车与保费", goal:"能在车行或私人处买车、看懂二手车信息、谈价格、办理保险并看懂保单。",
  intro:"买车的英语有两层：<b>车本身</b>（make、model、mileage、accident history）和<b>钱</b>（financing、lease、trade-in、保险）。二手车要查 <b>CARFAX</b>（事故和历史）和要 <b>safety certificate</b>（安检证明）。<b>保险</b>是新移民最大的意外支出：没有加拿大驾驶记录，保费可能一年 3000 到 5000；可以用中国驾驶记录的信降一点。本章教看车、谈价、买保险的句子。",
  learn:[{h:"看车",p:"",items:[
   {en:"make, model, year, mileage, trim, transmission", ipa:"", zh:"品牌、型号、年份、里程、配置等级、变速箱", tip:"mileage 读 MY-lij，公里数。"},
   {en:"How many kilometres does it have? Has it been in any accidents?", ipa:"", zh:"开了多少公里？出过事故吗？", tip:""},
   {en:"Can I see the CARFAX report and the maintenance records?", ipa:"", zh:"能看 CARFAX 报告和保养记录吗？", tip:"CARFAX 显示事故、过户、里程。"},
   {en:"Is it certified? Does it come with a safety certificate?", ipa:"", zh:"是认证的吗？带安检证明吗？", tip:"安省过户必须有 safety。"},
   {en:"Can I take it for a test drive? And can I have my mechanic look at it?", ipa:"", zh:"能试驾吗？能让我的修车师傅看一下吗？", tip:"私人买车一定要独立检查（pre-purchase inspection，约 100 到 150）。"},
   {en:"Are there any warning lights? When were the brakes and tires last replaced?", ipa:"", zh:"有警告灯吗？刹车和轮胎上次什么时候换的？", tip:""}]},
   {h:"谈价与付款",p:"",items:[
   {en:"What's your best price? / I've seen the same model listed for two thousand less.", ipa:"", zh:"最低多少？/ 我看到同款挂牌便宜两千。", tip:"带证据。"},
   {en:"Is that the all-in price, including fees and taxes?", ipa:"", zh:"这是全包价吗，含费用和税？", tip:"all-in = 全包。车行有很多附加费。"},
   {en:"Financing or leasing? What's the interest rate and the term?", ipa:"", zh:"贷款还是租赁？利率和期限是多少？", tip:"lease = 长租，到期还车。"},
   {en:"I'd like to trade in my current car. What would you give me for it?", ipa:"", zh:"我想置换我现在的车。你们能给多少？", tip:"trade-in 价通常低于私售。"},
   {en:"I don't need the extended warranty or the rust protection, thanks.", ipa:"", zh:"我不需要延保和防锈，谢谢。", tip:"车行会推销，可以拒绝。"},
   {en:"We'll need the bill of sale and the Used Vehicle Information Package to transfer ownership.", ipa:"", zh:"过户需要买卖合同和二手车信息包。", tip:"UVIP 卖家从 ServiceOntario 买。"}]},
   {h:"保险",p:"",items:[
   {en:"I'd like a quote for auto insurance. I'm a new driver in Canada, but I've driven for ten years in China.", ipa:"", zh:"我想要汽车保险报价。我在加拿大是新司机，但在中国开了十年。", tip:"要中国保险公司的无事故证明信（英文），有些公司认。"},
   {en:"liability, collision, comprehensive, deductible, premium", ipa:"", zh:"第三者责任、碰撞、综合、免赔额、保费", tip:"liability 是法定必须；collision 赔你的车；comprehensive 赔盗窃、冰雹等。"},
   {en:"What's the premium per month? Can I lower it with a higher deductible?", ipa:"", zh:"每月保费多少？提高免赔额能降吗？", tip:""},
   {en:"Do you offer a discount for winter tires or a driving-tracking app?", ipa:"", zh:"有冬季轮胎或驾驶追踪 App 的折扣吗？", tip:"安省冬胎折扣约 5%。"},
   {en:"I'd like to add my wife as an occasional driver.", ipa:"", zh:"我想把我太太加为偶尔驾驶人。", tip:"occasional = 偶尔。"},
   {en:"Please send me the pink slip. I need proof of insurance for the plates.", ipa:"", zh:"请把粉单发给我。我上牌需要保险证明。", tip:"pink slip = 保险卡（现在是电子版）。"}]}],
  drills:[["How many kilometres does it have? Has it been in any accidents?","看车"],["Can I see the CARFAX report? Does it come with a safety certificate?","两个必问"],["Can I take it for a test drive? And can I have my mechanic look at it?","试驾 + 检查"],["Is that the all-in price, including fees and taxes?","全包价"],["I'd like a quote for auto insurance. I'm a new driver in Canada, but I've driven for ten years in China.","保险"],["liability, collision, comprehensive, deductible, premium","保险五词"]],
  ex:[
   {t:"mc",q:"“mileage” 在加拿大指？",opts:["里程（公里数）","油耗","英里","价格"],a:0},
   {t:"listen",q:"听一听，买家要什么？",say:"Can I see the CARFAX report and the maintenance records?",opts:["事故报告和保养记录","试驾","保险","发票"],a:0},
   {t:"mc",q:"“all-in price” 是？",opts:["含所有费用和税的价格","不含税","只含车价","分期价"],a:0},
   {t:"listen",q:"听一听，他想加谁？",say:"I'd like to add my wife as an occasional driver.",opts:["太太作为偶尔驾驶人","儿子作为主驾驶","朋友","父母"],a:0},
   {t:"type",q:"翻译：最低多少？（用 best price）",a:"What's your best price?",alt:["What's your best price","What is your best price?","what's your best price"]},
   {t:"type",q:"听写这个词（“保费”）。",say:"premium",a:"premium"}],
  hw:[["读三个车源","在 AutoTrader 读三条二手车广告，用英语说出：品牌型号年份、公里数、价格、是否认证。"],["要三个保险报价","打给三家保险公司要报价，用英语问本章的四个问题，比较。"],["看一次车","去车行或约一个私人卖家看车，用英语问至少六个问题，不买也行。"]]
},
{ id:"l17c4", lv:17, title:"路上：加油、停车、罚单与冬天", goal:"能加油、找停车、看懂停车标志、处理罚单和拖车，应对加拿大冬天的驾驶。",
  intro:"日常开车的英语是小事的集合：<b>加油</b>（regular、pump、pay at the pump）、<b>停车</b>（标志复杂到本地人都看不懂）、<b>罚单和拖车</b>（parking ticket、towed）、<b>冬天</b>（winter tires、black ice、plow）。本章一次学完。特别注意停车标志：<b>No parking 1 to 3 p.m. Mon to Fri except by permit</b> 这种句子，看错就是 50 到 100 元。",
  learn:[{h:"加油与停车",p:"",items:[
   {en:"Regular, please. Fill it up. / Twenty dollars on pump four.", ipa:"", zh:"普通汽油。加满。/ 四号泵加 20 块。", tip:"北美大多数自助：pay at the pump 刷卡。"},
   {en:"Do you have a car wash? Can I get an air pump?", ipa:"", zh:"有洗车吗？能用打气泵吗？", tip:""},
   {en:"No parking, no stopping, no standing: what's the difference?", ipa:"", zh:"禁止停车、禁止停留、禁止候客：区别是什么？", tip:"no stopping 最严：连停一下都不行。"},
   {en:"Two-hour parking, eight a.m. to six p.m., Monday to Saturday. Permit holders excepted.", ipa:"", zh:"限停两小时，早 8 到晚 6，周一到周六。持证者除外。", tip:"excepted = 除外。周日免费。"},
   {en:"Pay and display. / Pay by plate at the machine or on the app.", ipa:"", zh:"付费后展示票据。/ 在机器或 App 上按车牌付费。", tip:"Green P 是多伦多的停车 App。"},
   {en:"Is this spot reserved? / That's a fire route, you'll get towed.", ipa:"", zh:"这个位置是预留的吗？/ 那是消防通道，会被拖走。", tip:"fire route 拖车 + 罚款很贵。"}]},
   {h:"罚单与拖车",p:"",items:[
   {en:"I got a parking ticket. Can I pay it online or dispute it?", ipa:"", zh:"我收到停车罚单。能网上付或申诉吗？", tip:"dispute = 申诉。有照片证据可以。"},
   {en:"My car's been towed. Where is the impound lot and how much to get it out?", ipa:"", zh:"我的车被拖走了。扣车场在哪，取车多少钱？", tip:"impound lot = 扣车场。每天加钱，快去。"},
   {en:"I was pulled over for speeding. The officer asked for my licence, registration, and insurance.", ipa:"", zh:"我因超速被拦下。警官要驾照、登记和保险。", tip:"pulled over = 被拦停。三样放手套箱。"},
   {en:"Do you know why I pulled you over? — No, officer.", ipa:"", zh:"你知道我为什么拦你吗？——不知道，警官。", tip:"不要承认（我开太快了），礼貌说不知道。"},
   {en:"I'd like to request an early resolution meeting for this ticket.", ipa:"", zh:"我想为这张罚单申请提前解决会面。", tip:"常能减罚减分。"}]},
   {h:"冬天",p:"",items:[
   {en:"Winter tires are strongly recommended from November to April.", ipa:"", zh:"强烈建议 11 月到 4 月用冬季轮胎。", tip:"魁北克法律强制。"},
   {en:"Watch for black ice on bridges and in shaded areas.", ipa:"", zh:"小心桥上和背阴处的黑冰。", tip:"black ice = 看不见的薄冰。"},
   {en:"If you skid, take your foot off the gas and steer in the direction you want to go.", ipa:"", zh:"打滑时松油门，往你想去的方向打方向盘。", tip:"skid = 打滑。不要猛踩刹车。"},
   {en:"Clear all the snow off your car, including the roof.", ipa:"", zh:"清掉车上所有的雪，包括车顶。", tip:"车顶的雪飞到后车会被罚。"},
   {en:"The plow hasn't come yet. The side streets are a mess.", ipa:"", zh:"铲雪车还没来。小街一团糟。", tip:"plow = 铲雪车。"},
   {en:"Keep an emergency kit: blanket, shovel, booster cables, and a flashlight.", ipa:"", zh:"备一套应急包：毯子、铲子、搭电线、手电。", tip:"booster cables = 搭电线。"}]}],

{ id:"l17c5", lv:17, title:"修车与保养：和技师沟通、看懂报价", goal:"能描述车的问题、理解技师的诊断和报价、拒绝不必要的维修、安排保养和换胎。",
  intro:"修车厂是新移民最容易被多收钱的地方，因为<b>听不懂就只能点头</b>。本章教<b>描述问题</b>（声音、感觉、灯）、<b>听懂诊断</b>（brake pads、alternator、timing belt）、<b>看懂报价</b>（parts、labour、shop supplies）、<b>拒绝</b>（Just the brakes for now）。原则：<b>要书面报价、要旧零件、大修要第二意见</b>。保养周期：换油 8000 公里左右，换胎每年两次。",
  learn:[{h:"描述问题",p:"",items:[
   {en:"There's a grinding noise when I brake. / A squealing sound when I start it.", ipa:"", zh:"刹车时有磨的声音。/ 启动时有尖叫声。", tip:"grinding = 磨；squealing = 尖叫。"},
   {en:"The check engine light came on yesterday.", ipa:"", zh:"昨天发动机故障灯亮了。", tip:"came on = 亮了。"},
   {en:"It pulls to the left when I drive. / The steering wheel shakes at highway speed.", ipa:"", zh:"开的时候车往左偏。/ 高速时方向盘抖。", tip:"pull to the left = 跑偏。"},
   {en:"It's hard to start in the morning. / The battery died twice this week.", ipa:"", zh:"早上很难启动。/ 这周电池没电两次。", tip:""},
   {en:"There's a smell of burning. / I see a puddle under the car.", ipa:"", zh:"有烧焦的味道。/ 车底有一滩液体。", tip:"puddle = 一滩。"}]},
   {h:"听懂诊断与报价",p:"",items:[
   {en:"Your brake pads are worn. We recommend replacing the pads and rotors.", ipa:"", zh:"你的刹车片磨损了。我们建议换刹车片和刹车盘。", tip:"pads 便宜，rotors 贵。问 Do the rotors really need it?"},
   {en:"The alternator is failing. That's why the battery keeps dying.", ipa:"", zh:"发电机快坏了。所以电池一直没电。", tip:"alternator 读 AL-ter-nay-ter。"},
   {en:"The estimate is six hundred: three fifty for parts, two hundred labour, plus shop supplies and tax.", ipa:"", zh:"报价 600：零件 350，工钱 200，加车间耗材和税。", tip:"shop supplies 是杂费，可以问。"},
   {en:"Is this urgent, or can it wait a few months?", ipa:"", zh:"这个紧急吗，还是能等几个月？", tip:"最有用的问题。"},
   {en:"Can you show me the worn part? / Please keep the old parts for me.", ipa:"", zh:"能给我看磨损的零件吗？/ 请把旧零件留给我。", tip:""},
   {en:"Just do the brakes for now. I'll think about the rest.", ipa:"", zh:"现在只做刹车。其他的我再考虑。", tip:"拒绝的标准句。"}]},
   {h:"保养与换胎",p:"",items:[
   {en:"I'd like to book an oil change and a tire swap.", ipa:"", zh:"我想预约换油和换胎。", tip:"tire swap = 冬夏胎互换。"},
   {en:"Can you store my summer tires? How much is seasonal storage?", ipa:"", zh:"能帮我存夏季轮胎吗？季节存放多少钱？", tip:""},
   {en:"Please check the tire pressure and top up the washer fluid.", ipa:"", zh:"请检查胎压并加满玻璃水。", tip:"top up = 加满。"},
   {en:"When is the next service due? / What's included in the service package?", ipa:"", zh:"下次保养什么时候？/ 保养套餐包含什么？", tip:"due = 到期。"},
   {en:"I'd like to get a second opinion before I spend that much.", ipa:"", zh:"花这么多钱之前我想要第二意见。", tip:"超过 500 就值得。"}]}],
  drills:[["There's a grinding noise when I brake. The check engine light came on yesterday.","描述"],["It pulls to the left when I drive. The steering wheel shakes at highway speed.","跑偏 / 抖"],["Your brake pads are worn. We recommend replacing the pads and rotors.","诊断"],["Is this urgent, or can it wait a few months?","最有用"],["Just do the brakes for now. I'll think about the rest.","拒绝"],["I'd like to book an oil change and a tire swap.","保养"]],
  ex:[
   {t:"listen",q:"听一听，什么问题？",say:"There's a grinding noise when I brake.",opts:["刹车时有磨的声音","启动困难","方向盘抖","有烧焦味"],a:0},

{ id:"l17c6", lv:17, title:"第十七级结业：事故处理与一次长途驾驶", goal:"能处理交通事故现场（交换信息、报保险、报警），并完成一次全英语的长途驾驶（计划、路上、到达）。",
  intro:"结业两件事：① <b>事故处理</b>——希望永远用不上，但必须会：<b>确认安全 → 交换信息 → 拍照 → 报警（如需要）→ 报保险</b>。安省小事故（损失低于 5000、无人受伤）去<b>碰撞报告中心</b>（Collision Reporting Centre），不用警察到场。② <b>一次长途驾驶</b>（至少两小时，去一个没去过的地方）：用英语规划路线、加油、问路、处理意外。",
  learn:[{h:"事故现场",p:"",items:[
   {en:"Is everyone okay? Let's move the cars to the shoulder if it's safe.", ipa:"", zh:"大家都没事吗？如果安全，把车挪到路肩。", tip:"第一件事：人。"},
   {en:"Let's exchange information: name, phone, licence number, plate, and insurance.", ipa:"", zh:"我们交换信息：姓名、电话、驾照号、车牌和保险。", tip:"拍对方的驾照和保险卡。"},
   {en:"I'm going to take some photos of both cars and the scene.", ipa:"", zh:"我要拍两辆车和现场的照片。", tip:"多拍：车牌、损伤、路标、路面。"},
   {en:"I'd rather not discuss who's at fault. Let's let the insurance companies sort it out.", ipa:"", zh:"我不想讨论谁的责任。让保险公司处理。", tip:"at fault = 有责任。不要说 sorry（在加拿大，事故现场的 sorry 不算认责，但还是别说）。"},
   {en:"Nobody's hurt and the damage is minor. We should go to the Collision Reporting Centre within twenty-four hours.", ipa:"", zh:"没人受伤，损伤轻微。我们应该 24 小时内去碰撞报告中心。", tip:"多伦多有几个，带车去。"},
   {en:"Someone's injured. I'm calling 911.", ipa:"", zh:"有人受伤。我打 911。", tip:"受伤、肇事逃逸、怀疑酒驾：报警。"}]},
   {h:"报保险",p:"",items:[
   {en:"I'd like to report a collision. It happened today at three p.m. at King and Bathurst.", ipa:"", zh:"我要报一起碰撞。今天下午三点在 King 和 Bathurst 路口。", tip:"collision = 碰撞。"},
   {en:"The other driver rear-ended me at a red light.", ipa:"", zh:"对方在红灯时追尾了我。", tip:"rear-ended = 追尾。"},
   {en:"I have photos, the other driver's information, and the police report number.", ipa:"", zh:"我有照片、对方信息和警方报告编号。", tip:""},
   {en:"Will this affect my premium? / Do I have a rental car while mine is being repaired?", ipa:"", zh:"这会影响我的保费吗？/ 我的车修理期间有代步车吗？", tip:"非你责任的事故通常不涨保费。"},
   {en:"The adjuster will contact you within two business days.", ipa:"", zh:"理赔员会在两个工作日内联系你。", tip:"adjuster = 理赔员。"}]},
   {h:"长途驾驶",p:"",items:[
   {en:"It's a four-hour drive. Let's stop halfway at the ONroute for gas and washrooms.", ipa:"", zh:"四小时车程。我们中途在 ONroute 停一下加油上厕所。", tip:"ONroute = 安省高速服务区。"},
   {en:"Take the 401 east, then exit at highway 15.", ipa:"", zh:"走 401 往东，然后在 15 号公路出口下。", tip:""},
   {en:"The GPS says there's construction ahead. Let's take the detour.", ipa:"", zh:"导航说前面施工。我们绕行。", tip:""},
   {en:"We're low on gas. Is there a gas station at the next exit?", ipa:"", zh:"油不多了。下一个出口有加油站吗？", tip:"low on = 快没了。"},
   {en:"I'm getting tired. Can you take over driving for a while?", ipa:"", zh:"我有点累了。你能开一会儿吗？", tip:"take over = 接手。"},
   {en:"We made it! Six hours, one wrong exit, and a lot of Tim Hortons.", ipa:"", zh:"我们到了！六小时，一次下错出口，很多 Tim Hortons。", tip:"made it = 到了。"}]}],
  drills:[["Is everyone okay? Let's move the cars to the shoulder if it's safe.","第一句"],["Let's exchange information: name, phone, licence number, plate, and insurance.","交换信息"],["I'd rather not discuss who's at fault. Let's let the insurance companies sort it out.","不认责"],["I'd like to report a collision. The other driver rear-ended me at a red light.","报保险"],["It's a four-hour drive. Let's stop halfway for gas and washrooms.","长途"],["We're low on gas. Is there a gas station at the next exit?","加油"]],
  ex:[
   {t:"mc",q:"事故现场第一件事是？",opts:["确认人是否安全","拍照","打保险公司","讨论责任"],a:0},
   {t:"listen",q:"听一听，发生了什么？",say:"The other driver rear-ended me at a red light.",opts:["红灯时被追尾","我追尾了别人","闯红灯","侧面碰撞"],a:0},
   {t:"mc",q:"安省小事故（无伤、损失小）应该？",opts:["24 小时内去碰撞报告中心","等警察到场","直接走","只拍照"],a:0},
   {t:"listen",q:"听一听，他想做什么？",say:"I'm getting tired. Can you take over driving for a while?",opts:["让别人开一会儿","停车休息","加油","换路线"],a:0},
   {t:"type",q:"翻译：这会影响我的保费吗？",a:"Will this affect my premium?",alt:["Will this affect my premium","will this affect my premium","Will it affect my premium?"]},
   {t:"type",q:"听写这个词（“理赔员”）。",say:"adjuster",a:"adjuster"}],
  hw:[["事故卡","用英语写一张事故处理卡放在手套箱：五个步骤、要交换的信息、保险公司电话、碰撞报告中心地址。"],["演练一次","请朋友扮演对方司机，演练交换信息和拒绝讨论责任的对话。"],["长途驾驶（必做）","开一次至少两小时的车去没去过的地方，全程英语（导航、加油、问路、点餐）。回来用英语讲三件路上发生的事。"]]

{ id:"l18c1", lv:18, title:"开始：注册、执照与结构", goal:"理解自雇、独资、合伙和公司的区别，能注册生意、申请执照和税号，和政府及银行沟通。",
  intro:"在加拿大开小生意<b>手续比中国简单</b>，但词汇多：<b>sole proprietorship</b>（独资）、<b>corporation</b>（公司）、<b>business number</b>（商业号）、<b>HST number</b>（销售税号，年收入超 3 万必须）、<b>business licence</b>（市政执照，看行业）。本章教三种结构的区别、注册步骤、和市政府、CRA、银行的对话。原则：<b>先确认行业要不要执照，再注册</b>。",
  learn:[{h:"结构",p:"",items:[
   {en:"A sole proprietorship is the simplest: you and the business are the same legal person.", ipa:"", zh:"独资最简单：你和生意是同一个法律主体。", tip:"proprietorship 读 pro-PRY-e-tor-ship。债务是你个人的。"},
   {en:"A corporation is a separate legal entity. It protects your personal assets but costs more to set up and maintain.", ipa:"", zh:"公司是独立的法律实体。保护你的个人资产，但设立和维护更贵。", tip:"entity = 实体。年收入高了再考虑。"},
   {en:"A partnership means two or more owners sharing profits and responsibility.", ipa:"", zh:"合伙意味着两个或更多所有者分享利润和责任。", tip:"一定要书面合伙协议。"},
   {en:"You can operate under your own name without registering, but a business name must be registered.", ipa:"", zh:"你可以用自己的名字经营不用注册，但商号必须注册。", tip:"安省注册商号约 60 元，五年。"}]},
   {h:"注册与执照",p:"",items:[
   {en:"I'd like to register a business name. Is this name available?", ipa:"", zh:"我想注册一个商号。这个名字可用吗？", tip:"先在 Ontario Business Registry 查重。"},
   {en:"Do I need a business licence to run a home-based cleaning service?", ipa:"", zh:"在家经营清洁服务需要营业执照吗？", tip:"打给市政府 311 问。"},
   {en:"I need a business number and an HST account. My revenue will exceed thirty thousand.", ipa:"", zh:"我需要商业号和 HST 账户。我的收入会超过三万。", tip:"超过 3 万必须收 HST。不足也可以自愿注册（能抵扣进项税）。"},
   {en:"Which permits do I need to open a food business? A health inspection?", ipa:"", zh:"开食品生意需要什么许可？卫生检查？", tip:"餐饮：食品安全证、卫生局检查、消防。"},
   {en:"I'd like to open a business bank account. Here's my registration and my ID.", ipa:"", zh:"我想开商业银行账户。这是注册文件和证件。", tip:"公私账户分开，报税清楚。"}]},
   {h:"基本运营词汇",p:"",items:[
   {en:"revenue, expenses, profit, cash flow, invoice, receipt", ipa:"", zh:"收入、开支、利润、现金流、发票、收据", tip:"invoice = 你开给客户的账单。"},
   {en:"Keep every receipt. Business expenses reduce your taxable income.", ipa:"", zh:"保留每张收据。生意开支减少应税收入。", tip:"车、手机、家里办公室的一部分都可以算。"},
   {en:"Set aside twenty-five to thirty percent of income for taxes.", ipa:"", zh:"留出收入的 25 到 30% 交税。", tip:"set aside = 留出。自雇没人帮你扣税。"},
   {en:"Do I need liability insurance? What does it cover?", ipa:"", zh:"我需要责任保险吗？覆盖什么？", tip:"服务类生意基本都需要。"}]}],
  drills:[["A sole proprietorship is the simplest: you and the business are the same legal person.","独资"],["A corporation is a separate legal entity. It protects your personal assets.","公司"],["I'd like to register a business name. Is this name available?","注册"],["I need a business number and an HST account. My revenue will exceed thirty thousand.","税号"],["revenue, expenses, profit, cash flow, invoice, receipt","六个词"],["Set aside twenty-five to thirty percent of income for taxes.","留税"]],
  ex:[

   {t:"listen",q:"听一听，什么时候必须注册 HST？",say:"You must register for HST once your revenue exceeds thirty thousand dollars.",opts:["收入超过 3 万","收入超过 3 千","一开始","收入超过 30 万"],a:0},

{ id:"l18c2", lv:18, title:"客户：报价、合同与收款", goal:"能给客户报价、写简单合同或工作说明、开发票、催款、处理不满。",
  intro:"小生意的钱从<b>报价到收款</b>这条线上。报价要<b>清楚、书面、有期限</b>；合同（哪怕一页纸的 agreement）写明<b>范围、价格、时间、付款条件</b>；发票要有 <b>HST 号和付款期限</b>；催款要<b>礼貌但坚持</b>。本章教这条线上每一步的英语，加上处理客户不满——<b>一个处理得好的投诉能带来三个推荐</b>。",
  learn:[{h:"报价",p:"",items:[
   {en:"Thanks for reaching out. Could you tell me a bit more about what you need?", ipa:"", zh:"感谢联系。能多说说你需要什么吗？", tip:"先问清楚再报价。"},
   {en:"Based on what you've described, the estimate is eight hundred dollars plus HST. That includes materials and two visits.", ipa:"", zh:"根据你的描述，报价 800 加税。包含材料和两次上门。", tip:"说清包含什么。"},
   {en:"This quote is valid for thirty days. A fifty percent deposit is required to book.", ipa:"", zh:"报价 30 天有效。预订需付 50% 定金。", tip:"deposit = 定金。"},
   {en:"Anything outside this scope would be quoted separately.", ipa:"", zh:"超出此范围的工作另行报价。", tip:"scope = 范围。防止客户不断加活。"},
   {en:"I can do it for seven fifty if you're flexible on the date.", ipa:"", zh:"如果你日期灵活，我可以做 750。", tip:"让价要换条件。"}]},
   {h:"合同与发票",p:"",items:[

{ id:"l18c3", lv:18, title:"营销：网站、Google 商家与社交媒体", goal:"能为生意写简短的英语文案、设置 Google 商家资料、回复评价、在社交媒体和本地社区推广。",
  intro:"在加拿大，本地小生意的客户来自三个地方：<b>Google 搜索</b>（Google Business Profile 免费，必须有）、<b>口碑和评价</b>、<b>本地社区</b>（Facebook 群、Nextdoor、传单）。英语文案要<b>短、具体、有行动</b>（Call today for a free quote）。本章教写商家简介、回复好评和差评、写一条社区帖、做一张传单。<b>回复差评的方式比差评本身更影响生意。</b>",
  learn:[{h:"商家简介与文案",p:"",items:[
   {en:"Family-owned cleaning service in Scarborough. Licensed, insured, and eco-friendly. Free quotes. Serving the GTA since 2021.", ipa:"", zh:"士嘉堡的家庭清洁服务。持牌、有保险、环保。免费报价。自 2021 年服务大多伦多。", tip:"简介四要素：什么、哪里、为什么信你、怎么联系。"},
   {en:"Call or text 416-555-0123 for a free quote. Same-week availability.", ipa:"", zh:"打电话或发短信 416-555-0123 免费报价。本周有档期。", tip:"call to action = 行动号召。"},
   {en:"Book online in under a minute.", ipa:"", zh:"一分钟内在线预订。", tip:"短。"},
   {en:"Mandarin and English spoken.", ipa:"", zh:"中英文服务。", tip:"这是优势，写出来。"},
   {en:"Hours: Mon to Sat, 8 a.m. to 6 p.m. Closed Sundays.", ipa:"", zh:"营业时间：周一到周六早 8 到晚 6。周日休息。", tip:""}]},
   {h:"回复评价",p:"",items:[
   {en:"Thank you so much, Jennifer! It was a pleasure working on your kitchen. We hope to see you again.", ipa:"", zh:"非常感谢，Jennifer！很高兴为你的厨房服务。希望再见到你。", tip:"好评：名字 + 具体 + 期待。"},
   {en:"Hi Mark, I'm sorry to hear the appointment ran late. That's not the standard we aim for.", ipa:"", zh:"Mark 你好，很抱歉预约时间延误了。那不是我们追求的标准。", tip:"差评第一句：道歉 + 承认。不争辩。"},
   {en:"I'd like to make this right. Please call me directly at 416-555-0123 so we can sort it out.", ipa:"", zh:"我想弥补。请直接打我电话 416-555-0123，我们来解决。", tip:"把对话移到线下。"},
   {en:"We've updated our scheduling to prevent this from happening again. Thank you for the feedback.", ipa:"", zh:"我们已更新排班以防再次发生。感谢反馈。", tip:"说明改进。其他人在看。"}]},
   {h:"社区推广",p:"",items:[
   {en:"Hi neighbours! I run a small tutoring business and have two spots open for math, grades 6 to 10. Message me for details.", ipa:"", zh:"邻居们好！我做小型辅导，6 到 10 年级数学有两个名额。私信详情。", tip:"Facebook 群帖子：友好、具体、有名额感。"},
   {en:"Can anyone recommend a good plumber? — I can help! Licensed, 15 years' experience, free estimates.", ipa:"", zh:"有人能推荐好的水管工吗？——我可以！持牌，15 年经验，免费报价。", tip:"回复社区里的求推荐帖。"},
   {en:"Grand opening this Saturday! Twenty percent off all services. Come say hi.", ipa:"", zh:"本周六盛大开业！所有服务八折。来打个招呼。", tip:"传单或帖子。"},
   {en:"Refer a friend and you both get ten percent off.", ipa:"", zh:"推荐朋友，你们都打九折。", tip:"推荐计划最便宜的营销。"},
   {en:"Would you be open to leaving us a review? Here's the link. It takes thirty seconds.", ipa:"", zh:"你愿意给我们写个评价吗？这是链接。只要 30 秒。", tip:"每个满意的客户都要问。"}]}],
  drills:[["Family-owned cleaning service in Scarborough. Licensed, insured, and eco-friendly. Free quotes.","简介"],["Call or text for a free quote. Same-week availability. Mandarin and English spoken.","行动号召"],["Thank you so much, Jennifer! It was a pleasure working on your kitchen.","回复好评"],["Hi Mark, I'm sorry to hear the appointment ran late. I'd like to make this right.","回复差评"],["Hi neighbours! I run a small tutoring business and have two spots open.","社区帖"],["Would you be open to leaving us a review? It takes thirty seconds.","要评价"]],
  ex:[
   {t:"mc",q:"商家简介应该包含？",opts:["做什么、在哪、为什么信你、怎么联系","老板的人生故事","所有价格","员工名单"],a:0},
   {t:"listen",q:"听一听，这是回复好评还是差评？",say:"I'm sorry to hear the appointment ran late. I'd like to make this right.",opts:["差评（道歉 + 弥补）","好评","广告","催款"],a:0},
   {t:"mc",q:"回复差评时不应该？",opts:["争辩说客户错了","道歉","提出解决办法","把对话移到线下"],a:0},
   {t:"listen",q:"听一听，这是什么促销？",say:"Refer a friend and you both get ten percent off.",opts:["推荐朋友双方打九折","新客户打九折","买十送一","周六打折"],a:0},
   {t:"type",q:"翻译：中英文服务。",a:"Mandarin and English spoken.",alt:["Mandarin and English spoken","We speak Mandarin and English.","Mandarin and English are spoken."]},
   {t:"type",q:"听写这个词（“评价”）。",say:"review",a:"review"}],
  hw:[["写简介","为你的生意写一段英语 Google 商家简介（四要素）和营业时间。"],["回复两条","找两条真实评价（自己的或别人生意的），各写一条英语回复（一好一差）。"],["发一条帖","在一个本地社区群发一条英语推广帖（或回复一条求推荐），记下反应。"]]
},
{ id:"l18c4", lv:18, title:"雇人：招聘、工资与劳动法基础", goal:"能招聘和面试员工，理解最低工资、加班、假期、解雇的基本规则，办理工资和扣款。",
  intro:"雇第一个人是小生意最大的一步，也是<b>法律风险最大的一步</b>。加拿大劳动法保护员工：<b>最低工资</b>（安省 2025 年 17.20 元）、<b>加班</b>（每周超 44 小时 1.5 倍）、<b>假期工资</b>（4%）、<b>法定假日</b>、<b>解雇通知</b>。工资要扣 <b>CPP、EI、所得税</b>并上交 CRA。本章教招聘、面试、入职和合规的英语。<b>把人当“承包商”逃避这些是常见的违法做法</b>。",
  learn:[{h:"招聘与面试",p:"",items:[
   {en:"Now hiring: part-time cashier, fifteen to twenty hours a week, seventeen fifty an hour. Experience preferred but not required.", ipa:"", zh:"招聘：兼职收银员，每周 15 到 20 小时，每小时 17.5。有经验优先但非必须。", tip:"广告要写时薪。"},
   {en:"Tell me about your availability. Can you work weekends?", ipa:"", zh:"说说你的可用时间。能周末上班吗？", tip:"availability = 可用时间。"},
   {en:"I can't ask about your age, religion, family plans, or where you're from. Let's focus on the job.", ipa:"", zh:"我不能问你的年龄、宗教、家庭计划或来自哪里。我们聊工作。", tip:"人权法禁止问这些。"},
   {en:"The position starts at seventeen fifty, with a review after three months.", ipa:"", zh:"职位起薪 17.5，三个月后回顾。", tip:""},
   {en:"We'd like to offer you the job. Can you start Monday?", ipa:"", zh:"我们想录用你。周一能开始吗？", tip:""}]},
   {h:"法律基础",p:"",items:[
   {en:"Minimum wage, overtime after forty-four hours, vacation pay of at least four percent, and public holidays.", ipa:"", zh:"最低工资、44 小时以上加班、至少 4% 假期工资、法定假日。", tip:"安省 Employment Standards Act。"},
   {en:"Employees get a pay stub showing hours, rate, and deductions for CPP, EI, and income tax.", ipa:"", zh:"员工拿到工资单，显示小时、时薪和 CPP、EI、所得税的扣款。", tip:"用 payroll 软件或会计师。"},
   {en:"As the employer, you also contribute to CPP and EI, and remit everything to the CRA monthly.", ipa:"", zh:"作为雇主，你也要缴 CPP 和 EI，每月上交 CRA。", tip:"remit = 上交。雇主 EI 是员工的 1.4 倍。"},
   {en:"Calling someone a contractor to avoid these rules is illegal if they work like an employee.", ipa:"", zh:"为了逃避这些规则把人叫“承包商”，如果他像员工一样工作，是违法的。", tip:"CRA 会追缴。"},
   {en:"To let someone go, you must give written notice or pay in lieu, based on how long they've worked.", ipa:"", zh:"解雇需要书面通知或代通知金，按工龄计算。", tip:"let go = 解雇；pay in lieu = 代通知金。三个月内不需要。"},
   {en:"Workers' compensation (WSIB) coverage is mandatory for most businesses with employees.", ipa:"", zh:"大多数有员工的生意必须有工伤保险（WSIB）。", tip:"mandatory = 强制。"}]},
   {h:"日常管理",p:"",items:[
   {en:"Here's your schedule for next week. Let me know by Thursday if you need any changes.", ipa:"", zh:"这是你下周的排班。需要改周四前告诉我。", tip:""},
   {en:"Great job today. Customers mentioned how friendly you were.", ipa:"", zh:"今天干得好。客户提到你很友好。", tip:"夸具体的。"},
   {en:"I noticed you were late twice this week. Is everything okay? We need you here on time.", ipa:"", zh:"我注意到你这周迟到两次。一切都好吗？我们需要你准时。", tip:"先关心，再要求。"},
   {en:"You're entitled to a thirty-minute unpaid break after five hours.", ipa:"", zh:"工作五小时后你有权休息 30 分钟（无薪）。", tip:""},
   {en:"If you have a concern, come talk to me first. My door is always open.", ipa:"", zh:"有问题先来找我谈。我的门永远开着。", tip:""}]}],
  drills:[["Now hiring: part-time cashier, fifteen to twenty hours a week, seventeen fifty an hour.","招聘广告"],["Tell me about your availability. Can you work weekends?","面试"],["Minimum wage, overtime after forty-four hours, vacation pay of at least four percent.","法律"],["As the employer, you also contribute to CPP and EI, and remit everything to the CRA monthly.","雇主义务"],["Great job today. Customers mentioned how friendly you were.","表扬"],["I noticed you were late twice this week. Is everything okay? We need you here on time.","提醒"]],
  ex:[
   {t:"mc",q:"面试时不能问的是？",opts:["年龄、宗教、家庭计划、来自哪里","可用时间","相关经验","能否周末上班"],a:0},
   {t:"listen",q:"听一听，什么时候算加班？",say:"Overtime starts after forty-four hours a week.",opts:["每周 44 小时以上","每天 8 小时以上","每周 40 小时以上","周末"],a:0},

   {t:"listen",q:"听一听，雇主在做什么？",say:"I noticed you were late twice this week. Is everything okay?",opts:["提醒迟到并关心","解雇","表扬","加薪"],a:0},
   {t:"type",q:"翻译：能周末上班吗？",a:"Can you work weekends?",alt:["Can you work weekends","can you work weekends","Can you work on weekends?"]},
   {t:"type",q:"听写这个词（“强制的”）。",say:"mandatory",a:"mandatory"}],
  hw:[["查规则","上安省（或你省）劳动标准网站，用英语写下：最低工资、加班、假期工资、解雇通知的规定。"],["写招聘广告","为一个职位写一条英语招聘广告（职位、小时、时薪、要求、怎么申请）。"],["演练面试","请朋友扮演应聘者，你用英语面试 10 分钟，只问合法的问题。"]]

{ id:"l18c5", lv:18, title:"供应商、采购与谈判", goal:"能和供应商建立关系、询价、比较条款、谈判价格和账期、处理质量问题。",
  intro:"小生意的利润一半在<b>采购</b>。和供应商的英语：<b>询价</b>（quote、unit price、minimum order）、<b>条款</b>（net 30、COD、delivery）、<b>谈判</b>（volume discount、better terms）、<b>问题</b>（damaged、short shipment、wrong item）。原则：<b>书面确认一切、建立关系、按时付款换好条款</b>。批发商喜欢稳定的小客户，你不用大。",
  learn:[{h:"询价与条款",p:"",items:[
   {en:"I run a small café and I'm looking for a coffee supplier. Could you send me your wholesale price list?", ipa:"", zh:"我经营一家小咖啡馆，在找咖啡供应商。能发我批发价目表吗？", tip:"wholesale = 批发。"},
   {en:"What's the unit price at fifty units? Is there a minimum order?", ipa:"", zh:"50 件的单价是多少？有最低订购量吗？", tip:"minimum order = 起订量。"},
   {en:"What are your payment terms? Net thirty, or cash on delivery?", ipa:"", zh:"付款条件是什么？30 天账期，还是货到付款？", tip:"net 30 = 发票后 30 天付。新客户通常先 COD。"},
   {en:"What's the lead time? Do you deliver, or do I pick up?", ipa:"", zh:"交货周期多久？你们送货还是我自取？", tip:"lead time = 下单到到货的时间。"},
   {en:"Could you send me a sample before I place a larger order?", ipa:"", zh:"下大单前能发我一个样品吗？", tip:"place an order = 下单。"}]},
   {h:"谈判",p:"",items:[
   {en:"If I commit to a monthly order of two hundred units, could you do a better price?", ipa:"", zh:"如果我承诺每月订 200 件，能给个更好的价格吗？", tip:"volume discount = 批量折扣。"},
   {en:"Your competitor quoted me twelve fifty a unit. Can you match that?", ipa:"", zh:"你的竞争对手给我报 12.5 一件。你能匹配吗？", tip:"match = 匹配。"},
   {en:"I've paid every invoice on time for six months. I'd like to move to net thirty.", ipa:"", zh:"我六个月每张发票都按时付。我想改成 30 天账期。", tip:"用信用换账期。"},
   {en:"Could you include delivery in that price?", ipa:"", zh:"能把送货包含在这个价格里吗？", tip:""},
   {en:"Let's start with a three-month trial and review the terms after.", ipa:"", zh:"我们先试三个月，之后再看条款。", tip:"降低双方风险。"}]},
   {h:"问题处理",p:"",items:[
   {en:"The shipment arrived with six damaged boxes. I've attached photos. Please send replacements.", ipa:"", zh:"货到时有六箱损坏。附照片。请补发。", tip:"replacements = 替换品。"},
   {en:"We received forty units, but the invoice says fifty. Please correct the invoice.", ipa:"", zh:"我们收到 40 件，但发票写 50。请更正发票。", tip:"short shipment = 短装。"},
   {en:"The quality on this batch is below what we agreed. I'd like a credit on the next order.", ipa:"", zh:"这批的质量低于我们约定的。我想在下一单上抵扣。", tip:"credit = 抵扣额。"},
   {en:"We've had three late deliveries this month. If this continues, we'll have to look at other suppliers.", ipa:"", zh:"这个月三次送货延迟。如果继续，我们只能考虑其他供应商。", tip:"礼貌的最后通牒。"},
   {en:"Thanks for sorting that out so quickly. I appreciate working with you.", ipa:"", zh:"感谢这么快解决。很高兴和你合作。", tip:"关系。"}]}],
  drills:[["Could you send me your wholesale price list? What's the unit price at fifty units?","询价"],["What are your payment terms? Net thirty, or cash on delivery?","条款"],["What's the lead time? Do you deliver, or do I pick up?","交货"],["If I commit to a monthly order of two hundred units, could you do a better price?","谈判"],["Your competitor quoted me twelve fifty a unit. Can you match that?","比价"],["The shipment arrived with six damaged boxes. Please send replacements.","问题"]],
  ex:[
   {t:"mc",q:"“net 30” 是？",opts:["发票后 30 天内付款","30% 折扣","30 件起订","30 天交货"],a:0},

   {t:"mc",q:"“lead time” 是？",opts:["下单到到货的时间","付款期限","试用期","谈判时间"],a:0},
   {t:"listen",q:"听一听，什么问题？",say:"We received forty units, but the invoice says fifty.",opts:["少收了 10 件，发票多开","多收了 10 件","质量问题","送货晚了"],a:0},
   {t:"type",q:"翻译：能发我一个样品吗？",a:"Could you send me a sample?",alt:["Could you send me a sample","Can you send me a sample?","could you send me a sample"]},
   {t:"type",q:"听写这个词（“批发”）。",say:"wholesale",a:"wholesale"}],

{ id:"l18c6", lv:18, title:"第十八级结业：一页商业计划与一次推介", goal:"能写一页英语商业计划（问题、方案、客户、钱），并向银行、投资人或合作伙伴做一次 5 分钟推介。",
  intro:"结业任务：<b>一页商业计划 + 一次 5 分钟推介（pitch）</b>。不管你是真要开店、申请小生意贷款、还是找合作伙伴，这两样都用得上。一页计划的结构：<b>问题 → 方案 → 客户 → 竞争 → 钱（收入、成本、需要多少）</b>。推介的结构：<b>一句话 → 为什么是现在 → 为什么是你 → 要什么</b>。本章教每一部分的句子，加上银行贷款和政府资助的对话。",
  learn:[{h:"一页计划",p:"",items:[
   {en:"Problem: busy families in Markham have no affordable, reliable after-school pickup.", ipa:"", zh:"问题：万锦的忙碌家庭没有便宜可靠的课后接送。", tip:"一句话说清问题。"},
   {en:"Solution: a licensed, insured pickup-and-homework service, four to six p.m., twenty dollars a day.", ipa:"", zh:"方案：持牌有保险的接送加作业辅导服务，下午 4 到 6 点，每天 20 元。", tip:""},
   {en:"Target customers: dual-income families with kids in grades one to six within five kilometres.", ipa:"", zh:"目标客户：五公里内有 1 到 6 年级孩子的双职工家庭。", tip:"target = 目标。"},
   {en:"Competition: two daycare centres, both full with waitlists. We're cheaper and more flexible.", ipa:"", zh:"竞争：两家日托，都满员有等候名单。我们更便宜更灵活。", tip:"承认竞争，说差异。"},
   {en:"Financials: fifteen kids a day brings in six thousand a month. Costs are three thousand. Break-even in month four.", ipa:"", zh:"财务：每天 15 个孩子，月收入 6000。成本 3000。第四个月收支平衡。", tip:"break-even = 收支平衡。"},
   {en:"The ask: a ten-thousand-dollar loan for a van and insurance, repaid over two years.", ipa:"", zh:"需求：一万元贷款买面包车和保险，两年还清。", tip:"the ask = 你要什么。"}]},
   {h:"推介",p:"",items:[
   {en:"We pick up kids from school so parents can finish their workday. Think of us as the aunt who's always on time.", ipa:"", zh:"我们从学校接孩子，让家长能完成工作。把我们想成永远准时的阿姨。", tip:"一句话 + 一个比喻。"},
   {en:"Why now? Both daycare centres in the area have twelve-month waitlists.", ipa:"", zh:"为什么是现在？区里两家日托都有 12 个月等候名单。", tip:""},
   {en:"Why us? I'm a former teacher, my partner is a licensed driver, and we both speak Mandarin and English.", ipa:"", zh:"为什么是我们？我是前教师，我的合伙人是持牌司机，我们都说中英文。", tip:""},
   {en:"We've already signed up eight families before launch.", ipa:"", zh:"开业前我们已经签了八个家庭。", tip:"traction = 已有的成绩，最有说服力。"},
   {en:"We're looking for ten thousand dollars. Here's exactly how we'll use it.", ipa:"", zh:"我们需要一万元。这是具体用途。", tip:""},
   {en:"Happy to answer any questions.", ipa:"", zh:"欢迎提问。", tip:""}]},
   {h:"贷款与资助",p:"",items:[
   {en:"I'd like to apply for a small business loan. I have a business plan and six months of financials.", ipa:"", zh:"我想申请小生意贷款。我有商业计划和六个月的财务记录。", tip:"BDC 和 Futurpreneur 对新移民友好。"},
   {en:"Are there grants or programs for newcomer entrepreneurs?", ipa:"", zh:"有给新移民创业者的资助或项目吗？", tip:"grant = 不用还的资助。"},
   {en:"What's the interest rate, and is a personal guarantee required?", ipa:"", zh:"利率是多少，需要个人担保吗？", tip:"personal guarantee = 你个人为贷款担保。"},
   {en:"Thank you for your time. I'll follow up with the documents you requested by Friday.", ipa:"", zh:"感谢您的时间。我会在周五前跟进您要求的文件。", tip:""}]}],
  drills:[["Problem: busy families in Markham have no affordable, reliable after-school pickup.","问题"],["Target customers: dual-income families with kids in grades one to six within five kilometres.","客户"],["Financials: fifteen kids a day brings in six thousand a month. Costs are three thousand. Break-even in month four.","财务"],["We pick up kids from school so parents can finish their workday.","一句话"],["Why us? I'm a former teacher, and we both speak Mandarin and English.","为什么是我们"],["We're looking for ten thousand dollars. Here's exactly how we'll use it. Happy to answer any questions.","要什么"]],
  ex:[
   {t:"mc",q:"一页商业计划的核心部分是？",opts:["问题、方案、客户、竞争、钱","公司历史","老板简历","产品照片"],a:0},
   {t:"listen",q:"听一听，什么时候收支平衡？",say:"Break-even in month four.",opts:["第四个月","四年","四周","四天"],a:0},
   {t:"mc",q:"推介里最有说服力的是？",opts:["已有的成绩（traction），如已签的客户","漂亮的 PPT","大的梦想","长的介绍"],a:0},
   {t:"listen",q:"听一听，他要什么？",say:"We're looking for ten thousand dollars for a van and insurance.",opts:["一万元买车和保险","十万元","一个合伙人","一辆免费的车"],a:0},
   {t:"type",q:"翻译：有给新移民创业者的资助吗？（用 grants）",a:"Are there grants for newcomer entrepreneurs?",alt:["Are there grants for newcomer entrepreneurs","Are there any grants for newcomer entrepreneurs?","Are there grants or programs for newcomer entrepreneurs?"]},
   {t:"type",q:"听写这个词（“收支平衡”）。",say:"break-even",a:"break-even",alt:["break even","breakeven"]}],
  hw:[["写一页计划","用英语写你的一页商业计划（六部分，每部分一到三句）。"],["练推介","把推介讲到 5 分钟内不看稿，录像回看。"],["推介（必做）","向至少一个真人（银行、朋友、潜在合伙人、小生意中心的顾问）做这次推介，回答至少两个问题。记下反馈。"]]
},
/* ===== 第十九级 · 技工行业 Trades ===== */
{ id:"l19c1", lv:19, title:"进入技工行业：学徒、红印章与认证", goal:"了解加拿大技工行业的路径（学徒制、认证、红印章），能和学徒办公室、工会、雇主沟通，把海外经验转成本地资格。",
  intro:"技工（trades）在加拿大<b>收入高、缺人、受尊重</b>：电工、水管工、木工、焊工、暖通、汽修。路径是<b>学徒制</b>（apprenticeship：边工作边上课，4 到 5 年）→ <b>证书考试</b>（Certificate of Qualification）→ <b>红印章</b>（Red Seal，全国通用）。有海外经验可以申请<b>挑战考试</b>（challenge the exam）。本章教行业词汇、路径和沟通。",
  learn:[{h:"行业与路径",p:"",items:[
   {en:"electrician, plumber, carpenter, welder, HVAC technician, automotive service technician, millwright", ipa:"", zh:"电工、水管工、木工、焊工、暖通技师、汽车维修技师、机械安装工", tip:"millwright 读 MIL-rite。"},
   {en:"compulsory trades require a licence; voluntary trades don't, but certification helps.", ipa:"", zh:"强制性工种必须持证；自愿性工种不必，但有证更好。", tip:"电工、水管工、暖通是强制性。"},
   {en:"An apprenticeship combines paid on-the-job training with in-class instruction over four to five years.", ipa:"", zh:"学徒制结合带薪在职培训和课堂学习，四到五年。", tip:"apprenticeship 读 a-PREN-tis-ship。"},
   {en:"A journeyperson has completed the apprenticeship and passed the exam.", ipa:"", zh:"熟练技工完成了学徒期并通过考试。", tip:"journeyperson（旧称 journeyman）。"},
   {en:"The Red Seal lets you work in any province without re-certifying.", ipa:"", zh:"红印章让你在任何省工作无需重新认证。", tip:""}]},
   {h:"海外经验",p:"",items:[
   {en:"I worked as an electrician in China for twelve years. Can I challenge the certification exam?", ipa:"", zh:"我在中国做了十二年电工。我能直接挑战认证考试吗？", tip:"challenge the exam = 不读学徒直接考。"},
   {en:"You'll need to document your hours and have your experience assessed.", ipa:"", zh:"你需要证明你的工时并让经验得到评估。", tip:"document = 用文件证明。雇主信、合同、工资单。"},
   {en:"Is there a bridging program for internationally trained tradespeople?", ipa:"", zh:"有给海外技工的衔接项目吗？", tip:"很多免费，含英语和考试准备。"},
   {en:"I'd like to register as an apprentice. Do I need a sponsor employer first?", ipa:"", zh:"我想注册学徒。需要先有担保雇主吗？", tip:"是的，学徒要有雇主。"},
   {en:"What's the exam format? Is it multiple choice? Can I use a dictionary?", ipa:"", zh:"考试什么形式？选择题吗？能用字典吗？", tip:"红印章考试是选择题，部分省允许翻译词典。"}]},
   {h:"工会与雇主",p:"",items:[
   {en:"I'd like to join the union. What are the dues, and how does the hiring hall work?", ipa:"", zh:"我想加入工会。会费多少，派工大厅怎么运作？", tip:"hiring hall = 工会派工。dues = 会费。"},
   {en:"I'm looking for a sponsor to start my apprenticeship. I have my own tools and a G licence.", ipa:"", zh:"我在找担保雇主开始学徒期。我有自己的工具和 G 驾照。", tip:"工具和驾照是雇主最看重的两样。"},
   {en:"What's the starting rate for a first-year apprentice?", ipa:"", zh:"一年级学徒的起薪是多少？", tip:"通常是熟练工的 40 到 50%，逐年涨。"},
   {en:"Do you pay for the in-class portion? Is there EI during school?", ipa:"", zh:"课堂部分你们付钱吗？上学期间有 EI 吗？", tip:"学徒上课期间可以领 EI。"}]}],
  drills:[["electrician, plumber, carpenter, welder, HVAC technician","五个工种"],["An apprenticeship combines paid on-the-job training with in-class instruction over four to five years.","学徒制"],["The Red Seal lets you work in any province without re-certifying.","红印章"],["I worked as an electrician in China for twelve years. Can I challenge the certification exam?","挑战考试"],["I'd like to register as an apprentice. Do I need a sponsor employer first?","注册"],["I'm looking for a sponsor to start my apprenticeship. I have my own tools and a G licence.","找雇主"]],
  ex:[
   {t:"mc",q:"“apprenticeship” 是？",opts:["学徒制：带薪工作 + 上课","大学学位","短期培训","实习"],a:0},
   {t:"listen",q:"听一听，他想做什么？",say:"Can I challenge the certification exam?",opts:["直接考认证考试","注册学徒","加入工会","找工作"],a:0},
   {t:"mc",q:"Red Seal 的好处是？",opts:["全国通用，换省不用重新认证","免税","工资翻倍","不用考试"],a:0},
   {t:"listen",q:"听一听，雇主看重什么？",say:"I have my own tools and a G licence.",opts:["工具和驾照","学历和英语","年龄和体力","推荐信"],a:0},
   {t:"type",q:"翻译：一年级学徒的起薪是多少？",a:"What's the starting rate for a first-year apprentice?",alt:["What's the starting rate for a first-year apprentice","What is the starting rate for a first-year apprentice?","What's the starting rate for a first year apprentice?"]},
   {t:"type",q:"听写这个词（“强制性的”）。",say:"compulsory",a:"compulsory"}],
  hw:[["查你的工种","上省学徒办公室网站（安省 Skilled Trades Ontario），用英语写下你的工种是否强制、学徒年限、考试要求。"],["整理经验","用英语列出你的海外工作经验：年份、雇主、工作内容、能提供的证明。"],["打一个电话","打给学徒办公室或一个衔接项目，问海外经验怎么评估，全程英语。"]]
},
{ id:"l19c2", lv:19, title:"工地安全：WHMIS、PPE 与安全会议", goal:"掌握工地安全的英语：安全培训证书、个人防护装备、危险标识、安全会议和拒绝危险工作的权利。",
  intro:"加拿大工地<b>安全第一，而且是法律</b>。上工前要有 <b>WHMIS</b>（危险品）、<b>Working at Heights</b>（高空作业）等证书；每天穿 <b>PPE</b>（hard hat、steel-toe boots、safety glasses、hi-vis vest）；每周有<b>安全会议</b>（toolbox talk）。你有<b>三项权利</b>：知道危险、参与安全、<b>拒绝不安全的工作</b>。本章教这些词和句子——听不懂安全指令会出人命。",
  learn:[{h:"证书与装备",p:"",items:[
   {en:"WHMIS, Working at Heights, fall protection, confined space, first aid", ipa:"", zh:"危险品标识、高空作业、坠落防护、密闭空间、急救", tip:"WHMIS 读 WIM-is。网上一天能拿。"},
   {en:"hard hat, steel-toe boots, safety glasses, hi-vis vest, gloves, hearing protection", ipa:"", zh:"安全帽、钢头靴、护目镜、反光背心、手套、听力保护", tip:"CSA 认证的钢头靴，绿三角标志。"},
   {en:"PPE is mandatory on site. No boots, no work.", ipa:"", zh:"工地必须穿戴防护装备。没靴子不能干活。", tip:"PPE = personal protective equipment。"},
   {en:"Where's the eyewash station? Where's the first aid kit?", ipa:"", zh:"洗眼器在哪？急救箱在哪？", tip:"第一天就问。"},
   {en:"Tie off when you're above three metres.", ipa:"", zh:"三米以上要系安全绳。", tip:"tie off = 系安全带挂点。"}]},
   {h:"标识与指令",p:"",items:[
   {en:"Danger. Caution. Warning. Authorized personnel only.", ipa:"", zh:"危险。小心。警告。仅限授权人员。", tip:"Danger 最严重。"},
   {en:"Lockout, tagout: de-energize the equipment before servicing.", ipa:"", zh:"上锁挂牌：维修前切断设备电源。", tip:"LOTO。电工、机修的命。"},
   {en:"Flammable. Corrosive. Toxic. Keep away from heat.", ipa:"", zh:"易燃。腐蚀性。有毒。远离热源。", tip:"WHMIS 标签。"},
   {en:"Heads up! / Watch out! / Coming through! / Behind you!", ipa:"", zh:"小心（上面）！/ 当心！/ 借过！/ 你后面！", tip:"工地四句喊话，听到就反应。"},
   {en:"Stop work! Something's not right.", ipa:"", zh:"停工！有点不对。", tip:"任何人都可以喊。"},
   {en:"Watch your footing. The floor's slippery.", ipa:"", zh:"注意脚下。地面滑。", tip:"footing = 脚下。"}]},
   {h:"安全会议与权利",p:"",items:[
   {en:"Toolbox talk at seven. Today's topic is ladder safety.", ipa:"", zh:"七点安全会。今天主题是梯子安全。", tip:"toolbox talk = 工前短会。"},
   {en:"I noticed the scaffold is missing a guardrail on the east side.", ipa:"", zh:"我注意到脚手架东侧少了一个护栏。", tip:"在会上说出来。"},
   {en:"I'm not comfortable doing this without fall protection. I'm exercising my right to refuse unsafe work.", ipa:"", zh:"没有坠落防护我不能做这个。我行使拒绝不安全工作的权利。", tip:"法律保护你，不能因此被解雇。"},
   {en:"There's been an incident. Call the supervisor and don't move him.", ipa:"", zh:"出事了。叫主管，别动他。", tip:"incident = 事故。"},
   {en:"I need to report a near miss. A pipe fell from the second floor.", ipa:"", zh:"我要报告一次险情。一根管子从二楼掉下来。", tip:"near miss = 差点出事。必须报告。"}]}],
  drills:[["hard hat, steel-toe boots, safety glasses, hi-vis vest","PPE"],["PPE is mandatory on site. No boots, no work.","规矩"],["Lockout, tagout: de-energize the equipment before servicing.","LOTO"],["Heads up! Watch out! Coming through! Behind you!","四句喊话"],["I'm not comfortable doing this without fall protection. I'm exercising my right to refuse unsafe work.","拒绝权"],["I need to report a near miss. A pipe fell from the second floor.","险情"]],
  ex:[
   {t:"mc",q:"“PPE” 是？",opts:["个人防护装备","工资单","工作许可","工会"],a:0},
   {t:"listen",q:"听一听，这是什么警告？",say:"Heads up!",opts:["小心上面有东西","抬头看风景","开会","下班"],a:0},
   {t:"mc",q:"工人觉得工作不安全，可以？",opts:["依法拒绝，不能因此被解雇","只能照做","辞职","自己想办法"],a:0},
   {t:"listen",q:"听一听，什么情况？",say:"I need to report a near miss.",opts:["报告险情（差点出事）","报告事故","报告迟到","报告完工"],a:0},
   {t:"type",q:"翻译：洗眼器在哪？",a:"Where's the eyewash station?",alt:["Where's the eyewash station","Where is the eyewash station?","where's the eyewash station"]},
   {t:"type",q:"听写这个词（“脚手架”）。",say:"scaffold",a:"scaffold"}],
  hw:[["拿证书","在网上完成 WHMIS 课程（约 1 小时，英语），用英语说出三个你学到的标签。"],["认装备","去五金店用英语说出每样 PPE 的名字，看钢头靴的 CSA 标志。"],["安全三句","背下：Stop work! / I'm exercising my right to refuse unsafe work. / I need to report a near miss."]]
},
{ id:"l19c3", lv:19, title:"工具、材料与图纸", goal:"认识常用工具和材料的英语名称，看懂尺寸和单位，读懂基本图纸和工作单。",
  intro:"工地上的英语是<b>名词</b>：工具、材料、尺寸。叫错工具会被笑，看错尺寸会返工。加拿大用<b>混合单位</b>：木材用英寸（2x4、3/4 inch plywood），管道用英寸，但距离和图纸常用毫米和米。本章教<b>常用工具</b>、<b>材料</b>、<b>分数英寸</b>（three-eighths、five-sixteenths）、<b>图纸词汇</b>和<b>工作单</b>。",
  learn:[{h:"工具",p:"",items:[
   {en:"hammer, screwdriver, wrench, pliers, tape measure, level, utility knife", ipa:"", zh:"锤子、螺丝刀、扳手、钳子、卷尺、水平尺、美工刀", tip:"wrench 读 /rentʃ/。"},
   {en:"drill, impact driver, circular saw, reciprocating saw, grinder, nail gun", ipa:"", zh:"电钻、冲击起子、圆锯、往复锯、角磨机、钉枪", tip:"reciprocating saw 俗称 Sawzall。"},
   {en:"Phillips vs flathead vs Robertson screwdriver", ipa:"", zh:"十字 vs 一字 vs 方头螺丝刀", tip:"Robertson（方头）是加拿大发明的，到处都是。"},
   {en:"Hand me the three-quarter wrench. / Pass me the level.", ipa:"", zh:"递我 3/4 扳手。/ 把水平尺给我。", tip:"hand me / pass me = 递给我。"},
   {en:"extension cord, ladder, sawhorse, clamp, caulking gun", ipa:"", zh:"延长线、梯子、锯马、夹子、填缝枪", tip:"caulking 读 KAW-king。"}]},
   {h:"材料与尺寸",p:"",items:[
   {en:"two-by-four, two-by-six, plywood, drywall, OSB, studs, joists", ipa:"", zh:"2x4 木方、2x6、胶合板、石膏板、定向刨花板、立柱、搁栅", tip:"2x4 读 two-by-four，实际是 1.5 x 3.5 英寸。"},
   {en:"copper pipe, PEX, PVC, ABS, fittings, elbow, tee, coupling", ipa:"", zh:"铜管、PEX 管、PVC、ABS、配件、弯头、三通、直接", tip:"加拿大排水用 ABS（黑色）。"},
   {en:"fourteen-gauge wire, breaker, outlet, junction box, conduit", ipa:"", zh:"14 号线、断路器、插座、接线盒、线管", tip:"gauge 读 /geɪdʒ/。数字越小线越粗。"},
   {en:"one-half, three-quarters, five-eighths, three-sixteenths of an inch", ipa:"", zh:"二分之一、四分之三、八分之五、十六分之三英寸", tip:"分数英寸：分子 + 分母序数。"},
   {en:"Cut it to forty-seven and a half inches. / It's two millimetres off.", ipa:"", zh:"切到 47.5 英寸。/ 差两毫米。", tip:"off = 有偏差。"},
   {en:"sixteen inches on centre", ipa:"", zh:"中心距 16 英寸", tip:"立柱的标准间距。on centre = 中心到中心。"}]},
   {h:"图纸与工作单",p:"",items:[
   {en:"blueprint, floor plan, elevation, section, scale, legend", ipa:"", zh:"图纸、平面图、立面图、剖面图、比例、图例", tip:"elevation 在图纸里是立面，不是海拔。"},
   {en:"The scale is one to fifty. Check the legend for symbols.", ipa:"", zh:"比例是 1:50。看图例的符号。", tip:""},
   {en:"Work order 1187: replace water heater, unit 304. Parts on truck. Customer home after four.", ipa:"", zh:"工单 1187：换热水器，304 单元。零件在车上。客户四点后在家。", tip:"work order = 工单。"},
   {en:"The spec calls for half-inch drywall on the ceiling.", ipa:"", zh:"规格要求天花板用半英寸石膏板。", tip:"spec = specification，规格书；calls for = 要求。"},
