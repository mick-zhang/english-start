{ id:"l23c1", lv:23, title:"微观经济学：供给、需求与价格", goal:"掌握微观经济学的核心词汇（供需、弹性、均衡、市场），能读懂经济学教材和解释价格为什么变。",
  intro:"经济学是加拿大大学里<b>最多人选的课之一</b>，也是新闻里出现最多的学科。微观经济学从<b>供给和需求</b>开始：价格怎么由它们决定、什么让曲线移动、<b>弹性</b>（价格变了需求变多少）。本章教这套词汇和<b>经济学的说理方式</b>：all else being equal、incentives、trade-off、opportunity cost。学会了，房价、油价、工资的讨论你都能参与。",
  learn:[{h:"基本概念",p:"",items:[
   {en:"scarcity, opportunity cost, trade-off, incentive, marginal", ipa:"", zh:"稀缺、机会成本、权衡、激励、边际", tip:"marginal = 多一个单位的。经济学最爱的词。"},
   {en:"Opportunity cost is what you give up to get something. The cost of university includes the wages you don't earn.", ipa:"", zh:"机会成本是你为得到某物而放弃的。上大学的成本包括你没赚的工资。", tip:""},
   {en:"People respond to incentives. Raise the price of something, and people buy less of it.", ipa:"", zh:"人们对激励做出反应。提高一样东西的价格，人们就少买。", tip:""},
   {en:"All else being equal, a higher price leads to lower quantity demanded.", ipa:"", zh:"其他条件不变，更高的价格导致更低的需求量。", tip:"all else being equal = 其他不变（ceteris paribus）。"},
   {en:"Think at the margin: is one more hour of work worth it?", ipa:"", zh:"在边际上思考：多工作一小时值得吗？", tip:""}]},
   {h:"供给与需求",p:"",items:[
   {en:"demand, supply, quantity, price, equilibrium, shortage, surplus", ipa:"", zh:"需求、供给、数量、价格、均衡、短缺、过剩", tip:"equilibrium 读 ee-kwi-LIB-ree-um。"},
   {en:"The demand curve slopes downward; the supply curve slopes upward. They meet at the equilibrium price.", ipa:"", zh:"需求曲线向下倾斜；供给曲线向上倾斜。它们在均衡价格相交。", tip:""},
   {en:"If the price is above equilibrium, there's a surplus. Below, there's a shortage.", ipa:"", zh:"价格高于均衡有过剩。低于均衡有短缺。", tip:""},
   {en:"When incomes rise, demand for restaurants shifts to the right.", ipa:"", zh:"收入上升时，餐厅的需求曲线右移。", tip:"shifts = 移动（整条曲线）。"},
   {en:"A drought reduces the supply of wheat, pushing prices up.", ipa:"", zh:"干旱减少小麦供给，推高价格。", tip:""},
   {en:"Rent control is a price ceiling. It keeps rent low but can cause a shortage of apartments.", ipa:"", zh:"租金管制是价格上限。它让租金低，但可能造成公寓短缺。", tip:"price ceiling / price floor（最低工资）。"}]},
   {h:"弹性与市场",p:"",items:[
   {en:"Elasticity measures how much quantity changes when price changes.", ipa:"", zh:"弹性衡量价格变化时数量变化多少。", tip:"elasticity 读 ee-las-TIS-i-tee。"},
   {en:"Gasoline is inelastic: people keep buying even when the price goes up. Restaurant meals are elastic.", ipa:"", zh:"汽油是缺乏弹性的：价格涨了人们还是买。餐厅吃饭是有弹性的。", tip:""},
   {en:"perfect competition, monopoly, oligopoly, market power", ipa:"", zh:"完全竞争、垄断、寡头、市场势力", tip:"oligopoly 读 ol-i-GOP-o-lee。加拿大的电信、银行是寡头。"},
   {en:"In a competitive market, no single seller can set the price.", ipa:"", zh:"在竞争市场中，没有单个卖家能定价。", tip:""},
   {en:"Consumer surplus is the difference between what you'd pay and what you actually pay.", ipa:"", zh:"消费者剩余是你愿付的和实际付的之间的差。", tip:""}]}],
  drills:[["scarcity, opportunity cost, trade-off, incentive, marginal","五个概念"],["All else being equal, a higher price leads to lower quantity demanded.","需求定律"],["demand, supply, equilibrium, shortage, surplus","供需词"],["When incomes rise, demand for restaurants shifts to the right.","曲线移动"],["Gasoline is inelastic. Restaurant meals are elastic.","弹性"],["perfect competition, monopoly, oligopoly","市场结构"]],
  ex:[
   {t:"mc",q:"“opportunity cost” 是？",opts:["为得到某物而放弃的东西","机会的价格","额外的费用","边际成本"],a:0},
   {t:"listen",q:"听一听，会发生什么？",say:"A drought reduces the supply of wheat, pushing prices up.",opts:["供给减少，价格上涨","需求减少","价格下跌","供给增加"],a:0},
   {t:"mc",q:"汽油需求“inelastic”意思是？",opts:["价格涨了人们还是买差不多的量","价格涨了没人买","价格不变","供给不变"],a:0},
   {t:"listen",q:"听一听，租金管制可能造成？",say:"It keeps rent low but can cause a shortage of apartments.",opts:["公寓短缺","公寓过剩","租金上涨","房东变多"],a:0},
   {t:"type",q:"翻译：人们对激励做出反应。",a:"People respond to incentives.",alt:["People respond to incentives","people respond to incentives"]},
   {t:"type",q:"听写这个词（“均衡”）。",say:"equilibrium",a:"equilibrium"}],
  hw:[["画供需图","画一张供需图，用英语标出 demand、supply、equilibrium，然后解释收入上升时发生什么。"],["找三个弹性","用英语说出三样你买的东西是 elastic 还是 inelastic，为什么。"],["解释一个价格","选一样最近涨价的东西（鸡蛋、房租、油），用供需语言用英语解释为什么。"]]
},
{ id:"l23c2", lv:23, title:"宏观经济学：GDP、通胀、利率与央行", goal:"掌握宏观经济的核心词汇，能读懂经济新闻（GDP 增长、通胀数据、加拿大央行决定），理解它们和自己生活的关系。",
  intro:"宏观经济学是<b>新闻头条的语言</b>：GDP、inflation、interest rates、unemployment、recession。每次加拿大央行（Bank of Canada）宣布利率，你的房贷、储蓄、工作都受影响。本章教这些指标<b>是什么、怎么读、为什么相关</b>（利率升 → 借钱贵 → 需求降 → 通胀降），以及<b>财政政策 vs 货币政策</b>。读懂了，新闻里的“央行加息 25 个基点”就不再是天书。",
  learn:[{h:"核心指标",p:"",items:[
   {en:"GDP, inflation, unemployment rate, interest rate, exchange rate", ipa:"", zh:"国内生产总值、通胀、失业率、利率、汇率", tip:""},
   {en:"GDP is the total value of everything a country produces in a year.", ipa:"", zh:"GDP 是一个国家一年生产的所有东西的总价值。", tip:""},
   {en:"The economy grew two percent last quarter. / The economy contracted, shrinking by half a percent.", ipa:"", zh:"上季度经济增长 2%。/ 经济收缩，萎缩 0.5%。", tip:"grew / contracted。"},
   {en:"A recession is two consecutive quarters of negative growth.", ipa:"", zh:"衰退是连续两个季度负增长。", tip:"consecutive = 连续的。"},
   {en:"Inflation is the rate at which prices rise. The Bank of Canada targets two percent.", ipa:"", zh:"通胀是物价上涨的速率。加拿大央行的目标是 2%。", tip:"targets = 以……为目标。"},
   {en:"The Consumer Price Index tracks the cost of a basket of goods and services.", ipa:"", zh:"消费者价格指数追踪一篮子商品和服务的成本。", tip:"CPI。"}]},
   {h:"央行与利率",p:"",items:[
   {en:"The Bank of Canada raised its key interest rate by twenty-five basis points to four point five percent.", ipa:"", zh:"加拿大央行将关键利率上调 25 个基点至 4.5%。", tip:"basis points = 基点，1 基点 = 0.01%。"},
   {en:"Higher interest rates make borrowing more expensive, which slows spending and cools inflation.", ipa:"", zh:"更高的利率让借钱更贵，这减缓支出并给通胀降温。", tip:"cools = 降温。"},
   {en:"When the central bank cuts rates, mortgages get cheaper and the economy gets a boost.", ipa:"", zh:"央行降息时，房贷变便宜，经济得到提振。", tip:"boost = 提振。"},
   {en:"Monetary policy is the central bank's tool; fiscal policy is the government's: taxes and spending.", ipa:"", zh:"货币政策是央行的工具；财政政策是政府的：税收和支出。", tip:"monetary 读 MON-e-tair-ee；fiscal 读 FIS-kl。"},
   {en:"The government ran a deficit of forty billion dollars this year, adding to the national debt.", ipa:"", zh:"政府今年赤字 400 亿，增加了国债。", tip:"deficit = 一年的赤字；debt = 累计的债。"},
   {en:"The loonie fell to seventy-two cents US.", ipa:"", zh:"加元跌到 72 美分。", tip:"汇率新闻的说法。"}]},
   {h:"和你的关系",p:"",items:[
   {en:"If inflation is four percent and your raise is two percent, you're actually poorer.", ipa:"", zh:"如果通胀 4% 而你加薪 2%，你实际上更穷了。", tip:"real vs nominal。"},
   {en:"Variable-rate mortgages go up immediately when the Bank raises rates.", ipa:"", zh:"央行加息时，浮动利率房贷立即上涨。", tip:""},
   {en:"In a recession, unemployment rises and it's harder to find a job.", ipa:"", zh:"衰退时失业率上升，找工作更难。", tip:""},
   {en:"A weak loonie makes imports and travel to the US more expensive, but helps exporters.", ipa:"", zh:"弱加元让进口和去美国旅行更贵，但帮助出口商。", tip:""},
   {en:"The labour market is tight: more jobs than workers, so wages are rising.", ipa:"", zh:"劳动力市场紧张：工作比工人多，所以工资在涨。", tip:"tight = 紧张。"}]}],
  drills:[["GDP, inflation, unemployment rate, interest rate, exchange rate","五个指标"],["A recession is two consecutive quarters of negative growth.","衰退"],["The Bank of Canada raised its key interest rate by twenty-five basis points.","加息"],["Higher interest rates make borrowing more expensive, which slows spending and cools inflation.","传导"],["Monetary policy is the central bank's tool; fiscal policy is the government's.","两种政策"],["If inflation is four percent and your raise is two percent, you're actually poorer.","实际工资"]],
  ex:[
   {t:"mc",q:"“twenty-five basis points” 是？",opts:["0.25%","25%","2.5%","0.025%"],a:0},
   {t:"listen",q:"听一听，经济怎么了？",say:"The economy contracted, shrinking by half a percent.",opts:["收缩 0.5%","增长 0.5%","增长 5%","没变"],a:0},
   {t:"mc",q:"央行加息的目的通常是？",opts:["给通胀降温","刺激经济","增加就业","降低汇率"],a:0},
   {t:"listen",q:"听一听，加元怎么了？",say:"The loonie fell to seventy-two cents US.",opts:["跌到 72 美分","涨到 72 美分","跌了 72%","等于 72 加分"],a:0},
   {t:"type",q:"翻译：货币政策是央行的工具。",a:"Monetary policy is the central bank's tool.",alt:["Monetary policy is the central bank's tool","monetary policy is the central bank's tool","Monetary policy is the tool of the central bank."]},
   {t:"type",q:"听写这个词（“衰退”）。",say:"recession",a:"recession"}],
  hw:[["读一条央行新闻","找最近一次加拿大央行利率决定的英文新闻，用英语说出：利率多少、变了多少、为什么。"],["查四个数","查加拿大当前的 GDP 增长、通胀率、失业率、政策利率，用英语写成四句。"],["算一次","用英语算出通胀 3% 时，你的工资需要涨多少才不变穷。"]]
},
{ id:"l23c3", lv:23, title:"产业组织：市场结构、定价与竞争政策", goal:"掌握产业组织的英语（市场集中度、定价策略、进入壁垒、反垄断），能分析加拿大的寡头行业并读懂竞争局的新闻。",
  intro:"产业组织（IO）研究<b>公司怎么竞争、为什么有些行业只有三四家</b>。这在加拿大特别相关：电信、银行、航空、杂货都是<b>寡头</b>。本章教<b>市场结构</b>（concentration、barriers to entry）、<b>定价策略</b>（price discrimination、bundling、predatory pricing）、<b>合谋与反垄断</b>（collusion、Competition Bureau、merger review），以及读懂“Rogers 收购 Shaw”这类新闻的语言。",
  learn:[{h:"市场结构",p:"",items:[
   {en:"market concentration, market share, barriers to entry, economies of scale", ipa:"", zh:"市场集中度、市场份额、进入壁垒、规模经济", tip:"economies of scale = 越大越便宜。"},
   {en:"Three companies control ninety percent of Canada's wireless market. That's a highly concentrated industry.", ipa:"", zh:"三家公司控制加拿大 90% 的无线市场。那是高度集中的行业。", tip:""},
   {en:"High fixed costs, like building a network, are a barrier to entry for new competitors.", ipa:"", zh:"高固定成本，比如建网络，是新竞争者的进入壁垒。", tip:""},
   {en:"A natural monopoly exists when one firm can serve the market more cheaply than two.", ipa:"", zh:"当一家公司能比两家更便宜地服务市场时，存在自然垄断。", tip:"水电、管道。"},
   {en:"Product differentiation lets firms charge more by making their product seem unique.", ipa:"", zh:"产品差异化让公司通过让产品显得独特来收更高价。", tip:"differentiation 读 dif-er-en-shee-AY-shun。"}]},
   {h:"定价策略",p:"",items:[
   {en:"price discrimination: charging different customers different prices for the same thing", ipa:"", zh:"价格歧视：对同一东西向不同客户收不同价格", tip:"学生票、老人票、早鸟票。"},
   {en:"bundling: selling internet, TV, and phone together for one price", ipa:"", zh:"捆绑：把网络、电视和电话打包一个价格卖", tip:""},
   {en:"Predatory pricing means selling below cost to drive out competitors, then raising prices.", ipa:"", zh:"掠夺性定价指低于成本卖以赶走竞争者，然后涨价。", tip:"predatory 读 PRED-a-tor-ee。"},
   {en:"Firms in an oligopoly watch each other closely. If one raises prices, the others often follow.", ipa:"", zh:"寡头中的公司密切关注彼此。一家涨价，其他常跟进。", tip:""},
   {en:"Switching costs keep customers locked in, even when a competitor is cheaper.", ipa:"", zh:"转换成本让客户被锁定，即使竞争者更便宜。", tip:"locked in = 被锁定。"}]},
   {h:"合谋与监管",p:"",items:[
   {en:"collusion, cartel, price-fixing, antitrust, merger, acquisition", ipa:"", zh:"合谋、卡特尔、操纵价格、反垄断、合并、收购", tip:"collusion 读 ko-LOO-zhun。"},
   {en:"The major grocers were investigated for fixing the price of bread for over a decade.", ipa:"", zh:"主要杂货商因十多年操纵面包价格被调查。", tip:"真实案例：加拿大面包价格操纵案。"},
   {en:"The Competition Bureau reviews mergers to decide whether they would reduce competition.", ipa:"", zh:"竞争局审查合并以决定是否会减少竞争。", tip:"加拿大的反垄断机构。"},
   {en:"The merger was approved on the condition that the company sell part of its business.", ipa:"", zh:"合并在公司出售部分业务的条件下获批。", tip:"on the condition that = 以……为条件。"},
   {en:"Critics argue that weak competition is why Canadians pay some of the highest cellphone bills in the world.", ipa:"", zh:"批评者认为竞争薄弱是加拿大人付世界上最高手机费之一的原因。", tip:""},
   {en:"Regulators can break up a monopoly, cap prices, or force it to open its network to rivals.", ipa:"", zh:"监管者可以拆分垄断、限制价格或强制它向对手开放网络。", tip:"rivals = 对手。"}]}],
  drills:[["market concentration, market share, barriers to entry, economies of scale","结构词"],["Three companies control ninety percent of Canada's wireless market.","集中"],["price discrimination, bundling, predatory pricing","三种定价"],["collusion, cartel, price-fixing, antitrust, merger","监管词"],["The Competition Bureau reviews mergers to decide whether they would reduce competition.","竞争局"],["Critics argue that weak competition is why Canadians pay some of the highest cellphone bills in the world.","批评"]],
  ex:[
   {t:"mc",q:"“barriers to entry” 是？",opts:["新竞争者进入市场的障碍","进口关税","入场费","市场份额"],a:0},
   {t:"listen",q:"听一听，这是什么策略？",say:"Selling below cost to drive out competitors, then raising prices.",opts:["掠夺性定价","价格歧视","捆绑","合谋"],a:0},
   {t:"mc",q:"学生票和成人票价格不同是？",opts:["价格歧视","掠夺性定价","捆绑","合谋"],a:0},
   {t:"listen",q:"听一听，合并的条件是？",say:"The merger was approved on the condition that the company sell part of its business.",opts:["出售部分业务","降价","不裁员","开放网络"],a:0},
   {t:"type",q:"翻译：规模经济（名词短语）",a:"economies of scale",alt:["Economies of scale","economies of scale."]},
   {t:"type",q:"听写这个词（“垄断”）。",say:"monopoly",a:"monopoly"}],
  hw:[["分析一个行业","选一个加拿大寡头行业（电信、银行、航空、杂货），用英语写：几家公司、进入壁垒、定价策略。"],["读一条新闻","找一条竞争局或合并的英文新闻，用英语总结三句。"],["找价格歧视","用英语列出你本周遇到的三个价格歧视的例子。"]]
},
{ id:"l23c4", lv:23, title:"博弈论：囚徒困境、纳什均衡与策略", goal:"掌握博弈论的核心概念和英语，能分析简单博弈（囚徒困境、协调、讨价还价），能把它用在谈判和日常决策上。",
  intro:"博弈论研究<b>当结果取决于别人怎么做时，你该怎么做</b>。它在经济、政治、商业谈判、甚至家庭决策里都用。本章教<b>基本概念</b>（player、strategy、payoff、Nash equilibrium）、<b>经典博弈</b>（囚徒困境、协调博弈、胆小鬼博弈）、<b>重复博弈与合作</b>（tit for tat），以及<b>用英语分析一个博弈</b>的句式。第五级学的谈判，这里给你理论。",
  learn:[{h:"基本概念",p:"",items:[
   {en:"player, strategy, payoff, payoff matrix, dominant strategy, Nash equilibrium", ipa:"", zh:"参与者、策略、收益、收益矩阵、占优策略、纳什均衡", tip:"Nash 读 /næʃ/。"},
   {en:"A dominant strategy is your best choice no matter what the other player does.", ipa:"", zh:"占优策略是无论对方怎么做都是你最好的选择。", tip:""},
   {en:"A Nash equilibrium is a situation where no player can do better by changing their strategy alone.", ipa:"", zh:"纳什均衡是没有参与者能通过单独改变策略而做得更好的状态。", tip:""},
   {en:"zero-sum vs positive-sum: in a zero-sum game, my gain is your loss. In a positive-sum game, we can both win.", ipa:"", zh:"零和 vs 正和：零和博弈中我的所得是你的损失。正和博弈中我们都能赢。", tip:""},
   {en:"Think about what the other player wants, and what they think you'll do.", ipa:"", zh:"想想对方想要什么，以及他们认为你会怎么做。", tip:"博弈思维的核心。"}]},
   {h:"经典博弈",p:"",items:[
   {en:"The prisoner's dilemma: two suspects each do better by confessing, but both would be better off staying silent.", ipa:"", zh:"囚徒困境：两个嫌疑人各自坦白更好，但两人都沉默会更好。", tip:"dilemma 读 di-LEM-a。"},
   {en:"Both confess. That's the Nash equilibrium, even though it's worse for both.", ipa:"", zh:"两人都坦白。那是纳什均衡，尽管对两人都更糟。", tip:""},
   {en:"Climate change is a prisoner's dilemma: every country benefits from cutting emissions, but each has an incentive to let others do it.", ipa:"", zh:"气候变化是囚徒困境：每个国家都从减排受益，但各自都有让别人去做的激励。", tip:"emissions = 排放。"},
   {en:"A coordination game: we both want to meet, but we have to pick the same place.", ipa:"", zh:"协调博弈：我们都想见面，但得选同一个地方。", tip:""},
   {en:"Chicken: two drivers head toward each other. Whoever swerves first loses face.", ipa:"", zh:"胆小鬼博弈：两个司机对冲。先转弯的丢面子。", tip:"swerve = 转向。"},
   {en:"First-mover advantage: the player who commits first can force the other to adapt.", ipa:"", zh:"先动优势：先承诺的参与者能迫使对方适应。", tip:""}]},
   {h:"重复博弈与应用",p:"",items:[
   {en:"In a repeated game, cooperation can emerge because cheating today costs you tomorrow.", ipa:"", zh:"在重复博弈中，合作可能出现，因为今天作弊明天会付出代价。", tip:"emerge = 出现。"},
   {en:"Tit for tat: cooperate first, then do whatever the other player did last time.", ipa:"", zh:"以牙还牙：先合作，然后对方上次怎么做你就怎么做。", tip:"最成功的策略之一。"},
   {en:"A credible threat is one you'd actually carry out. An empty threat changes nothing.", ipa:"", zh:"可信的威胁是你真的会执行的。空威胁什么都改变不了。", tip:"credible 读 KRED-i-bl。"},
   {en:"In a negotiation, knowing your walk-away point gives you leverage.", ipa:"", zh:"谈判中，知道你的底线给你筹码。", tip:"leverage 读 LEV-er-ij。"},
   {en:"Auctions, dating, and rush-hour traffic are all games.", ipa:"", zh:"拍卖、约会和早高峰交通都是博弈。", tip:""}]}],
  drills:[["player, strategy, payoff, dominant strategy, Nash equilibrium","五个概念"],["A Nash equilibrium is a situation where no player can do better by changing their strategy alone.","纳什均衡"],["The prisoner's dilemma: two suspects each do better by confessing, but both would be better off staying silent.","囚徒困境"],["Tit for tat: cooperate first, then do whatever the other player did last time.","以牙还牙"],["A credible threat is one you'd actually carry out.","可信威胁"],["Think about what the other player wants, and what they think you'll do.","博弈思维"]],
  ex:[
   {t:"mc",q:"“dominant strategy” 是？",opts:["无论对方怎么做都最好的选择","最强的参与者","最高的收益","合作"],a:0},
   {t:"listen",q:"听一听，这是哪种博弈？",say:"We both want to meet, but we have to pick the same place.",opts:["协调博弈","囚徒困境","胆小鬼","零和"],a:0},
   {t:"mc",q:"囚徒困境的纳什均衡是？",opts:["两人都坦白","两人都沉默","一个坦白一个沉默","没有均衡"],a:0},
   {t:"listen",q:"听一听，为什么重复博弈能合作？",say:"Cheating today costs you tomorrow.",opts:["今天作弊明天付代价","作弊没有代价","合作不可能","对方总是作弊"],a:0},
   {t:"type",q:"翻译：零和博弈中，我的所得是你的损失。",a:"In a zero-sum game, my gain is your loss.",alt:["In a zero-sum game, my gain is your loss","In a zero-sum game my gain is your loss.","in a zero-sum game, my gain is your loss"]},
   {t:"type",q:"听写这个词（“收益”）。",say:"payoff",a:"payoff"}],
  hw:[["画一个矩阵","画囚徒困境的收益矩阵，用英语解释每个格子，指出纳什均衡。"],["找一个生活博弈","用英语描述你生活中的一个博弈（室友洗碗、同事加班、邻居铲雪），说出参与者、策略、均衡。"],["用一次","在一次真实谈判或决策中用博弈思维（What does the other side want?），用英语写下你的分析和结果。"]]
},
{ id:"l23c5", lv:23, title:"加拿大经济与个人理财", goal:"了解加拿大经济的结构（资源、贸易、住房、劳动力），掌握个人理财的英语（预算、储蓄账户、投资、信用），能做理性的财务决策。",
  intro:"经济学最后要落到<b>自己的钱</b>上。本章先讲<b>加拿大经济的特点</b>（资源出口、对美贸易、住房占比高、移民驱动），再讲<b>个人理财</b>：<b>budget</b>、<b>emergency fund</b>、<b>TFSA / RRSP / FHSA</b>（三个免税账户的区别）、<b>index funds</b>、<b>compound interest</b>、<b>credit score</b>。原则：<b>先付自己（pay yourself first）、分散（diversify）、低费用（low fees）</b>。",
  learn:[{h:"加拿大经济",p:"",items:[
   {en:"Canada is a resource economy: oil, gas, minerals, lumber, and wheat are major exports.", ipa:"", zh:"加拿大是资源经济：石油、天然气、矿产、木材和小麦是主要出口。", tip:"lumber = 木材。"},
   {en:"About three quarters of Canada's exports go to the United States.", ipa:"", zh:"加拿大约四分之三的出口去美国。", tip:"所以美国的关税是大新闻。"},
   {en:"Housing makes up a large share of the economy, and household debt is among the highest in the G7.", ipa:"", zh:"住房占经济很大份额，家庭债务在七国集团中最高之列。", tip:""},
   {en:"Immigration drives population growth and fills labour shortages.", ipa:"", zh:"移民推动人口增长，填补劳动力短缺。", tip:""},
   {en:"The service sector, including finance, health care, and education, employs most Canadians.", ipa:"", zh:"服务业，包括金融、医疗和教育，雇用了大多数加拿大人。", tip:""},
   {en:"tariff, trade deal, supply chain, productivity", ipa:"", zh:"关税、贸易协议、供应链、生产率", tip:"tariff 读 TAIR-if。"}]},
   {h:"账户与投资",p:"",items:[
   {en:"TFSA: contributions aren't deductible, but all growth and withdrawals are tax-free.", ipa:"", zh:"TFSA：供款不抵税，但所有增值和取款免税。", tip:"withdrawals = 取款。"},
   {en:"RRSP: contributions reduce your taxable income now; you pay tax when you withdraw in retirement.", ipa:"", zh:"RRSP：供款现在减少应税收入；退休取款时交税。", tip:"高收入时存 RRSP 更划算。"},
   {en:"FHSA: for first-time home buyers. Deductible going in, tax-free coming out for a home.", ipa:"", zh:"FHSA：给首次购房者。存入抵税，为买房取出免税。", tip:"两者的优点都有。"},
   {en:"An index fund holds hundreds of companies at a very low fee. Diversification reduces risk.", ipa:"", zh:"指数基金以很低的费用持有数百家公司。分散降低风险。", tip:"diversification 读 dy-ver-si-fi-KAY-shun。"},
   {en:"Compound interest: your returns earn returns. Starting ten years earlier can double your final amount.", ipa:"", zh:"复利：你的收益再生收益。早十年开始能让最终金额翻倍。", tip:""},

{ id:"l23c6", lv:23, title:"第二十三级结业：读懂经济新闻并做一次经济分析", goal:"能读懂一篇英文经济报道或央行声明，并用英语做一次 5 分钟的经济分析：数据、原因、影响、不同观点。",
  intro:"结业任务：<b>选一个经济话题，做一次 5 分钟的英语分析</b>——房价、通胀、关税、最低工资、移民都行。本章先教<b>经济报道和央行声明的语言</b>（outlook、headwinds、downside risks），<b>解释因果的句式</b>（driven by、as a result of、in response to），<b>平衡不同观点</b>（economists are divided），以及<b>经济学家怎么说“不确定”</b>（is expected to、could、depending on）。",
  learn:[{h:"报道与声明的语言",p:"",items:[
   {en:"outlook, forecast, headwinds, tailwinds, downside risk, soft landing", ipa:"", zh:"前景、预测、逆风、顺风、下行风险、软着陆", tip:"soft landing = 降通胀不引发衰退。"},
   {en:"The Bank expects inflation to return to target by the end of next year.", ipa:"", zh:"央行预计通胀到明年底回到目标。", tip:"expects… to = 预计。"},
   {en:"Growth is forecast to slow to one percent amid high interest rates and weak consumer spending.", ipa:"", zh:"在高利率和消费疲软的背景下，增长预计放缓至 1%。", tip:"amid = 在……背景下。"},
   {en:"The labour market remains tight, but there are signs of softening.", ipa:"", zh:"劳动力市场仍然紧张，但有松动迹象。", tip:"softening = 松动。"},
   {en:"Economists are divided on whether the economy will enter a recession.", ipa:"", zh:"经济学家在经济是否会进入衰退上意见分歧。", tip:"are divided on = 有分歧。"},
   {en:"The data came in stronger than expected.", ipa:"", zh:"数据比预期强。", tip:"came in = 公布出来。"}]},
   {h:"解释因果",p:"",items:[
   {en:"Housing prices rose, driven by low interest rates and strong immigration.", ipa:"", zh:"房价上涨，由低利率和强劲移民驱动。", tip:"driven by = 由……驱动。"},
   {en:"As a result of the tariffs, the price of imported steel went up fifteen percent.", ipa:"", zh:"由于关税，进口钢材价格上涨 15%。", tip:""},
   {en:"In response to rising inflation, the Bank raised rates eight times in a year.", ipa:"", zh:"为应对通胀上升，央行一年加息八次。", tip:"in response to = 为应对。"},
   {en:"This led to higher mortgage payments, which in turn reduced consumer spending.", ipa:"", zh:"这导致更高的房贷还款，进而减少了消费支出。", tip:"in turn = 进而。"},
   {en:"The effect depends on how long rates stay high.", ipa:"", zh:"效果取决于利率保持高位多久。", tip:"depends on = 取决于。"}]},
   {h:"分析的结构",p:"",items:[
   {en:"Today I want to look at why rent in Toronto has risen so fast.", ipa:"", zh:"今天我想看看多伦多租金为什么涨这么快。", tip:"话题。"},
   {en:"Here's the data: average rent is up thirty percent in three years.", ipa:"", zh:"数据：平均租金三年涨了 30%。", tip:"数据。"},
   {en:"There are three main causes: population growth, slow construction, and investor demand.", ipa:"", zh:"三个主要原因：人口增长、建设缓慢和投资者需求。", tip:"原因。"},
   {en:"The impact falls hardest on young people and newcomers.", ipa:"", zh:"影响最重地落在年轻人和新移民身上。", tip:"影响。"},
   {en:"Some argue for rent control; others say we simply need to build more. I lean toward the second view, because…", ipa:"", zh:"有人主张租金管制；有人说我们只需要多建。我倾向于第二种，因为……", tip:"观点 + 立场。"},
   {en:"To sum up: this is a supply problem, and it won't be fixed quickly.", ipa:"", zh:"总结：这是供给问题，不会很快解决。", tip:""}]}],
  drills:[["outlook, forecast, headwinds, downside risk, soft landing","报道词"],["The Bank expects inflation to return to target by the end of next year.","央行声明"],["Economists are divided on whether the economy will enter a recession.","分歧"],["Housing prices rose, driven by low interest rates and strong immigration.","driven by"],["This led to higher mortgage payments, which in turn reduced consumer spending.","连锁"],["There are three main causes: population growth, slow construction, and investor demand.","分析"]],
  ex:[
   {t:"mc",q:"“soft landing” 是？",opts:["降通胀而不引发衰退","经济崩溃","飞机降落","利率降到零"],a:0},
   {t:"listen",q:"听一听，增长预测是？",say:"Growth is forecast to slow to one percent.",opts:["放缓至 1%","加速至 1%","下降 1%","保持 1%"],a:0},
   {t:"mc",q:"“in response to rising inflation” 意思是？",opts:["为应对通胀上升","导致通胀上升","尽管通胀上升","在通胀上升之前"],a:0},
   {t:"listen",q:"听一听，这是分析的哪部分？",say:"The impact falls hardest on young people and newcomers.",opts:["影响","数据","原因","观点"],a:0},
   {t:"type",q:"翻译：数据比预期强。",a:"The data came in stronger than expected.",alt:["The data came in stronger than expected","the data came in stronger than expected","The data was stronger than expected."]},
   {t:"type",q:"听写这个词（“前景”）。",say:"outlook",a:"outlook"}],
  hw:[["读一份声明","读最近一份加拿大央行利率声明（网站上有，一页），用英语找出 outlook、expects、risks 的句子并翻译。"],["写分析稿","选一个经济话题，按“话题 → 数据 → 原因 → 影响 → 观点 → 总结”写 5 分钟英语分析稿。"],["分析（必做）","对至少两个人做这次分析，回答一个反对意见（Some would say…），记下反馈。"]]
},

{ id:"l24c1", lv:24, title:"心理学（一）：大脑、记忆与学习", goal:"掌握认知心理学的核心词汇（记忆、注意、学习、认知偏差），能读懂心理学科普，并把它用在自己的英语学习上。",
  intro:"心理学是北美大学里<b>最受欢迎的入门课</b>，也是日常对话里最常引用的学科（“这是确认偏差”）。本章从<b>认知</b>开始：大脑怎么记、怎么忘、怎么学——这些直接关系到<b>你怎么学英语</b>。词汇：memory、attention、cognition、bias；概念：spaced repetition、working memory、confirmation bias。学完你会知道为什么“每天 20 分钟”比“周末 3 小时”有效。",
  learn:[{h:"记忆与学习",p:"",items:[
   {en:"cognition, perception, attention, memory, learning", ipa:"", zh:"认知、知觉、注意、记忆、学习", tip:"cognition 读 kog-NISH-un。"},
   {en:"short-term memory, working memory, long-term memory", ipa:"", zh:"短时记忆、工作记忆、长时记忆", tip:"工作记忆一次只能装约 4 到 7 样东西。"},
   {en:"Spaced repetition: reviewing at increasing intervals is far more effective than cramming.", ipa:"", zh:"间隔重复：以递增的间隔复习，比突击有效得多。", tip:"cramming = 临时突击。"},
   {en:"Retrieval practice: testing yourself strengthens memory more than rereading.", ipa:"", zh:"提取练习：自我测试比重读更能巩固记忆。", tip:"这就是本课堂“我来读”和练习的原理。"},
   {en:"Sleep consolidates memory. An all-nighter before an exam usually backfires.", ipa:"", zh:"睡眠巩固记忆。考前通宵通常适得其反。", tip:"backfires = 适得其反。"},
   {en:"The forgetting curve: we lose most new information within days unless we review it.", ipa:"", zh:"遗忘曲线：除非复习，我们几天内就忘掉大部分新信息。", tip:""}]},
   {h:"认知偏差",p:"",items:[
   {en:"confirmation bias: we notice evidence that supports what we already believe", ipa:"", zh:"确认偏差：我们注意支持已有信念的证据", tip:"最常被引用的偏差。"},
   {en:"availability bias: we overestimate risks that are easy to picture, like plane crashes", ipa:"", zh:"可得性偏差：我们高估容易想象的风险，比如坠机", tip:""},
   {en:"anchoring: the first number you hear shapes your judgment of what's reasonable", ipa:"", zh:"锚定：你听到的第一个数字塑造你对合理性的判断", tip:"谈判里第一个报价就是锚。"},
   {en:"The Dunning-Kruger effect: people with little skill tend to overestimate their ability.", ipa:"", zh:"邓宁-克鲁格效应：技能少的人倾向于高估自己的能力。", tip:""},
   {en:"Hindsight bias: after something happens, we feel we knew it all along.", ipa:"", zh:"后见之明偏差：事情发生后，我们觉得自己一直都知道。", tip:"hindsight 读 HIND-site。"},
   {en:"Knowing about a bias doesn't make you immune to it.", ipa:"", zh:"知道偏差不会让你免疫。", tip:"immune to = 免疫。"}]},
   {h:"应用到英语学习",p:"",items:[
   {en:"Twenty minutes a day beats three hours on Sunday because of spacing.", ipa:"", zh:"因为间隔效应，每天 20 分钟胜过周日 3 小时。", tip:"beats = 胜过。"},
   {en:"Don't just listen. Say it out loud. Production is harder than recognition, and that's the point.", ipa:"", zh:"不要只听。大声说出来。产出比识别难，这正是重点。", tip:""},
   {en:"Mistakes are information, not failure. The brain learns most from errors it notices.", ipa:"", zh:"错误是信息，不是失败。大脑从它注意到的错误中学到最多。", tip:""},
   {en:"Interleaving: mixing topics in one session improves long-term retention.", ipa:"", zh:"交错学习：一次练习混合不同主题能提高长期记忆。", tip:"retention = 记住。"}]}],
  drills:[["cognition, perception, attention, memory, learning","五个词"],["Spaced repetition: reviewing at increasing intervals is far more effective than cramming.","间隔重复"],["Retrieval practice: testing yourself strengthens memory more than rereading.","提取练习"],["confirmation bias: we notice evidence that supports what we already believe","确认偏差"],["Anchoring: the first number you hear shapes your judgment of what's reasonable.","锚定"],["Twenty minutes a day beats three hours on Sunday because of spacing.","应用"]],
  ex:[
   {t:"mc",q:"“cramming” 是？",opts:["临时突击","间隔复习","自我测试","睡觉"],a:0},
   {t:"listen",q:"听一听，这是哪种偏差？",say:"We overestimate risks that are easy to picture, like plane crashes.",opts:["可得性偏差","确认偏差","锚定","后见之明"],a:0},
   {t:"mc",q:"根据认知心理学，哪种学习方式最有效？",opts:["每天短时间 + 自我测试","周末长时间重读","考前通宵","只听不说"],a:0},
   {t:"listen",q:"听一听，这说的是什么？",say:"After something happens, we feel we knew it all along.",opts:["后见之明偏差","确认偏差","锚定","邓宁-克鲁格"],a:0},
   {t:"type",q:"翻译：错误是信息，不是失败。",a:"Mistakes are information, not failure.",alt:["Mistakes are information, not failure","mistakes are information, not failure","Mistakes are information and not failure."]},
   {t:"type",q:"听写这个词（“偏差”）。",say:"bias",a:"bias"}],
  hw:[["找三个偏差","用英语写下本周你在自己或别人身上看到的三个认知偏差。"],["改学习计划","用英语写一个基于 spacing 和 retrieval 的英语学习周计划。"],["讲给别人","用英语向朋友解释 confirmation bias，举一个社交媒体的例子。"]]
},
{ id:"l24c2", lv:24, title:"心理学（二）：情绪、人格与心理健康", goal:"掌握情绪、人格和心理健康的英语，能读懂相关科普，能用心理学语言描述自己和他人，知道什么时候求助。",
  intro:"这一章的词汇是<b>北美日常对话里的常用语</b>：stressed、anxious、burnout、introvert、boundaries、therapy。心理健康在加拿大<b>不是禁忌</b>，同事会说 “I'm seeing a therapist” 就像说看牙医。本章教<b>情绪的词</b>（细分，不只是 happy / sad）、<b>人格模型</b>（Big Five、内外向）、<b>压力与应对</b>、以及<b>求助的语言</b>（衔接第十级）。",
  learn:[{h:"情绪",p:"",items:[
   {en:"anxious, frustrated, overwhelmed, relieved, content, resentful, grateful", ipa:"", zh:"焦虑、沮丧、不堪重负、如释重负、满足、怨恨、感恩", tip:"overwhelmed = 事情太多应付不来。"},
   {en:"I'm feeling overwhelmed with work right now.", ipa:"", zh:"我现在工作多到应付不来。", tip:""},
   {en:"Emotions are signals, not instructions. Feeling angry doesn't mean you have to act angry.", ipa:"", zh:"情绪是信号，不是指令。感到生气不意味着你必须表现得生气。", tip:""},
   {en:"Naming the emotion reduces its intensity. 'I notice I'm feeling anxious.'", ipa:"", zh:"说出情绪的名字能减轻它的强度。“我注意到我在焦虑。”", tip:"affect labelling。"},
   {en:"Emotional regulation means managing how you respond, not suppressing what you feel.", ipa:"", zh:"情绪调节指管理你怎么反应，不是压抑你的感受。", tip:"suppressing = 压抑。"}]},
   {h:"人格",p:"",items:[
   {en:"The Big Five: openness, conscientiousness, extraversion, agreeableness, neuroticism", ipa:"", zh:"大五人格：开放性、尽责性、外向性、宜人性、神经质", tip:"conscientiousness 读 kon-shee-EN-shus-ness。"},
   {en:"I'm more of an introvert. I recharge by being alone.", ipa:"", zh:"我更偏内向。我靠独处充电。", tip:"recharge = 充电。北美常用的自我描述。"},
   {en:"Introverts aren't shy; they just find socializing draining.", ipa:"", zh:"内向者不是害羞；他们只是觉得社交消耗能量。", tip:"draining = 消耗。"},
   {en:"Personality is fairly stable, but it can shift over decades.", ipa:"", zh:"人格相当稳定，但几十年间可以变化。", tip:""},
   {en:"The MBTI is popular but not well supported by research. The Big Five is the scientific model.", ipa:"", zh:"MBTI 流行但研究支持不足。大五是科学模型。", tip:""}]},
   {h:"压力、应对与求助",p:"",items:[
   {en:"stress, burnout, coping, resilience, self-care, boundaries", ipa:"", zh:"压力、倦怠、应对、韧性、自我照顾、边界", tip:"resilience 读 ri-ZIL-yens。"},
   {en:"Burnout is chronic workplace stress: exhaustion, cynicism, and feeling ineffective.", ipa:"", zh:"倦怠是慢性职场压力：精疲力竭、愤世嫉俗和感觉无效。", tip:"cynicism 读 SIN-i-sizm。"},
   {en:"Setting boundaries means saying no to protect your time and energy.", ipa:"", zh:"设定边界意味着说不来保护你的时间和精力。", tip:""},
   {en:"Exercise, sleep, and social connection are the three most effective things for mental health.", ipa:"", zh:"运动、睡眠和社交联系是对心理健康最有效的三件事。", tip:""},
   {en:"Therapy isn't just for crises. Many people see a therapist the way they'd see a coach.", ipa:"", zh:"心理治疗不只是给危机的。很多人看治疗师就像看教练。", tip:""},
   {en:"Cognitive behavioural therapy, or CBT, helps you notice and change unhelpful thought patterns.", ipa:"", zh:"认知行为疗法（CBT）帮你注意并改变无益的思维模式。", tip:"加拿大最常见、保险最常覆盖的疗法。"}]}],
  drills:[["anxious, frustrated, overwhelmed, relieved, content, grateful","情绪词"],["Emotions are signals, not instructions.","信号"],["The Big Five: openness, conscientiousness, extraversion, agreeableness, neuroticism","大五"],["I'm more of an introvert. I recharge by being alone.","内向"],["Burnout is chronic workplace stress: exhaustion, cynicism, and feeling ineffective.","倦怠"],["Setting boundaries means saying no to protect your time and energy.","边界"]],
  ex:[
   {t:"mc",q:"“overwhelmed” 是？",opts:["事情太多应付不来","非常开心","很生气","如释重负"],a:0},
   {t:"listen",q:"听一听，他在描述什么？",say:"I recharge by being alone.",opts:["内向者的充电方式","外向者","倦怠","焦虑"],a:0},
   {t:"mc",q:"大五人格里的 “conscientiousness” 是？",opts:["尽责性","开放性","外向性","神经质"],a:0},
   {t:"listen",q:"听一听，这是什么疗法？",say:"It helps you notice and change unhelpful thought patterns.",opts:["认知行为疗法","药物治疗","运动","冥想"],a:0},
   {t:"type",q:"翻译：我现在工作多到应付不来。（用 overwhelmed）",a:"I'm feeling overwhelmed with work right now.",alt:["I'm feeling overwhelmed with work right now","I am feeling overwhelmed with work right now.","I'm overwhelmed with work right now."]},
   {t:"type",q:"听写这个词（“韧性”）。",say:"resilience",a:"resilience"}],
  hw:[["情绪日记","三天内每天用英语写三个细分的情绪词描述当天（不用 happy/sad）。"],["描述自己","用大五人格的五个维度用英语描述自己，各一句。"],["聊一次","和一位朋友用英语聊一次压力和应对（What helps you when you're stressed?），用上 boundaries 或 recharge。"]]
},
{ id:"l24c3", lv:24, title:"社会学：社会、群体与不平等", goal:"掌握社会学的核心概念和英语（社会化、规范、阶层、不平等、文化），能用社会学视角讨论移民、家庭、工作等话题。",
  intro:"社会学研究<b>人在群体中怎么行为</b>——它解释了很多你作为移民观察到的现象：为什么加拿大人这样排队、为什么同事不谈工资、为什么第二代和父母不同。本章教<b>基本概念</b>（socialization、norms、roles、institutions）、<b>分层与不平等</b>（class、mobility、privilege）、<b>文化与身份</b>（assimilation vs integration），以及社会学的<b>说理方式</b>（structural vs individual）。",
  learn:[{h:"基本概念",p:"",items:[
   {en:"society, culture, norms, values, roles, institutions, socialization", ipa:"", zh:"社会、文化、规范、价值观、角色、制度、社会化", tip:"socialization = 学会社会规则的过程。"},
   {en:"Norms are the unwritten rules: how close to stand, when to say sorry, who pays.", ipa:"", zh:"规范是不成文的规则：站多近、什么时候说抱歉、谁付钱。", tip:"unwritten = 不成文的。"},
   {en:"Children are socialized through family, school, peers, and media.", ipa:"", zh:"孩子通过家庭、学校、同伴和媒体被社会化。", tip:"peers = 同伴。"},
   {en:"A role is a set of expectations attached to a position: parent, employee, customer.", ipa:"", zh:"角色是附着在某个位置上的一组期望：父母、员工、顾客。", tip:""},
   {en:"Institutions like the family, education, and the law shape behaviour across generations.", ipa:"", zh:"家庭、教育和法律等制度跨代塑造行为。", tip:""},
   {en:"The sociological imagination: seeing personal problems as connected to larger social patterns.", ipa:"", zh:"社会学的想象力：把个人问题看作与更大的社会模式相连。", tip:"失业不只是个人的事，是经济结构的事。"}]},
   {h:"分层与不平等",p:"",items:[
   {en:"social class, inequality, social mobility, privilege, discrimination", ipa:"", zh:"社会阶层、不平等、社会流动、特权、歧视", tip:"privilege 读 PRIV-i-lij。"},
   {en:"Social mobility is the ability to move up or down the class ladder. Canada's is higher than the US's.", ipa:"", zh:"社会流动是在阶层阶梯上上下移动的能力。加拿大的比美国高。", tip:""},
   {en:"Income inequality has grown: the top one percent now earns a much larger share than in 1980.", ipa:"", zh:"收入不平等加剧：前 1% 现在赚的份额比 1980 年大得多。", tip:""},
   {en:"Systemic discrimination is built into institutions, even without individual intent.", ipa:"", zh:"系统性歧视内嵌于制度中，即使没有个人意图。", tip:"systemic 读 sis-TEM-ik。"},
   {en:"Newcomers often experience downward mobility at first: an engineer driving a taxi.", ipa:"", zh:"新移民常常一开始经历向下流动：工程师开出租车。", tip:""},
   {en:"Structural explanations look at systems; individual explanations look at choices. Usually it's both.", ipa:"", zh:"结构性解释看系统；个体性解释看选择。通常两者都有。", tip:""}]},
   {h:"文化与身份",p:"",items:[
   {en:"assimilation vs integration: giving up your culture vs keeping it while joining a new one", ipa:"", zh:"同化 vs 融合：放弃你的文化 vs 在加入新文化的同时保留它", tip:"加拿大官方政策是 integration。"},
   {en:"Second-generation immigrants often feel caught between two cultures.", ipa:"", zh:"第二代移民常常感觉夹在两种文化之间。", tip:"caught between = 夹在中间。"},
   {en:"Culture shock has stages: honeymoon, frustration, adjustment, acceptance.", ipa:"", zh:"文化冲击有阶段：蜜月期、挫折期、调整期、接受期。", tip:""},
   {en:"Identity is layered: I'm Chinese, Canadian, a mother, an engineer, and from Shanghai.", ipa:"", zh:"身份是多层的：我是中国人、加拿大人、母亲、工程师、上海人。", tip:"layered = 多层的。"},
   {en:"Stereotypes are oversimplified beliefs about a group. Even positive ones can harm.", ipa:"", zh:"刻板印象是对一个群体过于简化的信念。即使是正面的也会伤害。", tip:"“亚洲人数学好”也是刻板印象。"}]}],
  drills:[["society, culture, norms, values, roles, institutions, socialization","七个概念"],["Norms are the unwritten rules: how close to stand, when to say sorry, who pays.","规范"],["social class, inequality, social mobility, privilege, discrimination","不平等词"],["Newcomers often experience downward mobility at first: an engineer driving a taxi.","向下流动"],["assimilation versus integration: giving up your culture versus keeping it while joining a new one","同化 / 融合"],["Culture shock has stages: honeymoon, frustration, adjustment, acceptance.","文化冲击"]],
  ex:[
   {t:"mc",q:"“norms” 是？",opts:["不成文的社会规则","法律","价值观","角色"],a:0},
   {t:"listen",q:"听一听，这是什么概念？",say:"The ability to move up or down the class ladder.",opts:["社会流动","社会化","歧视","同化"],a:0},
   {t:"mc",q:"加拿大的官方多元文化政策更接近？",opts:["融合（integration）","同化（assimilation）","隔离","都不是"],a:0},
   {t:"listen",q:"听一听，这是文化冲击的哪个阶段？",say:"Everything is exciting and new.",opts:["蜜月期","挫折期","调整期","接受期"],a:0},
   {t:"type",q:"翻译：第二代移民常常感觉夹在两种文化之间。",a:"Second-generation immigrants often feel caught between two cultures.",alt:["Second-generation immigrants often feel caught between two cultures","second-generation immigrants often feel caught between two cultures","Second generation immigrants often feel caught between two cultures."]},
   {t:"type",q:"听写这个词（“特权”）。",say:"privilege",a:"privilege"}],
  hw:[["三条规范","用英语写下三条你在加拿大学到的不成文规范，和中国的对比。"],["你的阶段","用英语说出你现在处于文化冲击的哪个阶段，为什么。"],["一个结构性解释","选一个你遇到的问题（找工作难、房租高），用英语各给一个结构性和一个个体性解释。"]]
},
{ id:"l24c4", lv:24, title:"政治学与国际关系", goal:"掌握政治学的核心概念和英语（意识形态、政治光谱、民主制度、国际关系），能读懂政治分析，能比较加拿大与其他国家的制度。",
  intro:"第六级和第十二级学了加拿大的政府和政治<b>怎么运作</b>，这一章学<b>为什么</b>——政治学的概念：<b>意识形态</b>（liberalism、conservatism、socialism）、<b>政治光谱</b>（left、right、centre、populist）、<b>制度比较</b>（parliamentary vs presidential、federal vs unitary）、<b>国际关系</b>（sovereignty、alliance、NATO、trade war）。学会这些，你能读懂《经济学人》的政治版。",
  learn:[{h:"意识形态与光谱",p:"",items:[
   {en:"liberalism, conservatism, socialism, libertarianism, nationalism, populism", ipa:"", zh:"自由主义、保守主义、社会主义、自由意志主义、民族主义、民粹主义", tip:"populism 读 POP-yoo-lizm。"},
   {en:"The left generally favours a bigger role for government; the right favours markets and tradition.", ipa:"", zh:"左翼一般支持政府更大的作用；右翼支持市场和传统。", tip:"favours 加拿大拼法。"},
   {en:"Economic left-right and social liberal-conservative are two different axes.", ipa:"", zh:"经济上的左右和社会上的自由保守是两个不同的轴。", tip:"所以有人经济右社会左。"},
   {en:"Populists claim to speak for 'the people' against 'the elite'.", ipa:"", zh:"民粹主义者声称代表“人民”对抗“精英”。", tip:""},
   {en:"In Canada, 'liberal' is a party and an ideology. Don't confuse the two.", ipa:"", zh:"在加拿大，“liberal”既是一个党也是一种意识形态。别混淆。", tip:"大写 Liberal 是党。"}]},
   {h:"制度比较",p:"",items:[
   {en:"democracy, authoritarianism, constitution, rule of law, separation of powers", ipa:"", zh:"民主、威权主义、宪法、法治、三权分立", tip:"authoritarianism 读 aw-thor-i-TAIR-ee-an-izm。"},
   {en:"Canada has a parliamentary system: the prime minister comes from the legislature. The US has a presidential system: the president is elected separately.", ipa:"", zh:"加拿大是议会制：总理来自立法机关。美国是总统制：总统单独选举。", tip:"legislature 读 LEJ-is-lay-cher。"},
   {en:"First-past-the-post: the candidate with the most votes wins, even without a majority.", ipa:"", zh:"简单多数制：得票最多的候选人赢，即使没有过半。", tip:"加拿大和英美都用。"},
   {en:"Proportional representation gives parties seats in proportion to their votes.", ipa:"", zh:"比例代表制按得票比例给政党席位。", tip:"欧洲多数用。"},
   {en:"Federalism divides power between a national government and provinces or states.", ipa:"", zh:"联邦制在国家政府和省或州之间分权。", tip:""},
   {en:"An independent judiciary can strike down laws that violate the constitution.", ipa:"", zh:"独立的司法机关可以推翻违宪的法律。", tip:"strike down = 推翻。"}]},
   {h:"国际关系",p:"",items:[
   {en:"sovereignty, alliance, treaty, sanctions, diplomacy, foreign policy", ipa:"", zh:"主权、联盟、条约、制裁、外交、外交政策", tip:"sovereignty 读 SOV-rin-tee。"},
   {en:"Canada is a member of NATO, the G7, the Commonwealth, and the UN.", ipa:"", zh:"加拿大是北约、七国集团、英联邦和联合国的成员。", tip:""},
   {en:"The US is Canada's closest ally and largest trading partner, which gives it enormous influence.", ipa:"", zh:"美国是加拿大最亲密的盟友和最大贸易伙伴，这给了它巨大影响力。", tip:""},
   {en:"A trade war: countries raise tariffs on each other's goods in retaliation.", ipa:"", zh:"贸易战：国家互相提高对方商品的关税作为报复。", tip:"retaliation 读 ri-tal-ee-AY-shun。"},
   {en:"Soft power is influence through culture and values rather than force.", ipa:"", zh:"软实力是通过文化和价值观而非武力的影响力。", tip:""},
   {en:"Realists see international politics as a struggle for power; liberals emphasize cooperation and institutions.", ipa:"", zh:"现实主义者把国际政治看作权力斗争；自由主义者强调合作和制度。", tip:"国际关系的两大理论。"}]}],
  drills:[["liberalism, conservatism, socialism, nationalism, populism","五种主义"],["The left generally favours a bigger role for government; the right favours markets and tradition.","左右"],["Canada has a parliamentary system; the US has a presidential system.","制度"],["First-past-the-post: the candidate with the most votes wins, even without a majority.","选举制"],["sovereignty, alliance, treaty, sanctions, diplomacy","国际关系词"],["Soft power is influence through culture and values rather than force.","软实力"]],
  ex:[
   {t:"mc",q:"“populism” 是？",opts:["民粹主义：声称代表人民对抗精英","自由主义","保守主义","社会主义"],a:0},
   {t:"listen",q:"听一听，这是哪种制度？",say:"The prime minister comes from the legislature.",opts:["议会制","总统制","君主专制","比例代表制"],a:0},
   {t:"mc",q:"加拿大的选举制度是？",opts:["简单多数制（first-past-the-post）","比例代表制","两轮制","排序投票"],a:0},
   {t:"listen",q:"听一听，这是什么？",say:"Countries raise tariffs on each other's goods in retaliation.",opts:["贸易战","制裁","联盟","条约"],a:0},
   {t:"type",q:"翻译：独立的司法机关可以推翻违宪的法律。",a:"An independent judiciary can strike down laws that violate the constitution.",alt:["An independent judiciary can strike down laws that violate the constitution","an independent judiciary can strike down laws that violate the constitution","An independent judiciary can strike down unconstitutional laws."]},
   {t:"type",q:"听写这个词（“主权”）。",say:"sovereignty",a:"sovereignty"}],
  hw:[["定位","用英语说出你在经济和社会两个轴上的位置，各一句理由。"],["比较两国","用英语比较加拿大和中国（或任何国家）的三个制度差异。"],["读一篇","读一篇《经济学人》或 Foreign Affairs 的短文，用英语找出五个本章词汇并翻译标题。"]]
},
{ id:"l24c5", lv:24, title:"人类学与研究方法：文化、田野与怎么做研究", goal:"掌握人类学的核心概念和社会科学研究方法的英语（定性/定量、访谈、问卷、伦理），能设计一个小型调查。",
  intro:"人类学教你<b>像外星人一样看自己的文化</b>——这正是移民每天在做的事。本章前半讲<b>人类学概念</b>（culture、ethnography、cultural relativism、rituals），后半讲<b>社会科学研究方法</b>——所有社科课都要学：<b>定性 vs 定量</b>、<b>访谈和问卷</b>、<b>抽样</b>、<b>伦理</b>（consent、anonymity）。结业任务会用到：设计一个小调查。",
  learn:[{h:"人类学",p:"",items:[
   {en:"anthropology, ethnography, fieldwork, participant observation, ritual, kinship", ipa:"", zh:"人类学、民族志、田野工作、参与观察、仪式、亲属关系", tip:"ethnography 读 eth-NOG-ra-fee。"},
   {en:"Cultural relativism: understanding a practice by its own culture's standards, not yours.", ipa:"", zh:"文化相对主义：用一种实践自身文化的标准理解它，而不是你的。", tip:""},
   {en:"Ethnocentrism is judging other cultures by the standards of your own.", ipa:"", zh:"民族中心主义是用自己文化的标准评判其他文化。", tip:"ethnocentrism 读 eth-no-SEN-trizm。"},
   {en:"Rituals, from weddings to Monday meetings, create belonging and mark transitions.", ipa:"", zh:"仪式，从婚礼到周一例会，创造归属感并标记转变。", tip:"transitions = 转变。"},
   {en:"Making the familiar strange: ask why Canadians line up the way they do.", ipa:"", zh:"让熟悉的变陌生：问为什么加拿大人那样排队。", tip:"人类学的方法。"},
   {en:"Gift-giving creates obligation in every culture, but the rules differ: hongbao vs birthday presents.", ipa:"", zh:"送礼在每种文化里都创造义务，但规则不同：红包 vs 生日礼物。", tip:"obligation = 义务。"}]},
   {h:"研究方法",p:"",items:[
   {en:"qualitative vs quantitative: words and meanings vs numbers and measurements", ipa:"", zh:"定性 vs 定量：词语和意义 vs 数字和测量", tip:"qualitative 读 KWOL-i-tay-tiv。"},
   {en:"survey, interview, focus group, case study, experiment, observation", ipa:"", zh:"问卷、访谈、焦点小组、案例研究、实验、观察", tip:""},
   {en:"A representative sample reflects the population. A convenience sample is just whoever you could reach.", ipa:"", zh:"代表性样本反映总体。便利样本只是你能找到的人。", tip:""},
   {en:"Open-ended questions ('How do you feel about…?') give richer answers than yes/no questions.", ipa:"", zh:"开放式问题（“你对……怎么看？”）比是非题给出更丰富的答案。", tip:""},
   {en:"Avoid leading questions: 'Don't you think rent is too high?' pushes the answer.", ipa:"", zh:"避免引导性问题：“你不觉得房租太高吗？”在推动答案。", tip:"leading = 引导性的。"},
   {en:"Reliability means consistent results; validity means measuring what you intended to.", ipa:"", zh:"信度指结果一致；效度指测量了你想测的。", tip:""}]},
   {h:"伦理",p:"",items:[
   {en:"informed consent, anonymity, confidentiality, ethics review", ipa:"", zh:"知情同意、匿名、保密、伦理审查", tip:"anonymity 读 an-o-NIM-i-tee。"},
   {en:"Participants must know what the study is about and be free to leave at any time.", ipa:"", zh:"参与者必须知道研究是关于什么的，并可以随时退出。", tip:""},
   {en:"Your responses will be kept confidential and reported only in aggregate.", ipa:"", zh:"你的回答将保密，只以汇总形式报告。", tip:"in aggregate = 汇总。问卷开头的标准句。"},
   {en:"Would you be willing to take part in a short survey? It takes about five minutes.", ipa:"", zh:"你愿意参加一个简短的问卷吗？大约五分钟。", tip:"take part in = 参加。"}]}],
  drills:[["anthropology, ethnography, fieldwork, participant observation, ritual","人类学词"],["Cultural relativism: understanding a practice by its own culture's standards, not yours.","文化相对"],["qualitative versus quantitative: words and meanings versus numbers and measurements","定性定量"],["survey, interview, focus group, case study, experiment","方法"],["Avoid leading questions.","引导性"],["Would you be willing to take part in a short survey? Your responses will be kept confidential.","邀请"]],
  ex:[
   {t:"mc",q:"“ethnocentrism” 是？",opts:["用自己文化的标准评判其他文化","理解其他文化","研究民族","文化多元"],a:0},
   {t:"listen",q:"听一听，这是定性还是定量？",say:"We interviewed twelve newcomers about their experiences.",opts:["定性","定量","实验","问卷"],a:0},
   {t:"mc",q:"哪句是引导性问题？",opts:["Don't you think rent is too high?","How do you feel about rent?","What is your monthly rent?","Has your rent changed this year?"],a:0},
   {t:"listen",q:"听一听，这是什么伦理原则？",say:"Participants must be free to leave at any time.",opts:["知情同意与自愿","匿名","保密","代表性"],a:0},
   {t:"type",q:"翻译：你的回答将保密。",a:"Your responses will be kept confidential.",alt:["Your responses will be kept confidential","your responses will be kept confidential","Your answers will be kept confidential."]},
   {t:"type",q:"听写这个词（“问卷/调查”）。",say:"survey",a:"survey"}],
  hw:[["让熟悉的变陌生","像人类学家一样观察一个加拿大日常场景（Tim Hortons 排队、公交上车），用英语写五句观察。"],["写五个问题","为一个你感兴趣的话题写五个非引导性的英语问卷问题（至少两个开放式）。"],["小访谈","用英语访谈一个人 10 分钟（关于他来加拿大的经历），只问开放式问题，记下三个发现。"]]
},
{ id:"l24c6", lv:24, title:"第二十四级结业：做一次小型社会调查并汇报", goal:"能设计、执行并用英语汇报一次小型社会调查（10 到 20 人）：问题、方法、发现、局限、意义。",
  intro:"结业任务：<b>做一次真实的小型调查并汇报</b>——问 10 到 20 个人一个你关心的社会问题（新移民找工作最大的困难？邻居对新公交线的看法？），用英语分析和汇报。本章教<b>研究问题的写法</b>、<b>数据的呈现</b>（百分比、引语）、<b>讨论局限</b>、<b>社科论文的常用句式</b>（findings suggest、consistent with、further research）和<b>汇报结构</b>。",
  learn:[{h:"研究问题与方法",p:"",items:[
   {en:"My research question is: What are the main barriers newcomers face when looking for their first job in Canada?", ipa:"", zh:"我的研究问题是：新移民在加拿大找第一份工作时面临的主要障碍是什么？", tip:"一句话，具体，可回答。"},
   {en:"I surveyed fifteen newcomers using a mix of closed and open-ended questions.", ipa:"", zh:"我用封闭式和开放式问题的组合调查了 15 位新移民。", tip:""},
   {en:"Participants were recruited through a community centre and a WeChat group.", ipa:"", zh:"参与者通过社区中心和一个微信群招募。", tip:"recruited = 招募。"},
   {en:"This is a convenience sample, so the results may not represent all newcomers.", ipa:"", zh:"这是便利样本，所以结果可能不代表所有新移民。", tip:"诚实地说局限。"}]},
   {h:"呈现发现",p:"",items:[
   {en:"The most common barrier, mentioned by eleven of fifteen participants, was the lack of Canadian experience.", ipa:"", zh:"最常见的障碍，15 人中 11 人提到，是缺乏加拿大经验。", tip:"mentioned by X of Y。"},
   {en:"Seventy-three percent said their credentials were not recognized.", ipa:"", zh:"73% 说他们的学历不被认可。", tip:""},
   {en:"As one participant put it, 'I had ten years of experience, but it was like starting from zero.'", ipa:"", zh:"正如一位参与者所说：“我有十年经验，但就像从零开始。”", tip:"As one participant put it = 引语的引入。"},
   {en:"Interestingly, those who had done volunteer work found jobs faster.", ipa:"", zh:"有意思的是，做过义工的人更快找到工作。", tip:""},
   {en:"These findings are consistent with previous research on immigrant employment.", ipa:"", zh:"这些发现与之前关于移民就业的研究一致。", tip:"consistent with = 一致。"},
   {en:"The findings suggest that networking matters more than credentials in the first year.", ipa:"", zh:"发现表明在第一年人脉比学历更重要。", tip:""}]},
   {h:"局限、意义与汇报",p:"",items:[
   {en:"Limitations: the sample was small and mostly from one city. Self-reported data may be biased.", ipa:"", zh:"局限：样本小，主要来自一个城市。自我报告的数据可能有偏。", tip:"self-reported = 自我报告。"},
   {en:"Implications: settlement agencies could focus more on networking and volunteer placements.", ipa:"", zh:"意义：安置机构可以更多关注人脉和义工安排。", tip:"implications = 对实践的意义。"},
   {en:"Further research with a larger, more diverse sample is needed.", ipa:"", zh:"需要更大、更多样化样本的进一步研究。", tip:""},
   {en:"Today I'll present a small survey I conducted on… I'll cover the question, the method, what I found, and what it means.", ipa:"", zh:"今天我来汇报我做的一个关于……的小调查。我会讲问题、方法、发现和意义。", tip:"汇报开场。"},
   {en:"I'd be interested to hear if this matches your own experience.", ipa:"", zh:"我很想听听这是否和你们自己的经历一致。", tip:"邀请讨论。"}]}],
  drills:[["My research question is: What are the main barriers newcomers face when looking for their first job in Canada?","研究问题"],["I surveyed fifteen newcomers using a mix of closed and open-ended questions.","方法"],["The most common barrier, mentioned by eleven of fifteen participants, was the lack of Canadian experience.","发现"],["As one participant put it, 'I had ten years of experience, but it was like starting from zero.'","引语"],["Limitations: the sample was small and mostly from one city.","局限"],["The findings suggest that networking matters more than credentials in the first year.","意义"]],
  ex:[
   {t:"mc",q:"好的研究问题应该？",opts:["具体、一句话、可以回答","越大越好","是一个是非题","没有答案"],a:0},
   {t:"listen",q:"听一听，这是汇报的哪部分？",say:"The sample was small and mostly from one city.",opts:["局限","发现","方法","意义"],a:0},
   {t:"mc",q:"“As one participant put it” 用来？",opts:["引入参与者的原话","总结","提出问题","说明方法"],a:0},
   {t:"listen",q:"听一听，比例是多少？",say:"Seventy-three percent said their credentials were not recognized.",opts:["73%","37%","17%","3%"],a:0},
   {t:"type",q:"翻译：这些发现与之前的研究一致。",a:"These findings are consistent with previous research.",alt:["These findings are consistent with previous research","these findings are consistent with previous research","The findings are consistent with previous research."]},
   {t:"type",q:"听写这个词（“意义/影响”，复数）。",say:"implications",a:"implications"}],
  hw:[["设计","用英语写出：研究问题、5 到 8 个问卷问题（含开放式）、招募方式、伦理说明。"],["执行","调查 10 到 20 人（微信群、邻居、同事都行），用英语记录数据和三条引语。"],["汇报（必做）","用英语做 5 分钟汇报（问题 → 方法 → 发现 → 局限 → 意义），对至少两个人，收集一条反馈。"]]

{ id:"l25c1", lv:25, title:"哲学入门：大问题、逻辑与论证", goal:"掌握哲学的基本领域和论证的英语（premise、conclusion、valid、fallacy），能读懂哲学入门文本，能构建和评价一个论证。",
  intro:"哲学的英语是<b>论证的英语</b>——这在任何辩论、文章、会议里都用得上。本章先介绍哲学的<b>四个大领域</b>（形而上学、认识论、伦理学、逻辑学）和它们的问题，然后重点教<b>论证的结构</b>（premises → conclusion）、<b>有效性与可靠性</b>、<b>常见逻辑谬误</b>（straw man、ad hominem、slippery slope）。学会了，你能听出别人的论证哪里不对，也能把自己的理由说得清楚。",
  learn:[{h:"四个领域",p:"",items:[
   {en:"metaphysics: What is real? What is the mind? Do we have free will?", ipa:"", zh:"形而上学：什么是真实的？心灵是什么？我们有自由意志吗？", tip:"metaphysics 读 met-a-FIZ-iks。"},
   {en:"epistemology: What is knowledge? How do we know what we know?", ipa:"", zh:"认识论：什么是知识？我们怎么知道我们知道的？", tip:"epistemology 读 e-pis-te-MOL-o-jee。"},
   {en:"ethics: What is right? What makes a good life?", ipa:"", zh:"伦理学：什么是对的？什么造就好的生活？", tip:""},
   {en:"logic: What makes an argument good or bad?", ipa:"", zh:"逻辑学：什么让一个论证好或坏？", tip:""},
   {en:"Philosophy doesn't give final answers. It teaches you to ask better questions and examine your assumptions.", ipa:"", zh:"哲学不给最终答案。它教你问更好的问题，检视你的假设。", tip:"assumptions = 假设、前提。"}]},
   {h:"论证的结构",p:"",items:[
   {en:"premise, conclusion, argument, valid, sound, assumption", ipa:"", zh:"前提、结论、论证、有效的、可靠的、假设", tip:"premise 读 PREM-is。"},
   {en:"Premise one: All humans are mortal. Premise two: Socrates is human. Conclusion: Therefore, Socrates is mortal.", ipa:"", zh:"前提一：所有人都会死。前提二：苏格拉底是人。结论：因此苏格拉底会死。", tip:"经典三段论。"},
   {en:"An argument is valid if the conclusion follows from the premises. It's sound if it's valid and the premises are true.", ipa:"", zh:"如果结论从前提推出，论证是有效的。如果有效且前提为真，它是可靠的。", tip:"follows from = 从……推出。"},
   {en:"I agree with your premise, but I don't think the conclusion follows.", ipa:"", zh:"我同意你的前提，但我不认为结论能推出来。", tip:"讨论里最有用的一句。"},
   {en:"What's the assumption behind that? / What would it take to change your mind?", ipa:"", zh:"那背后的假设是什么？/ 什么能改变你的想法？", tip:"两个哲学式的追问。"}]},
   {h:"逻辑谬误",p:"",items:[
   {en:"straw man: attacking a weaker version of the other person's argument", ipa:"", zh:"稻草人：攻击对方论证的一个弱化版本", tip:""},
   {en:"ad hominem: attacking the person instead of the argument", ipa:"", zh:"人身攻击：攻击人而不是论证", tip:"ad hominem 读 ad HOM-i-nem。"},
   {en:"slippery slope: claiming one step will inevitably lead to disaster", ipa:"", zh:"滑坡：声称一步必然导致灾难", tip:""},
   {en:"false dilemma: presenting only two options when there are more", ipa:"", zh:"假两难：只给两个选项，其实有更多", tip:""},
   {en:"appeal to authority: it's true because an expert said so", ipa:"", zh:"诉诸权威：因为专家这么说所以是真的", tip:"专家在自己领域有分量，但不是证明。"},
   {en:"That's a straw man. I never said we should ban all cars; I said we should add bike lanes.", ipa:"", zh:"那是稻草人。我从没说该禁所有汽车；我说该加自行车道。", tip:"指出谬误的说法。"}]}],
  drills:[["metaphysics, epistemology, ethics, logic","四个领域"],["premise, conclusion, argument, valid, sound","论证词"],["All humans are mortal. Socrates is human. Therefore, Socrates is mortal.","三段论"],["I agree with your premise, but I don't think the conclusion follows.","讨论"],["straw man, ad hominem, slippery slope, false dilemma","四个谬误"],["What's the assumption behind that? What would it take to change your mind?","追问"]],
  ex:[
   {t:"mc",q:"“epistemology” 研究？",opts:["知识是什么、我们怎么知道","什么是对的","什么是真实的","什么是美"],a:0},
   {t:"listen",q:"听一听，这是哪种谬误？",say:"Attacking the person instead of the argument.",opts:["人身攻击","稻草人","滑坡","假两难"],a:0},
   {t:"mc",q:"“sound” 的论证是？",opts:["有效且前提为真","只是有效","声音大的","有结论的"],a:0},
   {t:"listen",q:"听一听，说话者在做什么？",say:"I agree with your premise, but I don't think the conclusion follows.",opts:["接受前提，质疑推理","完全同意","完全反对","人身攻击"],a:0},
   {t:"type",q:"翻译：那背后的假设是什么？",a:"What's the assumption behind that?",alt:["What's the assumption behind that","What is the assumption behind that?","what's the assumption behind that"]},
   {t:"type",q:"听写这个词（“前提”）。",say:"premise",a:"premise"}],
  hw:[["写一个论证","用英语写一个你相信的观点的论证：两个前提 + 结论。检查是否 valid 和 sound。"],["找谬误","看一段英文辩论或评论（YouTube、社交媒体），用英语找出两个逻辑谬误。"],["追问一次","在一次讨论中用英语问一次 What's the assumption behind that?，记下对方的回答。"]]
},
{ id:"l25c2", lv:25, title:"伦理学与哲学家：怎么决定什么是对的", goal:"掌握主要伦理理论（功利主义、义务论、德性伦理）和几位哲学家的核心思想，能用英语讨论道德困境。",
  intro:"伦理学是哲学里<b>最实用</b>的部分：工作中的诚实、对父母的责任、AI 该不该有限制——都是伦理问题。本章教<b>三大理论</b>（后果 / 规则 / 品格）、<b>经典困境</b>（电车难题）、<b>几位哲学家</b>（苏格拉底、亚里士多德、康德、密尔、孔子——对，孔子也是哲学家，和亚里士多德很像），以及<b>讨论道德问题的句式</b>。",
  learn:[{h:"三大理论",p:"",items:[
   {en:"utilitarianism: the right action is the one that produces the greatest good for the greatest number", ipa:"", zh:"功利主义：正确的行为是为最多人带来最大好处的", tip:"utilitarianism 读 yoo-til-i-TAIR-ee-an-izm。密尔。"},
   {en:"deontology: some actions are right or wrong in themselves, regardless of consequences", ipa:"", zh:"义务论：有些行为本身就是对或错的，无论后果", tip:"deontology 读 dee-on-TOL-o-jee。康德。"},
   {en:"virtue ethics: focus on being a good person, not on rules or outcomes", ipa:"", zh:"德性伦理：关注做一个好人，而不是规则或结果", tip:"亚里士多德和孔子。"},
   {en:"The trolley problem: would you pull a lever to kill one person and save five?", ipa:"", zh:"电车难题：你会拉杆杀一个人救五个人吗？", tip:"最有名的思想实验。"},
   {en:"A utilitarian says pull it. A deontologist might say you can't use a person as a means.", ipa:"", zh:"功利主义者说拉。义务论者可能说你不能把人当作手段。", tip:"as a means = 作为手段。"},
   {en:"Most people's moral intuitions mix all three theories.", ipa:"", zh:"大多数人的道德直觉混合了三种理论。", tip:"intuitions = 直觉。"}]},
   {h:"哲学家",p:"",items:[
   {en:"Socrates: 'The unexamined life is not worth living.' He asked questions until people saw their own contradictions.", ipa:"", zh:"苏格拉底：“未经审视的人生不值得过。”他提问直到人们看到自己的矛盾。", tip:"Socratic method = 提问教学法。"},
   {en:"Aristotle: virtue is a habit, found in the mean between extremes. Courage lies between cowardice and recklessness.", ipa:"", zh:"亚里士多德：美德是习惯，在两个极端的中道。勇气在怯懦和鲁莽之间。", tip:"和孔子的“中庸”很像。"},
   {en:"Confucius: cultivate virtue through ritual, respect, and relationships. He and Aristotle would have agreed on a lot.", ipa:"", zh:"孔子：通过礼、敬和关系培养美德。他和亚里士多德会有很多共识。", tip:"介绍孔子是你的优势话题。"},
   {en:"Kant: act only on principles you could will to be universal laws. Don't lie, even to save a friend.", ipa:"", zh:"康德：只按你愿意成为普遍法则的原则行动。不说谎，即使为了救朋友。", tip:"Kant 读 /kɑːnt/。"},
   {en:"Mill: the only reason to limit someone's freedom is to prevent harm to others.", ipa:"", zh:"密尔：限制一个人自由的唯一理由是防止伤害他人。", tip:"harm principle，自由主义的基础。"},
   {en:"Descartes: 'I think, therefore I am.' The one thing you can't doubt is that you're doubting.", ipa:"", zh:"笛卡尔：“我思故我在。”你唯一不能怀疑的是你在怀疑。", tip:"Descartes 读 day-KART。"}]},
   {h:"讨论道德问题",p:"",items:[
   {en:"Is it ever okay to lie? What if it protects someone?", ipa:"", zh:"说谎有时可以吗？如果它保护了某人呢？", tip:"What if = 如果……呢？"},
   {en:"From a utilitarian point of view, the outcome matters most.", ipa:"", zh:"从功利主义的角度，结果最重要。", tip:"From a… point of view。"},
   {en:"I see the appeal of that view, but it has a troubling implication: …", ipa:"", zh:"我明白那个观点的吸引力，但它有一个令人不安的推论：……", tip:"troubling = 令人不安。"},
   {en:"Where do you draw the line?", ipa:"", zh:"你在哪里划界线？", tip:"伦理讨论的核心问题。"},
   {en:"I don't think there's a clean answer, but here's where I land.", ipa:"", zh:"我不认为有干净的答案，但这是我的落脚点。", tip:"where I land = 我的立场。"}]}],
  drills:[["utilitarianism, deontology, virtue ethics","三大理论"],["The trolley problem: would you pull a lever to kill one person and save five?","电车难题"],["Socrates: 'The unexamined life is not worth living.'","苏格拉底"],["Aristotle: virtue is a habit, found in the mean between extremes.","亚里士多德"],["From a utilitarian point of view, the outcome matters most.","讨论"],["Where do you draw the line? I don't think there's a clean answer, but here's where I land.","立场"]],
  ex:[
   {t:"mc",q:"“the greatest good for the greatest number” 是哪种理论？",opts:["功利主义","义务论","德性伦理","存在主义"],a:0},
   {t:"listen",q:"听一听，这是谁的思想？",say:"Act only on principles you could will to be universal laws.",opts:["康德","密尔","亚里士多德","苏格拉底"],a:0},
   {t:"mc",q:"孔子的思想和哪位西方哲学家最接近？",opts:["亚里士多德（德性、中道）","康德","密尔","笛卡尔"],a:0},
   {t:"listen",q:"听一听，这是什么问题？",say:"Where do you draw the line?",opts:["你在哪里划界线","你在哪里画画","线在哪","你站在哪一边"],a:0},
   {t:"type",q:"翻译：我思故我在。",a:"I think, therefore I am.",alt:["I think, therefore I am","I think therefore I am.","i think, therefore i am"]},
   {t:"type",q:"听写这个词（“美德”）。",say:"virtue",a:"virtue"}],
  hw:[["电车难题","用英语写下你对电车难题的答案和理由，用一种理论的语言。"],["介绍孔子","用英语向一位加拿大朋友介绍孔子的一个思想，和亚里士多德比较。"],["一个困境","选一个真实的道德困境（工作、家庭），用三种理论各分析一句，说出 where you land。"]]
},
{ id:"l25c3", lv:25, title:"艺术史：怎么看一幅画", goal:"掌握艺术史的主要时期和风格的英语，能描述一幅画的构图、色彩和主题，能在美术馆和别人讨论。",
  intro:"多伦多的 AGO、渥太华的国家美术馆都是免费或便宜的好去处，但<b>站在画前不知道说什么</b>是常见的尴尬。本章教<b>看画的语言</b>（composition、perspective、brushwork、palette）、<b>主要时期</b>（文艺复兴到当代，每个一句话特征）、<b>加拿大的艺术</b>（七人画派、原住民艺术）和<b>讨论的句式</b>（What strikes me is…）。不用懂很多，会说几句就能享受。",
  learn:[{h:"看画的语言",p:"",items:[
   {en:"composition, perspective, foreground, background, focal point", ipa:"", zh:"构图、透视、前景、背景、焦点", tip:"focal point = 视线落的地方。"},
   {en:"palette, colour, contrast, light and shadow, brushwork, texture", ipa:"", zh:"色板、色彩、对比、光影、笔触、质感", tip:"palette 读 PAL-it。"},
   {en:"The artist uses warm colours in the foreground and cool colours in the distance.", ipa:"", zh:"艺术家在前景用暖色，远处用冷色。", tip:""},
   {en:"Your eye is drawn to the figure in the centre, lit from the left.", ipa:"", zh:"你的视线被中间从左边打光的人物吸引。", tip:"is drawn to = 被吸引。"},
   {en:"The loose brushwork gives it a sense of movement.", ipa:"", zh:"松散的笔触给它一种动感。", tip:""},
   {en:"portrait, landscape, still life, abstract, figurative", ipa:"", zh:"肖像、风景、静物、抽象、具象", tip:""}]},
   {h:"主要时期",p:"",items:[
   {en:"Renaissance: realism, perspective, and the human body. Leonardo, Michelangelo.", ipa:"", zh:"文艺复兴：写实、透视和人体。达·芬奇、米开朗基罗。", tip:"Renaissance 读 REN-a-sahns。"},
   {en:"Baroque: drama, movement, and strong contrasts of light. Rembrandt, Caravaggio.", ipa:"", zh:"巴洛克：戏剧性、动感和强烈的光影对比。伦勃朗、卡拉瓦乔。", tip:""},
   {en:"Impressionism: capturing light and the moment with visible brushstrokes. Monet, Renoir.", ipa:"", zh:"印象派：用可见的笔触捕捉光和瞬间。莫奈、雷诺阿。", tip:"Monet 读 mo-NAY。"},
   {en:"Modern art broke the rules: Picasso's cubism, Kandinsky's abstraction.", ipa:"", zh:"现代艺术打破规则：毕加索的立体主义、康定斯基的抽象。", tip:""},
   {en:"Contemporary art often asks questions rather than showing beauty. It can be installation, video, or performance.", ipa:"", zh:"当代艺术常常提出问题而不是展示美。它可以是装置、视频或行为。", tip:""},
   {en:"Chinese ink painting values empty space and the energy of the brush. Western viewers are often surprised by that.", ipa:"", zh:"中国水墨画重视留白和笔的气韵。西方观众常对此感到惊讶。", tip:"你可以介绍的话题。"}]},
   {h:"加拿大艺术与讨论",p:"",items:[
   {en:"The Group of Seven painted the Canadian wilderness in bold colours in the 1920s.", ipa:"", zh:"七人画派在 1920 年代用大胆的色彩画加拿大的荒野。", tip:"wilderness 读 WIL-der-ness。"},
   {en:"Tom Thomson's 'The Jack Pine' is one of the most famous Canadian paintings.", ipa:"", zh:"汤姆·汤姆森的《杰克松》是最著名的加拿大画作之一。", tip:""},
   {en:"Indigenous art, from Inuit carvings to Norval Morrisseau's paintings, is central to Canadian art today.", ipa:"", zh:"原住民艺术，从因纽特雕刻到莫里索的绘画，是今天加拿大艺术的核心。", tip:""},
   {en:"What strikes me about this piece is the use of colour.", ipa:"", zh:"这件作品让我印象深刻的是色彩的运用。", tip:"What strikes me is = 让我印象深刻的是。美术馆万能句。"},
   {en:"I'm not sure I get it, but I like how it makes me feel.", ipa:"", zh:"我不确定我懂了，但我喜欢它给我的感觉。", tip:"对当代艺术完全可以这么说。"},
   {en:"What do you think the artist was trying to say?", ipa:"", zh:"你觉得艺术家想表达什么？", tip:""}]}],
  drills:[["composition, perspective, foreground, background, focal point","构图词"],["Your eye is drawn to the figure in the centre, lit from the left.","描述"],["Renaissance, Baroque, Impressionism, Modern, Contemporary","五个时期"],["Impressionism: capturing light and the moment with visible brushstrokes.","印象派"],["The Group of Seven painted the Canadian wilderness in bold colours in the 1920s.","七人画派"],["What strikes me about this piece is the use of colour. What do you think the artist was trying to say?","美术馆"]],
  ex:[
   {t:"mc",q:"“focal point” 是？",opts:["画面中视线落的焦点","画框","背景","画家的签名"],a:0},
   {t:"listen",q:"听一听，这是哪个流派？",say:"Capturing light and the moment with visible brushstrokes.",opts:["印象派","文艺复兴","巴洛克","立体主义"],a:0},
   {t:"mc",q:"七人画派画的是？",opts:["加拿大的荒野风景","肖像","静物","抽象"],a:0},
   {t:"listen",q:"听一听，这句适合什么场合？",say:"I'm not sure I get it, but I like how it makes me feel.",opts:["看不太懂的当代艺术","经典肖像","买画","画画课"],a:0},
   {t:"type",q:"翻译：这件作品让我印象深刻的是色彩的运用。（用 strikes）",a:"What strikes me about this piece is the use of colour.",alt:["What strikes me about this piece is the use of colour","What strikes me about this piece is the use of color.","what strikes me about this piece is the use of colour"]},
   {t:"type",q:"听写这个词（“构图”）。",say:"composition",a:"composition"}],
  hw:[["描述一幅画","选一幅画（网上或家里），用英语描述：类型、构图、色彩、焦点、感觉。五句。"],["去美术馆","去一次美术馆（AGO 周三晚免费），对三幅画各说一句 What strikes me is…"],["介绍水墨","用英语向朋友介绍中国水墨画的一个特点（留白、气韵），对比一幅西方画。"]]
},
{ id:"l25c4", lv:25, title:"音乐与表演艺术", goal:"掌握音乐的基本英语（节奏、旋律、和声、流派、乐器），能讨论喜欢的音乐，能去音乐会和剧院并看懂节目单。",
  intro:"音乐是最容易聊的话题，也是加拿大文化的大部分（多伦多的音乐场景、Drake、Celine Dion、Leonard Cohen）。本章教<b>音乐的元素</b>（rhythm、melody、harmony、tempo）、<b>流派</b>（每个一句特征）、<b>乐器和表演</b>、<b>去音乐会和剧院</b>（节目单、座位、礼仪），以及<b>怎么说你喜欢或不喜欢一首歌</b>——而不只是 “It's good”。",
  learn:[{h:"音乐的元素",p:"",items:[
   {en:"rhythm, melody, harmony, tempo, beat, pitch, key", ipa:"", zh:"节奏、旋律、和声、速度、拍子、音高、调", tip:"rhythm 读 RITH-um。"},
   {en:"The melody is what you hum; the harmony is the chords underneath; the rhythm is what you tap your foot to.", ipa:"", zh:"旋律是你哼的；和声是下面的和弦；节奏是你跟着跺脚的。", tip:"hum = 哼。"},
   {en:"major keys sound bright and happy; minor keys sound sad or tense", ipa:"", zh:"大调听起来明亮快乐；小调听起来悲伤或紧张", tip:""},
   {en:"verse, chorus, bridge, hook, lyrics", ipa:"", zh:"主歌、副歌、桥段、记忆点、歌词", tip:"hook = 最抓耳的部分。"},
   {en:"It has a great hook, but the lyrics are kind of shallow.", ipa:"", zh:"它有很棒的记忆点，但歌词有点浅。", tip:"评价一首歌。"},
   {en:"This song builds slowly and then explodes in the chorus.", ipa:"", zh:"这首歌慢慢铺垫，然后在副歌爆发。", tip:"builds = 铺垫。"}]},
   {h:"流派与乐器",p:"",items:[
   {en:"classical, jazz, blues, rock, pop, hip-hop, country, folk, electronic", ipa:"", zh:"古典、爵士、布鲁斯、摇滚、流行、嘻哈、乡村、民谣、电子", tip:""},
   {en:"Jazz is built on improvisation: musicians make it up as they go.", ipa:"", zh:"爵士建立在即兴上：乐手边演边创作。", tip:"improvisation 读 im-prov-i-ZAY-shun。"},
   {en:"Hip-hop puts rhythm and words first. Drake, from Toronto, is one of its biggest stars.", ipa:"", zh:"嘻哈把节奏和词放在首位。来自多伦多的 Drake 是它最大的明星之一。", tip:""},
   {en:"piano, guitar, violin, cello, drums, trumpet, saxophone; strings, brass, woodwinds, percussion", ipa:"", zh:"钢琴、吉他、小提琴、大提琴、鼓、小号、萨克斯；弦乐、铜管、木管、打击乐", tip:"percussion 读 per-KUSH-un。"},
   {en:"The erhu is a two-stringed Chinese instrument. It sounds a bit like a violin, but more like a voice.", ipa:"", zh:"二胡是两根弦的中国乐器。有点像小提琴，但更像人声。", tip:"介绍中国乐器。"},
   {en:"Do you play anything? — I used to play piano as a kid. I'm pretty rusty.", ipa:"", zh:"你会什么乐器？——我小时候弹钢琴。现在很生疏了。", tip:"rusty = 生疏。"}]},
   {h:"音乐会与剧院",p:"",items:[
   {en:"concert, gig, recital, symphony, musical, play, opera, ballet", ipa:"", zh:"音乐会、演出（小型）、独奏会、交响乐、音乐剧、话剧、歌剧、芭蕾", tip:"gig = 小场地的演出。"},
   {en:"Two tickets for Saturday's show, please. What are the best seats still available?", ipa:"", zh:"请给我周六演出的两张票。还有什么最好的座位？", tip:""},
   {en:"orchestra, mezzanine, balcony; row F, seats 12 and 13", ipa:"", zh:"正厅、楼座、顶层楼座；F 排 12、13 座", tip:"orchestra 在剧院里指一楼正厅。"},
   {en:"The program has an intermission after the first act. Please silence your phones.", ipa:"", zh:"节目在第一幕后有中场休息。请手机静音。", tip:"intermission = 中场。"},
   {en:"That was incredible. The lead singer's voice gave me chills.", ipa:"", zh:"太棒了。主唱的声音让我起鸡皮疙瘩。", tip:"gave me chills = 让我起鸡皮疙瘩。"},
   {en:"Canadian musicians include Leonard Cohen, Joni Mitchell, Celine Dion, Shania Twain, and The Weeknd.", ipa:"", zh:"加拿大音乐人包括 Leonard Cohen、Joni Mitchell、Celine Dion、Shania Twain 和 The Weeknd。", tip:""}]}],
  drills:[["rhythm, melody, harmony, tempo, beat, pitch, key","七个元素"],["The melody is what you hum; the harmony is the chords underneath; the rhythm is what you tap your foot to.","三个定义"],["classical, jazz, blues, rock, pop, hip-hop, country, folk","流派"],["Jazz is built on improvisation: musicians make it up as they go.","爵士"],["Do you play anything? I used to play piano as a kid. I'm pretty rusty.","乐器"],["That was incredible. The lead singer's voice gave me chills.","音乐会后"]],
  ex:[
   {t:"mc",q:"“hook” 在歌里是？",opts:["最抓耳的记忆点","歌词","鼓点","乐器"],a:0},
   {t:"listen",q:"听一听，这是什么流派的特点？",say:"Musicians make it up as they go.",opts:["爵士（即兴）","古典","电子","乡村"],a:0},
   {t:"mc",q:"“I'm pretty rusty.” 意思是？",opts:["我很生疏了","我很棒","我很锈","我很累"],a:0},
   {t:"listen",q:"听一听，座位在哪？",say:"Row F, seats twelve and thirteen, in the orchestra.",opts:["正厅 F 排 12、13 座","楼座 F 排","顶层 12 排","乐队里"],a:0},
   {t:"type",q:"翻译：这首歌慢慢铺垫，然后在副歌爆发。",a:"This song builds slowly and then explodes in the chorus.",alt:["This song builds slowly and then explodes in the chorus","this song builds slowly and then explodes in the chorus","The song builds slowly and then explodes in the chorus."]},
   {t:"type",q:"听写这个词（“即兴”）。",say:"improvisation",a:"improvisation"}],
  hw:[["评三首歌","用英语各用三句评价三首你喜欢的歌（元素、流派、感觉），不用 good。"],["听一位加拿大音乐人","听 Leonard Cohen 或 Joni Mitchell 的一首歌，用英语说出歌词里你听懂的三句。"],["去一场","去一场音乐会、音乐剧或小型演出，用英语买票，之后用英语和同伴聊三句感受。"]]

{ id:"l25c5", lv:25, title:"文学与电影：读故事、看电影、写评论", goal:"掌握文学和电影分析的英语（情节、人物、主题、象征、镜头），能读英文小说和看英文电影后讨论，能写一篇短评。",
  intro:"读小说和看电影是<b>最愉快的英语学习方式</b>，也是和加拿大人深聊的入口（书友会、电影之夜）。本章教<b>故事的元素</b>（plot、character、setting、theme、point of view）、<b>文学手法</b>（symbol、metaphor、irony、foreshadowing）、<b>电影语言</b>（shot、cut、score、pacing）、<b>加拿大作家和电影</b>（Margaret Atwood、Alice Munro），以及<b>写短评的结构</b>。",
  learn:[{h:"故事的元素",p:"",items:[
   {en:"plot, character, setting, theme, point of view, conflict, climax, resolution", ipa:"", zh:"情节、人物、背景、主题、视角、冲突、高潮、结局", tip:"climax 读 KLY-max。"},
   {en:"The protagonist is the main character; the antagonist is the one who opposes them.", ipa:"", zh:"主角是主要人物；反派是与之对立的人。", tip:"protagonist 读 pro-TAG-o-nist。"},
   {en:"It's told in the first person, so we only know what the narrator knows.", ipa:"", zh:"它用第一人称讲述，所以我们只知道叙述者知道的。", tip:"narrator 读 NAIR-ay-ter。"},
   {en:"The theme is loss, but it's really about how people rebuild.", ipa:"", zh:"主题是失去，但它真正讲的是人们怎么重建。", tip:""},
   {en:"The character arc: she starts out selfish and learns to care for others.", ipa:"", zh:"人物弧线：她一开始自私，学会了关心他人。", tip:"arc = 弧线、变化。"}]},
   {h:"手法与电影语言",p:"",items:[
   {en:"symbol, metaphor, irony, foreshadowing, flashback, unreliable narrator", ipa:"", zh:"象征、隐喻、反讽、伏笔、闪回、不可靠的叙述者", tip:"foreshadowing = 提前暗示。"},
   {en:"The storm is a symbol of the family falling apart.", ipa:"", zh:"暴风雨是家庭分崩离析的象征。", tip:""},
   {en:"The irony is that he spends the whole book searching for something he already had.", ipa:"", zh:"反讽在于他整本书都在寻找他已经拥有的东西。", tip:""},
   {en:"close-up, wide shot, cut, long take, score, pacing, cinematography", ipa:"", zh:"特写、全景、剪辑、长镜头、配乐、节奏、摄影", tip:"cinematography 读 sin-e-ma-TOG-ra-fee。"},
   {en:"The pacing drags in the middle, but the last twenty minutes are gripping.", ipa:"", zh:"中间节奏拖沓，但最后 20 分钟扣人心弦。", tip:"drags = 拖沓；gripping = 扣人心弦。"},
   {en:"The score does a lot of the emotional work.", ipa:"", zh:"配乐承担了很多情感工作。", tip:""}]},
   {h:"加拿大作品与评论",p:"",items:[
   {en:"Margaret Atwood wrote 'The Handmaid's Tale'. Alice Munro won the Nobel Prize for her short stories.", ipa:"", zh:"玛格丽特·阿特伍德写了《使女的故事》。爱丽丝·门罗以短篇小说获诺贝尔奖。", tip:""},
   {en:"Canadian films are often quiet and character-driven. Try 'Women Talking' or anything by Denis Villeneuve.", ipa:"", zh:"加拿大电影常常安静、以人物驱动。试试《女人们的谈话》或维伦纽瓦的任何作品。", tip:"Villeneuve 导了《沙丘》。"},
   {en:"I'd give it four out of five. It's slow at first, but it stays with you.", ipa:"", zh:"我给四星（满分五）。开头慢，但余味悠长。", tip:"stays with you = 余味悠长。"},
   {en:"Without giving anything away, the ending recontextualizes the whole story.", ipa:"", zh:"不剧透的话，结局让整个故事有了新的意义。", tip:"without giving anything away = 不剧透。"},
   {en:"A short review: what it's about in one line, what works, what doesn't, who should see it.", ipa:"", zh:"短评：一句话讲什么、好在哪、差在哪、谁该看。", tip:"四部分。"},
   {en:"Would you like to join our book club? We meet once a month and the reading is about 200 pages.", ipa:"", zh:"你想加入我们的读书会吗？我们每月一次，读约 200 页。", tip:""}]}],
  drills:[["plot, character, setting, theme, point of view, conflict, climax","七个元素"],["The protagonist is the main character; the antagonist is the one who opposes them.","主角反派"],["symbol, metaphor, irony, foreshadowing, flashback","五个手法"],["The pacing drags in the middle, but the last twenty minutes are gripping.","节奏"],["I'd give it four out of five. It's slow at first, but it stays with you.","评分"],["Without giving anything away, the ending recontextualizes the whole story.","不剧透"]],
  ex:[
   {t:"mc",q:"“foreshadowing” 是？",opts:["伏笔、提前暗示","闪回","象征","反讽"],a:0},
   {t:"listen",q:"听一听，这是对什么的评价？",say:"The pacing drags in the middle.",opts:["节奏拖沓","演技好","配乐棒","结局意外"],a:0},
   {t:"mc",q:"“stays with you” 意思是？",opts:["余味悠长、让人难忘","留在你家","和你一起看","跟着你走"],a:0},
   {t:"listen",q:"听一听，这是什么意思？",say:"Without giving anything away, the ending is a surprise.",opts:["不剧透，结局很意外","免费赠送","结局没有惊喜","不想说"],a:0},
   {t:"type",q:"翻译：暴风雨是家庭分崩离析的象征。",a:"The storm is a symbol of the family falling apart.",alt:["The storm is a symbol of the family falling apart","the storm is a symbol of the family falling apart","The storm symbolizes the family falling apart."]},
   {t:"type",q:"听写这个词（“主角”）。",say:"protagonist",a:"protagonist"}],
  hw:[["写一篇短评","看一部英文电影，用四部分结构写一篇 100 词的英语短评。"],["读一个短篇","读一篇 Alice Munro 的短篇（或任何英文短篇），用英语说出：主角、冲突、主题、一个象征。"],["电影之夜","和朋友看一部电影，之后用英语讨论 15 分钟，用上 pacing、theme、What did you think of the ending?"]]
},
{ id:"l25c6", lv:25, title:"第二十五级结业：一场哲学对话与一件创作", goal:"能主持一场苏格拉底式的哲学对话（一个大问题，30 分钟），并用英语介绍一件自己的创作（照片、画、诗、歌、短文）。",
  intro:"结业任务两件：① <b>一场哲学对话</b>——选一个大问题（What makes a life good? Is it ever right to lie? Should AI have limits?），用苏格拉底的方式和两三个人聊 30 分钟；② <b>一件创作</b>——拍一组照片、画一幅画、写一首短诗或一篇短文，用英语向别人介绍它。本章教<b>主持哲学对话的语言</b>（提问、追问、总结分歧）和<b>艺术家谈论自己作品的语言</b>（artist statement）。",
  learn:[{h:"主持哲学对话",p:"",items:[
   {en:"Tonight's question is: What makes a life good? Let's start with what we mean by 'good'.", ipa:"", zh:"今晚的问题是：什么造就好的生活？我们先从“好”是什么意思开始。", tip:"先定义。"},
   {en:"Can you give an example? / What would be a counterexample?", ipa:"", zh:"能举个例子吗？/ 反例是什么？", tip:"counterexample = 反例。苏格拉底的工具。"},
   {en:"So you're saying pleasure is what matters. Does that mean a happy pig has a better life than an unhappy philosopher?", ipa:"", zh:"所以你是说快乐是最重要的。那意味着一头快乐的猪比一个不快乐的哲学家过得更好吗？", tip:"密尔的问题。用推论检验。"},
   {en:"Let's slow down. Are we talking about what feels good, or what is good?", ipa:"", zh:"我们慢一点。我们在谈感觉好的，还是真正好的？", tip:"区分概念。"},
   {en:"We've found two positions tonight: one says meaning, the other says happiness. Neither is obviously wrong.", ipa:"", zh:"今晚我们发现了两种立场：一种说意义，另一种说幸福。都不明显错。", tip:"总结分歧，不强求答案。"},
   {en:"I'll leave you with this: if you had to choose, which would you give up?", ipa:"", zh:"最后留一个问题：如果必须选，你会放弃哪个？", tip:""}]},
   {h:"谈自己的作品",p:"",items:[
   {en:"This is a series of photos I took of my street at six a.m. over one winter.", ipa:"", zh:"这是我一个冬天在早上六点拍的我家街道的一组照片。", tip:"是什么、怎么做的。"},
   {en:"I was interested in how the light changes, and how empty the city feels before it wakes up.", ipa:"", zh:"我感兴趣的是光怎么变化，以及城市醒来前感觉多空。", tip:"I was interested in = 创作动机。"},
   {en:"I chose black and white because colour was distracting from the shapes.", ipa:"", zh:"我选黑白是因为颜色会分散对形状的注意。", tip:"解释一个选择。"},
   {en:"The hardest part was getting up. The best part was the silence.", ipa:"", zh:"最难的是起床。最好的是寂静。", tip:"一点诚实和幽默。"},
   {en:"I don't think it's finished. I'd like to shoot the same street in summer.", ipa:"", zh:"我不觉得它完成了。我想夏天再拍同一条街。", tip:""},
   {en:"I'd love to hear what you see in it.", ipa:"", zh:"我很想听听你在里面看到了什么。", tip:"把解释权交给观众。"}]},
   {h:"回应别人的作品",p:"",items:[
   {en:"What drew you to this subject?", ipa:"", zh:"是什么让你被这个题材吸引？", tip:"drew = draw 的过去式，吸引。"},
   {en:"The second photo really stayed with me. There's something lonely about it.", ipa:"", zh:"第二张照片真的让我难忘。它有种孤独感。", tip:"具体 + 感受。"},
   {en:"I'd be curious to see what happens if you tried it in colour.", ipa:"", zh:"我很好奇如果你用彩色会怎样。", tip:"温和的建议。"},
   {en:"Thank you for sharing this. It took courage.", ipa:"", zh:"谢谢你分享这个。这需要勇气。", tip:""}]}],
  drills:[["Tonight's question is: What makes a life good? Let's start with what we mean by 'good'.","开场"],["Can you give an example? What would be a counterexample?","追问"],["Let's slow down. Are we talking about what feels good, or what is good?","区分"],["This is a series of photos I took of my street at six a.m. over one winter.","介绍作品"],["I chose black and white because colour was distracting from the shapes.","解释选择"],["What drew you to this subject? Thank you for sharing this. It took courage.","回应"]],
  ex:[
   {t:"mc",q:"苏格拉底式对话的开始应该？",opts:["先定义关键词","先说答案","先投票","先讲故事"],a:0},
   {t:"listen",q:"听一听，主持人在做什么？",say:"What would be a counterexample?",opts:["要求反例","总结","定义","结束"],a:0},
   {t:"mc",q:"介绍自己的作品时，“I was interested in…” 用来说？",opts:["创作动机","价格","技术","尺寸"],a:0},
   {t:"listen",q:"听一听，这是什么回应？",say:"The second photo really stayed with me. There's something lonely about it.",opts:["具体 + 感受的正面回应","批评","提问","拒绝"],a:0},
   {t:"type",q:"翻译：我很想听听你在里面看到了什么。",a:"I'd love to hear what you see in it.",alt:["I'd love to hear what you see in it","I would love to hear what you see in it.","i'd love to hear what you see in it"]},
   {t:"type",q:"听写这个词（“反例”）。",say:"counterexample",a:"counterexample"}],
  hw:[["哲学对话（必做）","选一个大问题，邀请两三个人，用英语主持 30 分钟苏格拉底式对话。记下两种立场和一个最好的反例。"],["创作一件","用一周做一件小创作：一组五张照片、一幅画、一首八行诗、或一篇 300 词短文。"],["介绍它（必做）","用英语向至少两个人介绍你的创作（是什么、动机、一个选择、最难的、下一步），然后问 What do you see in it?"]]
},
/* ===== 第二十六级 · 工程与计算机科学 Engineering & Computer Science ===== */
{ id:"l26c1", lv:26, title:"工程思维：设计流程、约束与权衡", goal:"掌握工程设计流程和工程师的英语（requirements、constraints、trade-offs、prototype、iterate），能描述一个工程问题的解决过程。",
  intro:"工程是<b>在约束下解决问题</b>：预算、时间、材料、安全。工程师的英语围绕<b>设计流程</b>（define → ideate → prototype → test → iterate）和<b>权衡</b>（stronger but heavier、cheaper but slower）。本章教这套流程的词汇、<b>工程的分支</b>（civil、mechanical、electrical、software……）、<b>读规格书</b>和<b>工程师怎么说话</b>（精确、量化、保守）。在加拿大做工程师需要 P.Eng 执照，本章也讲。",
  learn:[{h:"设计流程",p:"",items:[
   {en:"Define the problem. Identify requirements and constraints. Brainstorm solutions. Build a prototype. Test. Iterate.", ipa:"", zh:"定义问题。确定需求和约束。头脑风暴方案。做原型。测试。迭代。", tip:"iterate 读 IT-er-ate。"},
   {en:"Requirements are what it must do; constraints are the limits: budget, weight, time, safety codes.", ipa:"", zh:"需求是它必须做的；约束是限制：预算、重量、时间、安全规范。", tip:""},
   {en:"Every design is a trade-off. A stronger bridge costs more. A lighter car is less safe in a crash.", ipa:"", zh:"每个设计都是权衡。更强的桥更贵。更轻的车撞车时更不安全。", tip:""},
   {en:"We built a quick prototype to test the concept before committing to the full design.", ipa:"", zh:"我们做了一个快速原型，在投入完整设计前测试概念。", tip:"prototype 读 PRO-to-type。"},
   {en:"The first version failed under load, so we reinforced the joints and tested again.", ipa:"", zh:"第一版在负载下失败了，所以我们加固了接头再测。", tip:"under load = 在负载下。"},
   {en:"Good enough is often the goal. Over-engineering wastes money.", ipa:"", zh:"够用常常就是目标。过度设计浪费钱。", tip:""}]},
   {h:"分支与规格",p:"",items:[
   {en:"civil, mechanical, electrical, chemical, software, biomedical, environmental engineering", ipa:"", zh:"土木、机械、电气、化学、软件、生物医学、环境工程", tip:""},
   {en:"Civil engineers design bridges, roads, and water systems. Mechanical engineers design machines and engines.", ipa:"", zh:"土木工程师设计桥梁、道路和水系统。机械工程师设计机器和发动机。", tip:""},
   {en:"specification, tolerance, load, stress, strain, factor of safety", ipa:"", zh:"规格、公差、负载、应力、应变、安全系数", tip:"tolerance = 允许的误差。"},
   {en:"The beam must support a load of five kilonewtons with a factor of safety of two.", ipa:"", zh:"梁必须以 2 的安全系数支撑 5 千牛的负载。", tip:"factor of safety of two = 设计强度是需要的两倍。"},
   {en:"Tolerance: plus or minus 0.1 millimetres.", ipa:"", zh:"公差：正负 0.1 毫米。", tip:""},
   {en:"It must comply with the Ontario Building Code and CSA standards.", ipa:"", zh:"它必须符合安省建筑规范和 CSA 标准。", tip:"comply with = 符合。"}]},
   {h:"工程师怎么说话与执照",p:"",items:[
   {en:"Engineers quantify: not 'it's strong' but 'it holds 500 kilograms with a 20 percent margin'.", ipa:"", zh:"工程师量化：不说“它很强”，说“它能承重 500 公斤，余量 20%”。", tip:"margin = 余量。"},
   {en:"I'm not comfortable signing off on this without more testing.", ipa:"", zh:"没有更多测试我不放心签字。", tip:"sign off on = 签字批准。"},
   {en:"What's the failure mode? What happens if this part breaks?", ipa:"", zh:"失效模式是什么？这个零件坏了会怎样？", tip:"failure mode = 怎么坏。"},
   {en:"To practise as an engineer in Canada, you need a P.Eng licence from the provincial regulator.", ipa:"", zh:"在加拿大做执业工程师，你需要省监管机构的 P.Eng 执照。", tip:"安省是 PEO。"},
   {en:"Internationally trained engineers can have their credentials assessed and may need to write exams.", ipa:"", zh:"海外培训的工程师可以做学历评估，可能需要考试。", tip:"衔接第十六级。"},
   {en:"The iron ring is worn by Canadian engineers as a reminder of their responsibility.", ipa:"", zh:"加拿大工程师戴铁戒指，提醒他们的责任。", tip:"一个独特的加拿大传统。"}]}],
  drills:[["Define the problem. Identify requirements and constraints. Build a prototype. Test. Iterate.","流程"],["Every design is a trade-off. A stronger bridge costs more.","权衡"],["civil, mechanical, electrical, chemical, software, biomedical","分支"],["The beam must support a load of five kilonewtons with a factor of safety of two.","规格"],["What's the failure mode? What happens if this part breaks?","问题"],["To practise as an engineer in Canada, you need a P.Eng licence.","执照"]],
  ex:[
   {t:"mc",q:"“constraints” 是？",opts:["限制：预算、重量、时间等","需求","原型","测试"],a:0},
   {t:"listen",q:"听一听，发生了什么？",say:"The first version failed under load, so we reinforced the joints and tested again.",opts:["第一版负载失败，加固后重测","第一版成功","放弃了项目","换了材料"],a:0},
   {t:"mc",q:"“factor of safety of two” 意思是？",opts:["设计强度是需要的两倍","两个安全员","两次测试","安全系数 0.5"],a:0},

   {t:"type",q:"听写这个词（“原型”）。",say:"prototype",a:"prototype"}],
