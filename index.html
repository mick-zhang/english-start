<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>英语起步课堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed chapter rail on the left (stacks to a top strip on phones); lesson area with four study tabs; teacher drawer pinned bottom-right. */
:root{
  --bg:#f6f8f7; --panel:#ffffff; --fg:#17211f; --muted:#5d6b67; --line:#d9e1de;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dff1ec;
  --good:#1f8a4c; --good-soft:#dff5e7; --bad:#b4322d; --bad-soft:#fbe3e1; --warn:#9a6b00; --warn-soft:#fff3d6;
  --zh:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --en:"Lexend","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --panel:#172120; --fg:#e8eeec; --muted:#9db0aa; --line:#2b3a36;
  --accent:#4fc3a9; --accent-ink:#0b1715; --accent-soft:#163b33;
  --good:#5fd38a; --good-soft:#143826; --bad:#ff8a7f; --bad-soft:#4a1f1c; --warn:#f2c15c; --warn-soft:#3f3112; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --panel:#172120; --fg:#e8eeec; --muted:#9db0aa; --line:#2b3a36;
  --accent:#4fc3a9; --accent-ink:#0b1715; --accent-soft:#163b33;
  --good:#5fd38a; --good-soft:#143826; --bad:#ff8a7f; --bad-soft:#4a1f1c; --warn:#f2c15c; --warn-soft:#3f3112; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--zh);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-family:var(--en)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);background:var(--panel);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.brand h1{font-size:20px;margin:0;font-weight:700}
.brand .en{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.prog{font-size:13px;color:var(--muted);margin-bottom:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.lvl{margin-top:14px}
.lvl h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.chap{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--fg);padding:8px 8px;border-radius:8px;text-align:left;line-height:1.3}
.chap:hover{background:var(--accent-soft)}
.chap[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.chap .n{font-family:var(--en);font-size:12px;width:22px;flex:none;opacity:.7;font-variant-numeric:tabular-nums}
.chap .t{font-size:14px;flex:1;min-width:0}
.chap .d{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;flex:none;opacity:.5}
.chap .d.done{background:currentColor;opacity:1}
.chap.locked{opacity:.5}
.main{min-width:0;padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
.eyebrow{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.04em}
h2.title{font-size:28px;margin:4px 0 8px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.goal{color:var(--muted);margin:0 0 18px;max-width:65ch}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.sec{margin-bottom:28px}
.sec h3{font-size:18px;margin:0 0 6px}
.sec p.note{color:var(--muted);margin:0 0 12px;max-width:65ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.items{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.item .w{font-family:var(--en);font-size:22px;font-weight:600;line-height:1.2}
.item .ipa{font-family:var(--en);color:var(--muted);font-size:13px}
.item .zh{font-size:15px}
.item .tip{grid-column:1/-1;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.item .btns{display:flex;flex-direction:column;gap:6px}
.ib{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap;min-height:34px}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:600}
.btn.sec2{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.callout{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.callout.warn{background:var(--warn-soft)}
.drill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.drill .en{font-size:24px;font-weight:600;line-height:1.3}
.drill .zh{color:var(--muted);margin-bottom:10px}
.result{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.result .heard{font-family:var(--en);font-size:18px;margin:4px 0}
.wd{display:inline-block;padding:0 4px;border-radius:4px;margin:2px 2px 2px 0;font-family:var(--en)}
.wd.ok{background:var(--good-soft);color:var(--good)}
.wd.no{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.score{font-weight:700}
.score.g{color:var(--good)} .score.b{color:var(--bad)} .score.w{color:var(--warn)}
.rec{display:inline-flex;align-items:center;gap:6px}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ex .q{font-weight:600;margin-bottom:8px}
.ex .q .en{font-size:20px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.ex input[type=text]{font-family:var(--en);font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:min(100%,320px)}
.fb{margin-top:8px;font-size:14px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.hw{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hw li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.hw input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.hw .k{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}
.teach{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20}
.teach .open{border-radius:999px;padding:12px 18px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center}
.panel{display:none;width:min(420px,calc(100vw - 32px));height:min(560px,calc(100vh - 100px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);flex-direction:column;overflow:hidden}
.panel.on{display:flex}
.panel header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--accent);color:var(--accent-ink)}
.panel header b{font-size:15px}
.panel header button{background:none;border:0;color:inherit;font-size:20px;line-height:1}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:90%;padding:8px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg .say{display:inline-block;margin-top:6px}
.compose{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.compose textarea{flex:1;resize:none;height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--fg);font-family:inherit;font-size:14px;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}
.quick button{font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:3px 10px}
.home .levels{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:14px}
.home .lv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.home .lv b{font-size:17px}
.home .lv .en{color:var(--muted);font-size:13px}
.home .lv ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.home .lv.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lvsec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.lvsec.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lvsec summary{cursor:pointer;list-style:none}
.lvsec summary::-webkit-details-marker{display:none}
.lvsec .lvhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lvsec .lvhead b{font-size:17px}
.lvsec .pts{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px;columns:2;column-gap:18px}
@media (max-width:600px){.lvsec .pts{columns:1}}
.lvsec summary::after{content:"展开章节 ▾";display:block;font-size:12px;color:var(--accent);margin-top:8px}
.lvsec[open] summary::after{content:"收起 ▴"}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:6px}
.ltr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ltr .l{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.ltr .l .big{font-family:var(--en);font-size:40px;font-weight:700;line-height:1}
.ltr .l .nm{font-size:13px;color:var(--muted);margin:4px 0}
.ltr .l .ex2{font-family:var(--en);font-size:14px}
.ltr .l .tp{font-size:12px;color:var(--muted);margin-top:4px;text-align:left}
.mouth{font-size:14px;background:var(--bg);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.speed{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.speed button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 10px;font-size:13px;min-height:34px}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* mascot face */
.face{display:inline-block;width:var(--fs,96px);height:var(--fs,96px);vertical-align:middle}
.face svg{width:100%;height:100%;overflow:visible}
.face .head{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.face .eye{fill:var(--fg);transform-origin:center;transform-box:fill-box;animation:blink 4.2s infinite}
.face .eye.r{animation-delay:.08s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.face .cheek{fill:#ff8fa3;opacity:.55;transition:opacity .3s}
.face .mouth{fill:none;stroke:var(--fg);stroke-width:3.5;stroke-linecap:round;transition:d .25s}
.face .tongue{fill:#ff8fa3;opacity:0}
.face .brow{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .2s}
.face .mouthOpen{fill:var(--fg);opacity:0;transform-origin:center;transform-box:fill-box}
.face .shine{fill:#fff;opacity:.9}
.face[data-mood="happy"] .mouth{d:path("M34 70 Q50 86 66 70")}
.face[data-mood="happy"] .cheek{opacity:.9}
.face[data-mood="think"] .mouth{d:path("M42 74 Q50 70 58 74")}
.face[data-mood="think"] .brow{opacity:1}
.face[data-mood="oops"] .mouth{d:path("M38 76 Q50 68 62 76")}
.face[data-mood="oops"] .cheek{opacity:.2}
.face[data-mood="wow"] .mouth{d:path("M42 70 Q50 84 58 70 Q50 64 42 70")}
.face.talking .mouth{opacity:0}
.face.talking .mouthOpen{opacity:1;animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.face.bounce{animation:bounce .6s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.face .wave{transform-origin:84px 90px;opacity:0}
.face.hello .wave{opacity:1;animation:wave 1.4s ease-in-out 2}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-25deg)}75%{transform:rotate(18deg)}}
@media (prefers-reduced-motion:reduce){.face .eye,.face.talking .mouthOpen,.face.bounce,.face.hello .wave{animation:none}.face.talking .mouthOpen{transform:scaleY(.6)}}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:8px 0 12px}
.who b{color:var(--fg);display:block;font-size:14px}
.who button{font-size:12px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:6px 10px;min-height:34px}
.who img{width:30px;height:30px;border-radius:50%}
/* login */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login[hidden]{display:none}
.login .box{max-width:440px;margin:0 auto;text-align:center}
.login h1{font-size:30px;margin:10px 0 4px}
.login .sub{color:var(--muted);margin:0 0 22px}
.login .card{text-align:left}
.login label{display:block;font-size:14px;margin:10px 0 4px;font-weight:600}
.login input{width:100%;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-family:var(--en)}
.login .err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.login .plist{display:grid;gap:8px;margin:10px 0}
.login .pbtn{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;text-align:left}
.login .pbtn:hover{border-color:var(--accent)}
.login .pbtn small{color:var(--muted)}
.login .fine{font-size:12px;color:var(--muted);margin-top:14px}
.ptrack{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 18px}
.ptrack .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ptrack .top b{color:var(--fg)}
.ptrack .bar{height:10px;margin-top:8px}
.ptrack .bar i{transition:width .5s}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.step{position:relative;border:0;background:var(--bg);border-radius:8px;padding:8px 6px;text-align:center;font-size:13px;color:var(--muted);border-top:4px solid var(--line);line-height:1.3;-webkit-tap-highlight-color:transparent}
.step.on{background:var(--accent);color:var(--accent-ink);border-top-color:var(--accent);font-weight:600}
.step.on small{color:inherit;opacity:.9}
.step .ok{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;font-size:11px;line-height:16px;font-weight:700}
.step.on .ok{background:#fff;color:var(--good)}
.step small{display:block;font-size:11px}
.topbar{display:none}
.scrim{display:none}
.closeMenu{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .closeMenu{display:flex}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .menu{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;width:40px;height:40px;font-size:20px;flex:none}
  .topbar .tt{flex:1;min-width:0;line-height:1.2}
  .topbar .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tt span{font-size:12px;color:var(--muted)}
  .topbar .mini{width:46px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:none}
  .topbar .mini i{display:block;height:100%;background:var(--accent)}
  .rail{position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);height:auto;z-index:31;border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  @media (prefers-reduced-motion:reduce){.rail,.scrim{transition:none}}
  .main{padding-block:16px 140px}
  h2.title{font-size:24px}
  .item .w{font-size:20px}
  .steps{grid-template-columns:repeat(2,1fr)}
  .teach{right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px))}
  .teach .open{padding:10px 16px;font-size:15px}
  .panel{position:fixed;inset:env(safe-area-inset-top,0px) 0 0 0;width:auto;height:auto;border-radius:0;border:0}
  .panel header{padding-top:12px}
  .compose{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .drill .en{font-size:21px}
  .ex .q .en{font-size:18px}
}
</style>

<div class="login" id="login">
  <div class="box">
    <div id="loginFace"></div>
    <h1>英语起步课堂</h1>
    <p class="sub">我是小英，你的英语老师。先登录，我才能记住你学到哪里了。</p>
    <div class="card" id="loginBody"></div>
    <p class="fine" id="loginFine"></p>
  </div>
</div>

<div class="scrim" id="scrim" onclick="toggleMenu(false)"></div>

const LETTERS = [
 ["A","apple","嘴张大，像说“诶”。字母名读“诶—”（ei），拉长。单词里常发 /æ/，嘴角向两边拉开，下巴往下，像被人捏住脸说“啊”。"],
 ["B","book","双唇先闭紧再放开，声带要震动。注意：字母名是“比—”，不是“波”。"],
 ["C","cat","字母名读“西—”。在单词里多数读 /k/（cat），在 e、i、y 前读 /s/（city）。"],
 ["D","dog","舌尖顶上牙龈后面，弹开，声带震动。字母名“低—”。"],
 ["E","egg","字母名“衣—”，嘴角用力向两边拉。单词里常读 /e/，嘴半开，像“哎”但更短。"],
 ["F","fish","上牙轻咬下唇，吹气。中文没有这个动作，一定要咬住下唇，不要读成“夫”。"],
 ["G","go","字母名“机—”（dʒiː）。单词里多读 /g/，喉咙发力，像“哥”但没有“e”的尾音。"],
 ["H","hat","字母名“诶吃”（eɪtʃ），很多人漏掉最后的“吃”。单词里读 /h/，轻轻呼气。"],
 ["I","ice","字母名“爱”。单词里常读 /ɪ/，短而轻，嘴不要太用力，像“衣”和“哎”之间。"],
 ["J","juice","字母名“杰—”（dʒeɪ）。舌面贴上颚，声带震动，像“ji”但有气流摩擦。"],
 ["K","key","字母名“剋—”（keɪ）。单词里读 /k/，送气要足。"],
 ["L","love","字母名“哎奥”（el）：先“哎”，再把舌尖顶到上牙后面。词尾的 l（如 ball）舌尖也要顶上去，不要读成“奥”。"],
 ["M","milk","字母名“哎姆”：先“哎”，再闭嘴发鼻音。闭嘴这一步不能漏。"],
 ["N","no","字母名“哎恩”：先“哎”，再舌尖顶上齿龈发鼻音，嘴不闭。"],
 ["O","open","字母名“欧—”（oʊ），嘴先圆后收小。单词里常读 /ɑ/（hot），嘴张大。"],
 ["P","pen","字母名“劈—”。双唇闭紧，用力爆破送气，手放嘴前能感到风。"],
 ["Q","queen","字母名“克优—”（kjuː）。单词里几乎总是 qu，读 /kw/。"],
 ["R","red","字母名“啊儿”（ɑːr）。发 r 时舌头往后卷，舌尖不碰任何地方，嘴唇略圆。和中文“日”不一样。"],
 ["S","sun","字母名“哎斯”：先“哎”，再吹气“斯”。"],
 ["T","tea","字母名“踢—”。舌尖顶上齿龈，爆破送气。"],
 ["U","up","字母名“优—”（juː）。单词里常读 /ʌ/（up, cup），嘴半开放松，像轻轻的“阿”。"],
 ["V","very","字母名“vi—”。和 F 动作一样：上牙咬下唇，但声带要震动。千万不要读成 W。"],
 ["W","water","字母名“打波油”（dʌbəl.juː），三个音节。单词里读 /w/，嘴唇先收圆再放开，像“乌”。"],
 ["X","box","字母名“哎克斯”（eks），三个声音都要发出来。"],
 ["Y","yes","字母名“歪”（waɪ）。单词开头读 /j/，像“衣”快速滑出去。"],
 ["Z","zoo","字母名“zi—”（ziː），像“兹”但声带震动、拉长。不是“zed”（那是英式读法，也对）。"]
];

{ id:"c1", title:"字母表 A–M：名字和声音", goal:"学会前 13 个字母的“名字”（拼读时用）和“声音”（读单词时用），把嘴型练对。",
  intro:"英语字母有两个身份：<b>名字</b>（比如 B 叫“比”）和<b>声音</b>（b 在 book 里发 /b/）。中国学习者最常见的问题，是把每个字母都加一个“e”的尾音（“波、哥、得”）。英语的辅音是干净的，后面没有元音。本章先把嘴型做对，再去记单词。",
  letters:[0,13],
  learn:[{h:"三个必须记住的嘴型",p:"下面三个动作中文里没有，先在镜子前做 10 次。",items:[

   {en:"L", ipa:"/l/", zh:"舌尖顶上牙后", tip:"舌尖顶住上门牙后面的牙龈，让声音从舌头两边出来。"},
   {en:"B / D / G", ipa:"/b/ /d/ /g/", zh:"没有尾音", tip:"读完立刻停，不要加“e”。对比：book 不是 “bu-ke”。"}]}],
  drills:[["A B C D E F G","字母名字（前七个）"],["H I J K L M","字母名字（后六个）"],["apple, book, cat","三个单词，注意 b 和 k 后面不加音"],["fish, go, hat","f 咬下唇，h 轻呼气"],["ice, juice, key, love, milk","l 舌尖顶上去，m 要闭嘴"]],

{ id:"c2", title:"字母表 N–Z：读完整个字母表", goal:"学完 26 个字母，能清楚地用英语拼出自己的名字、电话号码里的字母和常见缩写。",

{ id:"c4", title:"中国学习者的四大发音难点", goal:"攻克 th、词尾辅音、r 和 l、v 和 w 这四个最影响“别人能不能听懂你”的问题。",
  intro:"你说英语别人听不懂，80% 的原因在这四个地方。它们不难，但<b>中文里没有</b>，所以要用“动作”去练，而不是靠耳朵模仿。每个难点都给你一个“手的动作提醒”。",
  learn:[{h:"难点一：th（舌头要伸出来）",p:"手的提醒：用手指轻触上牙，舌尖要碰到手指。",items:[

   {en:"this, that, the, they", ipa:"/ð/", zh:"震动的 th", tip:"同样舌位，声带震动。the 是英语里最常用的词，必须读对。"}]},

   {en:"cold, world, friend", ipa:"", zh:"两个连在一起的辅音都要发", tip:"cold 的 l 和 d 都要有。慢慢读：col-d。"},
   {en:"books, cats, dogs", ipa:"/s/ /z/", zh:"复数的 s", tip:"books 读 /s/，dogs 读 /z/。先保证发出来。"}]},
   {h:"难点三：r 和 l",p:"手的提醒：说 r 时手掌向后弯（舌头后卷）；说 l 时手指向上点（舌尖顶上）。",items:[

{ id:"c5", title:"数字 0–20 与打招呼", goal:"能用英语数数、报电话号码，并和别人完整地打一次招呼。",
  intro:"从本章开始，你学的每一句话都要<b>当天用一次</b>。打招呼是最安全的练习：对方不会要求你说更多，但你已经开口了。数字则是报电话、问价格、说时间的基础，th 在 three 和 thirteen 里又出现了。",
  learn:[{h:"数字 0–10",p:"注意 three（th）、five（v）、seven 的两个音节。",items:[
   {en:"zero, one, two, three", ipa:"", zh:"0 1 2 3", tip:"three：舌尖出来。two 的 t 送气。"},
   {en:"four, five, six, seven", ipa:"", zh:"4 5 6 7", tip:"four 的 r 轻轻卷。five 结尾是 v，咬唇。"},
   {en:"eight, nine, ten", ipa:"", zh:"8 9 10", tip:"eight 结尾 t 要有，不是“诶”。"}]},
   {h:"数字 11–20",p:"13–19 结尾都是 -teen，重音在后面，拉长。",items:[
   {en:"eleven, twelve, thirteen, fourteen, fifteen", ipa:"", zh:"11–15", tip:"twelve 结尾 lv 两个辅音都要有。"},
   {en:"sixteen, seventeen, eighteen, nineteen, twenty", ipa:"", zh:"16–20", tip:"twenty 的 t 可以轻一些，但 n 要有。"}]},
   {h:"打招呼与告别",p:"这些句子今天就能用。",items:[
   {en:"Hello. / Hi.", ipa:"", zh:"你好。", tip:"Hello 重音在 lo。对陌生人用 Hello，对熟人用 Hi。"},
   {en:"Good morning. / Good afternoon. / Good evening.", ipa:"", zh:"早上好 / 下午好 / 晚上好", tip:"good 结尾 d 要发，不要读成“鼓”。"},
   {en:"How are you?", ipa:"", zh:"你好吗？", tip:"语调最后往上。"},
   {en:"I'm good, thank you. And you?", ipa:"", zh:"我很好，谢谢。你呢？", tip:"这是标准回答，背下来。"},
   {en:"Nice to meet you.", ipa:"", zh:"很高兴认识你。", tip:"第一次见面说。"},
   {en:"Goodbye. / Bye. / See you.", ipa:"", zh:"再见", tip:"see 要拉长，嘴角拉开。"}]}],
  drills:[["zero, one, two, three, four, five","数字 0–5"],["six, seven, eight, nine, ten","数字 6–10"],["eleven, twelve, thirteen, fourteen, fifteen","11–15"],["sixteen, seventeen, eighteen, nineteen, twenty","16–20"],["Hello. How are you?","打招呼，最后语调上扬"],["I'm good, thank you. And you?","标准回答"],["Nice to meet you. Goodbye.","见面与告别"]],
  ex:[
   {t:"listen",q:"听一听，是哪个数字？",say:"thirteen",opts:["3","13","30","14"],a:1},
   {t:"listen",q:"听一听，是哪个数字？",say:"five",opts:["4","5","9","15"],a:1},
   {t:"mc",q:"别人对你说 “How are you?”，最合适的回答是？",opts:["I'm good, thank you. And you?","Hello.","Goodbye.","Nice to meet you."],a:0},
   {t:"mc",q:"下午三点见到同事，应该说？",opts:["Good morning.","Good afternoon.","Good evening.","Good night."],a:1},
   {t:"type",q:"听写：写出阿拉伯数字。",say:"twelve",a:"12"},
   {t:"type",q:"听写这个单词（小写）。",say:"seven",a:"seven"}],
  hw:[["真人打招呼","今天对至少 2 个人用英语说 “Hello, how are you?”。对方可以是店员、同事、邻居、外卖员。记下他们怎么回答。"],["报号码","用英语把自己的手机号读 5 遍（一个数字一个数字读），然后读给家人听，看他们能不能记下来。"],["数台阶","走楼梯或散步时，用英语从 1 数到 20，来回 3 次。"]]
},
{ id:"c6", title:"自我介绍：I am / My name is", goal:"用 5 句话完整介绍自己：名字、来自哪里、做什么、住哪里、喜欢什么。",
  intro:"英语句子最重要的骨架是 <b>主语 + be 动词</b>：I am（我是）、You are（你是）、He/She is（他/她是）。中文说“我老师”也能懂，但英语一定要有 am/is/are。本章学完，你要能对一个陌生人做 30 秒自我介绍。",
  learn:[{h:"be 动词三兄弟",p:"am 只跟 I；is 跟 he/she/it 和单个人或物；are 跟 you/we/they。",items:[
   {en:"I am a student.", ipa:"", zh:"我是学生。", tip:"口语常缩成 I'm。a 读 /ə/，很轻。"},
   {en:"You are my friend.", ipa:"", zh:"你是我的朋友。", tip:"缩成 You're。friend 结尾 nd 都要发。"},
   {en:"She is a doctor. He is a driver.", ipa:"", zh:"她是医生。他是司机。", tip:"she 的 sh 嘴唇稍圆；he 的 h 轻呼气。"},
   {en:"We are from China.", ipa:"", zh:"我们来自中国。", tip:"China 重音在前：CHI-na。"}]},
   {h:"自我介绍五句话",p:"把空格换成你自己的信息，整段背下来。",items:[
   {en:"Hello, my name is Wang Li.", ipa:"", zh:"你好，我叫王丽。", tip:"名字可以按中文顺序说。"},
   {en:"I am from Beijing, China.", ipa:"", zh:"我来自中国北京。", tip:"from 的 fr：先咬唇 f，再卷舌 r。"},
   {en:"I am a nurse.", ipa:"", zh:"我是护士。", tip:"职业前面要加 a / an。"},
   {en:"I live in Toronto now.", ipa:"", zh:"我现在住在多伦多。", tip:"live 的 i 是短音，v 咬唇。"},
   {en:"I like cooking and music.", ipa:"", zh:"我喜欢做饭和音乐。", tip:"like 结尾 k 要发出来。"}]},
   {h:"常用职业词",p:"找到自己的那个，读 10 遍。",items:[
   {en:"teacher, student, nurse, doctor", ipa:"", zh:"老师、学生、护士、医生", tip:"teacher 结尾的 er 轻轻卷舌。"},
   {en:"driver, cook, worker, engineer", ipa:"", zh:"司机、厨师、工人、工程师", tip:"engineer 重音在最后：engi-NEER。"},
   {en:"I am retired. / I am a homemaker.", ipa:"", zh:"我退休了。/ 我是家庭主妇（夫）。", tip:"retired 结尾 d 别丢。"}]}],
  drills:[["I am a student. You are my friend.","be 动词"],["She is a doctor. He is a driver.","sh 和 h"],["Hello, my name is Wang Li.","换成你的名字"],["I am from Beijing, China.","fr 的连读"],["I live in Toronto now. I like cooking and music.","短音 i，词尾 k"],["Hello, my name is Li. I am from China. I am a cook. I live in Toronto. I like music.","完整自我介绍，一口气读完"]],
  ex:[
   {t:"mc",q:"选正确的 be 动词：I ___ a teacher.",opts:["am","is","are","be"],a:0},
   {t:"mc",q:"选正确的 be 动词：She ___ from Shanghai.",opts:["am","is","are","be"],a:1},
   {t:"mc",q:"选正确的 be 动词：We ___ friends.",opts:["am","is","are","be"],a:2},
   {t:"listen",q:"听一听，她是做什么的？",say:"She is a nurse.",opts:["护士","医生","老师","司机"],a:0},
   {t:"type",q:"把中文翻译成英语：我来自中国。（写完整句子）",a:"I am from China.",alt:["I'm from China.","I am from China"]},
   {t:"type",q:"听写这句话。",say:"I am a student.",a:"I am a student.",alt:["I'm a student.","I am a student"]}],
  hw:[["30 秒介绍","写下你的 5 句自我介绍（名字、来自哪、职业、住哪、喜欢什么），录一段 30 秒视频，看三遍，找出发音不清楚的词再练。"],["对真人说","找一个人（朋友、同事、语言交换伙伴，或者手机语音助手），完整说一遍自我介绍。对方听懂了几句？记下来。"],["问别人","用 “What is your name?” 和 “Where are you from?” 问一个人，听懂答案后用 “Nice to meet you.” 结束。"]]
},
{ id:"c7", title:"这是什么？This is / That is 与 a / an", goal:"能指着身边的东西说出名字，会用 a / an，会问 “What is this?”",
  intro:"学会问 “What is this?”（这是什么？），你就有了一个永远用不完的练习方法：走到哪里问到哪里。本章同时解决一个小规则：<b>a 和 an</b>——单词开头是元音音（a e i o u）就用 an。",
  learn:[{h:"this / that / it",p:"this 近，that 远，it 代替前面说过的东西。",items:[
   {en:"This is a pen.", ipa:"", zh:"这是一支笔。", tip:"this 的 th 震动，is 的 s 读 /z/。"},
   {en:"That is a car.", ipa:"", zh:"那是一辆车。", tip:"that 的 a 嘴扁。"},
   {en:"What is this? — It is a key.", ipa:"", zh:"这是什么？——是一把钥匙。", tip:"What is 常连读成 What's。"}]},
   {h:"a 还是 an？",p:"看开头的声音，不是字母：an hour（h 不发音）用 an。",items:[
   {en:"a book, a cup, a phone", ipa:"", zh:"辅音开头用 a", tip:"a 读得很轻，/ə/。"},
   {en:"an apple, an egg, an orange, an umbrella", ipa:"", zh:"元音开头用 an", tip:"an 和后面的词连起来读：a-napple。"}]},
   {h:"家里 12 件东西",p:"每样东西都指着说一遍。",items:[
   {en:"table, chair, bed, door", ipa:"", zh:"桌子、椅子、床、门", tip:"chair 的 ch 像“吃”，但送气更强。"},
   {en:"window, phone, cup, bowl", ipa:"", zh:"窗、手机、杯、碗", tip:"bowl 结尾的 l 要顶舌。"},
   {en:"key, bag, clock, light", ipa:"", zh:"钥匙、包、钟、灯", tip:"clock 和 light 的 l 位置不同（开头 vs 顶舌）。"}]}],
  drills:[["This is a pen. That is a car.","th 震动"],["What is this? It is a key.","问与答"],["a book, a cup, a phone","a 读轻"],["an apple, an egg, an orange","an 连读"],["table, chair, bed, door, window, phone","家具"],["This is a table. That is a window. This is an apple.","混合练"]],
  ex:[
   {t:"mc",q:"选 a 还是 an：___ egg",opts:["a","an"],a:1},
   {t:"mc",q:"选 a 还是 an：___ chair",opts:["a","an"],a:0},
   {t:"mc",q:"选 a 还是 an：___ umbrella",opts:["a","an"],a:1},
   {t:"listen",q:"听一听，他说的是什么东西？",say:"This is a clock.",opts:["钟","杯子","钥匙","手机"],a:0},
   {t:"type",q:"翻译：这是一个苹果。",a:"This is an apple.",alt:["This is an apple"]},
   {t:"type",q:"听写这句话。",say:"What is this?",a:"What is this?",alt:["What is this","What's this?","What's this"]}],
  hw:[["家里巡回","在家里走一圈，指着 15 样东西说 “This is a ___.” 不知道的词查一下，写在便利贴上贴在物品上。"],["问别人","对一个会英语的人，指着 3 样东西问 “What is this?”，听他们说，然后跟着重复一遍。"],["便利贴复习","3 天后，撕掉便利贴，再指着说一遍，看记住了几个。"]]
},
{ id:"c8", title:"我有 / 我要 / 我需要：I have, I want, I need", goal:"能说自己有什么、要什么、需要什么，并学会复数（一个 vs 多个）。",
  intro:"这三个动词几乎能覆盖日常生活的一半需求：<b>I have</b>（我有）、<b>I want</b>（我要）、<b>I need</b>（我需要）。加上否定 <b>don't</b>，你就能说“我不要”。复数的 <b>s</b> 是发音难点：books 的 s、dogs 的 z 都要发出来。",
  learn:[{h:"三个最有用的动词",p:"主语是 I / you / we / they 时，动词不变。",items:[
   {en:"I have a car.", ipa:"", zh:"我有一辆车。", tip:"have 结尾 v 咬唇。"},
   {en:"I want water.", ipa:"", zh:"我要水。", tip:"want 的 w 圆唇，结尾 t 轻但要有。"},
   {en:"I need help.", ipa:"", zh:"我需要帮助。", tip:"need 的 ee 拉长，d 结尾。这句紧急时能救命。"},
   {en:"I don't want it. / I don't need it.", ipa:"", zh:"我不要。/ 我不需要。", tip:"don't 的 t 可以不送气，但 n 要有。"}]},
   {h:"一个和多个",p:"多个东西，名词后面加 s；有些词特殊。",items:[
   {en:"one book — two books", ipa:"/s/", zh:"一本书——两本书", tip:"清辅音后 s 读 /s/。"},
   {en:"one dog — three dogs", ipa:"/z/", zh:"一只狗——三只狗", tip:"浊音后 s 读 /z/，声带震动。"},
   {en:"one bus — two buses", ipa:"/ɪz/", zh:"一辆公交——两辆", tip:"s/sh/ch 结尾加 -es，读 /ɪz/。"},
   {en:"one child — two children; one man — two men", ipa:"", zh:"一个孩子——两个孩子；一个男人——两个", tip:"特殊变化，直接记。"}]},
   {h:"用在真实场景",p:"这些句子今天就能用。",items:[
   {en:"I have two children.", ipa:"", zh:"我有两个孩子。", tip:"children 重音在 CHIL。"},
   {en:"I want a coffee, please.", ipa:"", zh:"我要一杯咖啡，谢谢。", tip:"加 please 更礼貌。"},
   {en:"I need a doctor.", ipa:"", zh:"我需要医生。", tip:"紧急句，读熟。"},
   {en:"Do you have a bag?", ipa:"", zh:"你们有袋子吗？", tip:"问句用 Do you have，语调上扬。"}]}],
  drills:[["I have a car. I want water. I need help.","三个动词"],["I don't want it. I don't need it.","否定"],["books, cats, cups","/s/ 结尾"],["dogs, pens, bags","/z/ 结尾"],["buses, boxes, watches","/ɪz/ 结尾"],["I have two children. I want a coffee, please.","真实句"],["Do you have a bag? Do you have water?","问句上扬"]],
  ex:[
   {t:"mc",q:"选正确的复数：one box — two ___",opts:["boxs","boxes","boxies","box"],a:1},
   {t:"mc",q:"选正确的复数：one child — two ___",opts:["childs","childrens","children","childes"],a:2},
   {t:"mc",q:"在咖啡店想要一杯茶，应该说？",opts:["I want a tea, please.","I have a tea.","I need a tea doctor.","Tea am I."],a:0},
   {t:"listen",q:"听一听，他有什么？",say:"I have three dogs.",opts:["三只狗","三本书","两只狗","一只狗"],a:0},
   {t:"type",q:"翻译：我需要帮助。",a:"I need help.",alt:["I need help"]},
   {t:"type",q:"听写这句话。",say:"I don't want it.",a:"I don't want it.",alt:["I don't want it","I do not want it.","I do not want it"]}],
  hw:[["点一次单","去咖啡店、奶茶店或快餐店，用 “I want a ___, please.” 点一次单。说完记下店员说了什么。"],["拒绝一次","当有人递给你传单或推销时，用 “No, thank you. I don't need it.” 回应一次。"],["数东西","在家里数 5 类东西，说出复数：“I have four chairs. I have two phones.” 注意 s 的发音。"]]
},
{ id:"c9", title:"问问题：What / Where / Who / How much", goal:"学会五个问句，能主动开口问信息，而不是只等别人问你。",
  intro:"能问问题，你就从“被动听”变成“主动用”。问句的结构很固定：<b>疑问词 + is/are + 东西</b>。问句结尾语调要<b>往下</b>（特殊疑问句）或<b>往上</b>（是不是问句）。本章的每个问句都是你在加拿大/美国生活真的会用到的。",
  learn:[{h:"五个疑问词",p:"记住中文意思和发音，尤其是 wh 开头都读 /w/（who 例外，读 /h/）。",items:[
   {en:"What", ipa:"/wʌt/", zh:"什么", tip:"w 圆唇。"},
   {en:"Where", ipa:"/wer/", zh:"哪里", tip:"结尾 r 卷舌。"},
   {en:"Who", ipa:"/huː/", zh:"谁", tip:"读“胡—”，不是“屋”。"},
   {en:"When", ipa:"/wen/", zh:"什么时候", tip:"结尾 n 舌尖顶上。"},
   {en:"How much", ipa:"/haʊ mʌtʃ/", zh:"多少钱", tip:"much 结尾 ch 像“吃”，要送气。"}]},
   {h:"生活中的问句",p:"问完要听答案，听不懂就说 “Sorry, again please?”",items:[
   {en:"What is your name?", ipa:"", zh:"你叫什么名字？", tip:"语调最后往下。"},
   {en:"Where is the bathroom?", ipa:"", zh:"洗手间在哪里？", tip:"bathroom 的 th 不震动，舌头出来。"},
   {en:"Who is he?", ipa:"", zh:"他是谁？", tip:"he 的 h 轻呼气。"},
   {en:"When is the bus?", ipa:"", zh:"公交什么时候来？", tip:"the 在辅音前读 /ðə/。"},
   {en:"How much is this?", ipa:"", zh:"这个多少钱？", tip:"商店最常用的一句。"},
   {en:"Sorry, again please? / Slowly, please.", ipa:"", zh:"抱歉，再说一遍？/ 请慢一点。", tip:"听不懂时不要装懂，用这两句。"}]}],
  drills:[["What, Where, Who, When, How much","五个疑问词"],["What is your name?","语调往下"],["Where is the bathroom?","th 舌头出来"],["How much is this?","ch 送气"],["Sorry, again please? Slowly, please.","听不懂时的救命句"],["Where is the bus? When is the bus? How much is the bus?","换疑问词练"]],
  ex:[
   {t:"mc",q:"想知道价格，用哪个？",opts:["How much","Where","Who","When"],a:0},
   {t:"mc",q:"想知道地点，用哪个？",opts:["What","Where","Who","How"],a:1},
   {t:"mc",q:"听不懂对方说话，最好说？",opts:["Sorry, again please?","Goodbye.","I am a student.","Yes."],a:0},
   {t:"listen",q:"听一听，他在问什么？",say:"Where is the bathroom?",opts:["洗手间在哪","几点了","多少钱","你叫什么"],a:0},
   {t:"type",q:"翻译：这个多少钱？",a:"How much is this?",alt:["How much is this","How much is it?","How much is it"]},
   {t:"type",q:"听写这句话。",say:"What is your name?",a:"What is your name?",alt:["What is your name","What's your name?","What's your name"]}],
  hw:[["问价格","去一家店，拿起一件东西问店员 “How much is this?”，听懂价格后说 “Thank you.”（不一定要买）。"],["问路","在商场或车站，问工作人员 “Where is the bathroom?” 或 “Where is the exit?”，按对方指的方向走。"],["问名字","认识一个新的人（哪怕是店员），问 “What is your name?”，然后说 “Nice to meet you, ___.”"]]
},
{ id:"c10", title:"购物与点餐", goal:"能独立完成一次买东西和一次点餐，包括问价、付款、说谢谢。",
  intro:"这是第一个“完整场景”章节：从进门到付款，全程英语。你已经有了所有零件（打招呼、I want、How much、数字），本章把它们<b>串成一次对话</b>。重点：说慢一点、说清楚，比说得快更重要。",
  learn:[{h:"点餐对话（咖啡店）",p:"A 是店员，B 是你。先听整段，再只读 B 的句子。",items:[
   {en:"A: Hi, what can I get you?", ipa:"", zh:"店员：你好，要点什么？", tip:"你只要听懂 “get you” 就知道该点单了。"},
   {en:"B: Can I have a small coffee, please?", ipa:"", zh:"你：请给我一杯小杯咖啡。", tip:"Can I have 比 I want 更礼貌，三个词连读：Ca-ni-have。"},
   {en:"A: Anything else?", ipa:"", zh:"店员：还要别的吗？", tip:"听到 else 就是在问“还要吗”。"},
   {en:"B: No, that's all. Thank you.", ipa:"", zh:"你：不要了，就这些，谢谢。", tip:"that's 的 ts 一起读。"},
   {en:"A: That's three fifty.", ipa:"", zh:"店员：3 块 5。", tip:"价格常省略 dollars：three fifty = $3.50。"},
   {en:"B: Here you go. / Card, please.", ipa:"", zh:"你：给你。/ 刷卡。", tip:"递钱或卡时说。"}]},
   {h:"购物常用句",p:"",items:[
   {en:"Excuse me, where is the milk?", ipa:"", zh:"打扰一下，牛奶在哪里？", tip:"Excuse me 是打断别人、求助的礼貌开头。"},
   {en:"Do you have this in large?", ipa:"", zh:"这个有大号的吗？", tip:"large 结尾 dʒ 要有摩擦。"},
   {en:"I'll take it.", ipa:"", zh:"我要了（买这个）。", tip:"I'll 的 l 顶舌。"},
   {en:"Just looking, thanks.", ipa:"", zh:"只是看看，谢谢。", tip:"店员问 Can I help you? 时用。"},
   {en:"Can I get a receipt?", ipa:"", zh:"可以给我收据吗？", tip:"receipt 的 p 不发音：re-SEAT。"}]},
   {h:"钱的说法",p:"",items:[

   {h:"问路句",p:"",items:[

{ id:"l2c1", lv:2, title:"长元音：sheep 还是 ship？", goal:"分清五个长元音和它们的短元音兄弟，不再把 sheep 说成 ship、把 full 说成 fool。",
  intro:"第一级学了五个<b>短</b>元音。英语里还有一组<b>长</b>元音，它们不只是“拖长一点”，<b>嘴型也不一样</b>。中国学习者最常见的错误是把长短混在一起：beach / bitch、sheet / shit——这几对混了会非常尴尬。本章的办法很简单：长元音<b>嘴更紧、拖两拍</b>，短元音<b>嘴放松、一拍就停</b>。",
  learn:[{h:"五对长短元音",p:"每一对先听，再模仿。手指在桌上打拍子：长音两拍，短音一拍。",items:[
   {en:"sheep / ship", ipa:"/iː/ /ɪ/", zh:"绵羊 / 船", tip:"sheep 嘴角往两边拉、像微笑、拖两拍；ship 嘴放松、一拍。"},
   {en:"food / foot", ipa:"/uː/ /ʊ/", zh:"食物 / 脚", tip:"food 嘴唇收得很圆很小、拖长；foot 嘴唇放松一点、短。"},
   {en:"car / cup", ipa:"/ɑː/ /ʌ/", zh:"车 / 杯子", tip:"car 嘴张大、舌头放低、拖长；cup 嘴张一半、短促。"},
   {en:"four / fox", ipa:"/ɔː/ /ɒ/", zh:"四 / 狐狸", tip:"four 嘴圆、拖长；fox 嘴张大、短。北美口音里 fox 更像 /ɑ/。"},
   {en:"bird / bed", ipa:"/ɜːr/ /e/", zh:"鸟 / 床", tip:"bird 舌头中间抬起、带 r、拖长，像“饿—尔”；bed 嘴型是短 e。"}]},
   {h:"用在句子里",p:"长音在句子里一样要拖够。",items:[
   {en:"I need a seat, please.", ipa:"", zh:"我需要一个座位。", tip:"need 和 seat 都是长 /iː/，拖够两拍。sit 是短音，意思变成“坐”。"},
   {en:"The food is good.", ipa:"", zh:"食物很好吃。", tip:"food 长 /uː/，good 短 /ʊ/，一句话里两种。"},
   {en:"My car is far.", ipa:"", zh:"我的车很远。", tip:"car、far 都是长 /ɑːr/，北美口音要带 r 的卷舌。"},
   {en:"The girl works first.", ipa:"", zh:"那个女孩先工作。", tip:"girl、work、first 都是 /ɜːr/：舌头中间抬起带 r。"}]}],
  drills:[["sheep, ship, sheep, ship","长短交替，两拍一拍"],["food, foot, food, foot","圆唇紧 / 松"],["car, cup, four, fox","张大拖长 / 短促"],["I need a seat, please.","两个长 /iː/"],["The girl works first.","三个 /ɜːr/"],["Please leave the keys here.","连续长音，嘴角一直拉开"]],
  ex:[
   {t:"listen",q:"听一听，你听到的是哪个词？",say:"ship",opts:["ship","sheep","shop","shape"],a:0},
   {t:"listen",q:"听一听，你听到的是哪个词？",say:"food",opts:["foot","food","fed","fit"],a:1},
   {t:"mc",q:"发长元音 /iː/（如 see）的时候，嘴型是？",opts:["嘴角往两边拉、像微笑","嘴唇收圆","嘴张大","嘴放松微开"],a:0},
   {t:"mc",q:"下面哪个词的元音是长音？",opts:["seat","sit","six","fish"],a:0},
   {t:"type",q:"听写这个词。",say:"first",a:"first"},
   {t:"type",q:"听写这句话。",say:"The food is good.",a:"The food is good.",alt:["The food is good","the food is good"]}],
  hw:[["最小对立词","把 sheep/ship、food/foot、car/cup 各读 10 遍录下来，回听时能不能自己分出长短。"],["生活找词","今天在包装、路牌、菜单上找出 5 个含长元音的英文词（如 TEA、ROAD、PARK），大声读出来，故意拖长。"],["真人测试","对一位会英语的人读 sheep 和 ship，不告诉对方顺序，问他听到的是哪个。两个都对才算过关。"]]
},
{ id:"l2c2", lv:2, title:"双元音、重音与连读", goal:"读准五个双元音，掌握多音节单词的重音，并把相邻的词自然地连起来说。",
  intro:"中国学习者说英语“听起来一个字一个字的”，原因有两个：<b>每个音节都一样重</b>，以及<b>词与词之间都断开</b>。英语是有节拍的：每个词只有一个音节最重，其余轻读；一个词的结尾辅音会<b>滑到下一个词的元音</b>上。本章先把双元音读“满”（嘴型要从一个滑到另一个），再练重音，再练连读。",
  learn:[{h:"五个双元音：嘴型要滑动",p:"双元音 = 两个元音滑在一起。中国学习者常常只读前一半。",items:[
   {en:"day, name, late", ipa:"/eɪ/", zh:"白天、名字、晚", tip:"从“诶”滑到“一”，嘴角越来越开。不要读成扁扁的“dε”。"},
   {en:"time, like, nice", ipa:"/aɪ/", zh:"时间、喜欢、好", tip:"从“啊”滑到“一”，嘴先张大再收。"},
   {en:"go, no, home", ipa:"/oʊ/", zh:"去、不、家", tip:"从“欧”滑到“乌”，嘴最后一定要收圆。不要读成“哦”。"},
   {en:"house, now, how", ipa:"/aʊ/", zh:"房子、现在、怎样", tip:"从“啊”滑到“乌”。"},
   {en:"boy, toy, enjoy", ipa:"/ɔɪ/", zh:"男孩、玩具、享受", tip:"从“奥”滑到“一”。"}]},
   {h:"重音：一个词只有一个“重拍”",p:"大写的音节重读：声音大一点、长一点、高一点。其他音节轻快带过。",items:[
   {en:"BAnana, toMAto, poTAto", ipa:"", zh:"香蕉、西红柿、土豆", tip:"中间那个音节重，前后都轻。中国学习者常把三个音节读得一样重。"},
   {en:"COffee, WAter, MOrning", ipa:"", zh:"咖啡、水、早上", tip:"两音节的名词多数重音在前面。"},
   {en:"REcord / reCORD", ipa:"", zh:"记录（名词）/ 录音（动词）", tip:"同一个词，重音换位置，意思和词性就变了。"},
   {en:"I'd like a baNAna and a toMAto, please.", ipa:"", zh:"我想要一根香蕉和一个西红柿。", tip:"整句里只有 baNAna、toMAto 的中间音节是重拍。"}]},
   {h:"连读：辅音 + 元音滑过去",p:"前一个词结尾是辅音、后一个词开头是元音，就连在一起读。",items:[
   {en:"an apple → a-napple", ipa:"", zh:"一个苹果", tip:"n 直接接 a，听起来像 “a napple”。"},
   {en:"Turn it off. → Tur-ni-toff.", ipa:"", zh:"把它关掉。", tip:"三个词连成一个。"},
   {en:"I like it a lot. → I li-ki-ta lot.", ipa:"", zh:"我很喜欢它。", tip:"k 接 i，t 接 a。"},
   {en:"Pick it up. → Pi-ki-tup.", ipa:"", zh:"把它拿起来。", tip:"这是最常见的三词连读之一。"}]}],
  drills:[["day, time, go, house, boy","五个双元音，嘴型要滑到位"],["banana, tomato, potato, coffee, water","重音在哪儿"],["an apple, an orange, an egg","n 连到元音"],["Turn it off. Pick it up.","三词连读"],["I like it a lot.","k 接 i，t 接 a"],["I'd like a banana and a coffee, please.","重音 + 连读一起用"]],
  ex:[
   {t:"listen",q:"听一听，这个词的重音在第几个音节？",say:"banana",opts:["第一个","第二个","第三个","都一样重"],a:1},
   {t:"listen",q:"听一听，你听到的是哪个词？",say:"home",opts:["home","ham","hum","him"],a:0},
   {t:"mc",q:"“an apple” 自然连读后听起来像？",opts:["a napple","an a-pple（中间停一下）","ana pple","ap-ple an"],a:0},
   {t:"mc",q:"读双元音 /oʊ/（如 go）时，最后嘴要？",opts:["收圆","张大","往两边拉","放松不动"],a:0},
   {t:"type",q:"听写这句话。",say:"Turn it off.",a:"Turn it off.",alt:["Turn it off","turn it off"]},
   {t:"type",q:"听写这个词。",say:"tomato",a:"tomato"}],
  hw:[["打拍子读词","找 10 个三音节的英文词（菜单、商品名都可以），每个词先拍出重音位置，再读出来。"],["连读录音","把 “Pick it up. Turn it off. I like it a lot.” 连读录下来，回听：三个词之间有没有断开？断开就重录。"],["真人任务","去店里用 “I'd like a ___, please.” 买一样东西，注意 I'd like 连读、商品名重音正确。"]]
},
{ id:"l2c3", lv:2, title:"正在做什么：现在进行时", goal:"能描述现在正在发生的事，会问 “What are you doing?” 并回答。",
  intro:"第一级的句子都是“是什么、有什么”。从本章开始学<b>动作</b>。英语说“正在做”要用 <b>be + 动词-ing</b>：I am eating（我在吃）。两个关键：① be 要跟人变化（I am / you are / he is）；② 动词后面加 -ing。中国学习者最常漏掉 be：说成 “I eating”——记住，<b>没有 am/is/are 的进行时是错的</b>。",
  learn:[{h:"be 的三种形式",p:"先把这三组背到不用想。",items:[
   {en:"I am → I'm", ipa:"", zh:"我是 / 我在", tip:"口语几乎总是缩成 I'm。"},
   {en:"You are → You're / We are → We're / They are → They're", ipa:"", zh:"你（们）、我们、他们", tip:"You're 和 your 读音一样。"},
   {en:"He is → He's / She is → She's / It is → It's", ipa:"", zh:"他、她、它", tip:"He's 结尾是 z 音。"}]},
   {h:"动词 + ing",p:"",items:[
   {en:"eat → eating, read → reading, work → working", ipa:"", zh:"吃、读、工作", tip:"直接加 -ing。-ing 的 g 不要读出来，鼻音收尾。"},
   {en:"make → making, write → writing, come → coming", ipa:"", zh:"做、写、来", tip:"结尾的 e 去掉再加 -ing。"},
   {en:"sit → sitting, run → running, shop → shopping", ipa:"", zh:"坐、跑、购物", tip:"短元音 + 一个辅音结尾：双写辅音。"}]},
   {h:"用起来",p:"",items:[
   {en:"I'm eating lunch.", ipa:"", zh:"我在吃午饭。", tip:"I'm 一定要说出来。"},
   {en:"What are you doing?", ipa:"", zh:"你在做什么？", tip:"口语里 What are you 连读成 “Wha-da-ya”。"},
   {en:"She's talking on the phone.", ipa:"", zh:"她在打电话。", tip:"talking on 连读：tal-kin-gon。"},
   {en:"They're waiting for the bus.", ipa:"", zh:"他们在等公交。", tip:"wait for = 等。"},
   {en:"I'm not working today.", ipa:"", zh:"我今天不上班。", tip:"否定：在 be 后面加 not。"},
   {en:"Are you coming? — Yes, I'm coming.", ipa:"", zh:"你来吗？——来，我来了。", tip:"问句把 Are 放前面。"}]}],
  drills:[["I'm eating lunch.","别漏 I'm"],["What are you doing?","Wha-da-ya"],["She's talking on the phone.","tal-kin-gon"],["They're waiting for the bus.","They're 一拍"],["I'm not working today.","not 清楚"],["Are you coming? Yes, I'm coming.","问答一起"]],
  ex:[
   {t:"mc",q:"哪一句是对的？",opts:["I am eating.","I eating.","I is eating.","Me eating."],a:0},
   {t:"mc",q:"“她在读书。” 英语是？",opts:["She's reading.","She reading.","She is read.","Her is reading."],a:0},
   {t:"listen",q:"听一听，他在做什么？",say:"I'm waiting for the bus.",opts:["等公交","吃午饭","打电话","工作"],a:0},
   {t:"mc",q:"run 加 -ing 是？",opts:["running","runing","runeing","runn"],a:0},
   {t:"type",q:"翻译：你在做什么？",a:"What are you doing?",alt:["What are you doing","what are you doing"]},
   {t:"type",q:"听写这句话。",say:"I'm not working today.",a:"I'm not working today.",alt:["I'm not working today","I am not working today.","I am not working today"]}],
  hw:[["实况解说","今天任选 3 分钟，把你看到的每个人正在做的事用英语小声说出来：He's walking. She's eating."],["视频通话","和家人视频时问一句 “What are you doing?”，听对方回答（中文也行），然后你用英语把它说出来。"],["发一条消息","给会英语的朋友发一条 “I'm ___ing now.” 的短信，说你现在在做什么。"]]
},
{ id:"l2c4", lv:2, title:"昨天发生了什么：过去时", goal:"能讲昨天做了什么，掌握常用动词的过去式和 -ed 的三种读音。",
  intro:"讲过去的事，英语动词要<b>变形</b>。规则动词加 <b>-ed</b>（work → worked），但有一批最常用的动词是<b>不规则</b>的（go → went，eat → ate），只能一个一个记。-ed 有<b>三种读音</b>，读错了别人也能懂，但读对了会立刻显得地道。另外，过去时的否定和问句都用 <b>did</b>，动词变回原形。",
  learn:[{h:"-ed 的三种读音",p:"",items:[
   {en:"worked, cooked, washed", ipa:"/t/", zh:"工作、做饭、洗", tip:"前面是清辅音（k、sh、p 等）：-ed 读 t，不加音节。"},
   {en:"played, called, cleaned", ipa:"/d/", zh:"玩、打电话、打扫", tip:"前面是元音或浊辅音：-ed 读 d，不加音节。"},
   {en:"wanted, needed, visited", ipa:"/ɪd/", zh:"想要、需要、拜访", tip:"前面是 t 或 d：-ed 读 “id”，多一个音节。"}]},
   {h:"十个最常用的不规则动词",p:"只能背。每天读一遍，一周就记住了。",items:[
   {en:"go → went, eat → ate, see → saw", ipa:"", zh:"去、吃、看见", tip:"went 结尾 t 要有。"},
   {en:"have → had, do → did, make → made", ipa:"", zh:"有、做、制作", tip:"made 是双元音 /eɪ/。"},
   {en:"buy → bought, take → took, come → came, get → got", ipa:"", zh:"买、拿、来、得到", tip:"bought 和 brought 只差一个 r。"}]},
   {h:"用起来",p:"",items:[
   {en:"Yesterday I went to work.", ipa:"", zh:"昨天我去上班了。", tip:"时间词常放句首。"},
   {en:"I cooked dinner and watched TV.", ipa:"", zh:"我做了晚饭，看了电视。", tip:"cooked 读 t 结尾，watched 也读 t。"},
   {en:"Did you sleep well?", ipa:"", zh:"你睡得好吗？", tip:"用 Did 问，sleep 用原形，不是 slept。"},
   {en:"I didn't go out last night.", ipa:"", zh:"我昨晚没出门。", tip:"didn't 后面动词原形。"},
   {en:"What did you do on the weekend?", ipa:"", zh:"你周末做了什么？", tip:"这是最常见的周一闲聊开场。"},
   {en:"It was great. / It was okay.", ipa:"", zh:"很棒。/ 还行。", tip:"is 的过去式是 was，are 的过去式是 were。"}]}],
  drills:[["worked, played, wanted","三种 -ed"],["went, ate, saw, had, did, made","不规则动词"],["Yesterday I went to work.","went 的 t"],["I cooked dinner and watched TV.","两个 t 结尾"],["Did you sleep well?","Did 开头，sleep 原形"],["What did you do on the weekend? It was great.","周一闲聊"]],
  ex:[
   {t:"listen",q:"听一听，-ed 读的是哪种音？",say:"wanted",opts:["/ɪd/（多一个音节）","/t/","/d/","没读出来"],a:0},
   {t:"mc",q:"go 的过去式是？",opts:["went","goed","gone","going"],a:0},
   {t:"mc",q:"“我昨天没去上班。” 哪句对？",opts:["I didn't go to work yesterday.","I didn't went to work yesterday.","I not go to work yesterday.","I don't went to work yesterday."],a:0},
   {t:"listen",q:"听一听，她昨天做了什么？",say:"I bought a new phone yesterday.",opts:["买了新手机","看了电视","去了上班","做了晚饭"],a:0},
   {t:"type",q:"翻译：你周末做了什么？",a:"What did you do on the weekend?",alt:["What did you do on the weekend","What did you do at the weekend?","What did you do this weekend?"]},
   {t:"type",q:"听写这句话。",say:"I cooked dinner.",a:"I cooked dinner.",alt:["I cooked dinner"]}],
  hw:[["昨日三句","每天睡前用英语说三句昨天做的事：Yesterday I ___ . 坚持一周。"],["周一闲聊","周一对同事或邻居问一句 “How was your weekend?” 并听对方回答。"],["-ed 分类","把本章 9 个 -ed 动词写在纸上，按 t / d / id 分成三列，读一遍。"]]
},
{ id:"l2c5", lv:2, title:"时间与日期", goal:"能问和说时间、星期、月份、日期，会约时间和确认时间。",
  intro:"时间是生活里<b>最容易出错、后果也最大</b>的信息：听错一个数字就会迟到或错过预约。本章把时间说法系统过一遍：整点、半点、分钟、上午下午；星期和月份的名字（注意重音）；日期要用<b>序数词</b>（first, second, third……）。最后学会约时间和确认时间的套路。",
  learn:[{h:"几点了",p:"北美口语最常用的说法：先说小时，再说分钟。",items:[
   {en:"What time is it? — It's three o'clock.", ipa:"", zh:"几点了？——三点整。", tip:"o'clock 只用在整点。"},
   {en:"It's three fifteen. / It's three thirty. / It's three forty-five.", ipa:"", zh:"三点十五 / 三点半 / 三点四十五", tip:"直接读两个数字，最简单也最通用。"},
   {en:"half past three / a quarter to four", ipa:"", zh:"三点半 / 差一刻四点", tip:"听得懂就行，自己说用数字法。"},
   {en:"7 a.m. / 7 p.m. / at noon / at midnight", ipa:"", zh:"早上 7 点 / 晚上 7 点 / 中午 / 午夜", tip:"a.m. 读 “ay-em”，p.m. 读 “pee-em”。"}]},
   {h:"星期与月份",p:"重音都在第一个音节。",items:[
   {en:"Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday", ipa:"", zh:"周一到周日", tip:"Wednesday 读 “WENZ-day”，d 不发音。Thursday 开头是 th。"},
   {en:"January, February, March, April, May, June", ipa:"", zh:"一月到六月", tip:"February 口语常读 “FEB-yoo-air-ee”。"},
   {en:"July, August, September, October, November, December", ipa:"", zh:"七月到十二月", tip:"July 重音在后：ju-LY。"}]},
   {h:"日期用序数词",p:"",items:[
   {en:"first, second, third, fourth, fifth", ipa:"", zh:"1 号到 5 号", tip:"fifth 两个 f 加 th，慢慢读。"},
   {en:"tenth, twentieth, twenty-first, thirtieth", ipa:"", zh:"10 号、20 号、21 号、30 号", tip:"-th 结尾舌尖伸到牙齿之间。"},
   {en:"My birthday is on March tenth.", ipa:"", zh:"我的生日是 3 月 10 日。", tip:"日期前用 on。"},
   {en:"See you on Friday at two thirty.", ipa:"", zh:"周五两点半见。", tip:"星期前 on，几点前 at。"},
   {en:"Can we meet on Tuesday morning?", ipa:"", zh:"我们能周二上午见吗？", tip:"约时间的万能句。"},
   {en:"Sorry, I'm not free then. How about Wednesday?", ipa:"", zh:"抱歉，那时候我没空。周三怎么样？", tip:"How about 提议另一个时间。"}]}],
  drills:[["It's three fifteen. It's three thirty.","数字法报时"],["Monday, Tuesday, Wednesday, Thursday, Friday","WENZ-day，Thurs 的 th"],["January, February, March, April","重音在前"],["first, second, third, fourth, fifth","th 结尾"],["My birthday is on March tenth.","on + 日期"],["Can we meet on Tuesday at ten? See you then.","约时间"]],
  ex:[
   {t:"listen",q:"听一听，几点？",say:"It's four forty-five.",opts:["4:45","4:15","5:45","4:40"],a:0},
   {t:"listen",q:"听一听，星期几？",say:"See you on Thursday.",opts:["周四","周二","周三","周六"],a:0},
   {t:"mc",q:"“3 月 3 日” 怎么说？",opts:["March third","March three","three March","March the three"],a:0},
   {t:"mc",q:"“周五两点” 用哪两个介词？",opts:["on Friday at two","at Friday on two","in Friday at two","on Friday in two"],a:0},
   {t:"type",q:"听写这个月份。",say:"February",a:"February"},
   {t:"type",q:"翻译：几点了？",a:"What time is it?",alt:["What time is it","what time is it"]}],
  hw:[["报时一天","今天每次看表，都用英语小声说出时间：It's ___ ."],["读日历","打开手机日历，把本周每一天的星期和日期用英语读出来（Monday, October first……）。"],["真实预约","用英语约一次时间：理发、看牙、和朋友吃饭都可以。至少用到 “Can we meet on ___ at ___?”。"]]
},
{ id:"l2c6", lv:2, title:"天气与家人：闲聊的两大话题", goal:"能聊天气和家人——这是加拿大人见面最常聊的两件事。",
  intro:"在北美，<b>天气</b>是和陌生人、同事、邻居打开话题的万能钥匙；<b>家人</b>是和熟人深聊的开始。这两个话题的句子都很简单，但要会<b>接话</b>：对方说 “Cold today, eh?”，你要能回一句，而不是只点头。本章学描述天气的形容词、家庭成员的叫法，以及几句接话的套路。",
  learn:[{h:"天气怎么说",p:"天气句子的主语都是 It。",items:[
   {en:"It's sunny. / It's cloudy. / It's windy.", ipa:"", zh:"晴 / 多云 / 有风", tip:"形容词结尾 -y 读短 i。"},
   {en:"It's raining. / It's snowing.", ipa:"", zh:"在下雨 / 在下雪", tip:"用进行时，因为正在下。"},
   {en:"It's cold. / It's freezing. / It's hot. / It's warm.", ipa:"", zh:"冷 / 冻死了 / 热 / 暖和", tip:"cold 结尾 ld 两个辅音都要有。"},
   {en:"It's minus ten today.", ipa:"", zh:"今天零下十度。", tip:"加拿大用摄氏度，minus = 零下。"},
   {en:"What's the weather like tomorrow?", ipa:"", zh:"明天天气怎么样？", tip:"问天气的标准句。"},
   {en:"Nice day, eh? — Yeah, finally!", ipa:"", zh:"天气不错啊？——是啊，终于！", tip:"eh 是加拿大人的口头语，相当于“是吧？”。"}]},
   {h:"家人",p:"",items:[
   {en:"mother / mom, father / dad, parents", ipa:"", zh:"妈妈、爸爸、父母", tip:"mom 在加拿大也常拼 mum。"},
   {en:"husband, wife, son, daughter", ipa:"", zh:"丈夫、妻子、儿子、女儿", tip:"daughter 的 gh 不发音：DAW-ter。"},
   {en:"brother, sister, grandmother, grandfather", ipa:"", zh:"兄弟、姐妹、奶奶/外婆、爷爷/外公", tip:"brother 开头 br 一起读，th 舌尖伸出。"},
   {en:"I have two kids: a son and a daughter.", ipa:"", zh:"我有两个孩子，一个儿子一个女儿。", tip:"kids 是 children 的口语说法。"},
   {en:"Do you have any brothers or sisters?", ipa:"", zh:"你有兄弟姐妹吗？", tip:"问家人最常用的一句。"},
   {en:"My parents live in China. I miss them.", ipa:"", zh:"我父母住在中国。我想他们。", tip:"miss 短 i，结尾 s 清楚。"}]}],
  drills:[["It's sunny. It's cloudy. It's windy.","三个 -y 结尾"],["It's cold. It's freezing.","ld 结尾"],["What's the weather like tomorrow?","问天气"],["Nice day, eh? Yeah, finally!","接话"],["I have two kids: a son and a daughter.","DAW-ter"],["My parents live in China. I miss them.","th 舌尖"]],
  ex:[
   {t:"listen",q:"听一听，天气怎么样？",say:"It's snowing and it's freezing.",opts:["下雪，很冷","下雨，很暖","晴天，很热","多云，有风"],a:0},
   {t:"mc",q:"邻居说 “Cold today, eh?”，最自然的回答是？",opts:["Yeah, it's freezing!","I am a student.","What time is it?","My name is Li."],a:0},
   {t:"listen",q:"听一听，他有几个孩子？",say:"I have three kids: two sons and a daughter.",opts:["三个","两个","一个","四个"],a:0},
   {t:"mc",q:"“女儿” 的英语发音是？",opts:["DAW-ter（gh 不发音）","DAUG-ter","DOG-ter","DA-ug-ter"],a:0},
   {t:"type",q:"翻译：明天天气怎么样？",a:"What's the weather like tomorrow?",alt:["What's the weather like tomorrow","What is the weather like tomorrow?","What is the weather like tomorrow"]},
   {t:"type",q:"听写这句话。",say:"It's raining.",a:"It's raining.",alt:["It's raining","It is raining.","It is raining"]}],
  hw:[["每日天气","早上出门前看一眼天气，用英语说一句：It's ___ today. 坚持一周。"],["搭一次话","在电梯、公交站或排队时，对一个陌生人说一句关于天气的话（Nice day, eh? / Cold today!），看对方怎么回。"],["介绍家人","对着一张全家照，用英语把每个人介绍一遍：This is my ___ . 录下来听。"]]
},
{ id:"l2c7", lv:2, title:"看病与打电话", goal:"能描述身体不舒服、预约医生，并能打一通简单的英语电话。",
  intro:"这两件事是新移民最怕的：看病说不清症状，打电话看不到对方的脸。办法是<b>把句子准备好</b>。身体不舒服只要三类句子：<b>I have a ___</b>（我有……）、<b>My ___ hurts</b>（我的……疼）、<b>I feel ___</b>（我觉得……）。打电话有固定套路：报名字、说目的、确认信息、道别。听不清就说 “Sorry, could you repeat that?”——这句话比什么都重要。",
  learn:[{h:"说症状",p:"",items:[
   {en:"I have a headache. / I have a fever. / I have a cough.", ipa:"", zh:"我头疼 / 发烧 / 咳嗽", tip:"headache 读 HED-ake，ache 是 /eɪk/。"},
   {en:"My stomach hurts. / My back hurts.", ipa:"", zh:"我肚子疼 / 背疼", tip:"stomach 读 STUM-ick，ch 读 k。"},
   {en:"I feel sick. / I feel dizzy. / I feel tired.", ipa:"", zh:"我难受 / 头晕 / 累", tip:"sick 短 i，结尾 k 停住。"},
   {en:"I've had it for three days.", ipa:"", zh:"已经三天了。", tip:"医生一定会问多久了，先准备好。"},
   {en:"I'm allergic to penicillin.", ipa:"", zh:"我对青霉素过敏。", tip:"allergic 重音在 LER。有过敏一定要会说。"},
   {en:"I'd like to make an appointment, please.", ipa:"", zh:"我想预约。", tip:"appointment 重音在 POINT。"}]},
   {h:"打电话的套路",p:"A 是对方，B 是你。",items:[
   {en:"A: Hello, Maple Clinic. — B: Hi, this is Li Wang. I'd like to make an appointment.", ipa:"", zh:"枫叶诊所您好。——你好，我是王丽，我想预约。", tip:"电话里报名字用 This is，不用 I am。"},
   {en:"A: What's it for? — B: I have a bad cough.", ipa:"", zh:"看什么？——我咳嗽得厉害。", tip:"一句说清目的。"},
   {en:"A: Can you come Thursday at ten? — B: Yes, that works. Thank you.", ipa:"", zh:"周四十点可以吗？——可以，谢谢。", tip:"that works = 这个时间可以。"},
   {en:"Sorry, could you repeat that, please?", ipa:"", zh:"抱歉，能再说一遍吗？", tip:"听不清就用，用几次都没关系。"},
   {en:"Could you speak more slowly, please?", ipa:"", zh:"能慢一点说吗？", tip:"slowly 的 l 顶舌。"},
   {en:"Can I have your name and phone number?", ipa:"", zh:"能给我你的名字和电话吗？", tip:"对方会这样问你，准备好拼名字、报号码。"}]}],
  drills:[["I have a headache. I have a fever.","HED-ake"],["My stomach hurts.","STUM-ick"],["I'd like to make an appointment, please.","ap-POINT-ment"],["Hi, this is Li Wang.","电话里用 This is"],["Sorry, could you repeat that, please?","救命句"],["Can you come Thursday at ten? Yes, that works. Thank you.","确认时间"]],
  ex:[
   {t:"listen",q:"听一听，他哪里不舒服？",say:"My back hurts and I feel dizzy.",opts:["背疼、头晕","头疼、发烧","肚子疼、咳嗽","累、难受"],a:0},
   {t:"mc",q:"电话里介绍自己，正确的说法是？",opts:["This is Li Wang.","I am Li Wang here.","Me Li Wang.","Here Li Wang."],a:0},
   {t:"mc",q:"没听清对方说什么，说？",opts:["Sorry, could you repeat that?","What?","I don't know.","Yes, yes."],a:0},
   {t:"listen",q:"听一听，预约在什么时候？",say:"Can you come Friday at two thirty?",opts:["周五 2:30","周四 2:30","周五 3:30","周二 2:00"],a:0},
   {t:"type",q:"翻译：我想预约。（用 I'd like to）",a:"I'd like to make an appointment.",alt:["I'd like to make an appointment","I would like to make an appointment.","I would like to make an appointment","I'd like to make an appointment, please."]},
   {t:"type",q:"听写这句话。",say:"I feel sick.",a:"I feel sick.",alt:["I feel sick"]}],
  hw:[["症状卡","把你和家人常见的不舒服（头疼、过敏、感冒……）写成英语句子，放进手机备忘录，读 5 遍。"],["打一通电话","用英语打一通真实电话：问营业时间、预约理发或看牙都可以。打之前把要说的三句话写下来。"],["听电话录音","拨打一个有英语语音菜单的电话（银行、电信公司），听懂第一层菜单的选项，记下来。"]]

{ id:"l2c8", lv:2, title:"第二级结业：租房、银行与一通 3 分钟电话", goal:"能处理租房和银行的基本对话，并完成结业任务：一通 3 分钟的真实英语电话。",
  intro:"第二级的最后一章把两个重要场景——<b>租房</b>和<b>银行</b>——放在一起，因为它们的句型高度相似：问有没有、问多少钱、问怎么办。然后是结业任务：<b>打一通 3 分钟的英语电话</b>。你已经有了全部零件：时间日期、过去时、进行时、天气闲聊、电话套路。别怕说错，电话那头的人每天都在和口音不同的人说话。",
  learn:[{h:"租房",p:"",items:[

   {h:"银行",p:"",items:[

   {en:"Can I speak to someone in Mandarin?", ipa:"", zh:"有会说普通话的人吗？", tip:"大银行通常有，别不好意思问。"}]},
   {h:"3 分钟电话的结构",p:"结业任务用这个结构，写下来放在手边。",items:[

  drills:[["I'm looking for a one-bedroom apartment.","looking for"],["How much is the rent? Are utilities included?","u-TIL-ities"],["I'd like to open an account.","o-pe-nan"],["Is there a monthly fee?","长 fee"],["Hi, this is Li. I'm calling about the apartment.","电话开头"],["Okay, so it's Friday at two. Is that right? Great, thank you so much. Bye.","确认 + 结尾"]],
  ex:[

{ id:"l3c1", lv:3, title:"语调与句子节奏", goal:"掌握英语句子的升降调和轻重节奏，让别人一听就知道你是在问、在说、还是在列举。",
  intro:"到了第三级，单个词你已经能读准了。现在的差距在<b>整句的调子</b>。中文靠每个字的声调分辨意思，所以中国学习者说英语时每个词都带着一个“声调”，听起来很平、很硬。英语不一样：<b>句子的意思靠整句的升降</b>。陈述句和特殊问句<b>降调</b>，一般问句<b>升调</b>，列举时<b>前升后降</b>。另外，英语是<b>重音等时</b>的：重读的词之间时间大致相等，中间的小词要挤着快速带过。",
  learn:[{h:"三种基本语调",p:"用手在空中画出调子，一边画一边读。",items:[
   {en:"I live in Toronto. ↘", ipa:"", zh:"我住在多伦多。（降调）", tip:"陈述句最后一个重读词往下走，表示“说完了”。"},
   {en:"Where do you live? ↘", ipa:"", zh:"你住在哪？（降调）", tip:"有 what/where/when 等疑问词的问句也是降调。中国学习者常错读成升调。"},
   {en:"Do you live in Toronto? ↗", ipa:"", zh:"你住在多伦多吗？（升调）", tip:"Yes/No 问句才用升调，最后一个词往上扬。"},
   {en:"I need eggs ↗, milk ↗, bread ↗, and butter ↘.", ipa:"", zh:"我需要鸡蛋、牛奶、面包和黄油。", tip:"列举：前面每项都升，最后一项降，表示“到此为止”。"},
   {en:"Coffee or tea? ↗↘", ipa:"", zh:"咖啡还是茶？", tip:"选择问句：第一个选项升，第二个降。"}]},
   {h:"节奏：重读实词，轻读虚词",p:"名词、动词、形容词重读；the、a、to、of、and、is 这些小词轻快带过。",items:[
   {en:"I WANT to GO to the STORE.", ipa:"", zh:"我想去商店。", tip:"三个重拍：WANT、GO、STORE。to、the 几乎听不见。"},
   {en:"She's a TEACHER at a SCHOOL in the CITY.", ipa:"", zh:"她是城里一所学校的老师。", tip:"三个重拍，中间的 a、at、in、the 挤在一起。"},
   {en:"Can you HELP me with THIS?", ipa:"", zh:"你能帮我弄这个吗？", tip:"HELP 和 THIS 重，Can you、me、with 都轻。"},
   {en:"I didn't SAY she STOLE the MONEY.", ipa:"", zh:"我没说她偷了钱。", tip:"把重音分别放到 I / didn't / say / she / stole / money 上，意思都不一样。试试看。"}]}],
  drills:[["I live in Toronto. Where do you live?","两个降调"],["Do you live in Toronto?","升调"],["I need eggs, milk, bread, and butter.","升升升降"],["Coffee or tea?","升降"],["I want to go to the store.","三个重拍"],["Can you help me with this? Sure, no problem.","重 HELP、THIS"]],
  ex:[
   {t:"listen",q:"听一听，这句话的结尾是升还是降？",say:"Do you have a car?",opts:["升调（是 Yes/No 问句）","降调","平的","先降后升"],a:0},
   {t:"listen",q:"听一听，这句话的结尾是升还是降？",say:"Where do you work?",opts:["降调（有疑问词的问句）","升调","平的","先升后降"],a:0},
   {t:"mc",q:"列举 “apples, oranges, and bananas” 时，正确的调子是？",opts:["前两个升，最后一个降","三个都升","三个都降","前两个降，最后一个升"],a:0},
   {t:"mc",q:"“I want to go to the store.” 里哪些词重读？",opts:["want, go, store","I, to, the","to, to, the","want, to, the"],a:0},
   {t:"type",q:"听写这句话。",say:"Coffee or tea?",a:"Coffee or tea?",alt:["Coffee or tea","coffee or tea"]},
   {t:"type",q:"听写这句话。",say:"Where do you live?",a:"Where do you live?",alt:["Where do you live","where do you live"]}],
  hw:[["画调子","找一段 1 分钟的英语音频（新闻、播客都行），听三遍，把每句结尾是升还是降用箭头记下来。"],["影子跟读","选 5 句本章句子，播放一句、立刻跟着读一句，模仿它的调子和节奏，不是模仿单词。录下来对比。"],["真人问句","今天对真人问 3 个问题：1 个 Yes/No 问句（升调），2 个 Wh- 问句（降调）。"]]
},
{ id:"l3c2", lv:3, title:"将来：will 与 be going to", goal:"能谈计划、预测和临时决定，分清 will 和 be going to 的用法。",
  intro:"英语说“将来”有两个常用工具。<b>be going to</b> 用于<b>已经决定、有计划</b>的事（I'm going to visit my parents next month）；<b>will</b> 用于<b>当场决定、承诺、预测</b>（I'll help you. / It will rain tomorrow）。中国学习者容易全用 will，听起来有点生硬。口语里 going to 常读成 <b>gonna</b>，I will 缩成 <b>I'll</b>。",
  learn:[{h:"be going to：计划",p:"",items:[
   {en:"I'm going to visit my parents next month.", ipa:"", zh:"我下个月要去看父母。（已经计划好）", tip:"going to 口语读 gonna：I'm gonna visit。"},
   {en:"We're going to move to Vancouver.", ipa:"", zh:"我们要搬去温哥华。", tip:"大计划、已经决定。"},
   {en:"What are you going to do this weekend?", ipa:"", zh:"你这周末打算做什么？", tip:"问计划。读成 What are you gonna do。"},
   {en:"Look at the sky. It's going to rain.", ipa:"", zh:"看天。要下雨了。", tip:"有证据的预测也用 going to。"}]},
   {h:"will：当场决定、承诺、预测",p:"",items:[
   {en:"The phone is ringing. I'll get it.", ipa:"", zh:"电话响了。我来接。", tip:"当场决定用 I'll，不用 I'm going to。"},
   {en:"I'll call you tonight.", ipa:"", zh:"我今晚给你打电话。（承诺）", tip:"I'll 读成一个音节 “aɪl”，l 顶舌。"},
   {en:"Don't worry. It'll be fine.", ipa:"", zh:"别担心。会没事的。", tip:"It'll 读 “i-dl”。"},
   {en:"I won't be late.", ipa:"", zh:"我不会迟到。", tip:"won't = will not，读 /woʊnt/，和 want 不一样。"},
   {en:"Will you be home at six?", ipa:"", zh:"你六点会在家吗？", tip:"问句把 Will 放前面。"}]},
   {h:"时间词",p:"",items:[
   {en:"tomorrow, next week, next month, next year", ipa:"", zh:"明天、下周、下月、明年", tip:"next 后面不加 the。"},
   {en:"tonight, this weekend, in two hours, soon", ipa:"", zh:"今晚、这周末、两小时后、很快", tip:"“两小时后”用 in，不用 after。"}]}],
  drills:[["I'm going to visit my parents next month.","gonna"],["What are you going to do this weekend?","问计划"],["The phone is ringing. I'll get it.","当场决定"],["I'll call you tonight. I won't be late.","I'll / won't"],["Don't worry. It'll be fine.","i-dl"],["Will you be home at six? Yes, I will.","问答"]],
  ex:[
   {t:"mc",q:"门铃响了，你说“我去开”，最自然的是？",opts:["I'll get it.","I'm going to get it.","I get it.","I getting it."],a:0},
   {t:"mc",q:"你已经买好票下周去温哥华，说？",opts:["I'm going to Vancouver next week.","I will go Vancouver next week.","I go to Vancouver next week.","I went to Vancouver next week."],a:0},
   {t:"listen",q:"听一听，他要做什么？",say:"I'm going to cook dinner tonight.",opts:["今晚做饭","明天看父母","搬家","打电话"],a:0},
   {t:"listen",q:"听一听，他说了什么？",say:"I won't be late.",opts:["我不会迟到","我想迟到","我会迟到","我已经迟到了"],a:0},
   {t:"type",q:"翻译：我今晚给你打电话。（用 I'll）",a:"I'll call you tonight.",alt:["I'll call you tonight","I will call you tonight.","I will call you tonight"]},
   {t:"type",q:"听写这句话。",say:"It's going to rain.",a:"It's going to rain.",alt:["It's going to rain","It is going to rain.","It is going to rain"]}],
  hw:[["明天计划","每天晚上用英语说三件明天要做的事：Tomorrow I'm going to ___ ."],["承诺一次","对家人或朋友用英语承诺一件小事（I'll call you at eight. / I'll bring the coffee.），然后做到。"],["问计划","问一位同事或朋友 “What are you going to do this weekend?”，听懂并复述对方的回答。"]]

{ id:"l3c3", lv:3, title:"情态动词：can / should / must / have to", goal:"能表达能力、请求、建议和义务，知道哪个词客气、哪个词强硬。",
  intro:"情态动词是“态度词”，放在动词前面，改变整句的态度。<b>can</b>（能、可以）、<b>could</b>（更客气的 can）、<b>should</b>（应该，建议）、<b>must / have to</b>（必须）。最重要的用法差异：请求别人时用 <b>Could you…?</b> 比 <b>Can you…?</b> 更礼貌；给建议用 <b>should</b> 温和，用 <b>must</b> 像命令。规则：情态动词后面<b>动词原形</b>，而且<b>不加 s、不加 to</b>（have to 除外）。",
  learn:[{h:"能力与请求：can / could",p:"",items:[
   {en:"I can speak a little English.", ipa:"", zh:"我会说一点英语。", tip:"can 在句中轻读，像 “kn”。"},
   {en:"I can't hear you.", ipa:"", zh:"我听不见你。", tip:"北美口音 can't 读 /kænt/，比 can 重、长，而且结尾有 t。"},
   {en:"Can I use your phone?", ipa:"", zh:"我能用一下你的手机吗？", tip:"请求许可。"},
   {en:"Could you help me, please?", ipa:"", zh:"您能帮我一下吗？", tip:"Could 比 Can 客气，对陌生人用这个。"},
   {en:"Could you say that again?", ipa:"", zh:"您能再说一遍吗？", tip:"比 “What?” 礼貌一百倍。"}]},
   {h:"建议：should",p:"",items:[
   {en:"You should see a doctor.", ipa:"", zh:"你应该去看医生。", tip:"should 的 l 不发音：/ʃʊd/。"},
   {en:"You shouldn't eat so much sugar.", ipa:"", zh:"你不应该吃那么多糖。", tip:"shouldn't 读 SHUD-nt。"},
   {en:"Should I bring anything?", ipa:"", zh:"我需要带什么吗？", tip:"去别人家做客前必问。"},
   {en:"Maybe you should try again.", ipa:"", zh:"也许你应该再试一次。", tip:"加 Maybe 更温和。"}]},
   {h:"义务：must / have to",p:"",items:[
   {en:"I have to work tomorrow.", ipa:"", zh:"我明天必须上班。", tip:"口语里“必须”多用 have to，读 “hafta”。"},
   {en:"You must wear a seatbelt.", ipa:"", zh:"你必须系安全带。", tip:"must 用于规则、法律，语气强。"},
   {en:"You don't have to pay now.", ipa:"", zh:"你不用现在付。", tip:"don't have to = 不需要（不是“禁止”）。"},
   {en:"You mustn't smoke here.", ipa:"", zh:"你不可以在这里吸烟。", tip:"mustn't = 禁止。注意和 don't have to 的区别。"}]}],
  drills:[["I can speak a little English. I can't hear you.","can 轻 / can't 重"],["Could you help me, please?","客气请求"],["Could you say that again?","再说一遍"],["You should see a doctor.","should 的 l 不发音"],["I have to work tomorrow.","hafta"],["You don't have to pay now.","不需要"]],
  ex:[
   {t:"listen",q:"听一听，他说的是 can 还是 can't？",say:"I can't come tomorrow.",opts:["can't（不能）","can（能）","听不出来","两个都说了"],a:0},
   {t:"mc",q:"对陌生人请求帮助，最礼貌的是？",opts:["Could you help me, please?","Help me.","You help me now.","Can help?"],a:0},
   {t:"mc",q:"“You don't have to pay now.” 意思是？",opts:["你不需要现在付","你禁止现在付","你必须现在付","你不想现在付"],a:0},
   {t:"mc",q:"哪句是对的？",opts:["She can swim.","She can swims.","She can to swim.","She cans swim."],a:0},
   {t:"type",q:"翻译：您能再说一遍吗？（用 Could you）",a:"Could you say that again?",alt:["Could you say that again","Could you say that again, please?","Could you repeat that?","Could you repeat that, please?"]},
   {t:"type",q:"听写这句话。",say:"You should see a doctor.",a:"You should see a doctor.",alt:["You should see a doctor","you should see a doctor"]}],
  hw:[["三次 Could you","今天对真人用 3 次 “Could you ___, please?”（请人递东西、再说一遍、拍照都可以）。"],["给一条建议","对朋友用英语给一条建议：You should ___ . 或 Maybe you should ___ ."],["规则翻译","找一张英文告示牌（No smoking / Must wear a mask……），用 must / mustn't / don't have to 把它说成完整句子。"]]
},
{ id:"l3c4", lv:3, title:"工作面试", goal:"能完成一次 10 分钟的英语面试：自我介绍、谈经验、回答常见问题、反问面试官。",
  intro:"面试是把你学过的一切放在压力下用一次。好消息是：<b>面试问题是可以预测的</b>。本章把最常见的五个问题和回答结构给你，你只要<b>填自己的内容</b>，然后练到不用看稿。关键原则：① 回答有结构（先一句总结，再两个例子）；② 说<b>做过什么</b>，用过去时；③ 说<b>能做什么</b>，用 can；④ 结尾一定要<b>反问</b>一两个问题，表示你认真。",
  learn:[{h:"五个必考问题",p:"",items:[
   {en:"Tell me about yourself.", ipa:"", zh:"介绍一下你自己。", tip:"不是讲人生故事。说：现在做什么、做了多久、擅长什么。30 秒。"},
   {en:"Why do you want this job?", ipa:"", zh:"你为什么想要这份工作？", tip:"说公司吸引你的一点 + 你能带来的一点。"},
   {en:"What are your strengths?", ipa:"", zh:"你的优点是什么？", tip:"strengths 很难读：strengkths，慢慢来，读不准就说 strong points。"},
   {en:"Tell me about a problem you solved.", ipa:"", zh:"说一个你解决过的问题。", tip:"结构：情况 → 我做了什么 → 结果。全用过去时。"},
   {en:"Do you have any questions for us?", ipa:"", zh:"你有什么问题要问我们吗？", tip:"永远回答 Yes，至少问一个。"}]},
   {h:"回答的句型",p:"把下划线换成你自己的内容。",items:[
   {en:"I've been a cook for five years.", ipa:"", zh:"我做厨师已经五年了。", tip:"I've been + 职业 + for + 时间：讲工作年限的标准句。"},
   {en:"I'm good at working with people.", ipa:"", zh:"我擅长和人打交道。", tip:"good at 后面接名词或 -ing。"},

{ id:"l3c5", lv:3, title:"填表格：读懂并填对", goal:"能独立填写常见英文表格（诊所、学校、工作申请、政府表格），读懂每一栏在问什么。",
  intro:"表格是新移民遇到最多的英语文本：诊所登记、孩子的学校、工作申请、报税。好消息是<b>所有表格用的词都差不多</b>。本章把这些高频词一次学完，再学几句<b>向工作人员提问</b>的话——看不懂某一栏时，问比猜强。注意：英文表格里<b>姓和名分开填</b>，日期格式要看清楚是 MM/DD 还是 DD/MM。",
  learn:[{h:"个人信息栏",p:"",items:[
   {en:"first name / last name (surname, family name)", ipa:"", zh:"名 / 姓", tip:"中国人的姓填 last name。王丽：first name = Li，last name = Wang。"},
   {en:"date of birth (DOB) / place of birth", ipa:"", zh:"出生日期 / 出生地", tip:"看清格式：MM/DD/YYYY 还是 DD/MM/YYYY。"},
   {en:"address, postal code, city, province", ipa:"", zh:"地址、邮编、城市、省", tip:"加拿大邮编是字母数字混合，如 M5V 2T6。"},
   {en:"phone number, email address", ipa:"", zh:"电话、邮箱", tip:"邮箱写清楚，很多通知靠它。"},
   {en:"marital status: single / married / divorced / widowed", ipa:"", zh:"婚姻状况：单身 / 已婚 / 离异 / 丧偶", tip:"marital 重音在 MAR。"},
   {en:"emergency contact / relationship", ipa:"", zh:"紧急联系人 / 关系", tip:"relationship 填 spouse（配偶）、friend 等。"}]},
   {h:"常见指令词",p:"",items:[

   {en:"Check all that apply. / Check one.", ipa:"", zh:"勾选所有适用的。/ 只选一个。", tip:"check = 打勾。"},

{ id:"l3c6", lv:3, title:"写一封短邮件", goal:"能写请假、预约、询问、感谢四类短邮件，格式正确、语气得体。",
  intro:"英文邮件比中文邮件<b>短、直接</b>，但有固定的礼貌格式：<b>称呼 → 一句目的 → 细节 → 请求 → 结尾</b>。中国学习者两个常见问题：① 太客套，绕半天不说事；② 用错称呼和结尾（给老板写 Hi dear）。本章给你四个模板，每个不超过五句。记住：<b>一封邮件只说一件事</b>。",
  learn:[{h:"开头与结尾",p:"",items:[
   {en:"Hi Sarah, / Hello Mr. Chen, / Dear Dr. Smith,", ipa:"", zh:"三种称呼：熟人 / 一般 / 正式", tip:"不知道名字写 Hello, 或 Hi there,。不要写 Dear Sir（太旧）。"},
   {en:"I hope you're doing well.", ipa:"", zh:"希望你一切都好。", tip:"可有可无的开场，一句就够。"},
   {en:"I'm writing to ask about ___.", ipa:"", zh:"我写信是想问___。", tip:"第一句就说目的，这是最重要的一句。"},
   {en:"Please let me know if you have any questions.", ipa:"", zh:"如有任何问题请告诉我。", tip:"万能结尾句。"},
   {en:"Thanks, / Best regards, / Sincerely,", ipa:"", zh:"三种结尾：随意 / 一般 / 正式", tip:"下面空一行写你的名字。"}]},
   {h:"四个模板",p:"",items:[
   {en:"I won't be able to come to work tomorrow because I'm sick. I'll be back on Thursday.", ipa:"", zh:"请假：我明天生病不能上班，周四回来。", tip:"原因一句，回来时间一句。"},
   {en:"I'd like to book an appointment next week. Is Tuesday or Wednesday afternoon available?", ipa:"", zh:"预约：我想下周预约。周二或周三下午有空吗？", tip:"给两个选项，对方好回。"},
   {en:"Could you please send me the price list? Thank you in advance.", ipa:"", zh:"询问：能把价目表发给我吗？先谢了。", tip:"in advance = 提前。"},
   {en:"Thank you so much for your help yesterday. I really appreciate it.", ipa:"", zh:"感谢：非常感谢你昨天的帮助。我很感激。", tip:"appreciate 重音在 PRE：a-PREE-shee-ate。"}]},
   {h:"常用短语",p:"",items:[
   {en:"Please find the file attached.", ipa:"", zh:"文件见附件。", tip:"attached = 附上。"},
   {en:"Sorry for the late reply.", ipa:"", zh:"抱歉回复晚了。", tip:"开头用。"},
   {en:"Just a quick reminder: ___", ipa:"", zh:"简短提醒一下：___", tip:"催别人时用，很客气。"},
   {en:"Looking forward to hearing from you.", ipa:"", zh:"期待你的回复。", tip:"结尾用。"}]}],
  drills:[["I'm writing to ask about the apartment.","第一句说目的"],["I won't be able to come to work tomorrow because I'm sick.","请假"],["Is Tuesday or Wednesday afternoon available?","给两个选项"],["Thank you so much for your help. I really appreciate it.","a-PREE-shee-ate"],["Please find the file attached.","附件"],["Please let me know if you have any questions. Best regards, Li.","结尾"]],
  ex:[
   {t:"mc",q:"给不太熟的客户写邮件，最合适的称呼是？",opts:["Hello Mr. Chen,","Hi dear,","Dear Sir,","Hey!"],a:0},
   {t:"mc",q:"邮件的第一句应该？",opts:["直接说目的：I'm writing to ask about…","先问候对方全家","道歉自己英语不好","介绍自己的人生"],a:0},
   {t:"listen",q:"听一听，这封邮件是为了什么？",say:"I'd like to book an appointment next week.",opts:["预约","请假","感谢","询价"],a:0},
   {t:"mc",q:"“Please find the file attached.” 意思是？",opts:["文件见附件","请去找文件","请把文件发给我","文件丢了"],a:0},
   {t:"type",q:"翻译：抱歉回复晚了。",a:"Sorry for the late reply.",alt:["Sorry for the late reply","sorry for the late reply","Sorry for my late reply."]},
   {t:"type",q:"听写这句话。",say:"I really appreciate it.",a:"I really appreciate it.",alt:["I really appreciate it","i really appreciate it"]}],
  hw:[["写四封","用四个模板各写一封真实的邮件草稿（请假、预约、询问、感谢），每封不超过五句。"],["发出一封","把其中一封真的发出去（给房东、诊所、孩子老师、商家都可以）。"],["读回复","收到回复后，把看不懂的句子带回来问老师，然后用英语回一句。"]]

{ id:"l3c7", lv:3, title:"第三级结业：10 分钟面对面交谈", goal:"能和一个人进行 10 分钟的真实交谈：开场、提问、追问、分享、礼貌结束。",
  intro:"10 分钟听起来很长，其实只要会<b>接话</b>和<b>追问</b>，对话会自己往前走。本章教你交谈的“机关”：<b>开场</b>（天气、场合）→ <b>提问</b>（开放式问题）→ <b>追问</b>（Really? Why? How?）→ <b>分享</b>（Me too. / I also…）→ <b>结束</b>（It was nice talking to you）。记住：<b>听的时候要出声</b>（Uh-huh, I see, Really?），否则对方以为你没听懂。",
  learn:[{h:"开场与提问",p:"",items:[
   {en:"How's it going? — Pretty good. How about you?", ipa:"", zh:"最近怎么样？——挺好的，你呢？", tip:"How about you 把球抛回去。"},
   {en:"Are you from around here?", ipa:"", zh:"你是本地人吗？", tip:"around here = 这一带。"},
   {en:"What do you do? — I'm a nurse. What about you?", ipa:"", zh:"你做什么工作？——我是护士，你呢？", tip:"What do you do 问的是职业。"},
   {en:"How long have you lived here?", ipa:"", zh:"你在这住多久了？", tip:"How long have you = 多久了。"},
   {en:"What do you like to do on weekends?", ipa:"", zh:"你周末喜欢做什么？", tip:"开放式问题，对方能说很多。"}]},
   {h:"追问与反应",p:"这些是让对话继续的关键。",items:[
   {en:"Really? That's interesting.", ipa:"", zh:"真的？有意思。", tip:"Really 升调。"},
   {en:"Oh, I see. / Uh-huh. / Right.", ipa:"", zh:"哦，明白。/ 嗯。/ 对。", tip:"听的时候每几秒给一个反应。"},
   {en:"Why is that? / How come?", ipa:"", zh:"为什么呢？", tip:"How come 比 Why 更随意。"},
   {en:"Me too! / Same here.", ipa:"", zh:"我也是！", tip:"找到共同点就说。"},
   {en:"That sounds great. / That sounds hard.", ipa:"", zh:"听起来很棒。/ 听起来很难。", tip:"sounds + 形容词，万能反应。"},
   {en:"Sorry, what do you mean by that?", ipa:"", zh:"抱歉，你那句话是什么意思？", tip:"没懂就问，比装懂好。"}]},
   {h:"分享与结束",p:"",items:[
   {en:"I moved here two years ago from China.", ipa:"", zh:"我两年前从中国搬来的。", tip:"ago 放在时间后面。"},
   {en:"I'm still learning English, so please speak slowly.", ipa:"", zh:"我还在学英语，请说慢一点。", tip:"说出来对方会体谅你。"},
   {en:"Well, I should get going.", ipa:"", zh:"嗯，我该走了。", tip:"结束对话的礼貌信号。"},
   {en:"It was nice talking to you. Take care!", ipa:"", zh:"和你聊天很开心。保重！", tip:"结尾固定句。"}]}],
  drills:[["How's it going? Pretty good. How about you?","开场"],["What do you do? I'm a nurse. What about you?","职业"],["Really? That's interesting. How come?","追问"],["Me too! That sounds great.","反应"],["I moved here two years ago from China.","ago"],["Well, I should get going. It was nice talking to you. Take care!","结束"]],
  ex:[
   {t:"listen",q:"听一听，对方问的是？",say:"How long have you lived here?",opts:["在这住多久了","喜欢住这吗","住在哪","什么时候搬走"],a:0},
   {t:"mc",q:"对方说了一件有趣的事，你想让他多说点，说？",opts:["Really? How come?","OK.","I don't know.","Goodbye."],a:0},
   {t:"mc",q:"想礼貌地结束对话，说？",opts:["Well, I should get going. It was nice talking to you.","Stop talking.","I go now.","Bye bye bye."],a:0},

   {t:"type",q:"听写这句话。",say:"It was nice talking to you.",a:"It was nice talking to you.",alt:["It was nice talking to you","it was nice talking to you"]}],
  hw:[["问题清单","写下 10 个开放式问题（What / How / Why 开头），背下来，这是你的“弹药”。"],["5 分钟热身","和一位会英语的人聊 5 分钟，目标：用到至少 3 次追问（Really? / How come? / What do you mean?）。"],["结业交谈（必做）","和一个人面对面用英语聊 10 分钟（语言交换伙伴、邻居、同事都可以）。结束后记下：聊了什么、卡在哪、下次想说什么。"]]

{ id:"l4c1", lv:4, title:"弱读与缩读：听懂真实语速", goal:"听懂并说出 wanna / gotta / 'cause 这类口语缩读，掌握虚词的弱读形式。",
  intro:"为什么课堂英语都听得懂，真人一说就跟不上？因为真人说话时<b>虚词几乎消失</b>：to 变成 “tə”，and 变成 “n”，you 变成 “yə”；而且常用组合会<b>黏成一团</b>：want to → wanna，going to → gonna，got to → gotta。本章的目标首先是<b>听懂</b>这些；其次是在<b>随意场合</b>学着说，但在正式场合（面试、写邮件）要用完整形式。",
  learn:[{h:"虚词的弱读",p:"重读实词，弱读虚词。弱读时元音都变成模糊的 “ə”。",items:[
   {en:"to → tə: I want to go. → I wan-tə go.", say:"I want to go. I wanna go.", ipa:"", zh:"我想去。", tip:"to 几乎听不见。"},
   {en:"and → n: bread and butter → brea-dn-butter", say:"bread and butter. bread n butter.", ipa:"", zh:"面包和黄油", tip:"and 只剩一个 n。"},
   {en:"you → yə / ya: What do you want? → Wha-də-yə want?", say:"What do you want? Whaddaya want?", ipa:"", zh:"你想要什么？", tip:"do you 黏成 “də-yə”。"},
   {en:"can → kn: I can do it. → I kn do it.", say:"I can do it.", ipa:"", zh:"我能做到。", tip:"can 弱读，所以 can't 反而更容易听出来（重、有 t）。"},
   {en:"of → ə: a cup of coffee → a cup-ə coffee", say:"a cup of coffee. a cuppa coffee.", ipa:"", zh:"一杯咖啡", tip:"of 的 f 消失。"}]},
   {h:"七个最常见的缩读",p:"",items:[
   {en:"want to → wanna: I wanna go home.", ipa:"", zh:"我想回家。", tip:"随意场合用，面试别用。"},
   {en:"going to → gonna: It's gonna rain.", ipa:"", zh:"要下雨了。", tip:"只有表将来的 going to 能缩，“I'm going to Toronto” 不能。"},
   {en:"got to → gotta: I gotta go.", ipa:"", zh:"我得走了。", tip:"= I have got to go。"},
   {en:"because → 'cause: I'm late 'cause of traffic.", ipa:"", zh:"我迟到是因为堵车。", tip:"读 “kəz”。"},
   {en:"kind of → kinda: I'm kinda tired.", ipa:"", zh:"我有点累。", tip:"kinda = 有点。"},
   {en:"don't know → dunno: I dunno.", ipa:"", zh:"我不知道。", tip:"非常随意。"},
   {en:"let me → lemme / give me → gimme", ipa:"", zh:"让我 / 给我", tip:"Lemme see. = 让我看看。"}]},
   {h:"听力实战",p:"先按正常速度听，再看文字。",items:[
   {en:"Whaddaya wanna do tonight?", ipa:"", zh:"= What do you want to do tonight? 你今晚想做什么？", tip:"五个词黏成三个。"},
   {en:"I gotta get up early 'cause I'm gonna work.", ipa:"", zh:"= I have got to get up early because I'm going to work.", tip:"一句话三个缩读。"},
   {en:"Lemme know if you need anything.", ipa:"", zh:"= Let me know… 需要什么告诉我。", tip:"结尾 anything 的 th。"}]}],
  drills:[["I want to go. I wanna go.","完整 / 缩读"],["It's gonna rain. I gotta go.","gonna / gotta"],["I'm kinda tired. I dunno.","kinda / dunno"],["What do you want to do tonight?","先说完整"],["Whaddaya wanna do tonight?","再说缩读"],["Lemme know if you need anything.","lemme"]],
  ex:[
   {t:"listen",q:"听一听，他说的完整形式是？",say:"I gotta go.",opts:["I have got to go.","I got a goal.","I go to go.","I got the gold."],a:0},
   {t:"listen",q:"听一听，他问的是？",say:"Whaddaya wanna do tonight?",opts:["你今晚想做什么","你今晚在哪","你今晚几点来","你今晚累不累"],a:0},
   {t:"mc",q:"哪句里的 going to 可以缩成 gonna？",opts:["I'm going to call you.","I'm going to Toronto.","I'm going to the store.","I'm going to school."],a:0},

{ id:"l4c2", lv:4, title:"完成时：have done 与 have been doing", goal:"能用现在完成时谈经历、变化和持续到现在的事，分清它和过去时的区别。",
  intro:"现在完成时是中国学习者的一道坎，因为中文没有对应的形式。记住一个核心：<b>have + 过去分词</b> 讲的是<b>“到现在为止”</b>——经历（我去过）、结果（我做完了）、持续（我住了五年了）。和过去时的区别：<b>过去时有明确时间点</b>（I went there in 2019），<b>完成时不说具体什么时候</b>（I've been there）。口语里 have 缩成 <b>'ve</b>，has 缩成 <b>'s</b>。",
  learn:[{h:"三种用法",p:"",items:[
   {en:"I've been to Vancouver twice.", ipa:"", zh:"我去过温哥华两次。（经历）", tip:"been to = 去过。不说具体哪年。"},
   {en:"I've finished my homework.", ipa:"", zh:"我做完作业了。（结果：现在是完成状态）", tip:"重点是“现在做完了”。"},
   {en:"I've lived here for five years.", ipa:"", zh:"我在这住了五年了。（持续到现在）", tip:"for + 一段时间。还在住。"},
   {en:"She's worked here since 2020.", ipa:"", zh:"她从 2020 年起在这工作。", tip:"since + 起点。She's = She has。"},
   {en:"Have you ever eaten poutine?", ipa:"", zh:"你吃过肉汁奶酪薯条吗？", tip:"ever = 曾经。问经历的标准句。"},
   {en:"I haven't seen that movie yet.", ipa:"", zh:"我还没看那部电影。", tip:"yet 放句尾，= 还没。"}]},
   {h:"过去时 vs 完成时",p:"对比着看。",items:[
   {en:"I went to Montreal last year. / I've been to Montreal.", ipa:"", zh:"我去年去了蒙特利尔。/ 我去过蒙特利尔。", tip:"有 last year 就用过去时。"},
   {en:"I lost my keys yesterday. / I've lost my keys!", ipa:"", zh:"我昨天丢了钥匙。/ 我钥匙丢了！（现在还没找到）", tip:"完成时强调现在的后果。"},
   {en:"Did you eat? / Have you eaten?", ipa:"", zh:"你吃了吗？（两种都对）", tip:"北美口语两种都常用，Did you eat 更随意。"}]},
   {h:"进行完成时：have been doing",p:"强调动作一直在进行。",items:[
   {en:"I've been learning English for two years.", ipa:"", zh:"我学英语两年了（还在学）。", tip:"I've been + -ing。"},
   {en:"It's been raining all day.", ipa:"", zh:"下了一整天雨了。", tip:"It's been = It has been。"},
   {en:"What have you been up to?", ipa:"", zh:"你最近在忙什么？", tip:"老朋友见面必问。回答：Not much. / Just working."},
   {en:"I've been waiting for an hour!", ipa:"", zh:"我等了一个小时了！", tip:"带点抱怨。"}]},
   {h:"常用过去分词",p:"",items:[
   {en:"be → been, do → done, go → gone, see → seen", ipa:"", zh:"", tip:"gone 和 been 不一样：He's gone = 他走了；He's been there = 他去过。"},
   {en:"eat → eaten, take → taken, write → written, speak → spoken", ipa:"", zh:"", tip:"都是 -en 结尾。"},
   {en:"have → had, make → made, buy → bought, think → thought", ipa:"", zh:"", tip:"这组和过去式一样。"}]}],
  drills:[["I've been to Vancouver twice.","经历"],["I've lived here for five years.","持续"],["Have you ever eaten poutine? Yes, I have.","问经历"],["I haven't seen that movie yet.","yet"],["I've been learning English for two years.","have been -ing"],["What have you been up to? Not much, just working.","老友重逢"]],
  ex:[
   {t:"mc",q:"“我在这住了五年了（还在住）。” 哪句对？",opts:["I've lived here for five years.","I lived here for five years.","I live here five years.","I am living here since five years."],a:0},
   {t:"mc",q:"哪句应该用过去时？",opts:["我 2019 年去了北京。","我去过北京。","我住在这五年了。","我还没吃饭。"],a:0},
   {t:"listen",q:"听一听，他学英语多久了？",say:"I've been studying English for six months.",opts:["六个月","六年","六周","十六个月"],a:0},
   {t:"listen",q:"听一听，她看过那部电影了吗？",say:"I haven't seen it yet.",opts:["还没看","看过了","正在看","不想看"],a:0},
   {t:"type",q:"翻译：你最近在忙什么？",a:"What have you been up to?",alt:["What have you been up to","what have you been up to"]},
   {t:"type",q:"听写这句话。",say:"I've finished my homework.",a:"I've finished my homework.",alt:["I've finished my homework","I have finished my homework.","I have finished my homework"]}],
  hw:[["经历清单","用 I've been to… / I've never… 写 5 句自己的经历（去过的地方、做过的事、从没做过的事）。"],["分辨练习","今天说的每一句关于过去的话，问自己：有具体时间吗？有→过去时；没有→完成时。记下 5 个例子。"],["老友问候","给一位久未联系的会英语的朋友发消息：“Hey, long time! What have you been up to?”"]]
