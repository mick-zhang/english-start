{ id:"l19c4", lv:19, title:"和主管、同事与客户沟通", goal:"能听懂主管的指令、汇报进度、和同事配合、向客户解释工作并处理现场问题。",
  intro:"工地上的沟通<b>快、直、带口音</b>。主管说一遍不重复；同事喊话不客气；客户想知道“多久、多少钱”。本章教<b>听懂指令并确认</b>（So you want me to… right?）、<b>汇报进度</b>、<b>要帮手和材料</b>、<b>和客户解释</b>，以及<b>现场问题</b>（发现额外问题、没材料、要加时）。原则：<b>不懂就问，比做错便宜</b>。",
  learn:[{h:"听懂并确认指令",p:"",items:[
   {en:"Run the conduit along the north wall, then drop down to the panel.", ipa:"", zh:"沿北墙走线管，然后下到配电箱。", tip:"主管的典型指令。"},
   {en:"So you want the conduit on the north wall, down to the panel. Got it.", ipa:"", zh:"所以线管走北墙，下到配电箱。明白。", tip:"复述确认。Got it = 明白了。"},
   {en:"Sorry, which wall? Can you show me?", ipa:"", zh:"抱歉，哪面墙？能指给我看吗？", tip:"问一次，不会被看不起；做错了才会。"},
   {en:"Do you want me to finish this first, or start on the bathroom?", ipa:"", zh:"你要我先做完这个，还是开始浴室？", tip:"问优先级。"},
   {en:"I'll need about two hours for that.", ipa:"", zh:"那个我需要大约两小时。", tip:"给时间估计。"}]},
   {h:"汇报与配合",p:"",items:[
   {en:"Rough-in is done on the second floor. Ready for inspection.", ipa:"", zh:"二楼的预埋做完了。可以检查了。", tip:"rough-in = 封墙前的管线预埋。"},
   {en:"I'm about halfway. Should be done by three.", ipa:"", zh:"我做了一半。三点前应该能完。", tip:""},
   {en:"We're short on half-inch fittings. I need about twenty more.", ipa:"", zh:"半英寸配件不够了。我还需要大约 20 个。", tip:"short on = 缺。"},
   {en:"Can you give me a hand with this? It's a two-person job.", ipa:"", zh:"能搭把手吗？这要两个人。", tip:"give me a hand = 帮忙。"},
   {en:"Hold it steady while I fasten it. / A little to the left. Good, that's level.", ipa:"", zh:"扶稳我来固定。/ 往左一点。好，水平了。", tip:""},
   {en:"I'm heading out for lunch. Back in thirty.", ipa:"", zh:"我去吃午饭。30 分钟回来。", tip:"heading out = 出去。"}]},
   {h:"客户与现场问题",p:"",items:[
   {en:"Hi, I'm Wei from ABC Plumbing. I'm here to replace the water heater. Can you show me where it is?", ipa:"", zh:"你好，我是 ABC 水管公司的伟。我来换热水器。能带我去看看吗？", tip:"上门第一句。"},
   {en:"I'll need to shut off the water for about an hour. Is that okay?", ipa:"", zh:"我需要关水大约一小时。可以吗？", tip:"shut off = 关闭。"},
   {en:"I found another issue: the shut-off valve is corroded. I recommend replacing it while I'm here. It's an extra eighty dollars.", ipa:"", zh:"我发现另一个问题：截止阀锈蚀了。建议趁我在的时候换掉。额外 80 元。", tip:"发现额外问题：说明 + 建议 + 价格 + 让客户决定。"},
   {en:"This is going to take longer than quoted because the old pipe is a different size.", ipa:"", zh:"这会比报价的时间长，因为旧管子尺寸不同。", tip:"提前说，不要做完才说。"},
   {en:"All done. I've tested it and everything's working. Here's what I did, and here's the invoice.", ipa:"", zh:"都好了。我测试过，一切正常。这是我做的，这是发票。", tip:"收尾三句。"},
   {en:"Any questions? Here's my card if anything comes up.", ipa:"", zh:"有问题吗？这是我的名片，有事找我。", tip:"comes up = 出现。"}]}],
  drills:[["So you want the conduit on the north wall, down to the panel. Got it.","复述确认"],["Sorry, which wall? Can you show me?","问清楚"],["Rough-in is done on the second floor. Ready for inspection.","汇报"],["We're short on half-inch fittings. Can you give me a hand with this?","缺料 + 帮手"],["Hi, I'm Wei from ABC Plumbing. I'll need to shut off the water for about an hour. Is that okay?","上门"],["I found another issue: the shut-off valve is corroded. I recommend replacing it. It's an extra eighty dollars.","额外问题"]],
  ex:[
   {t:"listen",q:"听一听，主管要你做什么？",say:"Run the conduit along the north wall.",opts:["沿北墙走线管","拆北墙","在北墙开窗","粉刷北墙"],a:0},
   {t:"mc",q:"没听懂指令，最好的做法是？",opts:["复述或问 Can you show me?","猜着做","问同事","不做"],a:0},
   {t:"listen",q:"听一听，什么情况？",say:"We're short on half-inch fittings.",opts:["半英寸配件不够","半英寸配件太多","配件太短","配件尺寸错"],a:0},
   {t:"mc",q:"现场发现额外问题，应该？",opts:["说明问题、建议、价格，让客户决定","直接修了再收钱","不说","只在发票上写"],a:0},
   {t:"type",q:"翻译：能搭把手吗？（用 give me a hand）",a:"Can you give me a hand with this?",alt:["Can you give me a hand with this","Can you give me a hand?","Could you give me a hand with this?"]},
   {t:"type",q:"听写这个词（“检查”）。",say:"inspection",a:"inspection"}],
  hw:[["复述练习","请人用英语给你三条工作指令，你每条复述确认（So you want me to…）。"],["上门脚本","写下上门服务的五句：自我介绍、问位置、说明会关什么、发现问题、收尾。读到不看稿。"],["一天的汇报","用英语记录一天的工作进度（三句：做了什么、做到哪、缺什么），说给主管或自己听。"]]
},
{ id:"l19c5", lv:19, title:"工资、工时、工会与工伤", goal:"理解技工的工资结构、加班和差旅规则、工会福利，能处理工伤（WSIB）申报和权益问题。",
  intro:"技工的钱有很多部分：<b>时薪</b>、<b>加班</b>（1.5 倍）、<b>双倍</b>（周日或法定假日）、<b>差旅</b>（travel time、per diem）、<b>工具津贴</b>。工会工种还有<b>养老金和福利</b>。受伤了要通过 <b>WSIB</b>（工伤保险局）申报——<b>雇主不能让你不报</b>。本章教看懂工资单、问清规则、申报工伤和维护权益的英语。",
  learn:[{h:"工资与工时",p:"",items:[
   {en:"Journeyperson rate is forty-two an hour. First-year apprentices start at fifty percent.", ipa:"", zh:"熟练工时薪 42。一年级学徒从 50% 开始。", tip:""},
   {en:"Time and a half after eight hours a day or forty-four a week. Double time on Sundays.", ipa:"", zh:"每天超 8 小时或每周超 44 小时 1.5 倍。周日双倍。", tip:"time and a half = 1.5 倍。工会合同可能更好。"},
   {en:"Is travel time paid? Is there a per diem for out-of-town jobs?", ipa:"", zh:"路上时间算工资吗？外地工作有每日津贴吗？", tip:"per diem = 每日津贴。"},
   {en:"Do you provide a tool allowance or a truck?", ipa:"", zh:"你们提供工具津贴或车吗？", tip:"allowance = 津贴。"},
   {en:"My pay stub shows forty-six hours but I worked fifty. Can we fix that?", ipa:"", zh:"我的工资单显示 46 小时，但我工作了 50。能改吗？", tip:"自己记工时。"},
   {en:"I'm paid every two weeks by direct deposit.", ipa:"", zh:"我每两周通过直接存款发薪。", tip:""}]},
   {h:"工会",p:"",items:[
   {en:"Union members get a pension, health benefits, and the collective agreement rate.", ipa:"", zh:"工会会员有养老金、医疗福利和集体协议工资。", tip:"collective agreement = 集体协议。"},
   {en:"The dues are about two percent of my wages.", ipa:"", zh:"会费大约是工资的 2%。", tip:""},
   {en:"If I have a problem with the employer, I talk to my steward.", ipa:"", zh:"和雇主有问题，我找工会代表。", tip:"steward = 工地上的工会代表。"},
   {en:"I'd like to file a grievance about the schedule change.", ipa:"", zh:"我想就排班变更提出申诉。", tip:"grievance 读 GREE-vens，工会的正式投诉。"}]},
   {h:"工伤与权益",p:"",items:[
   {en:"I hurt my back lifting a water heater this morning. I need to report it.", ipa:"", zh:"我今天早上搬热水器伤了背。我需要报告。", tip:"当天报告，哪怕看起来不严重。"},
   {en:"The employer must report the injury to WSIB within three days. You can also file yourself.", ipa:"", zh:"雇主必须在三天内向 WSIB 报告工伤。你也可以自己报。", tip:"WSIB 读 W-S-I-B。"},
   {en:"The doctor gave me a note: no lifting over ten kilograms for two weeks. Can I do modified duties?", ipa:"", zh:"医生给我开了证明：两周内不能举超过 10 公斤。我能做轻工吗？", tip:"modified duties = 轻工。雇主应安排。"},
   {en:"My boss told me not to report it and to say it happened at home. That's illegal.", ipa:"", zh:"我老板让我别报，说是在家受的伤。那是违法的。", tip:"打 WSIB 或劳工部。"},
   {en:"I haven't been paid for three weeks. I'd like to file a claim with the Ministry of Labour.", ipa:"", zh:"我三周没拿到工资。我想向劳工部投诉。", tip:"拖欠工资：Ministry of Labour 免费处理。"},
   {en:"I'm being paid cash with no pay stub. What are my rights?", ipa:"", zh:"我拿现金没有工资单。我有什么权利？", tip:"现金工 = 没有 EI、没有 CPP、受伤没保障。小心。"}]}],
  drills:[["Time and a half after eight hours a day or forty-four a week. Double time on Sundays.","加班"],["Is travel time paid? Is there a per diem for out-of-town jobs?","差旅"],["My pay stub shows forty-six hours but I worked fifty. Can we fix that?","工时错"],["Union members get a pension, health benefits, and the collective agreement rate.","工会"],["I hurt my back lifting a water heater this morning. I need to report it.","工伤"],["The doctor gave me a note: no lifting over ten kilograms for two weeks. Can I do modified duties?","轻工"]],
  ex:[
   {t:"mc",q:"“time and a half” 是？",opts:["1.5 倍工资","半天工资","加班一个半小时","半小时休息"],a:0},
   {t:"listen",q:"听一听，什么问题？",say:"My pay stub shows forty-six hours but I worked fifty.",opts:["工资单少算了 4 小时","多算了 4 小时","没发工资","工资太低"],a:0},
   {t:"mc",q:"老板让你不要报工伤，你应该？",opts:["还是报，这是你的权利，老板的做法违法","听老板的","自己付医药费","辞职"],a:0},
   {t:"listen",q:"听一听，他问什么？",say:"Is there a per diem for out-of-town jobs?",opts:["外地工作有没有每日津贴","有没有工具津贴","有没有车","有没有加班"],a:0},
   {t:"type",q:"翻译：我能做轻工吗？（用 modified duties）",a:"Can I do modified duties?",alt:["Can I do modified duties","Can I do modified duty?","can I do modified duties"]},
   {t:"type",q:"听写这个词（“养老金”）。",say:"pension",a:"pension"}],
  hw:[["读工资单","拿一张你的工资单（或样本），用英语读出：小时、时薪、加班、扣款、实发。"],["问五个问题","面试或入职时问清：加班、差旅、工具津贴、发薪周期、WSIB。用英语写下答案。"],["工伤三句","背下：I need to report an injury. / The doctor gave me a note. / Can I do modified duties?"]]
},
{ id:"l19c6", lv:19, title:"第十九级结业：通过考试与一次完整的工作", goal:"能用英语准备和参加技工认证考试，并独立完成一次从接单到收款的完整工作（或一天的工地工作）。",
  intro:"结业两件事：① <b>考试</b>——红印章或省考试的英语题型（计算、规范、安全、识图），教你<b>读题的技巧</b>；② <b>一次完整的工作</b>——接单、报价、上门、施工、处理问题、收尾、收款，全程英语（或在工地独立完成一整天并汇报）。本章也补上<b>职业发展</b>：从学徒到熟练工到承包商，每一步的英语。",
  learn:[{h:"考试读题",p:"",items:[
   {en:"Which of the following is the minimum size of conductor for a thirty-amp circuit?", ipa:"", zh:"以下哪个是 30 安培电路的最小导线尺寸？", tip:"which of the following = 以下哪个。先看选项再读题。"},
   {en:"According to the code, what is the maximum spacing between supports?", ipa:"", zh:"根据规范，支撑之间的最大间距是多少？", tip:"according to the code = 查规范书。考试可以带规范书。"},
   {en:"All of the following are true EXCEPT:", ipa:"", zh:"以下都正确，除了：", tip:"EXCEPT 题：找错的那个。"},
   {en:"Calculate the total load. / Determine the correct fitting. / Identify the hazard.", ipa:"", zh:"计算总负荷。/ 确定正确的配件。/ 识别危险。", tip:"三个指令动词。"},
   {en:"I'd like to request extra time and a translation dictionary for the exam.", ipa:"", zh:"我想申请考试延时和翻译词典。", tip:"部分省允许，提前申请。"}]},
   {h:"一次完整的工作",p:"",items:[
   {en:"Thanks for calling. What seems to be the problem? When did it start?", ipa:"", zh:"感谢来电。是什么问题？什么时候开始的？", tip:"接单。"},
   {en:"I can come Thursday between one and three. The service call is ninety dollars, which goes toward the repair.", ipa:"", zh:"我周四一到三点能来。上门费 90，可抵维修费。", tip:"goes toward = 抵扣。"},
   {en:"Here's what I found, here's what I recommend, and here's the cost. Would you like me to go ahead?", ipa:"", zh:"这是我发现的，这是我建议的，这是费用。你要我继续吗？", tip:"go ahead = 开始做。等客户说 yes。"},
   {en:"I've cleaned up and tested everything. Let me walk you through what I did.", ipa:"", zh:"我已经清理并测试了一切。让我给你讲一遍我做了什么。", tip:""},
   {en:"The total is three twenty plus HST. I take e-Transfer or card. Here's a one-year warranty on the work.", ipa:"", zh:"总共 320 加税。我收 e-Transfer 或刷卡。工程一年保修。", tip:""},
   {en:"If you're happy with the work, a review would mean a lot. Thanks for choosing me.", ipa:"", zh:"如果你对工作满意，一条评价对我意义很大。谢谢选择我。", tip:""}]},
   {h:"职业发展",p:"",items:[
   {en:"I've logged all my hours and I'm ready to write the exam.", ipa:"", zh:"我记录了所有工时，准备好考试了。", tip:"write the exam = 参加考试（加拿大说法）。"},
   {en:"Once I get my ticket, I'd like to go out on my own.", ipa:"", zh:"拿到证后，我想自己单干。", tip:"ticket = 技工证（俗称）；on my own = 自己干。"},
   {en:"I'm taking on apprentices now. It's my turn to teach.", ipa:"", zh:"我现在带学徒了。轮到我教了。", tip:"take on = 接收。"},
   {en:"I started as a first-year apprentice who couldn't read a tape measure in English. Now I run a crew of six.", ipa:"", zh:"我从一个看不懂英语卷尺的一年级学徒开始。现在我带六个人的班组。", tip:"你的故事。crew = 班组。"}]}],
  drills:[["Which of the following is the minimum size of conductor for a thirty-amp circuit?","考题"],["All of the following are true EXCEPT:","EXCEPT 题"],["I can come Thursday between one and three. The service call is ninety dollars, which goes toward the repair.","接单"],["Here's what I found, here's what I recommend, and here's the cost. Would you like me to go ahead?","三步 + 确认"],["The total is three twenty plus HST. Here's a one-year warranty on the work.","收款"],["Once I get my ticket, I'd like to go out on my own.","单干"]],
  ex:[
   {t:"mc",q:"“All of the following are true EXCEPT” 要你选？",opts:["错的那一个","对的那一个","全部","第一个"],a:0},
   {t:"listen",q:"听一听，上门费怎么算？",say:"The service call is ninety dollars, which goes toward the repair.",opts:["90 元，可抵维修费","90 元，另算","免费","90 元押金"],a:0},
   {t:"mc",q:"发现问题后、动手前，应该？",opts:["说明发现、建议、费用，等客户同意","直接修","先收钱","拍照走人"],a:0},
   {t:"listen",q:"听一听，他的计划是？",say:"Once I get my ticket, I'd like to go out on my own.",opts:["拿到证后自己单干","买票出国","换工种","退休"],a:0},
   {t:"type",q:"翻译：你要我继续吗？（用 go ahead）",a:"Would you like me to go ahead?",alt:["Would you like me to go ahead","Do you want me to go ahead?","Should I go ahead?"]},
   {t:"type",q:"听写这个词（“导线”）。",say:"conductor",a:"conductor"}],
  hw:[["做一套模拟题","找一套你工种的英语模拟考题（Red Seal 网站有样题），做 20 题，记下读不懂的题型和词。"],["完整工作（必做）","独立完成一次从接单到收款的工作（或在工地独立完成一整天并向主管汇报），全程英语。记下每个阶段用到的一句话。"],["你的故事","用英语写三句你的技工故事：从哪开始、现在在哪、下一步。讲给一位学徒或新移民听。"]]
},
/* ===== 第二十级 · 生命科学 Life Sciences ===== */
{ id:"l20c1", lv:20, title:"生物学入门：细胞与生命的组成", goal:"掌握细胞生物学的核心词汇，能读懂教科书段落，能用英语描述细胞的结构和功能。",
  intro:"学科英语的难点不是语法，是<b>术语</b>：每个词都长、都是拉丁或希腊词根。好消息是这些词根<b>重复出现</b>：<b>-ology</b>（学科）、<b>cyto-</b>（细胞）、<b>-osis</b>（过程）、<b>micro-</b>（小）。本章从生物学的起点——细胞——开始，教你<b>读教科书的句式</b>（X is made up of Y / X is responsible for Z）和<b>课堂上问问题的方式</b>。学会了这套，其他学科的术语就不怕了。",
  learn:[{h:"核心术语",p:"",items:[
   {en:"cell, nucleus, membrane, cytoplasm, mitochondria", ipa:"", zh:"细胞、细胞核、细胞膜、细胞质、线粒体", tip:"nucleus 读 NOO-klee-us；mitochondria 读 my-to-KON-dree-a。"},
   {en:"DNA, gene, chromosome, protein, enzyme", ipa:"", zh:"脱氧核糖核酸、基因、染色体、蛋白质、酶", tip:"enzyme 读 EN-zime。"},
   {en:"prokaryote vs eukaryote: bacteria have no nucleus; plants and animals do.", ipa:"", zh:"原核生物 vs 真核生物：细菌没有细胞核；动植物有。", tip:"pro- = 之前；eu- = 真正的。"},
   {en:"photosynthesis, respiration, metabolism, homeostasis", ipa:"", zh:"光合作用、呼吸作用、新陈代谢、稳态", tip:"photosynthesis 读 fo-to-SIN-the-sis。"},
   {en:"The mitochondria is the powerhouse of the cell.", ipa:"", zh:"线粒体是细胞的动力工厂。", tip:"每个北美学生都背过的一句，也是网络梗。"}]},
   {h:"教科书句式",p:"",items:[
   {en:"A cell is the basic unit of life. All living things are made up of cells.", ipa:"", zh:"细胞是生命的基本单位。所有生物都由细胞组成。", tip:"is the basic unit of / is made up of。"},
   {en:"The cell membrane controls what enters and leaves the cell.", ipa:"", zh:"细胞膜控制什么进出细胞。", tip:"controls what = 控制……"},
   {en:"The nucleus contains the genetic material and is responsible for cell division.", ipa:"", zh:"细胞核含有遗传物质，负责细胞分裂。", tip:"contains / is responsible for。"},
   {en:"During photosynthesis, plants convert sunlight, water, and carbon dioxide into glucose and oxygen.", ipa:"", zh:"在光合作用中，植物把阳光、水和二氧化碳转化为葡萄糖和氧气。", tip:"convert X into Y。"},
   {en:"Unlike plant cells, animal cells do not have a cell wall.", ipa:"", zh:"与植物细胞不同，动物细胞没有细胞壁。", tip:"Unlike X, Y… 对比句。"}]},
   {h:"课堂用语",p:"",items:[
   {en:"Could you explain the difference between mitosis and meiosis again?", ipa:"", zh:"能再解释一下有丝分裂和减数分裂的区别吗？", tip:"mitosis 读 my-TO-sis。"},
   {en:"So if I understand correctly, the membrane is selectively permeable?", ipa:"", zh:"所以如果我理解得对，细胞膜是选择性渗透的？", tip:"确认理解的句式。permeable 读 PER-mee-a-bl。"},
   {en:"What's the function of the ribosome?", ipa:"", zh:"核糖体的功能是什么？", tip:"What's the function of = 问功能。"},
   {en:"Is this going to be on the exam?", ipa:"", zh:"这个会考吗？", tip:"每个学生都问。"}]}],
  drills:[["cell, nucleus, membrane, cytoplasm, mitochondria","五个词"],["photosynthesis, respiration, metabolism, homeostasis","四个过程"],["A cell is the basic unit of life. All living things are made up of cells.","教科书句"],["During photosynthesis, plants convert sunlight, water, and carbon dioxide into glucose and oxygen.","convert into"],["Unlike plant cells, animal cells do not have a cell wall.","对比"],["Could you explain the difference between mitosis and meiosis again?","课堂提问"]],
  ex:[
   {t:"listen",q:"听一听，说的是哪个结构？",say:"It contains the genetic material and is responsible for cell division.",opts:["细胞核","细胞膜","线粒体","细胞壁"],a:0},
   {t:"mc",q:"“photosynthesis” 是？",opts:["光合作用","呼吸作用","新陈代谢","细胞分裂"],a:0},
   {t:"mc",q:"“X is made up of Y” 意思是？",opts:["X 由 Y 组成","X 制造 Y","X 在 Y 上面","X 补充 Y"],a:0},
   {t:"listen",q:"听一听，这是什么对比？",say:"Unlike plant cells, animal cells do not have a cell wall.",opts:["动物细胞没有细胞壁","植物细胞没有细胞壁","都有细胞壁","都没有细胞核"],a:0},
   {t:"type",q:"翻译：核糖体的功能是什么？",a:"What's the function of the ribosome?",alt:["What's the function of the ribosome","What is the function of the ribosome?","What is the function of the ribosome"]},
   {t:"type",q:"听写这个词（“酶”）。",say:"enzyme",a:"enzyme"}],
  hw:[["词根表","用英语写下 10 个生物学词根（cyto-、-ology、photo-、-synthesis……）和各一个例词。"],["读一段","找一段英文生物教科书或维基百科关于细胞的段落（200 词），找出本章学过的句式，翻译三句。"],["讲给别人","用英语向家人解释“细胞是什么”，三句话，用上 is made up of 和 is responsible for。"]]
},
{ id:"l20c2", lv:20, title:"遗传与进化：从孟德尔到达尔文", goal:"掌握遗传学和进化论的核心词汇，能读懂相关科普文章，能讨论自然选择和基因。",
  intro:"遗传和进化是生物学里<b>最常出现在新闻和日常对话中</b>的部分：基因检测、GMO、“适者生存”。词汇：<b>heredity</b>（遗传）、<b>dominant / recessive</b>（显性 / 隐性）、<b>mutation</b>（突变）、<b>natural selection</b>（自然选择）、<b>adaptation</b>（适应）。本章也教<b>科学论证的句式</b>：evidence suggests、this supports the theory that——这是读任何科学文章都要会的。",
  learn:[{h:"遗传",p:"",items:[
   {en:"heredity, trait, allele, dominant, recessive, genotype, phenotype", ipa:"", zh:"遗传、性状、等位基因、显性、隐性、基因型、表现型", tip:"allele 读 a-LEEL。"},
   {en:"Mendel crossed pea plants and discovered that traits are inherited in predictable ratios.", ipa:"", zh:"孟德尔杂交豌豆，发现性状按可预测的比例遗传。", tip:"inherited = 遗传得来。"},
   {en:"If both parents carry the recessive allele, there's a one-in-four chance the child will show the trait.", ipa:"", zh:"如果父母都携带隐性等位基因，孩子有四分之一的几率表现出该性状。", tip:"a one-in-four chance = 1/4 的几率。"},
   {en:"A mutation is a change in the DNA sequence. Most are neutral; some are harmful; a few are beneficial.", ipa:"", zh:"突变是 DNA 序列的改变。大多数是中性的；有些有害；少数有益。", tip:"sequence 读 SEE-kwens。"},
   {en:"Genetic testing can tell you if you carry a gene linked to a disease.", ipa:"", zh:"基因检测能告诉你是否携带与某种疾病相关的基因。", tip:"linked to = 与……相关。"}]},
   {h:"进化",p:"",items:[
   {en:"evolution, natural selection, adaptation, species, fossil, common ancestor", ipa:"", zh:"进化、自然选择、适应、物种、化石、共同祖先", tip:"species 单复数同形，读 SPEE-sheez。"},
   {en:"Darwin proposed that organisms with favourable traits are more likely to survive and reproduce.", ipa:"", zh:"达尔文提出，具有有利性状的生物更可能存活和繁殖。", tip:"proposed that = 提出。"},
   {en:"Over many generations, these traits become more common in the population.", ipa:"", zh:"经过许多代，这些性状在种群中变得更常见。", tip:"over many generations = 经过许多代。"},
   {en:"Antibiotic resistance in bacteria is evolution happening in real time.", ipa:"", zh:"细菌的抗生素耐药性是实时发生的进化。", tip:"resistance = 耐药性。"},
   {en:"Humans and chimpanzees share about ninety-eight percent of their DNA.", ipa:"", zh:"人类和黑猩猩共享约 98% 的 DNA。", tip:""}]},
   {h:"科学论证句式",p:"",items:[
   {en:"The evidence suggests that birds evolved from dinosaurs.", ipa:"", zh:"证据表明鸟类是从恐龙进化来的。", tip:"suggests = 表明（不说 proves）。"},
   {en:"This finding supports the theory that all life shares a common ancestor.", ipa:"", zh:"这一发现支持所有生命有共同祖先的理论。", tip:"supports the theory that…"},
   {en:"A theory in science is not a guess. It's an explanation backed by extensive evidence.", ipa:"", zh:"科学中的理论不是猜测。它是有大量证据支持的解释。", tip:"backed by = 有……支持。"},
   {en:"Correlation does not imply causation.", ipa:"", zh:"相关不等于因果。", tip:"科学素养的核心句。"}]}],
  drills:[["heredity, trait, allele, dominant, recessive","遗传词"],["If both parents carry the recessive allele, there's a one-in-four chance the child will show the trait.","几率"],["evolution, natural selection, adaptation, species, common ancestor","进化词"],["Darwin proposed that organisms with favourable traits are more likely to survive and reproduce.","达尔文"],["The evidence suggests that birds evolved from dinosaurs.","evidence suggests"],["Correlation does not imply causation.","名句"]],
  ex:[
   {t:"mc",q:"“recessive” 是？",opts:["隐性","显性","突变","适应"],a:0},
   {t:"listen",q:"听一听，几率是多少？",say:"There's a one-in-four chance the child will show the trait.",opts:["四分之一","四分之三","一半","百分之四"],a:0},
   {t:"mc",q:"科学文章里 “The evidence suggests that…” 的语气是？",opts:["谨慎的“表明”，不是“证明”","绝对肯定","怀疑","反对"],a:0},
   {t:"listen",q:"听一听，这是在说什么？",say:"Antibiotic resistance in bacteria is evolution happening in real time.",opts:["细菌耐药性是实时的进化","抗生素杀死所有细菌","细菌不会进化","进化很慢"],a:0},
   {t:"type",q:"翻译：相关不等于因果。",a:"Correlation does not imply causation.",alt:["Correlation does not imply causation","correlation does not imply causation","Correlation doesn't imply causation."]},
   {t:"type",q:"听写这个词（“突变”）。",say:"mutation",a:"mutation"}],
  hw:[["家族性状","用英语列出你家三个可能遗传的性状（酒窝、卷发、色盲……），各写一句 dominant 或 recessive。"],["读一篇科普","读一篇关于进化或基因的英文科普（BBC、Scientific American），圈出 suggests / supports / evidence，翻译三句。"],["辩一辩","和一位朋友用英语讨论 Is a theory just a guess?，用上 backed by evidence。"]]
},
{ id:"l20c3", lv:20, title:"人体：系统、器官与健康词汇", goal:"掌握人体主要系统和器官的英语名称，能读懂健康和医学科普，衔接第十级的看病英语。",
  intro:"第十级学了看病时怎么说，这一章学<b>医生在说什么背后的科学</b>：人体的<b>系统</b>（循环、呼吸、消化、神经、免疫、内分泌）、每个系统的<b>器官</b>、以及<b>常见健康话题的科学词汇</b>（cholesterol、blood pressure、immune response、hormones）。读懂了这些，体检报告、药品说明、健康新闻都不再是天书。",
  learn:[{h:"系统与器官",p:"",items:[
   {en:"circulatory system: heart, arteries, veins, blood", ipa:"", zh:"循环系统：心脏、动脉、静脉、血液", tip:"arteries 读 AR-ter-eez。"},
   {en:"respiratory system: lungs, trachea, diaphragm", ipa:"", zh:"呼吸系统：肺、气管、横膈膜", tip:"diaphragm 读 DY-a-fram，g 不发音。"},
   {en:"digestive system: stomach, intestines, liver, pancreas", ipa:"", zh:"消化系统：胃、肠、肝、胰腺", tip:"pancreas 读 PAN-kree-as。"},
   {en:"nervous system: brain, spinal cord, nerves, neurons", ipa:"", zh:"神经系统：大脑、脊髓、神经、神经元", tip:""},
   {en:"immune system: white blood cells, antibodies, lymph nodes", ipa:"", zh:"免疫系统：白细胞、抗体、淋巴结", tip:"antibodies 读 AN-ti-bod-eez。"},
   {en:"endocrine system: glands, hormones, insulin, thyroid", ipa:"", zh:"内分泌系统：腺体、激素、胰岛素、甲状腺", tip:"endocrine 读 EN-do-krin。"}]},
   {h:"怎么运作",p:"",items:[
   {en:"The heart pumps blood through the arteries, delivering oxygen to the body's tissues.", ipa:"", zh:"心脏通过动脉泵血，将氧气输送到身体组织。", tip:"delivering = 输送。"},
   {en:"When you breathe in, the diaphragm contracts and the lungs expand.", ipa:"", zh:"吸气时，横膈膜收缩，肺部扩张。", tip:"contracts / expands。"},
   {en:"The immune system recognizes foreign invaders and produces antibodies to fight them.", ipa:"", zh:"免疫系统识别外来入侵者并产生抗体对抗它们。", tip:""},
   {en:"Insulin regulates blood sugar. In type 2 diabetes, the body doesn't respond to it properly.", ipa:"", zh:"胰岛素调节血糖。2 型糖尿病中，身体对它的反应不正常。", tip:"regulates = 调节。"},
   {en:"Vaccines train the immune system to recognize a virus before you're exposed to it.", ipa:"", zh:"疫苗训练免疫系统在你接触病毒之前就识别它。", tip:"exposed to = 接触到。"}]},
   {h:"健康报告里的词",p:"",items:[
   {en:"blood pressure: systolic over diastolic, like 120 over 80", ipa:"", zh:"血压：收缩压 / 舒张压，如 120/80", tip:"读 one-twenty over eighty。"},
   {en:"cholesterol: LDL is the bad kind, HDL is the good kind", ipa:"", zh:"胆固醇：LDL 是坏的，HDL 是好的", tip:""},
   {en:"BMI, heart rate, blood glucose, white blood cell count", ipa:"", zh:"体重指数、心率、血糖、白细胞计数", tip:""},
   {en:"Your levels are within the normal range.", ipa:"", zh:"你的指标在正常范围内。", tip:"within the normal range。"},
   {en:"chronic vs acute: a chronic condition lasts a long time; an acute one comes on suddenly.", ipa:"", zh:"慢性 vs 急性：慢性病持续很久；急性病突然发作。", tip:"chronic 读 KRON-ik。"}]}],
  drills:[["circulatory, respiratory, digestive, nervous, immune, endocrine","六大系统"],["heart, lungs, stomach, liver, brain, kidneys","六个器官"],["The heart pumps blood through the arteries, delivering oxygen to the body's tissues.","运作"],["The immune system recognizes foreign invaders and produces antibodies to fight them.","免疫"],["blood pressure: one-twenty over eighty","血压"],["Your levels are within the normal range.","报告"]],
  ex:[
   {t:"listen",q:"听一听，说的是哪个系统？",say:"It recognizes foreign invaders and produces antibodies.",opts:["免疫系统","消化系统","循环系统","神经系统"],a:0},
   {t:"mc",q:"“diaphragm” 是？",opts:["横膈膜","气管","肺","心脏"],a:0},
   {t:"listen",q:"听一听，血压是多少？",say:"Your blood pressure is one-thirty over eighty-five.",opts:["130/85","135/80","113/85","130/58"],a:0},
   {t:"mc",q:"“chronic” 意思是？",opts:["慢性的、长期的","急性的","严重的","传染的"],a:0},
   {t:"type",q:"翻译：你的指标在正常范围内。",a:"Your levels are within the normal range.",alt:["Your levels are within the normal range","your levels are within the normal range","Your levels are in the normal range."]},
   {t:"type",q:"听写这个词（“激素”，复数）。",say:"hormones",a:"hormones"}],
  hw:[["身体地图","画一个人体简图，用英语标出 12 个器官和它们所属的系统。"],["读体检报告","拿一份英文体检报告（或网上样本），用英语读出每项指标的名字和是否在正常范围。"],["解释一个","用英语向家人解释疫苗怎么工作，三句话，用上 immune system 和 antibodies。"]]
},
{ id:"l20c4", lv:20, title:"化学基础：原子、元素与反应", goal:"掌握化学的基本词汇（元素、化合物、反应、酸碱），能读元素周期表和化学方程式，能描述日常生活中的化学。",
  intro:"化学的英语有一个好处：<b>元素符号全世界一样</b>。难的是读法（H2O 读 “H two O”）和反应的描述（react with、produce、dissolve）。本章从原子讲到反应，覆盖<b>周期表</b>、<b>化学键</b>、<b>酸碱</b>、<b>反应类型</b>，再用<b>厨房里的化学</b>（烘焙、生锈、肥皂）把它们落地。核心句式：<b>X reacts with Y to form Z</b>。",
  learn:[{h:"原子与元素",p:"",items:[
   {en:"atom, proton, neutron, electron, nucleus", ipa:"", zh:"原子、质子、中子、电子、原子核", tip:"原子核和细胞核都是 nucleus。"},
   {en:"element, compound, molecule, mixture", ipa:"", zh:"元素、化合物、分子、混合物", tip:"compound 重音在前：COM-pound。"},
   {en:"The periodic table organizes elements by atomic number.", ipa:"", zh:"元素周期表按原子序数排列元素。", tip:"periodic 读 peer-ee-OD-ik。"},
   {en:"hydrogen, carbon, nitrogen, oxygen, sodium, chlorine, iron, gold", ipa:"", zh:"氢、碳、氮、氧、钠、氯、铁、金", tip:"sodium = Na，iron = Fe，gold = Au。"},
   {en:"H2O is read as 'H two O'. CO2 is 'C O two'. NaCl is 'sodium chloride'.", say:"H two O. C O two. Sodium chloride.", ipa:"", zh:"H2O 读 “H two O”。CO2 读 “C O two”。NaCl 读“氯化钠”。", tip:"数字直接读。"}]},
   {h:"键与反应",p:"",items:[
   {en:"ionic bond, covalent bond, metallic bond", ipa:"", zh:"离子键、共价键、金属键", tip:"covalent 读 ko-VAY-lent。"},
   {en:"Sodium reacts with chlorine to form sodium chloride, which is table salt.", ipa:"", zh:"钠与氯反应生成氯化钠，也就是食盐。", tip:"reacts with… to form… 核心句式。"},
   {en:"In a chemical reaction, the reactants are transformed into products. Mass is conserved.", ipa:"", zh:"在化学反应中，反应物转化为生成物。质量守恒。", tip:"conserved = 守恒。"},
   {en:"Combustion is a reaction with oxygen that releases heat and light.", ipa:"", zh:"燃烧是与氧气的反应，释放热和光。", tip:"combustion 读 kom-BUS-chun。"},
   {en:"acid, base, pH, neutral: pH 7 is neutral, below 7 is acidic, above 7 is basic.", say:"acid, base, p H, neutral: p H 7 is neutral, below 7 is acidic, above 7 is basic.", ipa:"", zh:"酸、碱、pH、中性：pH 7 中性，低于 7 酸性，高于 7 碱性。", tip:"basic 在化学里是碱性。"},
   {en:"A catalyst speeds up a reaction without being used up.", ipa:"", zh:"催化剂加快反应而自身不被消耗。", tip:"used up = 消耗完。"}]},
   {h:"厨房里的化学",p:"",items:[
   {en:"Baking soda is a base. When it reacts with an acid like vinegar, it produces carbon dioxide, which makes the cake rise.", ipa:"", zh:"小苏打是碱。它与醋这样的酸反应产生二氧化碳，使蛋糕膨胀。", tip:"rise = 膨胀。"},
   {en:"Rust is iron reacting with oxygen and water. It's called oxidation.", ipa:"", zh:"锈是铁与氧气和水的反应。这叫氧化。", tip:"oxidation 读 ok-si-DAY-shun。"},
   {en:"Sugar dissolves in water, but oil doesn't, because oil is non-polar.", ipa:"", zh:"糖溶于水，但油不溶，因为油是非极性的。", tip:"dissolves = 溶解。"},
   {en:"Soap works because one end of the molecule attracts water and the other attracts grease.", ipa:"", zh:"肥皂有效是因为分子的一端吸引水，另一端吸引油脂。", tip:""}]}],
  drills:[["atom, proton, neutron, electron, nucleus","原子"],["element, compound, molecule, mixture","四个概念"],["H two O. C O two. Sodium chloride.","读化学式"],["Sodium reacts with chlorine to form sodium chloride, which is table salt.","reacts with to form"],["pH 7 is neutral, below 7 is acidic, above 7 is basic.","酸碱"],["Rust is iron reacting with oxygen and water. It's called oxidation.","生锈"]],
  ex:[
   {t:"listen",q:"听一听，这是什么化学式？",say:"C O two",opts:["CO2（二氧化碳）","H2O","NaCl","O2"],a:0},
   {t:"mc",q:"“X reacts with Y to form Z” 意思是？",opts:["X 与 Y 反应生成 Z","X 和 Y 组成 Z","X 变成 Y 和 Z","Z 分解为 X 和 Y"],a:0},
   {t:"mc",q:"pH 为 3 的溶液是？",opts:["酸性","碱性","中性","无法判断"],a:0},
   {t:"listen",q:"听一听，催化剂的特点是？",say:"A catalyst speeds up a reaction without being used up.",opts:["加快反应，自身不消耗","减慢反应","被消耗掉","产生热"],a:0},
   {t:"type",q:"翻译：糖溶于水。（用 dissolves）",a:"Sugar dissolves in water.",alt:["Sugar dissolves in water","sugar dissolves in water"]},
   {t:"type",q:"听写这个词（“化合物”）。",say:"compound",a:"compound"}],
  hw:[["读周期表","打开英文元素周期表，用英语读出前 20 个元素的名字。"],["厨房实验","做小苏打加醋的实验，用英语描述发生了什么（reacts with、produces、rise）。"],["找三个反应","在家找三个化学变化（生锈、烹饪、燃烧），各用一句 X reacts with Y 描述。"]]
},
{ id:"l20c5", lv:20, title:"生物统计：数据、试验与读懂医学研究", goal:"掌握生物统计和临床研究的核心词汇，能读懂医学研究的摘要和新闻报道，判断一项研究是否可信。",
  intro:"新闻天天说“研究表明……”，但<b>研究的质量差别巨大</b>。生物统计教你看门道：<b>样本量</b>（sample size）、<b>随机对照试验</b>（RCT）、<b>安慰剂</b>（placebo）、<b>p 值</b>、<b>置信区间</b>、<b>相对风险 vs 绝对风险</b>。本章教这些词，教读<b>论文摘要的结构</b>（Background、Methods、Results、Conclusion），最后教<b>五个问题</b>判断一项研究值不值得信。",
  learn:[{h:"核心术语",p:"",items:[
   {en:"sample size, population, randomized controlled trial, placebo, control group", ipa:"", zh:"样本量、总体、随机对照试验、安慰剂、对照组", tip:"placebo 读 pla-SEE-bo。"},
   {en:"double-blind: neither the patients nor the doctors know who got the real drug.", ipa:"", zh:"双盲：病人和医生都不知道谁用了真药。", tip:"金标准。"},
   {en:"mean, median, standard deviation, confidence interval", ipa:"", zh:"均值、中位数、标准差、置信区间", tip:"median 读 MEE-dee-an。"},
   {en:"The result was statistically significant, with a p-value of less than 0.05.", ipa:"", zh:"结果有统计显著性，p 值小于 0.05。", tip:"读 p less than point oh five。"},
   {en:"relative risk vs absolute risk: a fifty percent increase from two percent is only three percent.", ipa:"", zh:"相对风险 vs 绝对风险：从 2% 增加 50% 只是 3%。", tip:"新闻标题最爱用相对风险吓人。"},
   {en:"bias, confounding variable, correlation, causation", ipa:"", zh:"偏倚、混杂变量、相关、因果", tip:"confounding 读 kon-FOUND-ing。"}]},
   {h:"论文摘要的结构",p:"",items:[
   {en:"Background: Heart disease is the leading cause of death in Canada.", ipa:"", zh:"背景：心脏病是加拿大的主要死因。", tip:"leading cause of = 主要原因。"},
   {en:"Methods: We randomly assigned 2,000 patients to receive either the drug or a placebo for two years.", ipa:"", zh:"方法：我们随机分配 2000 名患者接受药物或安慰剂两年。", tip:"randomly assigned = 随机分配。"},
   {en:"Results: The drug reduced the risk of heart attack by twenty percent compared with placebo.", ipa:"", zh:"结果：与安慰剂相比，药物将心脏病发作风险降低 20%。", tip:"compared with = 与……相比。"},
   {en:"Conclusion: These findings suggest the drug is effective, but longer studies are needed.", ipa:"", zh:"结论：这些发现表明药物有效，但需要更长期的研究。", tip:"are needed = 需要。"}]},
   {h:"判断研究的五个问题",p:"",items:[
   {en:"How big was the sample? Ten people or ten thousand?", ipa:"", zh:"样本多大？十个人还是一万人？", tip:""},
   {en:"Was there a control group? Was it randomized?", ipa:"", zh:"有对照组吗？随机了吗？", tip:""},
   {en:"Was it done on humans, or on mice?", ipa:"", zh:"是在人身上做的，还是老鼠？", tip:"很多“突破”只在老鼠身上。"},
   {en:"Who funded the study?", ipa:"", zh:"谁资助的研究？", tip:""},
   {en:"Has it been peer-reviewed and replicated?", ipa:"", zh:"经过同行评审和重复验证了吗？", tip:"peer-reviewed = 同行评审；replicated = 被重复。"}]}],
  drills:[["sample size, randomized controlled trial, placebo, control group","四个词"],["double-blind: neither the patients nor the doctors know who got the real drug.","双盲"],["The result was statistically significant, with a p-value of less than 0.05.","p 值"],["We randomly assigned 2,000 patients to receive either the drug or a placebo.","方法"],["The drug reduced the risk of heart attack by twenty percent compared with placebo.","结果"],["How big was the sample? Was there a control group? Who funded the study?","三个问题"]],
  ex:[
   {t:"mc",q:"“placebo” 是？",opts:["安慰剂","真药","副作用","对照组的医生"],a:0},
   {t:"listen",q:"听一听，这是摘要的哪部分？",say:"We randomly assigned 2,000 patients to receive either the drug or a placebo.",opts:["方法","背景","结果","结论"],a:0},
   {t:"mc",q:"风险从 2% 升到 3%，新闻说“风险增加 50%”，这用的是？",opts:["相对风险","绝对风险","p 值","置信区间"],a:0},
   {t:"listen",q:"听一听，这个研究的问题是？",say:"The study was done on twelve mice and was not peer-reviewed.",opts:["样本小、老鼠、未同行评审","样本太大","没有结果","太贵"],a:0},
   {t:"type",q:"翻译：谁资助的研究？",a:"Who funded the study?",alt:["Who funded the study","who funded the study","Who funded this study?"]},
   {t:"type",q:"听写这个词（“显著的”）。",say:"significant",a:"significant"}],
  hw:[["读一篇摘要","在 PubMed 找一篇英文摘要，标出 Background、Methods、Results、Conclusion，翻译 Results 一句。"],["拆一条新闻","找一条“研究表明……”的健康新闻，用五个问题检查它，用英语写一句结论。"],["算一次","找一个用相对风险的标题，用英语说出它的绝对风险是多少。"]]
},
{ id:"l20c6", lv:20, title:"第二十级结业：读一篇论文、做一次科学汇报", goal:"能读懂一篇生命科学论文的主要内容，并用英语做一次 5 分钟的科学汇报：问题、方法、发现、意义。",
  intro:"结业任务：<b>读一篇真正的英文科学论文（或长篇科普）并做 5 分钟汇报</b>。本章先教<b>读论文的策略</b>（先摘要、再图表、再结论，最后才是方法）、<b>图表的英语</b>（x-axis、error bars、the graph shows）、<b>汇报的句式</b>，以及<b>听众提问时怎么答</b>。原则：<b>说清“他们发现了什么、怎么发现的、为什么重要”</b>，不用全懂。",
  learn:[{h:"读论文的策略",p:"",items:[
   {en:"Read the abstract first, then the figures, then the conclusion. Read the methods last.", ipa:"", zh:"先读摘要，再看图，再读结论。方法最后读。", tip:"figures = 图表。"},
   {en:"The hypothesis was that exercise improves memory in older adults.", ipa:"", zh:"假设是运动能改善老年人的记忆。", tip:"hypothesis 读 hy-POTH-e-sis。"},
   {en:"The authors found a strong correlation between sleep and immune function.", ipa:"", zh:"作者发现睡眠和免疫功能之间有很强的相关性。", tip:"the authors found = 作者发现。"},
   {en:"The limitations of the study include a small sample and a short follow-up period.", ipa:"", zh:"研究的局限包括样本小和随访期短。", tip:"limitations = 局限。好论文自己会写。"},
   {en:"Further research is needed to confirm these results.", ipa:"", zh:"需要进一步研究来证实这些结果。", tip:"每篇论文的结尾。"}]},
   {h:"图表的英语",p:"",items:[
   {en:"The x-axis shows time in weeks; the y-axis shows blood pressure.", ipa:"", zh:"x 轴显示周数；y 轴显示血压。", tip:"axis 读 AK-sis，复数 axes。"},
   {en:"The graph shows a steady decline in the treatment group.", ipa:"", zh:"图显示治疗组稳步下降。", tip:"steady decline / sharp increase / plateau。"},
   {en:"The error bars indicate the ninety-five percent confidence interval.", ipa:"", zh:"误差线表示 95% 置信区间。", tip:""},
   {en:"As you can see in Figure 2, the effect was larger in women than in men.", ipa:"", zh:"如图 2 所示，效果在女性中比男性更大。", tip:"As you can see in Figure 2。"},
   {en:"bar chart, line graph, scatter plot, table", ipa:"", zh:"柱状图、折线图、散点图、表格", tip:""}]},
   {h:"汇报与答问",p:"",items:[
   {en:"Today I'll summarize a study on how gut bacteria affect mood.", ipa:"", zh:"今天我来总结一项关于肠道细菌如何影响情绪的研究。", tip:"开场。"},
   {en:"The key finding is that patients with more diverse gut bacteria reported fewer symptoms of depression.", ipa:"", zh:"主要发现是肠道细菌更多样的患者报告的抑郁症状更少。", tip:"The key finding is that…"},
   {en:"Why does this matter? It suggests diet could be part of treatment.", ipa:"", zh:"为什么重要？它表明饮食可能是治疗的一部分。", tip:""},
   {en:"That's a good question. The study didn't test that, but I'd guess…", ipa:"", zh:"好问题。研究没测试那个，但我猜……", tip:"答不了就说研究没涉及。"},
   {en:"I'm not sure about the exact number, but I can check and get back to you.", ipa:"", zh:"我不确定具体数字，但我可以查了再回复你。", tip:""}]}],
  drills:[["Read the abstract first, then the figures, then the conclusion.","策略"],["The authors found a strong correlation between sleep and immune function.","发现"],["The limitations of the study include a small sample and a short follow-up period.","局限"],["The x-axis shows time in weeks; the y-axis shows blood pressure.","图"],["The key finding is that patients with more diverse gut bacteria reported fewer symptoms of depression.","主要发现"],["Why does this matter? It suggests diet could be part of treatment.","意义"]],
  ex:[
   {t:"mc",q:"读论文最有效的顺序是？",opts:["摘要 → 图表 → 结论 → 方法","从头到尾","方法 → 结果","只看标题"],a:0},
   {t:"listen",q:"听一听，图表显示什么？",say:"The graph shows a steady decline in the treatment group.",opts:["治疗组稳步下降","治疗组急剧上升","没有变化","对照组下降"],a:0},
   {t:"mc",q:"“limitations” 在论文里指？",opts:["研究的局限","研究的限额","研究的时间","研究的费用"],a:0},
   {t:"listen",q:"听一听，这是汇报的哪部分？",say:"Why does this matter? It suggests diet could be part of treatment.",opts:["意义","方法","开场","局限"],a:0},
   {t:"type",q:"翻译：需要进一步研究来证实这些结果。",a:"Further research is needed to confirm these results.",alt:["Further research is needed to confirm these results","More research is needed to confirm these results.","further research is needed to confirm these results"]},
   {t:"type",q:"听写这个词（“假设”）。",say:"hypothesis",a:"hypothesis"}],
  hw:[["选一篇","找一篇你感兴趣的生命科学论文或长篇科普（PubMed、Nature News、Scientific American），用策略读一遍，用英语写下：问题、方法、发现、局限。"],["画一张图","把论文里的一个结果画成图，用英语描述它（axis、shows、increase/decline）。"],["汇报（必做）","对至少两个人做 5 分钟英语汇报（问题 → 方法 → 发现 → 意义），回答两个提问。"]]
},
/* ===== 第二十一级 · 物理科学与太空 Physical Sciences & Space ===== */
{ id:"l21c1", lv:21, title:"物理学入门：运动、力与牛顿定律", goal:"掌握经典力学的核心词汇和牛顿三定律的英语表述，能描述日常生活中的运动和力。",
  intro:"物理的英语有两层：<b>术语</b>（velocity、acceleration、friction）和<b>数学语言</b>（is proportional to、equals、per second squared）。本章从最直观的部分开始：<b>运动</b>和<b>力</b>。牛顿三定律是物理课的第一周，也是最常被引用的科学句子（“每个作用力都有反作用力”）。学会<b>用英语描述一个物体怎么动、为什么动</b>，后面的能量、电学就有了基础。",
  learn:[{h:"运动",p:"",items:[
   {en:"distance, displacement, speed, velocity, acceleration", ipa:"", zh:"距离、位移、速率、速度、加速度", tip:"velocity 有方向，speed 没有。"},
   {en:"metres per second, metres per second squared, kilometres per hour", ipa:"", zh:"米每秒、米每二次方秒、千米每小时", tip:"m/s² 读 metres per second squared。"},
   {en:"The car accelerated from zero to one hundred kilometres per hour in six seconds.", ipa:"", zh:"车在六秒内从 0 加速到 100 公里每小时。", tip:"accelerated from… to… in…"},
   {en:"An object in free fall accelerates at nine point eight metres per second squared.", ipa:"", zh:"自由落体以 9.8 米每二次方秒加速。", tip:"读 nine point eight。"},
   {en:"Speed is distance divided by time.", ipa:"", zh:"速率是距离除以时间。", tip:"divided by = 除以。"}]},
   {h:"力与牛顿定律",p:"",items:[
   {en:"force, mass, weight, gravity, friction, momentum", ipa:"", zh:"力、质量、重量、重力、摩擦力、动量", tip:"mass 和 weight 不同：质量不变，重量随重力变。"},
   {en:"Newton's first law: an object at rest stays at rest, and an object in motion stays in motion, unless acted on by a force.", ipa:"", zh:"牛顿第一定律：静止的物体保持静止，运动的物体保持运动，除非受到力的作用。", tip:"unless acted on by = 除非受到……作用。"},
   {en:"Newton's second law: force equals mass times acceleration. F equals m a.", ipa:"", zh:"牛顿第二定律：力等于质量乘以加速度。F = ma。", tip:"times = 乘以。"},
   {en:"Newton's third law: for every action, there is an equal and opposite reaction.", ipa:"", zh:"牛顿第三定律：每个作用力都有一个大小相等、方向相反的反作用力。", tip:"最常被引用的物理句。"},
   {en:"Friction opposes motion. That's why a sliding box eventually stops.", ipa:"", zh:"摩擦力阻碍运动。所以滑动的箱子最终会停下。", tip:"opposes = 阻碍。"},
   {en:"The heavier the object, the more force it takes to accelerate it.", ipa:"", zh:"物体越重，加速它需要的力越大。", tip:"The more…, the more… 句式。"}]},
   {h:"数学语言",p:"",items:[
   {en:"is proportional to / is inversely proportional to", ipa:"", zh:"与……成正比 / 与……成反比", tip:"inversely 读 in-VERS-lee。"},
   {en:"The gravitational force is inversely proportional to the square of the distance.", ipa:"", zh:"引力与距离的平方成反比。", tip:"the square of = 平方。"},
   {en:"equals, plus, minus, times, divided by, squared, the square root of", ipa:"", zh:"等于、加、减、乘、除以、平方、平方根", tip:""},
   {en:"If we double the mass, the force doubles too.", ipa:"", zh:"如果质量加倍，力也加倍。", tip:"double = 加倍。"}]}],
  drills:[["distance, speed, velocity, acceleration","运动四词"],["force, mass, weight, gravity, friction, momentum","力六词"],["Newton's first law: an object at rest stays at rest unless acted on by a force.","第一定律"],["Newton's second law: force equals mass times acceleration.","第二定律"],["For every action, there is an equal and opposite reaction.","第三定律"],["The gravitational force is inversely proportional to the square of the distance.","成反比"]],
  ex:[
   {t:"mc",q:"“acceleration” 是？",opts:["加速度","速度","距离","力"],a:0},
   {t:"listen",q:"听一听，这是哪条定律？",say:"For every action, there is an equal and opposite reaction.",opts:["牛顿第三定律","牛顿第一定律","牛顿第二定律","万有引力"],a:0},
   {t:"mc",q:"“is inversely proportional to” 意思是？",opts:["与……成反比","与……成正比","等于","大于"],a:0},
   {t:"listen",q:"听一听，这个公式是？",say:"Force equals mass times acceleration.",opts:["F = ma","F = m/a","F = m + a","F = a/m"],a:0},
   {t:"type",q:"翻译：速率是距离除以时间。",a:"Speed is distance divided by time.",alt:["Speed is distance divided by time","speed is distance divided by time","Speed equals distance divided by time."]},
   {t:"type",q:"听写这个词（“摩擦力”）。",say:"friction",a:"friction"}],
  hw:[["描述三个运动","用英语描述今天看到的三个运动（公交车启动、球落地、刹车），用上 accelerate、friction、force。"],["读公式","把 F = ma、v = d/t、a = Δv/t 用英语完整读出来。"],["解释一条定律","用英语向家人解释牛顿第一定律，举一个汽车急刹车的例子。"]]
},
{ id:"l21c2", lv:21, title:"能量、热与波", goal:"掌握能量的形式和守恒、热传递、声波和光波的英语，能解释日常现象（为什么金属摸起来冷、为什么天空是蓝的）。",
  intro:"能量是物理里<b>最常进入日常对话的概念</b>：电费（kilowatt-hours）、食物（calories）、节能（efficiency）。本章教<b>能量的形式</b>（kinetic、potential、thermal、chemical）、<b>守恒定律</b>、<b>热传递三种方式</b>（conduction、convection、radiation）和<b>波</b>（frequency、wavelength、spectrum）。然后用这些解释几个每个人都好奇的现象。",
  learn:[{h:"能量",p:"",items:[
   {en:"kinetic energy, potential energy, thermal energy, chemical energy, electrical energy", ipa:"", zh:"动能、势能、热能、化学能、电能", tip:"kinetic 读 ki-NET-ik。"},
   {en:"Energy cannot be created or destroyed, only converted from one form to another.", ipa:"", zh:"能量不能被创造或毁灭，只能从一种形式转化为另一种。", tip:"能量守恒定律。"},
   {en:"A ball at the top of a hill has potential energy. As it rolls down, it's converted to kinetic energy.", ipa:"", zh:"山顶的球有势能。滚下来时转化为动能。", tip:""},
   {en:"joule, calorie, kilowatt-hour, watt", ipa:"", zh:"焦耳、卡路里、千瓦时、瓦", tip:"电费按 kilowatt-hours 算；watt 是功率（每秒的能量）。"},
   {en:"A sixty-watt bulb uses sixty joules of energy every second.", ipa:"", zh:"60 瓦的灯泡每秒用 60 焦耳的能量。", tip:""},
   {en:"Efficiency is the useful energy out divided by the total energy in.", ipa:"", zh:"效率是有用能量输出除以总能量输入。", tip:"LED 灯效率高，白炽灯大部分变成热。"}]},
   {h:"热",p:"",items:[
   {en:"heat, temperature, conduction, convection, radiation, insulation", ipa:"", zh:"热、温度、传导、对流、辐射、隔热", tip:"heat 是能量，temperature 是度量。"},
   {en:"Metal feels cold because it conducts heat away from your hand quickly.", ipa:"", zh:"金属摸起来冷，因为它快速把热从你手上传导走。", tip:"conducts heat away = 把热传走。"},
   {en:"Hot air rises and cold air sinks. That's convection, and it's why the upstairs is warmer.", ipa:"", zh:"热空气上升，冷空气下沉。这是对流，所以楼上更暖。", tip:""},
   {en:"The sun warms the Earth by radiation, through empty space.", ipa:"", zh:"太阳通过辐射穿过真空温暖地球。", tip:""},
   {en:"Good insulation keeps heat in during winter and out during summer.", ipa:"", zh:"好的隔热冬天留住热，夏天挡住热。", tip:"加拿大房子的 R-value 就是隔热值。"}]},
   {h:"波",p:"",items:[
   {en:"wave, frequency, wavelength, amplitude, hertz", ipa:"", zh:"波、频率、波长、振幅、赫兹", tip:"frequency 读 FREE-kwen-see。"},
   {en:"Sound is a wave that needs a medium. It can't travel through a vacuum.", ipa:"", zh:"声音是需要介质的波。它不能在真空中传播。", tip:"medium = 介质；vacuum 读 VAK-yoom。"},
   {en:"Light travels at about three hundred thousand kilometres per second.", ipa:"", zh:"光以约每秒 30 万公里的速度传播。", tip:""},
   {en:"The electromagnetic spectrum includes radio waves, microwaves, visible light, and X-rays.", ipa:"", zh:"电磁波谱包括无线电波、微波、可见光和 X 射线。", tip:"spectrum 读 SPEK-trum。"},
   {en:"The sky is blue because air scatters blue light more than red light.", ipa:"", zh:"天空是蓝的，因为空气散射蓝光比红光多。", tip:"scatters = 散射。"}]}],
  drills:[["kinetic energy, potential energy, thermal energy, chemical energy","能量形式"],["Energy cannot be created or destroyed, only converted from one form to another.","守恒"],["conduction, convection, radiation","热传递"],["Metal feels cold because it conducts heat away from your hand quickly.","解释"],["wave, frequency, wavelength, amplitude","波"],["The sky is blue because air scatters blue light more than red light.","蓝天"]],
  ex:[
   {t:"mc",q:"山顶的球有什么能量？",opts:["势能","动能","热能","化学能"],a:0},
   {t:"listen",q:"听一听，这是哪种热传递？",say:"Hot air rises and cold air sinks.",opts:["对流","传导","辐射","隔热"],a:0},
   {t:"mc",q:"电费单上的单位 “kilowatt-hour” 是？",opts:["能量单位","功率单位","温度单位","频率单位"],a:0},

{ id:"l21c3", lv:21, title:"电与磁：电路、电器与安全", goal:"掌握电学的基本词汇（电流、电压、电阻、电路），能读懂电器标签和家里的电路，理解用电安全。",
  intro:"电是物理里<b>最实用</b>的部分：家里的断路器、电器的功率、充电器的电压，都是电学词汇。本章教<b>三个基本量</b>（current、voltage、resistance）和<b>欧姆定律</b>、<b>电路</b>（series、parallel）、<b>家用电</b>（120 伏、断路器、接地）和<b>磁</b>。最后是<b>安全</b>——为什么不能用湿手摸插座、为什么要接地。衔接第十四级的家庭维修。",
  learn:[{h:"基本量",p:"",items:[
   {en:"current (amps), voltage (volts), resistance (ohms), power (watts)", ipa:"", zh:"电流（安培）、电压（伏特）、电阻（欧姆）、功率（瓦）", tip:"amps 读 /æmps/；ohms 读 /oʊmz/。"},
   {en:"Ohm's law: voltage equals current times resistance. V equals I R.", ipa:"", zh:"欧姆定律：电压等于电流乘以电阻。V = IR。", tip:"电流用 I 表示。"},
   {en:"Power equals voltage times current. A 1,200-watt kettle on 120 volts draws 10 amps.", ipa:"", zh:"功率等于电压乘以电流。1200 瓦的水壶在 120 伏下用 10 安培。", tip:"draws = 消耗（电流）。"},
   {en:"Think of voltage as water pressure, current as flow, and resistance as the pipe's narrowness.", ipa:"", zh:"把电压想成水压，电流想成流量，电阻想成管子的窄。", tip:"经典比喻。"},
   {en:"conductor vs insulator: copper conducts; rubber insulates.", ipa:"", zh:"导体 vs 绝缘体：铜导电；橡胶绝缘。", tip:""}]},
   {h:"电路与家用电",p:"",items:[
   {en:"circuit, switch, battery, resistor, series, parallel", ipa:"", zh:"电路、开关、电池、电阻器、串联、并联", tip:""},
   {en:"In a series circuit, if one bulb burns out, they all go out. In parallel, the others stay on.", ipa:"", zh:"串联电路中一个灯泡坏了全灭。并联中其他的还亮。", tip:"家里的插座是并联。"},
   {en:"North American outlets are 120 volts. Large appliances like dryers use 240.", ipa:"", zh:"北美插座是 120 伏。烘干机等大电器用 240。", tip:"中国是 220 伏，带来的电器要看电压。"},
   {en:"A breaker trips when the circuit draws more current than it's rated for.", ipa:"", zh:"当电路电流超过额定值时，断路器跳闸。", tip:"rated for = 额定。15 安培的电路最多约 1800 瓦。"},
   {en:"The third prong is the ground. It gives a safe path for stray current.", ipa:"", zh:"第三个插脚是地线。它给杂散电流一条安全通路。", tip:"prong = 插脚。"},
   {en:"AC vs DC: the wall is alternating current; batteries are direct current.", ipa:"", zh:"交流 vs 直流：墙上是交流电；电池是直流电。", tip:""}]},
   {h:"磁与安全",p:"",items:[
   {en:"A magnet has a north and a south pole. Opposite poles attract; like poles repel.", ipa:"", zh:"磁铁有北极和南极。异极相吸；同极相斥。", tip:"repel = 排斥。"},
   {en:"Moving a magnet through a coil of wire generates electricity. That's how generators work.", ipa:"", zh:"让磁铁穿过线圈产生电。发电机就是这样工作的。", tip:"coil = 线圈。"},
   {en:"Water conducts electricity. Never touch an outlet or appliance with wet hands.", ipa:"", zh:"水导电。永远不要用湿手摸插座或电器。", tip:""},
   {en:"Don't overload a power bar. Add up the watts.", ipa:"", zh:"不要让插线板超载。把瓦数加起来。", tip:"power bar = 插线板（加拿大说法）。"},
   {en:"If a cord is frayed, replace it. Exposed wire can cause a fire or a shock.", ipa:"", zh:"电线磨损了就换。裸露的线会引起火灾或触电。", tip:"frayed = 磨损；shock = 触电。"}]}],
  drills:[["current, voltage, resistance, power","四个量"],["Ohm's law: voltage equals current times resistance.","欧姆定律"],["In a series circuit, if one bulb burns out, they all go out. In parallel, the others stay on.","串联 / 并联"],["North American outlets are 120 volts.","电压"],["A breaker trips when the circuit draws more current than it's rated for.","跳闸"],["Water conducts electricity. Never touch an outlet with wet hands.","安全"]],
  ex:[
   {t:"mc",q:"电压的单位是？",opts:["伏特","安培","欧姆","瓦"],a:0},
   {t:"listen",q:"听一听，这是什么电路？",say:"If one bulb burns out, they all go out.",opts:["串联","并联","短路","开路"],a:0},
   {t:"mc",q:"北美插座电压是？",opts:["120 伏","220 伏","240 伏","110 伏"],a:0},
   {t:"listen",q:"听一听，为什么跳闸？",say:"The circuit draws more current than it's rated for.",opts:["电流超过额定值","电压太低","电线太长","开关坏了"],a:0},
   {t:"type",q:"翻译：异极相吸，同极相斥。",a:"Opposite poles attract; like poles repel.",alt:["Opposite poles attract; like poles repel","Opposite poles attract, like poles repel.","Opposite poles attract and like poles repel."]},
   {t:"type",q:"听写这个词（“电路”）。",say:"circuit",a:"circuit"}],
  hw:[["读三个标签","找三个电器的标签，用英语读出电压、瓦数，算出电流（watts ÷ volts）。"],["看配电箱","打开家里的配电箱，用英语读出每个断路器的安培数和标签。"],["算一次","用英语算出一个 15 安培电路能同时带多少瓦，列出厨房里哪些电器不能同时开。"]]

{ id:"l21c4", lv:21, title:"地球与太阳系", goal:"掌握太阳系、地球结构、季节和月相的英语，能解释日食、潮汐、为什么有季节。",
  intro:"太空是<b>孩子问得最多、大人答不上来</b>的领域：为什么有季节？月亮为什么变？火星能住人吗？本章从<b>太阳系</b>（八大行星的顺序和特点）到<b>地球</b>（结构、自转公转、季节）到<b>月亮</b>（月相、潮汐、日食月食）。教科书句式：<b>orbits、rotates、is tilted、is made of</b>。",
  learn:[{h:"太阳系",p:"",items:[
   {en:"Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune", ipa:"", zh:"水星、金星、地球、火星、木星、土星、天王星、海王星", tip:"口诀：My Very Educated Mother Just Served Us Noodles。"},
   {en:"The inner planets are rocky; the outer planets are gas giants.", ipa:"", zh:"内行星是岩石的；外行星是气态巨行星。", tip:""},
   {en:"The Earth orbits the Sun once a year and rotates on its axis once a day.", ipa:"", zh:"地球每年绕太阳公转一圈，每天绕轴自转一圈。", tip:"orbits = 公转；rotates = 自转。"},
   {en:"Jupiter is the largest planet. Over 1,300 Earths could fit inside it.", ipa:"", zh:"木星是最大的行星。能装下 1300 多个地球。", tip:""},
   {en:"The Sun is a star, a giant ball of hydrogen and helium undergoing nuclear fusion.", ipa:"", zh:"太阳是一颗恒星，一个正在进行核聚变的巨大氢氦球。", tip:"fusion 读 FYOO-zhun。"},
   {en:"Light from the Sun takes about eight minutes to reach Earth.", ipa:"", zh:"太阳光到达地球约需八分钟。", tip:""}]},
   {h:"地球",p:"",items:[
   {en:"crust, mantle, core; atmosphere, hydrosphere", ipa:"", zh:"地壳、地幔、地核；大气层、水圈", tip:"mantle 读 MAN-tl。"},
   {en:"The Earth's axis is tilted by 23.5 degrees. That tilt causes the seasons.", ipa:"", zh:"地轴倾斜 23.5 度。这个倾斜造成季节。", tip:"不是因为离太阳远近！"},
   {en:"When the Northern Hemisphere is tilted toward the Sun, it's summer in Canada.", ipa:"", zh:"当北半球朝向太阳倾斜时，加拿大是夏天。", tip:"hemisphere 读 HEM-is-feer。"},
   {en:"Tectonic plates move a few centimetres a year, causing earthquakes and volcanoes.", ipa:"", zh:"构造板块每年移动几厘米，引起地震和火山。", tip:"tectonic 读 tek-TON-ik。"},
   {en:"The atmosphere is mostly nitrogen and oxygen, with a little carbon dioxide that traps heat.", ipa:"", zh:"大气主要是氮和氧，还有少量能困住热量的二氧化碳。", tip:"traps heat = 温室效应。"}]},
   {h:"月亮",p:"",items:[
   {en:"new moon, crescent, half moon, full moon; the phases of the moon", ipa:"", zh:"新月、娥眉月、半月、满月；月相", tip:"crescent 读 KRES-ent。"},
   {en:"The Moon doesn't make its own light. We see the part lit by the Sun.", ipa:"", zh:"月亮不发光。我们看到的是被太阳照亮的部分。", tip:""},
   {en:"The Moon's gravity pulls on the oceans, causing two high tides a day.", ipa:"", zh:"月亮的引力拉动海洋，造成每天两次涨潮。", tip:"tides = 潮汐。"},
   {en:"A solar eclipse happens when the Moon passes between the Sun and the Earth.", ipa:"", zh:"日食发生在月亮经过太阳和地球之间时。", tip:"eclipse 读 i-KLIPS。"},
   {en:"A lunar eclipse happens when the Earth's shadow falls on the Moon.", ipa:"", zh:"月食发生在地球的影子落在月亮上时。", tip:""}]}],
  drills:[["Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune","八大行星"],["The Earth orbits the Sun once a year and rotates on its axis once a day.","公转自转"],["The Earth's axis is tilted by 23.5 degrees. That tilt causes the seasons.","季节"],["crust, mantle, core; atmosphere, hydrosphere","地球结构"],["The Moon's gravity pulls on the oceans, causing two high tides a day.","潮汐"],["A solar eclipse happens when the Moon passes between the Sun and the Earth.","日食"]],
  ex:[
   {t:"mc",q:"季节是由什么造成的？",opts:["地轴的倾斜","地球离太阳的远近","月亮","太阳的温度变化"],a:0},
   {t:"listen",q:"听一听，这是日食还是月食？",say:"The Earth's shadow falls on the Moon.",opts:["月食","日食","新月","满月"],a:0},
   {t:"mc",q:"“orbits” 和 “rotates” 的区别？",opts:["公转 / 自转","自转 / 公转","一样","都是倾斜"],a:0},
   {t:"listen",q:"听一听，太阳光到地球要多久？",say:"Light from the Sun takes about eight minutes to reach Earth.",opts:["约 8 分钟","约 8 秒","约 8 小时","约 8 天"],a:0},
   {t:"type",q:"翻译：木星是最大的行星。",a:"Jupiter is the largest planet.",alt:["Jupiter is the largest planet","jupiter is the largest planet","Jupiter is the biggest planet."]},
   {t:"type",q:"听写这个词（“半球”）。",say:"hemisphere",a:"hemisphere"}],
  hw:[["背行星","用英语口诀背出八大行星顺序，说给一个孩子听。"],["看月亮","连续三天看月亮，用英语记下月相（crescent、half、full）。"],["解释季节","用英语向家人解释为什么有季节（tilt，不是距离），两句话。"]]

{ id:"l21c5", lv:21, title:"宇宙与太空探索", goal:"掌握天文学和太空探索的英语，能读懂太空新闻（火箭发射、火星任务、黑洞照片），能讨论宇宙的大问题。",
  intro:"太空新闻是<b>科学新闻里最受欢迎的</b>：SpaceX 发射、韦伯望远镜的照片、黑洞、外星生命。本章教<b>宇宙的尺度</b>（light-year、galaxy、Big Bang）、<b>天体</b>（star、black hole、nebula）、<b>太空探索</b>（rocket、orbit、ISS、rover、Canadarm）和<b>加拿大在太空中的角色</b>。还有<b>讨论大问题的句式</b>：Is there life elsewhere? What happened before the Big Bang?",
  learn:[{h:"宇宙",p:"",items:[
   {en:"universe, galaxy, the Milky Way, solar system, light-year", ipa:"", zh:"宇宙、星系、银河系、太阳系、光年", tip:"light-year 是距离，不是时间。"},
   {en:"A light-year is the distance light travels in one year: about nine and a half trillion kilometres.", ipa:"", zh:"一光年是光一年走的距离：约 9.5 万亿公里。", tip:"trillion = 万亿。"},
   {en:"The Big Bang happened about 13.8 billion years ago, and the universe has been expanding ever since.", ipa:"", zh:"大爆炸发生在约 138 亿年前，宇宙从那以后一直在膨胀。", tip:"billion = 十亿。"},
   {en:"star, supernova, black hole, nebula, exoplanet", ipa:"", zh:"恒星、超新星、黑洞、星云、系外行星", tip:"nebula 读 NEB-yoo-la。"},
   {en:"A black hole's gravity is so strong that not even light can escape.", ipa:"", zh:"黑洞的引力强到连光都无法逃脱。", tip:"so… that… 句式。"},
   {en:"When we look at a distant star, we're seeing light that left it thousands of years ago.", ipa:"", zh:"当我们看一颗遥远的星星，看到的是几千年前离开它的光。", tip:""}]},
   {h:"太空探索",p:"",items:[
   {en:"rocket, launch, orbit, satellite, space station, astronaut, rover, probe", ipa:"", zh:"火箭、发射、轨道、卫星、空间站、宇航员、探测车、探测器", tip:"rover = 在星球表面开的车。"},
   {en:"The International Space Station orbits Earth every ninety minutes.", ipa:"", zh:"国际空间站每 90 分钟绕地球一圈。", tip:""},
   {en:"The rocket launched successfully and the booster landed back on the pad.", ipa:"", zh:"火箭成功发射，助推器降落回发射台。", tip:"booster = 助推器。"},
   {en:"The rover is searching for signs of ancient life on Mars.", ipa:"", zh:"探测车在火星上寻找古代生命的迹象。", tip:"signs of = 迹象。"},
   {en:"Canada built the Canadarm, the robotic arm used on the Space Shuttle and the ISS.", ipa:"", zh:"加拿大建造了加拿大臂，用于航天飞机和空间站的机械臂。", tip:"5 元纸币上有。"},
   {en:"Canadian astronauts include Chris Hadfield and Jeremy Hansen.", ipa:"", zh:"加拿大宇航员包括 Chris Hadfield 和 Jeremy Hansen。", tip:"Hansen 是 Artemis II 绕月任务的成员。"}]},
   {h:"大问题",p:"",items:[
   {en:"Is there life elsewhere in the universe? Given the number of planets, many scientists think it's likely.", ipa:"", zh:"宇宙其他地方有生命吗？考虑到行星的数量，许多科学家认为很可能。", tip:"Given = 考虑到。"},
   {en:"We don't know what dark matter is, but it makes up most of the universe's mass.", ipa:"", zh:"我们不知道暗物质是什么，但它占宇宙质量的大部分。", tip:"makes up = 占。"},
   {en:"Could humans live on Mars? Maybe, but it would be extremely hard.", ipa:"", zh:"人类能住在火星吗？也许，但会极其困难。", tip:""},

  drills:[["universe, galaxy, the Milky Way, solar system, light-year","尺度"],["The Big Bang happened about 13.8 billion years ago, and the universe has been expanding ever since.","大爆炸"],["A black hole's gravity is so strong that not even light can escape.","黑洞"],["rocket, launch, orbit, satellite, space station, astronaut, rover","探索词"],["The rover is searching for signs of ancient life on Mars.","火星"],["Is there life elsewhere in the universe? That's one of the biggest unanswered questions in science.","大问题"]],

   {t:"listen",q:"听一听，发生了什么？",say:"The rocket launched successfully and the booster landed back on the pad.",opts:["发射成功，助推器回收","发射失败","火箭爆炸","宇航员返回"],a:0},

{ id:"l21c6", lv:21, title:"第二十一级结业：科学方法与一次家庭实验", goal:"掌握科学方法的英语（假设、变量、对照、结论），能设计并用英语记录和汇报一次简单的实验。",
  intro:"结业任务：<b>设计并完成一次家庭实验，用英语写实验报告并汇报</b>。本章先教<b>科学方法</b>的步骤和词汇（question、hypothesis、independent/dependent variable、control、procedure、data、conclusion）、<b>实验报告的格式</b>、<b>测量和误差</b>的语言，以及<b>伪科学 vs 科学</b>的区分——这是培养孩子（和自己）科学思维的核心。",
  learn:[{h:"科学方法",p:"",items:[
   {en:"Ask a question. Form a hypothesis. Test it. Analyze the data. Draw a conclusion.", ipa:"", zh:"提出问题。形成假设。测试。分析数据。得出结论。", tip:"draw a conclusion = 得出结论。"},
   {en:"A hypothesis is a testable prediction: 'If I water the plant more, then it will grow taller.'", ipa:"", zh:"假设是可检验的预测：“如果我多浇水，植物就会长得更高。”", tip:"If…, then… 是假设的标准格式。"},
   {en:"The independent variable is what you change. The dependent variable is what you measure.", ipa:"", zh:"自变量是你改变的。因变量是你测量的。", tip:""},
   {en:"Keep everything else the same. Those are the controlled variables.", ipa:"", zh:"其他一切保持不变。那些是控制变量。", tip:""},
   {en:"Repeat the experiment at least three times to make sure the result is reliable.", ipa:"", zh:"至少重复实验三次以确保结果可靠。", tip:""},
   {en:"If the data doesn't support the hypothesis, that's still a result. Revise and try again.", ipa:"", zh:"如果数据不支持假设，那仍然是结果。修改再试。", tip:"revise = 修改。"}]},
   {h:"实验报告",p:"",items:[
   {en:"Title. Question. Hypothesis. Materials. Procedure. Results. Conclusion.", ipa:"", zh:"标题。问题。假设。材料。步骤。结果。结论。", tip:"学校实验报告的七部分。"},
   {en:"Materials: three identical cups, soil, bean seeds, water, a ruler.", ipa:"", zh:"材料：三个相同的杯子、土、豆种、水、一把尺。", tip:"identical = 相同的。"},
   {en:"Procedure: Step one, fill each cup with soil. Step two, plant one seed in each.", ipa:"", zh:"步骤：第一步，每个杯子装土。第二步，每个种一粒种子。", tip:"用祈使句。"},
   {en:"Results: Cup A grew 12 centimetres, Cup B 8, and Cup C 3.", ipa:"", zh:"结果：杯 A 长了 12 厘米，杯 B 8 厘米，杯 C 3 厘米。", tip:""},
   {en:"Conclusion: The data supports the hypothesis. More water led to more growth, up to a point.", ipa:"", zh:"结论：数据支持假设。更多水带来更多生长，到一定程度为止。", tip:"up to a point = 到一定程度。"}]},
   {h:"测量与科学思维",p:"",items:[
   {en:"Measure to the nearest millimetre. Record your measurements in a table.", ipa:"", zh:"测量到最接近的毫米。把测量记录在表格里。", tip:"to the nearest = 精确到。"},
   {en:"There's always some error. That's why we take the average of several trials.", ipa:"", zh:"总有一些误差。所以我们取几次试验的平均值。", tip:"trials = 试验次数。"},
   {en:"Science is falsifiable: a claim must be testable and could be proven wrong.", ipa:"", zh:"科学是可证伪的：主张必须可检验，并且可能被证明是错的。", tip:"falsifiable 读 FAL-si-fy-a-bl。"},

{ id:"l22c1", lv:22, title:"用英语说数学：数字、运算与读公式", goal:"能用英语读出数字、分数、小数、百分比、指数和基本公式，听懂数学课的口头表达。",
  intro:"中国学习者的数学通常比本地人好，但<b>用英语读不出来</b>：3/4 怎么说？x² 怎么说？“解方程”怎么说？本章专门解决<b>读法</b>：数字（包括大数和负数）、分数、小数、百分比、指数和根号、常见符号，以及<b>运算的动词</b>（add、subtract、multiply、divide、simplify、solve）。学会了，数学课的每一句你都能跟上。",
  learn:[{h:"数字与分数",p:"",items:[

   {en:"one half, one third, two thirds, three quarters, five eighths", ipa:"", zh:"1/2、1/3、2/3、3/4、5/8", tip:"分子基数，分母序数；分子大于 1 时分母加 s。"},
   {en:"seven over twelve; one and a half; twenty-five percent; a ratio of three to one", ipa:"", zh:"7/12；一又二分之一；25%；3:1 的比", tip:"复杂分数读 over。"},
   {en:"x squared, x cubed, x to the power of five, the square root of sixteen", ipa:"", zh:"x 的平方、x 的立方、x 的五次方、16 的平方根", tip:"to the power of = 次方。"},
   {en:"plus, minus, times, divided by, equals, is greater than, is less than, is approximately", ipa:"", zh:"加、减、乘、除以、等于、大于、小于、约等于", tip:""}]},
   {h:"读公式",p:"",items:[
   {en:"Three x plus five equals twenty. Solve for x.", ipa:"", zh:"3x + 5 = 20。解 x。", tip:"solve for x = 解出 x。"},
   {en:"a squared plus b squared equals c squared.", ipa:"", zh:"a² + b² = c²。", tip:"勾股定理（Pythagorean theorem）。"},
   {en:"y equals m x plus b, where m is the slope and b is the y-intercept.", ipa:"", zh:"y = mx + b，其中 m 是斜率，b 是 y 截距。", tip:"where = 其中。"},
   {en:"The area of a circle is pi r squared.", ipa:"", zh:"圆的面积是 πr²。", tip:"pi 读 /paɪ/。"},
   {en:"f of x equals two x minus one. What is f of three?", ipa:"", zh:"f(x) = 2x − 1。f(3) 是多少？", tip:"f(x) 读 f of x。"},
   {en:"open bracket, close bracket; the quantity x plus one, squared", ipa:"", zh:"左括号、右括号；(x+1)²", tip:"the quantity… 用来读括号。"}]},
   {h:"运算动词与课堂",p:"",items:[
   {en:"add, subtract, multiply, divide, simplify, factor, expand, substitute", ipa:"", zh:"加、减、乘、除、化简、因式分解、展开、代入", tip:""},
   {en:"Simplify the expression. Factor the polynomial. Expand the brackets.", ipa:"", zh:"化简表达式。分解多项式。展开括号。", tip:"polynomial 读 pol-i-NO-mee-al。"},
   {en:"Substitute three for x and evaluate.", ipa:"", zh:"把 3 代入 x 并求值。", tip:"evaluate = 求值。"},
   {en:"Round to two decimal places. / Round to the nearest whole number.", ipa:"", zh:"四舍五入到两位小数。/ 四舍五入到整数。", tip:""},
   {en:"Show your work. / Check your answer by plugging it back in.", ipa:"", zh:"写出过程。/ 把答案代回去检验。", tip:"plug in = 代入（口语）。"},
   {en:"I got a different answer. Can we go through it step by step?", ipa:"", zh:"我得到了不同的答案。我们能一步步过一遍吗？", tip:"go through = 过一遍。"}]}],

   {t:"type",q:"听写这个词（“化简”）。",say:"simplify",a:"simplify"}],

{ id:"l22c2", lv:22, title:"代数与函数：方程、图像与变化", goal:"掌握代数和函数的英语（变量、方程、不等式、函数、图像），能描述函数的行为，能读懂数学题。",
  intro:"代数是<b>用字母表示数</b>，函数是<b>一个量怎么随另一个量变</b>。它们的英语主要是<b>描述关系</b>：linear、quadratic、exponential；increasing、decreasing；slope、intercept。本章教<b>方程与不等式</b>、<b>函数的类型和图像</b>、以及<b>读应用题</b>——应用题（word problems）是英语学习者最难的，因为要先翻译文字再算。",
  learn:[{h:"方程与不等式",p:"",items:[
   {en:"variable, constant, coefficient, expression, equation, inequality", ipa:"", zh:"变量、常数、系数、表达式、方程、不等式", tip:"coefficient 读 ko-e-FISH-ent。"},
   {en:"In 3x + 2, three is the coefficient and two is the constant.", ipa:"", zh:"在 3x + 2 中，3 是系数，2 是常数。", tip:""},
   {en:"To solve, isolate the variable: subtract two from both sides, then divide by three.", ipa:"", zh:"解法：把变量孤立出来：两边减 2，再除以 3。", tip:"isolate = 孤立；both sides = 两边。"},
   {en:"A linear equation has one solution; a quadratic can have two, one, or none.", ipa:"", zh:"一次方程有一个解；二次方程可能有两个、一个或没有解。", tip:"quadratic 读 kwa-DRAT-ik。"},
   {en:"x is greater than or equal to five.", ipa:"", zh:"x ≥ 5。", tip:"≤ 读 less than or equal to。"},
   {en:"a system of equations: two equations, two unknowns", ipa:"", zh:"方程组：两个方程，两个未知数", tip:"unknowns = 未知数。"}]},
   {h:"函数与图像",p:"",items:[
   {en:"function, input, output, domain, range", ipa:"", zh:"函数、输入、输出、定义域、值域", tip:"range 读 /reɪndʒ/。"},
   {en:"linear, quadratic, exponential, logarithmic; parabola", ipa:"", zh:"线性、二次、指数、对数；抛物线", tip:"exponential 读 ek-spo-NEN-shul。"},
   {en:"The function is increasing on this interval and decreasing on that one.", ipa:"", zh:"函数在这个区间递增，在那个区间递减。", tip:"interval = 区间。"},
   {en:"The slope tells you the rate of change: how much y changes for each unit of x.", ipa:"", zh:"斜率告诉你变化率：x 每变一个单位 y 变多少。", tip:"rate of change = 变化率。"},
   {en:"The graph crosses the x-axis at two and negative three. Those are the roots.", ipa:"", zh:"图像在 2 和 −3 处穿过 x 轴。那些是根。", tip:"roots = 根（解）。"},
   {en:"Exponential growth doubles at a constant rate. That's why it gets so big so fast.", ipa:"", zh:"指数增长以恒定速率翻倍。所以它变大得那么快。", tip:"疫情、复利都是指数。"}]},
   {h:"读应用题",p:"",items:[
   {en:"A train leaves at 2 p.m. travelling at 80 km/h. How far has it gone by 5 p.m.?", ipa:"", zh:"一列火车下午 2 点出发，时速 80 公里。到 5 点走了多远？", tip:"读题三步：找已知、找问题、列式。"},
   {en:"Let x be the number of apples. Then the cost is 2x.", ipa:"", zh:"设 x 为苹果数。那么成本是 2x。", tip:"Let x be = 设 x 为。"},
   {en:"'Twice as many as' means multiply by two; 'five more than' means add five.", ipa:"", zh:"“是……的两倍”意思是乘 2；“比……多 5”意思是加 5。", tip:"应用题的关键短语。"},
   {en:"'Per' means divide; 'of' usually means multiply; 'is' means equals.", ipa:"", zh:"“每”意思是除；“的”通常是乘；“是”意思是等于。", tip:"20% of 50 = 0.2 × 50。"},
   {en:"What is the question actually asking for? Underline it.", ipa:"", zh:"题目到底问什么？画出来。", tip:""}]}],
  drills:[["variable, constant, coefficient, expression, equation, inequality","六个词"],["To solve, isolate the variable: subtract two from both sides, then divide by three.","解方程"],["function, input, output, domain, range","函数"],["linear, quadratic, exponential, logarithmic","四种函数"],["The slope tells you the rate of change: how much y changes for each unit of x.","斜率"],["Let x be the number of apples. Then the cost is 2x.","设未知数"]],
  ex:[
   {t:"mc",q:"在 5x + 7 中，“coefficient” 是？",opts:["5","7","x","5x"],a:0},
   {t:"listen",q:"听一听，这是什么不等式？",say:"x is greater than or equal to five.",opts:["x ≥ 5","x > 5","x ≤ 5","x = 5"],a:0},
   {t:"mc",q:"应用题里 “twice as many as” 意思是？",opts:["乘以 2","加 2","除以 2","减 2"],a:0},
   {t:"listen",q:"听一听，这是哪种增长？",say:"It doubles at a constant rate. That's why it gets so big so fast.",opts:["指数增长","线性增长","二次","对数"],a:0},
   {t:"type",q:"翻译：设 x 为苹果数。",a:"Let x be the number of apples.",alt:["Let x be the number of apples","let x be the number of apples"]},
   {t:"type",q:"听写这个词（“抛物线”）。",say:"parabola",a:"parabola"}],
  hw:[["解三道","找三道英语的一元方程题（Khan Academy），用英语口头讲解解题步骤。"],["画一个函数","画 y = x² 的图，用英语描述：parabola、increasing/decreasing、roots、vertex。"],["翻译一道应用题","把一道英文应用题逐句翻译，标出 twice、more than、per、of，然后列式。"]]
},
{ id:"l22c3", lv:22, title:"微积分（一）：极限与导数", goal:"掌握极限和导数的英语，能读懂微积分教材的定义和例题，能用英语解释导数的意义。",
  intro:"微积分是大学第一年的门槛课，也是<b>英语术语最密集</b>的数学。好消息：核心概念只有两个——<b>导数</b>（变化率）和<b>积分</b>（累积）。本章讲<b>极限</b>（limit、approaches、tends to）和<b>导数</b>（derivative、rate of change、tangent line），教你读<b>定义</b>（the limit as x approaches a of f of x）和<b>求导规则</b>（power rule、chain rule），并用速度和斜率解释导数是什么。",
  learn:[{h:"极限",p:"",items:[
   {en:"limit, approaches, tends to, infinity, continuous, discontinuous", ipa:"", zh:"极限、趋近、趋向、无穷、连续、不连续", tip:"infinity 读 in-FIN-i-tee。"},
   {en:"The limit as x approaches two of f of x equals four.", ipa:"", zh:"当 x 趋近 2 时 f(x) 的极限等于 4。", tip:"读极限的标准句。"},
   {en:"As x approaches infinity, one over x approaches zero.", ipa:"", zh:"当 x 趋向无穷时，1/x 趋近 0。", tip:""},
   {en:"A function is continuous if you can draw it without lifting your pen.", ipa:"", zh:"如果能不抬笔画出来，函数就是连续的。", tip:"直观定义。"},
   {en:"The limit doesn't exist because the left and right limits are different.", ipa:"", zh:"极限不存在，因为左极限和右极限不同。", tip:""}]},
   {h:"导数",p:"",items:[
   {en:"derivative, rate of change, slope of the tangent line, instantaneous velocity", ipa:"", zh:"导数、变化率、切线斜率、瞬时速度", tip:"instantaneous 读 in-stan-TAY-nee-us。"},
   {en:"The derivative of f at a point is the slope of the tangent line at that point.", ipa:"", zh:"f 在一点的导数是该点切线的斜率。", tip:""},
   {en:"f prime of x; d y d x; the derivative of y with respect to x", ipa:"", zh:"f′(x)；dy/dx；y 对 x 的导数", tip:"with respect to = 对……；f′ 读 f prime。"},
   {en:"If position is a function of time, the derivative is velocity, and the second derivative is acceleration.", ipa:"", zh:"如果位置是时间的函数，导数是速度，二阶导数是加速度。", tip:"物理和微积分的联系。"},
   {en:"Where the derivative is zero, the function has a maximum or minimum.", ipa:"", zh:"导数为零的地方，函数有最大值或最小值。", tip:"优化问题的核心。"},
   {en:"Differentiate means find the derivative.", ipa:"", zh:"求导意思是找导数。", tip:"differentiate 读 dif-er-EN-shee-ate。"}]},
   {h:"求导规则",p:"",items:[
   {en:"Power rule: the derivative of x to the n is n x to the n minus one.", ipa:"", zh:"幂法则：xⁿ 的导数是 n·xⁿ⁻¹。", tip:""},
   {en:"The derivative of x cubed is three x squared.", ipa:"", zh:"x³ 的导数是 3x²。", tip:""},
   {en:"Product rule, quotient rule, chain rule", ipa:"", zh:"乘积法则、商法则、链式法则", tip:"quotient 读 KWO-shent。"},
   {en:"Chain rule: differentiate the outside, then multiply by the derivative of the inside.", ipa:"", zh:"链式法则：对外层求导，再乘以内层的导数。", tip:""},
   {en:"The derivative of e to the x is e to the x. The derivative of sine is cosine.", ipa:"", zh:"eˣ 的导数是 eˣ。正弦的导数是余弦。", tip:"sine 读 /saɪn/；cosine 读 KO-sine。"}]}],
  drills:[["limit, approaches, infinity, continuous","极限词"],["The limit as x approaches two of f of x equals four.","读极限"],["The derivative of f at a point is the slope of the tangent line at that point.","导数定义"],["If position is a function of time, the derivative is velocity.","物理意义"],["Power rule: the derivative of x to the n is n x to the n minus one.","幂法则"],["Chain rule: differentiate the outside, then multiply by the derivative of the inside.","链式法则"]],
  ex:[
   {t:"listen",q:"听一听，这是什么？",say:"The limit as x approaches zero of f of x equals one.",opts:["x→0 时 f(x) 的极限是 1","f(0) = 1","x = 1 时 f 为 0","f 的导数是 1"],a:0},
   {t:"mc",q:"导数在几何上是？",opts:["切线的斜率","曲线下的面积","函数的最大值","x 截距"],a:0},
   {t:"listen",q:"听一听，这是哪个法则？",say:"Differentiate the outside, then multiply by the derivative of the inside.",opts:["链式法则","幂法则","乘积法则","商法则"],a:0},
   {t:"mc",q:"位置对时间的导数是？",opts:["速度","加速度","距离","质量"],a:0},
   {t:"type",q:"用英语写出：x³ 的导数是 3x²",a:"The derivative of x cubed is three x squared.",alt:["The derivative of x cubed is three x squared","the derivative of x cubed is three x squared","The derivative of x cubed is 3 x squared."]},
   {t:"type",q:"听写这个词（“导数”）。",say:"derivative",a:"derivative"}],
  hw:[["读定义","找一本英文微积分教材（或 Khan Academy）导数的定义，用英语读出来，翻译。"],["求三个导","用英语口头求 x⁵、3x² + 2x、sin(x) 的导数，说出用的法则。"],["解释导数","用英语向一位朋友解释“导数是什么”，用汽车速度表的例子。"]]
},
{ id:"l22c4", lv:22, title:"微积分（二）：积分与应用", goal:"掌握积分的英语（面积、累积、微积分基本定理），能读懂积分题，能解释积分在物理和经济中的应用。",
  intro:"积分是导数的反向：<b>导数问“变多快”，积分问“累积了多少”</b>。本章教<b>定积分和不定积分</b>（definite / indefinite）、<b>读积分符号</b>（the integral from a to b of f of x d x）、<b>微积分基本定理</b>、<b>积分技巧</b>（substitution、by parts），以及<b>应用</b>：曲线下面积、总距离、总收入——这是经济学和统计学都会用到的。",
  learn:[{h:"积分的概念",p:"",items:[
   {en:"integral, antiderivative, area under the curve, accumulation", ipa:"", zh:"积分、原函数、曲线下面积、累积", tip:"antiderivative = 反导数。"},
   {en:"The integral from zero to three of x squared d x.", ipa:"", zh:"从 0 到 3 对 x² 的积分 dx。", tip:"读定积分的标准句。"},
   {en:"A definite integral has limits and gives a number. An indefinite integral gives a function plus C.", ipa:"", zh:"定积分有上下限，给出一个数。不定积分给出一个函数加 C。", tip:"plus C = 加常数。"},
   {en:"Integration is the reverse of differentiation.", ipa:"", zh:"积分是求导的逆运算。", tip:""},
   {en:"The Fundamental Theorem of Calculus connects derivatives and integrals.", ipa:"", zh:"微积分基本定理连接了导数和积分。", tip:""},
   {en:"To evaluate a definite integral, find the antiderivative and subtract: F of b minus F of a.", ipa:"", zh:"计算定积分：找原函数再相减：F(b) − F(a)。", tip:""}]},
   {h:"技巧",p:"",items:[
   {en:"The integral of x to the n is x to the n plus one, over n plus one, plus C.", ipa:"", zh:"xⁿ 的积分是 xⁿ⁺¹/(n+1) + C。", tip:""},
   {en:"u-substitution: let u equal the inside function, then d u equals its derivative d x.", ipa:"", zh:"换元法：设 u 等于内层函数，则 du 等于它的导数 dx。", tip:""},
   {en:"Integration by parts: the integral of u d v equals u v minus the integral of v d u.", ipa:"", zh:"分部积分：∫u dv = uv − ∫v du。", tip:""},
   {en:"We can approximate the area with rectangles. More rectangles means a better approximation.", ipa:"", zh:"我们可以用矩形近似面积。矩形越多近似越好。", tip:"黎曼和（Riemann sum）。"},
   {en:"The integral of one over x is the natural log of the absolute value of x.", ipa:"", zh:"1/x 的积分是 ln|x|。", tip:"natural log 读 natural log；|x| 读 absolute value of x。"}]},
   {h:"应用",p:"",items:[
   {en:"If you integrate velocity over time, you get total distance travelled.", ipa:"", zh:"对速度在时间上积分，得到总路程。", tip:""},
   {en:"The area between the supply and demand curves gives consumer and producer surplus.", ipa:"", zh:"供给和需求曲线之间的面积给出消费者和生产者剩余。", tip:"经济学的积分。"},
   {en:"In statistics, the area under the probability density curve equals one.", ipa:"", zh:"在统计学中，概率密度曲线下的面积等于 1。", tip:""},
   {en:"To find the volume, we integrate the cross-sectional area.", ipa:"", zh:"要求体积，我们对横截面面积积分。", tip:""},
   {en:"I'm stuck on this integral. Should I try substitution?", ipa:"", zh:"我卡在这个积分上了。该试换元吗？", tip:"stuck on = 卡住。"}]}],
  drills:[["integral, antiderivative, area under the curve, accumulation","积分词"],["The integral from zero to three of x squared d x.","读积分"],["Integration is the reverse of differentiation.","逆运算"],["To evaluate a definite integral, find the antiderivative and subtract: F of b minus F of a.","计算"],["If you integrate velocity over time, you get total distance travelled.","应用"],["I'm stuck on this integral. Should I try substitution?","求助"]],
  ex:[
   {t:"mc",q:"定积分和不定积分的区别？",opts:["定积分给出一个数，不定积分给出函数加 C","一样","定积分更难","不定积分有上下限"],a:0},
   {t:"listen",q:"听一听，这是什么积分？",say:"The integral from one to four of x d x.",opts:["从 1 到 4 对 x 积分","从 4 到 1","x 的四次方","1/4 的积分"],a:0},
   {t:"mc",q:"速度对时间积分得到？",opts:["总路程","加速度","平均速度","时间"],a:0},
   {t:"listen",q:"听一听，这是哪个技巧？",say:"Let u equal the inside function.",opts:["换元法","分部积分","幂法则","黎曼和"],a:0},
   {t:"type",q:"翻译：积分是求导的逆运算。",a:"Integration is the reverse of differentiation.",alt:["Integration is the reverse of differentiation","integration is the reverse of differentiation","Integration is the opposite of differentiation."]},
   {t:"type",q:"听写这个词（“积分”）。",say:"integral",a:"integral"}],
  hw:[["读三个积分","用英语读出三个定积分和它们的计算过程。"],["画面积","画 y = x 从 0 到 2 的图，用英语解释积分等于三角形面积。"],["讲一个应用","用英语讲积分在你的领域（物理、经济、统计、工程）的一个应用。"]]
},
{ id:"l22c5", lv:22, title:"统计与概率：描述数据、分布与推断", goal:"掌握统计学的核心英语（描述统计、概率、正态分布、假设检验），能读懂数据报告和研究结果，衔接第二十级的生物统计。",
  intro:"统计是<b>所有学科和所有工作都用的数学</b>。第二十级学了医学研究里的统计，这一章系统地学：<b>描述数据</b>（mean、median、mode、spread）、<b>概率</b>（probability、independent、conditional）、<b>分布</b>（normal distribution、bell curve、standard deviation）、<b>推断</b>（sample、hypothesis test、p-value、confidence interval）。还有<b>读图表和报告</b>的句式。",
  learn:[{h:"描述数据",p:"",items:[
   {en:"mean, median, mode, range, standard deviation, variance", ipa:"", zh:"均值、中位数、众数、极差、标准差、方差", tip:"variance 读 VAIR-ee-ens。"},
   {en:"The mean is the average. The median is the middle value. The mode is the most common.", ipa:"", zh:"均值是平均。中位数是中间值。众数是最常见的。", tip:""},
   {en:"Median income is a better measure than mean income because a few billionaires skew the mean.", ipa:"", zh:"中位收入比平均收入更好，因为几个亿万富翁会扭曲平均值。", tip:"skew = 扭曲、偏斜。"},
   {en:"A large standard deviation means the data is spread out; a small one means it's clustered.", ipa:"", zh:"标准差大意味着数据分散；小意味着集中。", tip:"spread out / clustered。"},
   {en:"outlier, distribution, histogram, box plot, percentile", ipa:"", zh:"离群值、分布、直方图、箱线图、百分位", tip:"outlier 读 OUT-ly-er。"}]},
   {h:"概率与分布",p:"",items:[
   {en:"The probability of rolling a six is one in six, or about seventeen percent.", ipa:"", zh:"掷出 6 的概率是六分之一，约 17%。", tip:""},
   {en:"Two events are independent if one doesn't affect the other.", ipa:"", zh:"如果一个事件不影响另一个，两事件独立。", tip:""},
   {en:"Conditional probability: the probability of A given B.", ipa:"", zh:"条件概率：在 B 发生的条件下 A 的概率。", tip:"given = 在……条件下。"},
   {en:"The normal distribution is the bell curve. About sixty-eight percent of values fall within one standard deviation of the mean.", ipa:"", zh:"正态分布是钟形曲线。约 68% 的值落在均值的一个标准差内。", tip:"68-95-99.7 法则。"},
   {en:"Expected value is the long-run average if you repeated the experiment many times.", ipa:"", zh:"期望值是重复实验许多次的长期平均。", tip:""},
   {en:"The gambler's fallacy: past results don't change the odds of the next flip.", ipa:"", zh:"赌徒谬误：过去的结果不改变下一次的几率。", tip:"fallacy 读 FAL-a-see。"}]},
   {h:"推断与报告",p:"",items:[
   {en:"We sampled five hundred people and found that fifty-two percent support the plan, plus or minus four percent.", ipa:"", zh:"我们抽样 500 人，发现 52% 支持该计划，误差正负 4%。", tip:"plus or minus = 误差范围。民调的标准说法。"},
   {en:"The null hypothesis is that there's no difference. We test whether the data lets us reject it.", ipa:"", zh:"零假设是没有差异。我们检验数据是否让我们拒绝它。", tip:"null 读 /nʌl/。"},
   {en:"A p-value below 0.05 is usually considered statistically significant.", ipa:"", zh:"p 值低于 0.05 通常被认为有统计显著性。", tip:""},
   {en:"The ninety-five percent confidence interval is from forty-eight to fifty-six percent.", ipa:"", zh:"95% 置信区间是 48% 到 56%。", tip:""},
   {en:"Statistically significant doesn't mean important. Check the effect size.", ipa:"", zh:"统计显著不等于重要。看效应大小。", tip:"effect size = 效应大小。"},
   {en:"The chart shows a positive correlation between hours studied and test scores.", ipa:"", zh:"图表显示学习时间和考试分数之间有正相关。", tip:"positive / negative correlation。"}]}],
  drills:[["mean, median, mode, range, standard deviation","五个词"],["The mean is the average. The median is the middle value. The mode is the most common.","三个定义"],["The probability of rolling a six is one in six.","概率"],["About sixty-eight percent of values fall within one standard deviation of the mean.","正态"],["Fifty-two percent support the plan, plus or minus four percent.","民调"],["Statistically significant doesn't mean important. Check the effect size.","提醒"]],
  ex:[
   {t:"mc",q:"收入数据里几个亿万富翁会扭曲哪个？",opts:["均值（mean）","中位数","众数","极差"],a:0},
   {t:"listen",q:"听一听，这是什么？",say:"The probability of A given B.",opts:["条件概率","独立事件","期望值","标准差"],a:0},
   {t:"mc",q:"正态分布中，均值一个标准差内有多少数据？",opts:["约 68%","约 95%","约 50%","约 99%"],a:0},
   {t:"listen",q:"听一听，误差范围是？",say:"Fifty-two percent, plus or minus three percent.",opts:["正负 3%","正负 5%","正负 2%","正负 52%"],a:0},
   {t:"type",q:"翻译：两事件独立，如果一个不影响另一个。",a:"Two events are independent if one doesn't affect the other.",alt:["Two events are independent if one doesn't affect the other","Two events are independent if one does not affect the other.","two events are independent if one doesn't affect the other"]},
   {t:"type",q:"听写这个词（“离群值”）。",say:"outlier",a:"outlier"}],
  hw:[["算一组数","找 10 个数（家里的电费、孩子的分数），用英语说出 mean、median、range。"],["读一个民调","找一条英文民调新闻，用英语读出：样本量、结果、误差范围。"],["解释一个概念","用英语向朋友解释 median 为什么比 mean 更能代表“普通人的收入”。"]]
},
{ id:"l22c6", lv:22, title:"第二十二级结业：数学的说与写——讲题、证明与一次辅导", goal:"能用英语讲解一道题的完整解法、理解简单证明的语言，并完成一次 30 分钟的英语数学辅导（教别人或被教）。",
  intro:"数学的最高英语技能是<b>讲清楚</b>：给同学讲题、给孩子辅导、在课堂上展示解法。本章教<b>讲题的结构</b>（What we know → What we want → Plan → Steps → Check）、<b>证明的语言</b>（assume、therefore、suppose、contradiction、Q.E.D.）、<b>常见错误的说法</b>（sign error、forgot to carry）和<b>辅导的语言</b>（引导而不是直接给答案）。结业：<b>一次 30 分钟的英语数学辅导</b>。",
  learn:[{h:"讲题的结构",p:"",items:[
   {en:"Here's what we know, and here's what we're looking for.", ipa:"", zh:"这是已知的，这是要求的。", tip:"开头。"},
   {en:"My plan is to set up an equation and solve for x.", ipa:"", zh:"我的计划是列方程解 x。", tip:"说计划。"},
   {en:"First, we… Next, we… Then, we… Finally, we get…", say:"First, we set it up. Next, we simplify. Then, we solve. Finally, we get the answer.", ipa:"", zh:"首先……接着……然后……最后得到……", tip:"路标词。"},
   {en:"Let's check: plug fifteen back in. Three times fifteen plus five is fifty. It works.", ipa:"", zh:"检验：把 15 代回去。3×15+5 = 50。对了。", tip:"It works = 成立。"},
   {en:"Does that make sense? The answer should be positive since it's a distance.", ipa:"", zh:"这合理吗？答案应该是正的，因为是距离。", tip:"合理性检查。"}]},
   {h:"证明与错误",p:"",items:[
   {en:"Assume that n is even. Then n equals two k for some integer k.", ipa:"", zh:"假设 n 是偶数。那么对某个整数 k，n = 2k。", tip:"assume = 假设；for some = 对某个。"},
   {en:"Therefore, n squared is also even, which is what we wanted to show.", ipa:"", zh:"因此 n² 也是偶数，这就是我们要证明的。", tip:"therefore = 因此。结尾也可写 Q.E.D.。"},
   {en:"Proof by contradiction: suppose the opposite is true, and show it leads to a contradiction.", ipa:"", zh:"反证法：假设相反的成立，证明它导致矛盾。", tip:"contradiction 读 kon-tra-DIK-shun。"},
   {en:"if and only if; for all; there exists; without loss of generality", ipa:"", zh:"当且仅当；对所有；存在；不失一般性", tip:"证明里的固定用语。"},
   {en:"I made a sign error. / I forgot to carry the one. / I divided by zero by mistake.", ipa:"", zh:"我符号错了。/ 我忘了进位。/ 我不小心除以零了。", tip:"三种常见错误。"},
   {en:"Let me redo that step. I think I dropped a negative.", ipa:"", zh:"让我重做那一步。我想我丢了个负号。", tip:"dropped = 漏了。"}]},
   {h:"辅导的语言",p:"引导，不直接给答案。",items:[
   {en:"What do you think the first step is?", ipa:"", zh:"你觉得第一步是什么？", tip:""},
   {en:"Good. Why did you do that? / What would happen if we tried the other way?", ipa:"", zh:"好。你为什么那么做？/ 如果我们试另一种方法会怎样？", tip:""},
   {en:"You're close. Look at the sign on this term again.", ipa:"", zh:"接近了。再看一下这一项的符号。", tip:"close = 接近。"},
   {en:"Let's try an easier example first, then come back to this one.", ipa:"", zh:"我们先试一个简单的例子，再回到这个。", tip:""},
   {en:"You got it! Now try the next one on your own.", ipa:"", zh:"你会了！现在自己试下一道。", tip:""},
   {en:"I don't understand this step. Could you explain why you divided here?", ipa:"", zh:"我不懂这一步。能解释为什么在这里除吗？", tip:"被辅导时问。"}]}],
  drills:[["Here's what we know, and here's what we're looking for.","开头"],["First, we set it up. Next, we simplify. Then, we solve. Finally, we get the answer.","路标"],["Let's check: plug fifteen back in. It works.","检验"],["Assume that n is even. Then n equals two k for some integer k. Therefore, n squared is also even.","证明"],["I made a sign error. Let me redo that step.","错误"],["What do you think the first step is? You're close. Look at the sign on this term again.","辅导"]],
  ex:[
   {t:"mc",q:"讲题的开头应该说？",opts:["已知什么、要求什么","答案是多少","这题很难","我不会"],a:0},
   {t:"listen",q:"听一听，这是什么证明方法？",say:"Suppose the opposite is true, and show it leads to a contradiction.",opts:["反证法","归纳法","直接证明","举例"],a:0},
   {t:"mc",q:"“I dropped a negative.” 意思是？",opts:["我漏了一个负号","我放弃了","我减了一个数","我得了负分"],a:0},
   {t:"listen",q:"听一听，辅导者在做什么？",say:"You're close. Look at the sign on this term again.",opts:["引导学生自己发现错误","直接给答案","批评","结束辅导"],a:0},
   {t:"type",q:"翻译：你觉得第一步是什么？",a:"What do you think the first step is?",alt:["What do you think the first step is","what do you think the first step is","What do you think is the first step?"]},
   {t:"type",q:"听写这个词（“因此”）。",say:"therefore",a:"therefore"}],
  hw:[["讲一道题","选一道中等难度的题，按五步结构用英语讲解，录音回听。"],["读一个证明","读“n 偶数则 n² 偶数”的英文证明，用英语复述，用上 assume、therefore。"],["辅导（必做）","用英语辅导一个人 30 分钟数学（孩子、朋友、语言伙伴），只引导不给答案；或者请人用英语辅导你。记下用到的五句话。"]]
},
