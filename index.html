{ id:"l4c3", lv:4, title:"条件句：如果……就……", goal:"能用三种条件句谈真实可能、假设和遗憾，掌握 If 句的时态搭配。",
  intro:"“如果……就……”是表达计划、建议、假设和遗憾的核心结构。英语有三种：<b>第一条件句</b>（真实可能：If it rains, I'll stay home）、<b>第二条件句</b>（现在的假设：If I had a car, I would drive）、<b>第三条件句</b>（过去的遗憾：If I had known, I would have come）。关键是<b>时态搭配</b>：If 后面的时态要“往后退一步”，主句用 will / would / would have。中国学习者最常见的错误是在 If 后面用 will。",
  learn:[{h:"第一条件句：真实可能",p:"If + 现在时，will + 动词原形。",items:[
   {en:"If it rains tomorrow, I'll stay home.", ipa:"", zh:"如果明天下雨，我就待在家。", tip:"If 后面用 rains（现在时），不是 will rain。"},
   {en:"If you need help, just call me.", ipa:"", zh:"如果你需要帮助，打电话给我就行。", tip:"主句可以是命令句。"},
   {en:"You'll miss the bus if you don't hurry.", ipa:"", zh:"你不快点就赶不上公交了。", tip:"If 句也可以放后面。"},
   {en:"If I have time, I'll come to the party.", ipa:"", zh:"如果有时间我就来参加派对。", tip:"真实可能发生的事。"}]},
   {h:"第二条件句：现在的假设",p:"If + 过去时，would + 动词原形。说的是“不太可能”或“并非事实”。",items:[
   {en:"If I had a car, I would drive to work.", ipa:"", zh:"如果我有车，我就开车上班。（但我没有）", tip:"had 不是过去，是“假设”。"},
   {en:"If I were you, I would take the job.", ipa:"", zh:"如果我是你，我会接受这份工作。", tip:"给建议的经典句。If I were you，用 were 不用 was。"},
   {en:"What would you do if you won the lottery?", ipa:"", zh:"如果你中了彩票会做什么？", tip:"would 读 /wʊd/，l 不发音。"},
   {en:"I'd travel the world if I had the money.", ipa:"", zh:"如果有钱我会环游世界。", tip:"I'd = I would。"}]},
   {h:"第三条件句：过去的遗憾",p:"If + had + 过去分词，would have + 过去分词。",items:[
   {en:"If I had known, I would have come.", ipa:"", zh:"如果我早知道，我就来了。（但我不知道，所以没来）", tip:"would have 口语读 “would-ə”。"},
   {en:"If you had called me, I would have helped you.", ipa:"", zh:"你要是给我打电话，我就帮你了。", tip:"带一点责备。"},
   {en:"I would have passed if I had studied more.", ipa:"", zh:"我多学点就能及格了。", tip:"典型的遗憾句。"}]}],
  drills:[["If it rains tomorrow, I'll stay home.","If + 现在，will"],["If you need help, just call me.","If + 命令"],["If I were you, I would take the job.","If I were you"],["What would you do if you won the lottery?","would 的 l 不发音"],["If I had known, I would have come.","would-ə"],["I would have passed if I had studied more.","遗憾"]],
  ex:[
   {t:"mc",q:"哪句是对的？",opts:["If it rains, I'll stay home.","If it will rain, I'll stay home.","If it rains, I stay home will.","If it rained, I'll stay home."],a:0},
   {t:"mc",q:"给朋友建议“如果我是你，我会去看医生”，说？",opts:["If I were you, I would see a doctor.","If I am you, I will see a doctor.","If I was you, I see a doctor.","If I be you, I would see a doctor."],a:0},
   {t:"listen",q:"听一听，这是真实可能、现在假设，还是过去遗憾？",say:"If I had known, I would have come.",opts:["过去的遗憾","真实可能","现在的假设","将来的计划"],a:0},
   {t:"listen",q:"听一听，他会做什么？",say:"If I had the money, I'd buy a house.",opts:["买房子（假设有钱）","已经买了房子","明天去买房子","不想买房子"],a:0},
   {t:"type",q:"翻译：如果你需要帮助，打电话给我就行。",a:"If you need help, just call me.",alt:["If you need help, just call me","If you need help, call me.","If you need help call me"]},
   {t:"type",q:"听写这句话。",say:"If I were you, I would take the job.",a:"If I were you, I would take the job.",alt:["If I were you, I would take the job","If I were you I would take the job","If I were you, I'd take the job."]}],
  hw:[["三句假设","用三种条件句各写一句关于自己的真话：一件可能发生的事、一个假设、一个遗憾。"],["If I were you","今天对一个人用 “If I were you, I would…” 给一条建议。"],["中彩票问题","问一位朋友 “What would you do if you won the lottery?”，听懂并复述对方的答案。"]]
},
{ id:"l4c4", lv:4, title:"被动语态：事情被怎样了", goal:"能理解和使用被动语态，读懂通知、新闻和说明里的被动句。",
  intro:"通知、新闻、产品说明里到处是被动句：<b>The store is closed. / The meeting was cancelled. / Made in Canada.</b> 被动语态的结构是 <b>be + 过去分词</b>，重点在<b>事情本身</b>，而不是谁做的。中国学习者容易漏掉 be（说成 “The meeting cancelled”），或者把过去分词用错。本章先学会<b>读懂</b>被动句，再学在<b>不知道或不重要谁做的</b>时候用它。",
  learn:[{h:"被动语态的结构",p:"be 的时态变，过去分词不变。",items:[
   {en:"The store is closed on Sundays.", ipa:"", zh:"商店周日关门。", tip:"is + closed。"},
   {en:"The meeting was cancelled.", ipa:"", zh:"会议被取消了。", tip:"was + cancelled。谁取消的不重要。"},
   {en:"The package will be delivered tomorrow.", ipa:"", zh:"包裹明天送到。", tip:"will be + delivered。"},
   {en:"The room has been cleaned.", ipa:"", zh:"房间已经打扫过了。", tip:"has been + cleaned。"},
   {en:"My car is being repaired.", ipa:"", zh:"我的车正在修。", tip:"is being + repaired：正在被……"}]},
   {h:"生活里的被动句",p:"",items:[
   {en:"Made in Canada. / Sold out. / Closed for renovation.", ipa:"", zh:"加拿大制造。/ 售完。/ 装修中暂停营业。", tip:"标牌上常省略 be。"},
   {en:"Your order has been shipped.", ipa:"", zh:"您的订单已发出。", tip:"网购邮件必见。"},
   {en:"Masks are required. / Dogs are not allowed.", ipa:"", zh:"须戴口罩。/ 禁止带狗。", tip:"required = 必须；not allowed = 不许。"},
   {en:"I was born in Shanghai.", ipa:"", zh:"我在上海出生。", tip:"“出生”永远是被动：was born。"},
   {en:"English is spoken here.", ipa:"", zh:"这里说英语。", tip:"spoken 是 speak 的过去分词。"}]},
   {h:"主动 vs 被动",p:"",items:[
   {en:"Someone stole my bike. → My bike was stolen.", ipa:"", zh:"有人偷了我的自行车。→ 我的自行车被偷了。", tip:"不知道谁偷的，用被动更自然。"},
   {en:"They built this bridge in 1950. → This bridge was built in 1950.", ipa:"", zh:"这座桥建于 1950 年。", tip:"谁建的不重要。"},
   {en:"The bike was stolen by a teenager.", ipa:"", zh:"自行车被一个青少年偷了。", tip:"要说谁做的，加 by。"}]}],
  drills:[["The store is closed on Sundays.","is + closed"],["The meeting was cancelled.","was + cancelled"],["The package will be delivered tomorrow.","will be + delivered"],["Your order has been shipped.","has been + shipped"],["I was born in Shanghai.","was born"],["My bike was stolen. My car is being repaired.","两种时态"]],
  ex:[
   {t:"mc",q:"“会议被取消了。” 哪句对？",opts:["The meeting was cancelled.","The meeting cancelled.","The meeting is cancel.","The meeting has cancel."],a:0},

   {t:"mc",q:"“Dogs are not allowed.” 意思是？",opts:["禁止带狗","狗没有被允许离开","狗不喜欢","这里有狗"],a:0},
   {t:"listen",q:"听一听，发生了什么？",say:"My phone was stolen yesterday.",opts:["手机被偷了","手机修好了","买了新手机","手机送到了"],a:0},
   {t:"type",q:"翻译：我在北京出生。",a:"I was born in Beijing.",alt:["I was born in Beijing","i was born in beijing"]},

{ id:"l4c5", lv:4, title:"看懂新闻：标题、结构与高频词", goal:"能看懂英文新闻标题和导语，掌握新闻英语的特殊语法和 30 个高频词。",
  intro:"新闻英语是一种<b>特殊方言</b>：标题省略 be 和冠词、用现在时讲过去的事、用短词代替长词（<b>cut</b> 代替 reduce，<b>bid</b> 代替 attempt）。但新闻的<b>结构非常固定</b>：标题 → 导语（第一段，回答谁、什么、哪里、何时）→ 细节 → 背景。所以读新闻的办法是：<b>先读标题和第一段</b>，懂了就够了，后面都是补充。本章教你解码标题，再给你 30 个新闻高频词。",
  learn:[{h:"标题的语法",p:"",items:[
   {en:"City to Build New Hospital", ipa:"", zh:"= The city is going to build a new hospital. 市政府将建新医院", tip:"to + 动词 = 将要。省略 the、a、is going。"},
   {en:"Prices Rise as Rent Hits Record High", ipa:"", zh:"= Prices are rising as rent has hit a record high. 物价上涨，房租创新高", tip:"现在时讲最近发生的事。"},
   {en:"Three Injured in Highway Crash", ipa:"", zh:"= Three people were injured in a highway crash. 高速车祸三人受伤", tip:"省略 be：Injured = were injured。"},
   {en:"PM Announces Tax Cut", ipa:"", zh:"= The Prime Minister has announced a tax cut. 总理宣布减税", tip:"PM = Prime Minister。cut 代替 reduction。"}]},
   {h:"新闻高频词（一）",p:"",items:[
   {en:"announce, report, confirm, deny, claim", ipa:"", zh:"宣布、报道、确认、否认、声称", tip:"deny 重音在后：de-NY。"},
   {en:"increase, decrease, rise, fall, drop", ipa:"", zh:"增加、减少、上升、下降、下跌", tip:"数字新闻的五个动词。"},
   {en:"government, minister, mayor, official, police", ipa:"", zh:"政府、部长、市长、官员、警方", tip:"official 重音在 FI。"},
   {en:"economy, inflation, interest rate, unemployment", ipa:"", zh:"经济、通胀、利率、失业", tip:"inflation 重音在 FLA。"}]},
   {h:"新闻高频词（二）",p:"",items:[
   {en:"according to, due to, as a result, meanwhile", ipa:"", zh:"据……、由于、结果、与此同时", tip:"according to = 根据某人/机构说。"},
   {en:"a record high, a sharp drop, a slight increase", ipa:"", zh:"创纪录的高、急剧下降、略微增加", tip:"形容幅度的三种说法。"},
   {en:"According to the report, unemployment fell to five percent last month.", ipa:"", zh:"据报告，上月失业率降至 5%。", tip:"典型导语句。"},
   {en:"The mayor confirmed that the project will be delayed due to costs.", ipa:"", zh:"市长确认项目将因成本推迟。", tip:"confirmed that + 完整句子。"}]}],
  drills:[["City to Build New Hospital","标题：to = 将要"],["Three Injured in Highway Crash","省略 be"],["announce, confirm, deny, claim","新闻动词"],["increase, decrease, rise, fall, drop","数字动词"],["According to the report, unemployment fell to five percent last month.","导语句"],["The mayor confirmed that the project will be delayed due to costs.","confirmed that"]],
  ex:[
   {t:"mc",q:"标题 “City to Build New Hospital” 的意思是？",opts:["市政府将建新医院","市政府已建成新医院","市政府反对建新医院","新医院建在城市里"],a:0},
   {t:"mc",q:"标题 “Three Injured in Crash” 里省略了什么？",opts:["were（被动的 be）","to","will","the three"],a:0},

   {t:"mc",q:"“according to the police” 意思是？",opts:["据警方说","为了警方","和警方一起","反对警方"],a:0},
   {t:"type",q:"听写这个词（“宣布”）。",say:"announce",a:"announce"},
   {t:"type",q:"把标题补成完整句：“Prices Rise”",a:"Prices are rising.",alt:["Prices are rising","The prices are rising.","Prices rise.","Prices are rising"]}],
  hw:[["每日一标题","每天读 3 个英文新闻标题（CBC、CTV 网站），把每个标题补成完整句子。坚持一周。"],["读一段导语","选一篇新闻只读第一段，回答：谁？做了什么？在哪？什么时候？"],["讲给别人","用三句英语把一条新闻讲给朋友：According to ___, ___ . 对方能听懂就算成功。"]]

{ id:"l4c6", lv:4, title:"讨论观点：同意、不同意与说明理由", goal:"能在讨论中表达观点、礼貌地不同意、给出理由和举例，不只是说 yes 或 no。",
  intro:"到了中级，能不能<b>参与讨论</b>是分水岭。北美文化里，有不同意见是正常的，但<b>怎么说</b>很重要：直接说 “You're wrong” 很冒犯；说 “I see your point, but…” 就得体。本章给你一套完整工具：<b>表达观点</b>（I think / In my opinion）→ <b>同意</b>（Exactly / I agree）→ <b>部分不同意</b>（That's true, but…）→ <b>给理由</b>（because / the reason is）→ <b>举例</b>（For example）→ <b>总结</b>（So, overall）。",
  learn:[{h:"表达观点",p:"",items:[
   {en:"I think / I believe / In my opinion, ___.", ipa:"", zh:"我认为 / 我相信 / 在我看来", tip:"三种开头，In my opinion 最正式。"},
   {en:"Personally, I prefer working from home.", ipa:"", zh:"就我个人而言，我更喜欢在家工作。", tip:"Personally 表示“这只是我的看法”。"},
   {en:"It seems to me that prices are too high.", ipa:"", zh:"我觉得价格太高了。", tip:"It seems to me 比 I think 更委婉。"},
   {en:"The way I see it, we have two options.", ipa:"", zh:"在我看来，我们有两个选择。", tip:"口语常用。"}]},
   {h:"同意与不同意",p:"",items:[
   {en:"Exactly. / I totally agree. / That's a good point.", ipa:"", zh:"没错。/ 我完全同意。/ 说得好。", tip:"三种程度的同意。"},
   {en:"I see your point, but I'm not sure I agree.", ipa:"", zh:"我明白你的意思，但我不太同意。", tip:"最礼貌的不同意：先肯定，再 but。"},

{ id:"l4c7", lv:4, title:"第四级结业：5 分钟工作汇报", goal:"能做一个 5 分钟的结构化口头汇报：背景、做了什么、结果、下一步，并回答一两个提问。",
  intro:"工作汇报是中级英语最实用的输出。它比闲聊容易，因为<b>结构是固定的</b>，你可以提前准备。标准结构：<b>开场</b>（说明主题和时长）→ <b>背景</b>（为什么做）→ <b>做了什么</b>（过去时）→ <b>结果</b>（数字 + 完成时）→ <b>下一步</b>（将来时）→ <b>提问</b>。关键技巧：<b>路标词</b>（First / Next / Finally）让听众知道你讲到哪了；每部分不超过四句。",
  learn:[{h:"开场与路标词",p:"",items:[
   {en:"Good morning, everyone. Today I'd like to give you a quick update on the new website.", ipa:"", zh:"大家早上好。今天我想简短汇报一下新网站的进展。", tip:"一句话说主题。update on = 关于……的进展。"},
   {en:"I'll cover three things: the background, what we did, and the next steps.", ipa:"", zh:"我会讲三点：背景、我们做了什么、下一步。", tip:"先告诉听众结构。"},
   {en:"First, / Next, / Then, / Finally,", ipa:"", zh:"首先 / 接着 / 然后 / 最后", tip:"每换一部分就用一个。"},
   {en:"Let me move on to the results.", ipa:"", zh:"我接着说结果。", tip:"move on to = 转到。"}]},
   {h:"背景、行动、结果",p:"",items:[
   {en:"The problem was that customers couldn't find the contact page.", ipa:"", zh:"问题是客户找不到联系页面。", tip:"背景：The problem was that…"},
   {en:"So we redesigned the menu and added a search bar.", ipa:"", zh:"所以我们重新设计了菜单，加了搜索栏。", tip:"行动：过去时。"},
   {en:"As a result, calls to support have dropped by thirty percent.", ipa:"", zh:"结果，客服电话减少了 30%。", tip:"结果：数字 + 完成时。dropped by = 下降了（幅度）。"},
   {en:"We've also received positive feedback from users.", ipa:"", zh:"我们也收到了用户的正面反馈。", tip:"feedback 不可数，不加 s。"}]},
   {h:"下一步与提问",p:"",items:[
   {en:"Next, we're going to test it on mobile.", ipa:"", zh:"接下来我们要在手机上测试。", tip:"下一步：将来时。"},
   {en:"We expect to finish by the end of the month.", ipa:"", zh:"我们预计月底前完成。", tip:"by = 不迟于。"},
   {en:"That's all from me. Any questions?", ipa:"", zh:"我就说这些。有问题吗？", tip:"结尾固定句。"},
   {en:"Good question. Let me check and get back to you.", ipa:"", zh:"好问题。我查一下再回复你。", tip:"回答不了时的万能句。"},
   {en:"If I understand correctly, you're asking about the cost?", ipa:"", zh:"如果我理解得对，你是问成本？", tip:"没听清问题时先确认。"}]}],
  drills:[["Today I'd like to give you a quick update on the new website.","开场"],["I'll cover three things: the background, what we did, and the next steps.","说结构"],["The problem was that customers couldn't find the contact page.","背景"],["As a result, calls to support have dropped by thirty percent.","结果"],["Next, we're going to test it on mobile. We expect to finish by the end of the month.","下一步"],["That's all from me. Any questions? Good question. Let me check and get back to you.","结尾 + 应答"]],
  ex:[
   {t:"mc",q:"汇报开场应该先说？",opts:["主题和要讲的几点","自己的英语不好","详细的数字","谢谢大家"],a:0},
   {t:"listen",q:"听一听，结果是什么？",say:"As a result, sales have increased by twenty percent.",opts:["销售额增加了 20%","销售额减少了 20%","成本增加了 20%","客户减少了 20%"],a:0},
   {t:"mc",q:"被问到一个答不上来的问题，说？",opts:["Good question. Let me check and get back to you.","I don't know.","No.","Next question."],a:0},
   {t:"listen",q:"听一听，他接下来要讲什么？",say:"Let me move on to the next steps.",opts:["下一步","背景","结果","问题"],a:0},
   {t:"type",q:"翻译：我就说这些。有问题吗？",a:"That's all from me. Any questions?",alt:["That's all from me. Any questions","That's all. Any questions?","That's all from me, any questions?"]},
   {t:"type",q:"听写这句话。",say:"We expect to finish by the end of the month.",a:"We expect to finish by the end of the month.",alt:["We expect to finish by the end of the month","we expect to finish by the end of the month"]}],
  hw:[["写汇报稿","选一件你最近做的事（工作项目、家里的事都可以），按“开场 → 背景 → 做了什么 → 结果 → 下一步”写一份 5 分钟的稿子。"],["计时练习","对着手机录像讲一遍，计时。超过 6 分钟就删内容，不到 4 分钟就加例子。练到不看稿。"],["结业汇报（必做）","对至少一个真人做这个 5 分钟汇报（同事、朋友、语言伙伴），请对方提两个问题，你当场回答。"]]

{ id:"l5c1", lv:5, title:"口音打磨：北美音的细节", goal:"掌握北美口音的四个标志性特征，让你的英语听起来更自然、更容易被听懂。",
  intro:"到了第五级，你的发音已经“正确”了。现在追求的是<b>自然</b>。北美口音有几个标志：① <b>闪音 t</b>：water 读成 “wadder”，better 读成 “bedder”；② <b>卷舌 r</b>：car、hard、work 的 r 都要卷；③ <b>鼻音前的元音</b>：can't、man 带一点鼻音；④ <b>句尾 t 的吞音</b>：what、that 的结尾 t 不完全释放。这些不是“必须”，但做到了会让母语者<b>不用费力就能听懂你</b>——这才是口音的意义。",
  learn:[{h:"闪音 t：两个元音之间的 t 读成轻快的 d",p:"",items:[
   {en:"water, better, little, city", ipa:"", zh:"水、更好、小、城市", tip:"wadder, bedder, liddle, ciddy。舌尖轻轻弹一下。"},
   {en:"What a beautiful day!", ipa:"", zh:"多美的一天！", tip:"What a → “wadda”；beautiful → “byoodiful”。"},
   {en:"I got it. / Get out of here.", ipa:"", zh:"我明白了。/ 出去。", tip:"got it → “goddit”；out of → “oudda”。"},
   {en:"Put it on the table.", ipa:"", zh:"把它放在桌上。", tip:"Put it on → “pudidon”。"}]},
   {h:"卷舌 r 与吞音 t",p:"",items:[
   {en:"car, far, hard, park, start", ipa:"", zh:"车、远、硬、公园、开始", tip:"北美音 r 一定要卷：舌头后缩、不碰任何地方。英式音不卷，北美音必须卷。"},
   {en:"work, word, world, first, nurse", ipa:"", zh:"工作、词、世界、第一、护士", tip:"/ɜːr/ 全程带 r，world 的 rl 最难，慢慢来。"},
   {en:"What? / That's right. / I don't know.", ipa:"", zh:"什么？/ 对。/ 我不知道。", tip:"句尾的 t 和 n't 的 t 不释放：喉头轻轻一卡就停。"},
   {en:"button, mountain, certain", ipa:"", zh:"按钮、山、确定", tip:"t 后面是 n 时，t 变成喉塞音：“bu'n”、“moun'n”。"}]},
   {h:"整句模仿",p:"先听三遍，再影子跟读。",items:[
   {en:"I'd better get a little water before we start.", ipa:"", zh:"开始前我最好喝点水。", tip:"better、little、water 三个闪音 t；start 卷舌。"},
   {en:"What are you doing later? Wanna get a bite to eat?", ipa:"", zh:"你一会儿干什么？想去吃点东西吗？", tip:"Whaddaya、lader、bide to eat。"},
   {en:"It's not that hard once you get the hang of it.", ipa:"", zh:"一旦掌握了窍门就不难了。", tip:"not that → 两个吞音 t；get the hang of it = 掌握窍门。"}]}],
  drills:[["water, better, little, city","闪音 t"],["What a beautiful day!","wadda byoodiful"],["car, far, hard, work, world","卷舌 r"],["button, mountain, certain","喉塞音 t"],["I'd better get a little water before we start.","整句"],["It's not that hard once you get the hang of it.","吞音 + 短语"]],
  ex:[
   {t:"listen",q:"听一听，这个词的 t 读成了什么？",say:"better",opts:["轻快的 d（闪音）","清楚的 t","没读","s"],a:0},
   {t:"mc",q:"北美口音里，car 的 r 应该？",opts:["卷舌，舌头后缩不碰任何地方","不发音","像中文的“日”","像 l"],a:0},
   {t:"listen",q:"听一听，他说的是？",say:"Put it on the table.",opts:["把它放在桌上","把它拿下来","桌子上有东西","放在哪儿"],a:0},

   {t:"type",q:"听写这句话。",say:"What a beautiful day!",a:"What a beautiful day!",alt:["What a beautiful day","what a beautiful day"]},

{ id:"l5c2", lv:5, title:"演讲技巧：开场、结构与停顿", goal:"能设计并发表一场有结构、有停顿、有互动的演讲，掌握开场钩子和结尾升华。",
  intro:"好的演讲不是流利，而是<b>节奏和结构</b>。母语者讲得好的秘诀：① <b>开场有钩子</b>（一个问题、一个数字、一个故事）；② <b>三段结构</b>（听众只记得住三点）；③ <b>停顿</b>（重要的话之前停两秒，比大声更有力）；④ <b>互动</b>（反问、举手）；⑤ <b>结尾回到开头</b>。本章先给你这些工具的英文说法，再练一个 3 分钟的小演讲。记住：<b>说慢、停顿，是自信的表现，不是英语不好</b>。",
  learn:[{h:"开场钩子",p:"",items:[
   {en:"Raise your hand if you've ever forgotten someone's name.", ipa:"", zh:"如果你曾忘过别人的名字，请举手。", tip:"举手式开场，立刻让听众参与。"},
   {en:"Three years ago, I couldn't order a coffee in English.", ipa:"", zh:"三年前，我连用英语点咖啡都不会。", tip:"故事式开场，用自己的经历。"},
   {en:"Did you know that most people forget 90 percent of what they hear within a week?", ipa:"", zh:"你知道吗，大多数人一周内会忘掉听到的 90%。", tip:"数字式开场。Did you know that…"},
   {en:"Today I want to share three simple ideas with you.", ipa:"", zh:"今天我想和你们分享三个简单的想法。", tip:"钩子之后，马上告诉听众结构。"}]},
   {h:"过渡与强调",p:"",items:[
   {en:"That brings me to my second point.", ipa:"", zh:"这就引出我的第二点。", tip:"过渡句。"},
   {en:"Here's the thing: it's not about talent.", ipa:"", zh:"关键是：这和天赋无关。", tip:"Here's the thing 后面停两秒，再说重点。"},
   {en:"Let me say that again.", ipa:"", zh:"我再说一遍。", tip:"强调重点的方法：重复一次。"},
   {en:"Think about that for a second.", ipa:"", zh:"想一想。", tip:"给听众两秒停顿。"},
   {en:"And this is the part that surprised me.", ipa:"", zh:"而这是让我惊讶的部分。", tip:"制造期待。"}]},
   {h:"结尾",p:"",items:[
   {en:"So, to sum up: start small, practise daily, and don't be afraid to make mistakes.", ipa:"", zh:"总结一下：从小处开始、每天练、别怕犯错。", tip:"三点总结，和开头呼应。"},
   {en:"Remember that coffee I couldn't order? Last week, I gave a presentation in English.", ipa:"", zh:"还记得我点不了的那杯咖啡吗？上周，我用英语做了一场演讲。", tip:"回到开头的故事，这是最有力的结尾。"},
   {en:"I'll leave you with one question: what will you try this week?", ipa:"", zh:"最后留给大家一个问题：这周你会尝试什么？", tip:"I'll leave you with = 最后给大家留下。"},
   {en:"Thank you. I'm happy to take any questions.", ipa:"", zh:"谢谢。欢迎提问。", tip:"结尾固定句。"}]}],
  drills:[["Raise your hand if you've ever forgotten someone's name.","举手式开场"],["Three years ago, I couldn't order a coffee in English.","故事式开场"],["Today I want to share three simple ideas with you.","说结构"],["Here's the thing: it's not about talent.","停顿再说重点"],["That brings me to my second point.","过渡"],["I'll leave you with one question: what will you try this week? Thank you.","结尾"]],
  ex:[
   {t:"mc",q:"演讲开场最有效的是？",opts:["一个问题、数字或故事（钩子）","道歉自己英语不好","念出全部提纲","直接讲第一点"],a:0},
   {t:"listen",q:"听一听，这是哪种开场？",say:"Did you know that most people forget 90 percent of what they hear?",opts:["数字式","故事式","举手式","道歉式"],a:0},

   {t:"listen",q:"听一听，他要做什么？",say:"That brings me to my second point.",opts:["转到第二点","结束演讲","回答问题","重复第一点"],a:0},

{ id:"l5c3", lv:5, title:"复杂语法：定语从句与间接引语", goal:"能用 who / which / that 把句子连成复杂句，能转述别人说的话。",
  intro:"高级英语的句子不是更长的单句，而是<b>把几个意思连成一句</b>。两个最重要的工具：<b>定语从句</b>——用 who / which / that / where 把两句合并（The man who lives next door is a doctor）；<b>间接引语</b>——转述别人说的话（She said she was tired）。间接引语有一个中国学习者常忽略的规则：<b>时态往后退一步</b>（“I am tired” → she said she <b>was</b> tired），人称也要换。",
  learn:[{h:"定语从句：把两句合成一句",p:"",items:[
   {en:"The man who lives next door is a doctor.", ipa:"", zh:"住在隔壁的那个人是医生。", tip:"who 指人。= The man is a doctor. He lives next door."},
   {en:"This is the phone that I bought last week.", ipa:"", zh:"这是我上周买的手机。", tip:"that 指物。口语里 that 常省略：the phone I bought。"},
   {en:"The restaurant where we met has closed.", ipa:"", zh:"我们相遇的那家餐厅关门了。", tip:"where 指地方。"},
   {en:"My sister, who lives in Calgary, is visiting next week.", ipa:"", zh:"我姐姐（她住在卡尔加里）下周来看我。", tip:"有逗号的从句只是补充信息，可以去掉不影响意思。"},
   {en:"That's the reason why I moved here.", ipa:"", zh:"那就是我搬来这里的原因。", tip:"the reason why 固定搭配。"}]},
   {h:"间接引语：转述别人的话",p:"时态退一步，人称换掉。",items:[
   {en:"\"I'm tired.\" → She said she was tired.", ipa:"", zh:"“我累了。”→ 她说她累了。", tip:"am → was，I → she。"},
   {en:"\"I'll call you.\" → He said he would call me.", ipa:"", zh:"“我会给你打电话。”→ 他说他会给我打电话。", tip:"will → would，you → me。"},
   {en:"\"I've finished.\" → She told me she had finished.", ipa:"", zh:"“我做完了。”→ 她告诉我她做完了。", tip:"have → had。told 后面要有人（told me），said 后面不用。"},
   {en:"\"Where do you live?\" → He asked me where I lived.", ipa:"", zh:"“你住哪？”→ 他问我住哪。", tip:"转述问句：不再倒装，do 消失。"},
   {en:"\"Can you help?\" → She asked if I could help.", ipa:"", zh:"“你能帮忙吗？”→ 她问我能不能帮忙。", tip:"Yes/No 问句用 if。"}]},

/* ---------- levels ---------- */
const LV_N = ["","第一级","第二级","第三级","第四级","第五级"];
function lvOf(c){ return c.lv||1; }
function lvChapters(l){ return COURSE.filter(c=>lvOf(c)===l); }
function lvDone(l){ return lvChapters(l).every(chapDone); }
function curLevel(){ const c=COURSE.find(x=>!chapDone(x)); return c? lvOf(c) : LEVELS.length; }
function lvIndex(c){ return lvChapters(lvOf(c)).indexOf(c)+1; }
// what the voice actually says for a displayed phrase (arrows, A:/B: labels, blanks, IPA marks removed)
function spokenOf(it){
  if(it.say) return it.say;
  return it.en.replace(/[↗↘]/g,"").replace(/\b[AB]:\s*/g,"").replace(/\s*→\s*/g,", ").replace(/\s*\/\s*/g,". ").replace(/\s*—\s*/g,". ")
    .replace(/_{2,}/g,"blank").replace(/\s*\(DOB\)/,"").replace(/\bN\/A\b/,"N A").replace(/\s+/g," ").replace(/\s+([.,?!])/g,"$1").trim();
}

let faces=[];
function mountFace(el,size){ if(!el) return; faces=faces.filter(f=>f.isConnected); el.classList.add("face"); if(size) el.style.setProperty("--fs",size); el.setAttribute("data-mood","happy"); el.innerHTML=FACE_SVG; faces.push(el); }
const face = {
  mood(m,ms){ faces.forEach(f=>f.setAttribute("data-mood",m)); if(ms) setTimeout(()=>faces.forEach(f=>f.setAttribute("data-mood","happy")),ms); },
  talk(on){ faces.forEach(f=>f.classList.toggle("talking",on)); },
  bounce(){ faces.forEach(f=>{ f.classList.remove("bounce"); void f.offsetWidth; f.classList.add("bounce"); }); },
  hello(){ faces.forEach(f=>{ f.classList.remove("hello"); void f.offsetWidth; f.classList.add("hello"); setTimeout(()=>f.classList.remove("hello"),3000); }); }
};
document.addEventListener("pointermove",e=>{ const dx=(e.clientX/innerWidth-.5)*4, dy=(e.clientY/innerHeight-.5)*3;
  faces.forEach(f=>f.querySelectorAll(".eye,.shine").forEach(n=>n.style.transform=`translate(${dx}px,${dy}px)`)); },{passive:true});

/* ---------- state & login ---------- */
const BLANK = ()=>({done:{}, hw:{}, ex:{}, seen:{}, drill:{}, speed:0.95});
let S = BLANK();
let me = null;      // {kind:"claude"|"local", id, name, avatar}
let dbRef = null;   // db doc for cloud progress
let saveTimer=null;
function stateKey(){ return "ys-state:"+(me?me.kind+":"+me.id:"anon"); }
function save(){
  try{ localStorage.setItem(stateKey(),JSON.stringify(S)); }catch(e){}
  if(dbRef){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ dbRef.set(Object.assign({},S,{savedAt:Date.now()})).catch(()=>{ dbRef=null; }); },600); }
}
async function loadState(){
  S = BLANK();
  try{ const s=localStorage.getItem(stateKey()); if(s) Object.assign(S,JSON.parse(s)); }catch(e){}
  if(dbRef){ try{ const snap=await dbRef.get(); const d=snap.data(); if(d && (d.savedAt||0) >= (S.savedAt||0)){ delete d.savedAt; Object.assign(S,d); } }catch(e){} }
}
async function sha(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function localProfiles(){ try{ return JSON.parse(localStorage.getItem("ys-profiles")||"[]"); }catch(e){ return []; } }
function saveProfiles(p){ try{ localStorage.setItem("ys-profiles",JSON.stringify(p)); }catch(e){} }

async function initLogin(){
  mountFace($("#loginFace"),"150px"); mountFace($("#panelFace"),"40px"); mountFace($("#openFace"),"34px");
  face.hello();
  let claudeUser=null, viewer=null;
  try{ claudeUser = window.claude?.use ? await window.claude.use("user") : null; if(claudeUser){ viewer = await claudeUser.me(); if(!viewer.id) claudeUser=null; } }catch(e){ claudeUser=null; }
  let remembered=null; try{ remembered=JSON.parse(localStorage.getItem("ys-session")||"null"); }catch(e){}
  if(claudeUser && viewer){
    $("#loginBody").innerHTML = '<div style="display:flex;gap:12px;align-items:center"><img src="'+esc(viewer.avatarUrl)+'" alt="" style="width:48px;height:48px;border-radius:50%"><div><div style="font-size:12px;color:var(--muted)">已检测到你的 Claude 账户</div><b id="vname" style="font-size:18px"></b></div></div><div class="row" style="margin-top:14px"><button class="btn" id="cloudBtn">用这个账户登录 →</button></div><div class="fine">学习进度会保存在你的账户里，换一台设备打开同一个链接也能继续。</div>';
    $("#vname").textContent = viewer.name || "Claude 用户";
    $("#loginFine").textContent = "";
    $("#cloudBtn").onclick = async ()=>{
      me = {kind:"claude", id:viewer.id, name:viewer.name||"同学", avatar:viewer.avatarUrl};
      try{ const db = await window.claude.use("db"); if(db) dbRef = db.doc("data/users/"+viewer.id+"/progress"); }catch(e){ dbRef=null; }
      await enter();
    };
    if(remembered && remembered.kind==="claude" && remembered.id===viewer.id) $("#cloudBtn").click();
    return;
  }
  renderLocalLogin(remembered);
}
function renderLocalLogin(remembered){
  const ps = localProfiles();
  let h = '';
  if(ps.length){ h += '<div style="font-weight:600">选择学员</div><div class="plist">'+ps.map(p=>'<button class="pbtn" data-id="'+esc(p.id)+'"><span class="en" style="font-size:17px">'+esc(p.name)+'</span><small>'+(p.last?'上次学习 '+new Date(p.last).toLocaleDateString("zh-CN"):'新学员')+'</small></button>').join("")+'</div><div id="pinBox"></div><div style="text-align:center;color:var(--muted);font-size:13px;margin:8px 0">或</div>'; }
  h += '<details'+(ps.length?'':' open')+'><summary style="cursor:pointer;font-weight:600">新学员注册</summary><label for="nm">你的名字（中文或英文都可以）</label><input id="nm" autocomplete="off" placeholder="例如：王丽 / Li"><label for="pin">设一个 4 位数字密码</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off"><div class="err" id="regErr"></div><button class="btn" id="regBtn" style="margin-top:4px">注册并开始 →</button></details>';
  $("#loginBody").innerHTML = h;
  $("#loginFine").textContent = "学员资料和学习进度保存在这台设备的浏览器里。密码只是防止家人之间点错账号，不要用重要的密码。";
  $("#loginBody").querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{
    const p = ps.find(x=>x.id===b.dataset.id);
    $("#pinBox").innerHTML = '<label for="pin2">'+esc(p.name)+' 的密码</label><div class="row"><input id="pin2" inputmode="numeric" maxlength="4" style="width:140px" autocomplete="off"><button class="btn" id="inBtn">登录</button></div><div class="err" id="inErr"></div>';
    $("#pin2").focus();
    const tryIn = async ()=>{ const v=$("#pin2").value.trim(); if(await sha(v+"|"+p.id)===p.hash){ me={kind:"local",id:p.id,name:p.name}; p.last=Date.now(); saveProfiles(ps); await enter(); } else { $("#inErr").textContent="密码不对，再试一次。"; face.mood("oops",1500); } };
    $("#inBtn").onclick=tryIn; $("#pin2").addEventListener("keydown",e=>{ if(e.key==="Enter") tryIn(); });
  });
  $("#regBtn").onclick = async ()=>{
    const name=$("#nm").value.trim(), pin=$("#pin").value.trim();
    if(!name){ $("#regErr").textContent="请输入名字。"; return; }
    if(!/^\d{4}$/.test(pin)){ $("#regErr").textContent="密码要是 4 位数字。"; return; }
    if(ps.some(p=>p.name===name)){ $("#regErr").textContent="这个名字已经有人用了，换一个或者在上面选择。"; return; }
    const id = "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    ps.push({id,name,hash:await sha(pin+"|"+id),last:Date.now()}); saveProfiles(ps);
    me={kind:"local",id,name}; await enter();
  };
  if(remembered && remembered.kind==="local"){ const p=ps.find(x=>x.id===remembered.id); if(p){ me={kind:"local",id:p.id,name:p.name}; enter(); } }
}
async function enter(){
  try{ localStorage.setItem("ys-session",JSON.stringify({kind:me.kind,id:me.id})); }catch(e){}
  await loadState();
  $("#login").hidden = true;
  renderWho(); renderRail(); render(); face.hello();
}
function logout(){ try{ localStorage.removeItem("ys-session"); }catch(e){} location.reload(); }
function renderWho(){
  const w=$("#who"); if(!me){ w.innerHTML=""; return; }

}

let voices=[];
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = ()=>{ loadVoices(); if(document.getElementById("voiceSel")===null && document.querySelector(".speed")) render(); }; }
function voiceQuality(v){
  const n=v.name, l=v.lang.toLowerCase(); let q=0;
  if(/natural|neural|premium|enhanced|online/i.test(n)) q+=40;
  if(/^google/i.test(n)) q+=25;
  if(/samantha|ava|allison|zoe|evan|tom|nathan|aria|jenny|guy|clara|liam|heather|emma/i.test(n)) q+=15;
  if(/zira|david|mark|espeak|compact/i.test(n)) q-=30;
  if(l==="en-ca") q+=30; else if(l==="en-us") q+=15; else if(l==="en-gb"||l==="en-au") q+=5;
  if(v.localService===false) q+=5;
  return q;
}
function pickVoice(){
  if(S.voice){ const v=voices.find(v=>v.name===S.voice); if(v) return v; }
  return voices.slice().sort((a,b)=>voiceQuality(b)-voiceQuality(a))[0] || null;
}
function voiceLabel(v){ const l=v.lang.toLowerCase(); const where=l==="en-ca"?"加拿大":l==="en-us"?"美国":l==="en-gb"?"英国":l==="en-au"?"澳洲":l==="en-in"?"印度":v.lang; const nat=/natural|neural|premium|enhanced|online|^google/i.test(v.name)?" · 自然":""; return v.name.replace(/Microsoft |Online \(Natural\)|\(Natural\)/g,"").trim()+"（"+where+nat+"）"; }
function voiceCtl(){
  if(!voices.length) return '';
  const cur=pickVoice(); const sorted=voices.slice().sort((a,b)=>voiceQuality(b)-voiceQuality(a));
  let h='<div class="speed" style="margin-top:4px;flex-wrap:wrap">课文朗读用的是真人感录音。老师聊天示范的备用声音：<select id="voiceSel" onchange="S.voice=this.value;save();say(\'Hello! Nice to meet you.\')" style="font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);padding:3px 6px;max-width:100%">'+sorted.map(v=>'<option value="'+esc(v.name)+'"'+(cur&&v.name===cur.name?" selected":"")+'>'+esc(voiceLabel(v))+'</option>').join("")+'</select><button onclick="voiceHelp()">哪个声音最自然？</button></div>';
  return h;
}
function voiceHelp(){
  const ua=navigator.userAgent; let tip;
  if(/Edg\//.test(ua)) tip="你在用 Edge，很好：选择 Clara 或 Liam（加拿大 · 自然），这是最自然的加拿大口音。";
  else if(/Windows/.test(ua)) tip="在 Windows 上，Chrome 自带的声音比较机械。最自然的办法：用 Microsoft Edge 浏览器打开本课堂，然后选 Clara 或 Liam（加拿大 · 自然）。";
  else if(/Macintosh/.test(ua)) tip="在 Mac 上：打开“系统设置 → 辅助功能 → 朗读内容 → 系统声音 → 管理声音”，下载 Samantha、Ava 或 Allison 的“增强/高级”版本，然后回到这里重新选择。";
  else if(/Android/.test(ua)) tip="在安卓手机上：系统设置里搜索“文字转语音”，选择 Google 语音服务并下载英语（美国或加拿大）高质量语音，然后回到这里重新选择。";
  else if(/iPhone|iPad/.test(ua)) tip="在 iPhone/iPad 上：设置 → 辅助功能 → 朗读内容 → 声音 → 英语，下载 Samantha、Ava 或 Evan 的增强版本，然后回到这里重新选择。";
  else tip="声音来自你的设备。Microsoft Edge 浏览器自带最自然的加拿大英语声音（Clara、Liam）；Mac 和 iPhone 可以在辅助功能里下载增强声音。";
  toast(tip, 9000);
}

let recBusyUntil=0;
function releaseRec(r){
  // drop every handler and abort, so Safari closes the mic session instead of keeping it open

function startRec(target, box, isRetry){
  if(!SR){ box.innerHTML = micHelp("这个浏览器不支持语音识别。"); return; }

  if(prev){ releaseRec(prev); }
  stopAll(); clearTimeout(recTimer);
  if(!isRetry) recTries=0;
  // iOS needs a moment after the previous session is released before a new one can take the mic
  const wait=Math.max(0, recBusyUntil-Date.now(), prev?350:0);
  if(wait>0){ box.innerHTML='<span class="rec"><span class="dot"></span> 准备中…</span>'; setTimeout(()=>startRec(target, box, isRetry), wait); recBusyUntil=0; return; }
  const r = new SR(); activeRec=r;
  r.lang="en-US"; r.interimResults=true; r.maxAlternatives=3; r.continuous=false;
  box.innerHTML = '<span class="rec"><span class="dot"></span> 正在听…请大声、慢慢地读上面的英文</span>';
  face.mood("think");
  let finalText="", gotAudio=false, handled=false, myTimer=null;
  const finish=(kind)=>{ if(handled) return; handled=true; clearTimeout(myTimer); if(activeRec===r) activeRec=null; releaseRec(r); recBusyUntil=Date.now()+350; face.mood("happy");
    if(finalText.trim()){ showResult(target, finalText.trim(), box); return; }
    // transient failure: retry once silently before showing help
    if((kind==="network"||kind==="timeout"||kind==="aborted") && recTries<1){ recTries++; box.innerHTML='<span class="rec"><span class="dot"></span> 连接有点慢，正在重试…请再读一遍</span>'; setTimeout(()=>startRec(target, box, true), 400); return; }
    recHelp(kind, box, target); };
  r.onaudiostart=()=>{ gotAudio=true; };
  r.onresult = e=>{ let s=""; for(let i=e.resultIndex;i<e.results.length;i++){ s+=e.results[i][0].transcript; if(e.results[i].isFinal) finalText+=e.results[i][0].transcript+" "; }
    if(!finalText) box.innerHTML = '<span class="rec"><span class="dot"></span> 听到：<span class="en">'+esc(s)+'</span></span>'; };
  r.onerror = e=>{ const k=e.error; try{ r.abort(); }catch(x){}
    if(k==="not-allowed"||k==="service-not-allowed") finish("not-allowed");
    else if(k==="no-speech") finish("no-speech");
    else if(k==="network"||k==="aborted") finish(k);
    else finish("other"); };

}
function micHelp(head){
  return '<b>'+head+'</b><br>说话练习需要麦克风。请在浏览器地址栏左边点一下“锁”或“设置”图标，把麦克风改为“允许”，然后刷新页面再试。手机上请在弹出的提示里选择“允许”。';

function showResult(target, heard, box){
  const c = compare(target, heard);
  const m=/^d(\d+)$/.exec(box.id); const ch=COURSE.find(x=>x.id===cur);
  if(m && ch){ const k=ch.id+"-"+m[1]; if(c.score>(S.drill[k]||0)){ S.drill[k]=c.score; save(); const t=document.querySelector(".ptrack"); if(t) t.outerHTML=trackerHTML(ch); } }

  if(c.score>=85){ face.mood("wow",2500); face.bounce(); } else if(c.score<60) face.mood("oops",2000);

  let html = '<div>你的得分：<span class="score '+cls+'">'+c.score+'%</span> · '+verdict+'</div>';
  html += '<div class="heard">我听到：'+esc(heard)+'</div><div>';

    html += '<div style="margin-top:6px;font-size:14px">'+missed.map(hint).filter(Boolean).join("<br>")+'</div>'; }

}
function hint(w){
  if(/th/.test(w)) return "“"+w+"”有 th：舌尖伸到上下牙之间。";
  if(/^v|v$/.test(w)||/v/.test(w)) return "“"+w+"”有 v：上牙咬下唇，声带震动。";
  if(/^r/.test(w)) return "“"+w+"”开头是 r：舌头往后卷，不碰上颚。";
  if(/l$/.test(w)) return "“"+w+"”结尾是 l：舌尖顶住上牙后面。";
  if(/[bdgkptsz]$/.test(w)) return "“"+w+"”结尾是辅音：发出来就停，不要加尾音。";
  if(/^w/.test(w)) return "“"+w+"”开头是 w：嘴唇先收圆。";
  return "";
}

function speakHTML(c){
  let h='<div class="callout">怎么练：① 点“🔊 听”两三遍，可以用“🐢 慢”。② 点“🎤 我来读”，大声、慢慢读出英文。③ 看结果：绿色是被听清的词，红色是没听清的，点红色词单独再听。目标是每句 85% 以上。</div>'+speedCtl();
  if(!SR) h+='<div class="callout warn">'+micHelp("这个浏览器不支持语音识别。")+'</div>';
  else if(isIOS()) h+='<div class="callout" style="font-size:14px">📱 iPhone 小提示：“🎤 我来读”用的是手机系统的听写服务。如果它反复没有反应，请到 设置 → 通用 → 键盘 → 启用听写，并添加英语。</div>';
  c.drills.forEach(([en,zh],i)=>{ const id="d"+i; h+='<div class="drill"><div class="en">'+esc(en)+'</div><div class="zh">'+esc(zh)+'</div><div class="row"><button class="ib" onclick="say('+JSON.stringify(en).replace(/"/g,"&quot;")+')">🔊 听</button><button class="ib" onclick="say('+JSON.stringify(en).replace(/"/g,"&quot;")+',0.6)">🐢 慢</button><button class="btn" onclick="startRec('+JSON.stringify(en).replace(/"/g,"&quot;")+',document.getElementById(\''+id+'\'))">🎤 我来读</button></div><div class="result" id="'+id+'">还没有读。点“🎤 我来读”开始。</div><div id="'+id+'p"></div></div>'; });
  h+='<div class="row"><button class="btn" onclick="go(\''+c.id+'\',\'ex\')">去做练习 →</button></div>';
  return h;
}

function exHTML(c){
  let h='<div class="callout">练习会立刻给出对错。“听写”题先点 🔊，可以听很多遍。做完全部题目再去作业。</div>';
  c.ex.forEach((e,i)=>{ const key=c.id+"-"+i; const st=S.ex[key];
    h+='<div class="ex" id="ex'+i+'"><div class="q">'+(i+1)+'. '+esc(e.q)+'</div>';
    if(e.say) h+='<div class="row" style="margin-bottom:8px"><button class="ib" onclick="say('+JSON.stringify(e.say).replace(/"/g,"&quot;")+')">🔊 听</button><button class="ib" onclick="say('+JSON.stringify(e.say).replace(/"/g,"&quot;")+',0.6)">🐢 慢</button></div>';
    if(e.t==="mc"||e.t==="listen"){ h+='<div class="opts">'+e.opts.map((o,j)=>'<button class="opt'+(st!==undefined&&j===e.a?" ok":"")+(st!==undefined&&st===j&&j!==e.a?" no":"")+'" onclick="answer(\''+c.id+'\','+i+','+j+')"><span class="en">'+esc(o)+'</span></button>').join("")+'</div>'; }
    else { h+='<div class="row"><input type="text" id="in'+i+'" value="'+(st!==undefined?esc(st):"")+'" placeholder="在这里打字" autocomplete="off"><button class="btn sec2" onclick="answerType(\''+c.id+'\','+i+')">检查</button></div>'; }
    if(st!==undefined){ const ok = e.t==="type"? typeOK(e,st) : st===e.a; h+='<div class="fb '+(ok?"ok":"no")+'">'+(ok?'✓ 正确！':'✗ 不对。正确答案：<span class="en">'+esc(e.t==="type"?e.a:e.opts[e.a])+'</span>')+(e.say&&!ok?' —— 再听一遍，注意嘴型。':'')+'</div>'; }
    h+='</div>'; });
  const total=c.ex.length, right=c.ex.filter((e,i)=>{const st=S.ex[c.id+"-"+i]; return st!==undefined && (e.t==="type"?typeOK(e,st):st===e.a);}).length;
  h+='<div class="card"><b>本章练习：'+right+' / '+total+' 正确</b>'+(right===total?' <span class="badge">全对 🎉</span>':'')+'<div class="row" style="margin-top:10px"><button class="btn sec2" onclick="resetEx(\''+c.id+'\')">重做本章练习</button><button class="btn" onclick="go(\''+c.id+'\',\'hw\')">去看作业 →</button></div></div>';
  return h;
}
function typeOK(e,ans){ const n=s=>norm(s); return [e.a,...(e.alt||[])].some(x=>n(x)===n(ans)); }
function react(ok){ if(ok){ face.mood("happy"); face.bounce(); } else face.mood("oops",1800); }
function answer(cid,i,j){ S.ex[cid+"-"+i]=j; const e=COURSE.find(x=>x.id===cid).ex[i]; react(j===e.a); save(); render(); setTimeout(()=>document.getElementById("ex"+i)?.scrollIntoView({block:"center",behavior:"smooth"}),0); }
function answerType(cid,i){ const v=document.getElementById("in"+i).value.trim(); if(!v) return; S.ex[cid+"-"+i]=v; react(typeOK(COURSE.find(x=>x.id===cid).ex[i],v)); save(); render(); setTimeout(()=>document.getElementById("ex"+i)?.scrollIntoView({block:"center",behavior:"smooth"}),0); }
function resetEx(cid){ Object.keys(S.ex).forEach(k=>{ if(k.startsWith(cid+"-")) delete S.ex[k]; }); save(); render(); }

function hwHTML(c){
  let h='<div class="callout"><b>作业要在真实生活里完成。</b>这是本课堂和“只在手机里学”的根本区别。每项作业完成后打勾。三项都打勾，本章就完成了。做的时候紧张很正常，说错也没关系，对方听懂了一个词就是胜利。</div>';
  h+='<ul class="hw">'+c.hw.map(([k,t],i)=>{ const id=c.id+"-"+i; return '<li><input type="checkbox" id="hw'+i+'" '+(S.hw[id]?"checked":"")+' onchange="hwToggle(\''+c.id+'\','+i+',this.checked)"><label for="hw'+i+'"><div class="k">'+esc(k)+'</div><div>'+esc(t)+'</div></label></li>'; }).join("")+'</ul>';
  h+='<div class="card" style="margin-top:14px">'+(chapDone(c)?'<b style="color:var(--good)">✓ 本章已完成</b>':'<b>完成三项作业后，本章自动标记完成。</b>')+'<div style="font-size:14px;color:var(--muted);margin-top:6px">做作业时遇到的问题（对方说了什么听不懂、某个词不会说），回来按“问老师”问我。</div></div>';
  return h;
}
function hwToggle(cid,i,v){ S.hw[cid+"-"+i]=v; const c=COURSE.find(x=>x.id===cid); S.done[cid]=c.hw.every((_,j)=>S.hw[cid+"-"+j]); save(); renderRail(); render(); if(v) face.bounce(); if(S.done[cid]){ toast("本章完成！🎉"); face.mood("wow",3000); } }

/* ---------- teacher (ask Claude) ---------- */
const RULES = `你是一位耐心的英语老师，学生是中国人，英语零基础，正在用一个叫“英语起步课堂”的课程学习。规则：
1. 永远用简单的中文解释。英文只出现在需要示范的单词和句子里，并且每个英文例子后面都用括号写中文意思。
2. 讲发音时，用“嘴型/舌头位置”的动作描述（例如：上牙轻咬下唇），不要只给音标。可以给“近似的中文发音”帮助理解，但要说明只是近似。
3. 回答要短：3 到 6 句，像在课堂上面对面说话。一次只讲一个重点。
4. 课程分五个级别（入门、基础、进阶、中级、高级）。如果学生问的内容超出他现在所在的级别，先用最简单的方式回答，再说“这个在后面的级别会详细学”。
5. 鼓励学生到真实生活里去用。可以在结尾给一个今天就能做的“小任务”。
6. 如果学生写的英文有错，先说对的地方，再指出错误并给出正确说法。
7. 不要用 markdown 标题或表格，可以用简单的换行。`;
let turns=[], sampleFn=null, ctl=null;
(async()=>{ try{ sampleFn = window.claude?.use ? await window.claude.use("sample") : null; }catch(e){ sampleFn=null; } })();
function togglePanel(on){ $("#panel").classList.toggle("on",on); $("#openBtn").hidden=on; if(on){ if(!$("#chat").children.length) seedChat(); setTimeout(()=>$("#ask").focus(),50); } }
function seedChat(){
  addMsg("ai",(me?me.name+"，":"")+"你好！我是小英，你的英语老师。你可以用中文问我任何问题：某个音怎么发、这句话什么意思、生活里遇到的英语怎么说。\n\n我会用中文解释，用英文示范，点“🔊”就能听到示范的读音。");
  renderQuick();
}
function renderQuick(){
  const c = COURSE.find(x=>x.id===cur);
  const qs = c? ["th 怎么发音？我总发成 s","这一章最难的是什么？","帮我检查这句话：I am go to school","做作业时对方说太快听不懂怎么办？"] : ["我该从哪里开始？","怎么练才能让别人听懂我？","每天学多久合适？"];
  $("#quick").innerHTML = qs.map(q=>'<button onclick="$(\'#ask\').value='+JSON.stringify(q).replace(/"/g,"&quot;")+';askTeacher()">'+esc(q)+'</button>').join("");
}
function addMsg(who,text){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=text; if(who==="ai") addSayButtons(d,text); $("#chat").appendChild(d); $("#chat").scrollTop=1e9; return d; }
function addSayButtons(d,text){
  const en = (text.match(/[A-Za-z][A-Za-z' ,.!?-]{2,}/g)||[]).map(s=>s.trim()).filter(s=>/[a-zA-Z]{2,}/.test(s)&&s.length<80);
  const uniq=[...new Set(en)].slice(0,6); if(!uniq.length) return;
  const row=document.createElement("div"); row.className="row say";
  uniq.forEach(s=>{ const b=document.createElement("button"); b.className="ib"; b.textContent="🔊 "+s; b.onclick=()=>say(s,0.75); row.appendChild(b); });
  d.appendChild(row);
}
async function askTeacher(){
  const q=$("#ask").value.trim(); if(!q) return;
  $("#ask").value=""; addMsg("me",q);
  if(!sampleFn){ const d=addMsg("ai","“问老师”在这个网址上不能回答（它需要你的 Claude 账户）。请打开课堂的 claude.ai 版本提问。课程内容一样，进度是分开记录的。"); const a=document.createElement("a"); a.href="https://claude.ai/artifact/UAoxtesh5KrBp7drdj8bd9"; a.target="_blank"; a.rel="noopener"; a.textContent="打开 claude.ai 版本 →"; a.className="btn"; a.style.cssText="display:inline-block;margin-top:8px;text-decoration:none"; d.appendChild(a); return; }
  const c = COURSE.find(x=>x.id===cur);
  const ctx = c? "学生现在在学："+LV_N[lvOf(c)]+"第"+lvIndex(c)+"章《"+c.title+"》。本章目标："+c.goal+"。本章重点句："+c.drills.map(d=>d[0]).join(" | ") : "学生在课程总览页。";
  turns.push({role:"user",content:q}); if(turns.length>12) turns=turns.slice(-12);
  const bubble=addMsg("ai","小英在想……"); $("#askBtn").disabled=true;
  face.mood("think");
  ctl=new AbortController();
  try{
    const {text} = await sampleFn([{role:"user",content:RULES+"\n\n学生的名字："+(me?me.name:"同学")+"。当前上下文："+ctx},...turns],{cache:false,signal:ctl.signal,modelTier:"default",onText:({text})=>{face.mood("happy");face.talk(true);bubble.textContent=text;$("#chat").scrollTop=1e9;}});
    face.talk(false); bubble.textContent=text; addSayButtons(bubble,text); turns.push({role:"assistant",content:text});
  }catch(e){
    face.talk(false); face.mood("oops",2000);
    const map={not_granted:"你没有允许本页面使用 Claude，所以老师暂时不能回答。可以在页面的权限设置里打开。",rate_limited:"问得太快了，或者今天的用量到了上限。休息一下再问。",session_expired:"登录过期了，请重新登录 claude.ai。",refused:"这个问题老师不能回答，换个问法试试。"};
    bubble.textContent = e.text || map[e.code] || "老师这边出了点问题，请再问一次。";
    turns.pop();
  }finally{ $("#askBtn").disabled=false; $("#chat").scrollTop=1e9; }
}
$("#ask").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); askTeacher(); } });

/* ---------- boot ---------- */
if(/^#(c\d+|review)$/.test(location.hash)){ const id=location.hash.slice(1); if(id==="review"||COURSE.find(c=>c.id===id)) cur=id; }
renderRail(); render();
initLogin();
if(USE_WEBAUDIO){ const unlock=()=>{ try{ getCtx(); }catch(e){} }; document.addEventListener("touchend",unlock,{once:true,passive:true}); document.addEventListener("click",unlock,{once:true}); }
</script>
