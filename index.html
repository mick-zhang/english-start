{ id:"l26c2", lv:26, title:"力学与结构：为什么桥不塌", goal:"掌握结构力学的基本英语（应力、应变、压缩、拉伸、弯曲、梁、桁架），能解释日常结构（桥、楼、椅子）为什么站得住。",
  intro:"每栋楼、每座桥、每把椅子都在和<b>重力和力</b>打交道。本章用最少的公式教最核心的概念：<b>四种受力</b>（compression、tension、bending、shear）、<b>材料的性质</b>（strength、stiffness、ductile vs brittle）、<b>结构形式</b>（beam、column、truss、arch）和<b>失效</b>（buckling、fatigue）。加拿大的工程史上有一个必讲的故事：<b>魁北克桥的倒塌</b>——铁戒指就从那来的。",
  learn:[{h:"力与材料",p:"",items:[
   {en:"compression, tension, bending, shear, torsion", ipa:"", zh:"压缩、拉伸、弯曲、剪切、扭转", tip:"tension 读 TEN-shun。"},
   {en:"A column is in compression; a cable is in tension; a beam is in bending.", ipa:"", zh:"柱子受压；缆索受拉；梁受弯。", tip:""},
   {en:"stress is force per area; strain is how much it stretches", ipa:"", zh:"应力是单位面积的力；应变是它拉伸了多少", tip:""},
   {en:"strength, stiffness, ductile, brittle, elastic, plastic", ipa:"", zh:"强度、刚度、延性的、脆性的、弹性的、塑性的", tip:"ductile 读 DUK-tile。"},
   {en:"Steel is ductile: it bends before it breaks. Concrete is brittle: it cracks suddenly.", ipa:"", zh:"钢是延性的：断之前先弯。混凝土是脆性的：突然开裂。", tip:""},
   {en:"Concrete is strong in compression but weak in tension. That's why we put steel rebar inside it.", ipa:"", zh:"混凝土抗压强但抗拉弱。所以我们在里面放钢筋。", tip:"rebar = 钢筋。"}]},
   {h:"结构形式",p:"",items:[
   {en:"beam, column, truss, arch, cantilever, foundation", ipa:"", zh:"梁、柱、桁架、拱、悬臂、基础", tip:"cantilever 读 KAN-ti-lee-ver。"},
   {en:"A truss uses triangles because a triangle can't change shape without changing a side's length.", ipa:"", zh:"桁架用三角形，因为三角形不改变边长就不能变形。", tip:""},
   {en:"An arch turns the load into compression, which stone handles well. That's why Roman arches still stand.", ipa:"", zh:"拱把负载变成压力，石头擅长承受。所以罗马拱还立着。", tip:""},
   {en:"A cantilever is supported at only one end, like a balcony or a diving board.", ipa:"", zh:"悬臂只在一端支撑，像阳台或跳板。", tip:""},
   {en:"Suspension bridges hang the deck from cables in tension, anchored to towers.", ipa:"", zh:"悬索桥把桥面挂在受拉的缆索上，锚固在塔上。", tip:""},
   {en:"The deeper a beam, the stiffer it is. Doubling the depth makes it eight times stiffer.", ipa:"", zh:"梁越深越刚。深度加倍，刚度变八倍。", tip:"所以工字梁是那个形状。"}]},
   {h:"失效与故事",p:"",items:[
   {en:"buckling, fatigue, fracture, corrosion, overload", ipa:"", zh:"屈曲、疲劳、断裂、腐蚀、超载", tip:"fatigue 读 fa-TEEG。"},
   {en:"A long thin column buckles sideways long before it crushes.", ipa:"", zh:"细长的柱子远在压碎之前就会侧向屈曲。", tip:""},
   {en:"Fatigue is failure from repeated loading. A paper clip bent back and forth eventually snaps.", ipa:"", zh:"疲劳是反复加载造成的失效。回形针来回弯最终会断。", tip:"snaps = 突然断。"},
   {en:"The Quebec Bridge collapsed in 1907 during construction, killing 75 workers. The engineers had underestimated its own weight.", ipa:"", zh:"魁北克桥 1907 年施工中倒塌，75 名工人死亡。工程师低估了它自身的重量。", tip:"underestimated = 低估。"},
   {en:"The iron ring tradition began after that disaster, as a reminder that engineering mistakes cost lives.", ipa:"", zh:"铁戒指的传统在那次灾难后开始，提醒工程错误会付出生命。", tip:""},
   {en:"Inspections look for cracks, rust, and movement before they become failures.", ipa:"", zh:"检查寻找裂缝、锈和位移，在它们变成失效之前。", tip:""}]}],
  drills:[["compression, tension, bending, shear, torsion","五种力"],["A column is in compression; a cable is in tension; a beam is in bending.","三个例子"],["Steel is ductile: it bends before it breaks. Concrete is brittle: it cracks suddenly.","材料"],["beam, column, truss, arch, cantilever, foundation","结构"],["A truss uses triangles because a triangle can't change shape without changing a side's length.","三角形"],["The Quebec Bridge collapsed in 1907 during construction. The engineers had underestimated its own weight.","故事"]],
  ex:[
   {t:"mc",q:"缆索主要受什么力？",opts:["拉伸（tension）","压缩","弯曲","剪切"],a:0},
   {t:"listen",q:"听一听，这是什么材料性质？",say:"It bends before it breaks.",opts:["延性（ductile）","脆性","刚度","强度"],a:0},
   {t:"mc",q:"混凝土里为什么放钢筋？",opts:["混凝土抗拉弱，钢筋补充","让它更重","省钱","防水"],a:0},
   {t:"listen",q:"听一听，这是哪种失效？",say:"A paper clip bent back and forth eventually snaps.",opts:["疲劳","屈曲","腐蚀","超载"],a:0},
   {t:"type",q:"翻译：悬臂只在一端支撑。",a:"A cantilever is supported at only one end.",alt:["A cantilever is supported at only one end","a cantilever is supported at only one end","A cantilever is supported on only one end."]},
   {t:"type",q:"听写这个词（“桁架”）。",say:"truss",a:"truss"}],
  hw:[["看一座桥","找一座你见过的桥（照片也行），用英语说出它的类型和哪些部分受压、受拉。"],["家里的结构","用英语说出家里三样东西的结构形式（书架是 beam 和 column，阳台是 cantilever……）。"],["讲一个故事","用英语给朋友讲魁北克桥和铁戒指的故事，三句话。"]]
},
{ id:"l26c3", lv:26, title:"编程入门：代码怎么读、怎么说", goal:"掌握编程的基本概念和英语（variable、loop、function、bug），能读懂简单的代码和错误信息，能用英语描述程序的逻辑。",
  intro:"编程的英语是<b>最容易学的学科英语</b>，因为代码本身就是英语单词（if、while、return、print）。本章不教你成为程序员，教你<b>读懂代码在做什么</b>、<b>说出程序的逻辑</b>、<b>读懂错误信息</b>——这对任何用电脑工作的人都有用，对想转行或辅导孩子的人更是入门。用 Python 举例，因为它最像英语。",
  learn:[{h:"基本概念",p:"",items:[
   {en:"variable, value, data type: string, integer, float, boolean, list", ipa:"", zh:"变量、值、数据类型：字符串、整数、浮点数、布尔值、列表", tip:"boolean 读 BOO-lee-an，只有 True / False。"},
   {en:"name equals 'Wei'. age equals 35. is_student equals False.", ipa:"", zh:"name = 'Wei'。age = 35。is_student = False。", tip:"读代码时 = 读 equals 或 is set to。"},
   {en:"A function takes input, does something, and returns output.", ipa:"", zh:"函数接收输入，做某事，返回输出。", tip:"和数学的函数一样。"},
   {en:"if, else, while, for, return, print; condition, loop, iteration", ipa:"", zh:"如果、否则、当、对于、返回、打印；条件、循环、迭代", tip:""},
   {en:"If age is greater than or equal to 18, print 'adult'; otherwise print 'minor'.", ipa:"", zh:"如果 age ≥ 18，打印 adult；否则打印 minor。", tip:"读 if 语句的方式。"},
   {en:"For each item in the list, add it to the total.", ipa:"", zh:"对列表里的每一项，把它加到总数。", tip:"读 for 循环的方式。"}]},
   {h:"读代码与描述逻辑",p:"",items:[
   {en:"This function loops through the list and returns the largest number.", ipa:"", zh:"这个函数遍历列表并返回最大的数。", tip:"loops through = 遍历。"},
   {en:"First it checks whether the input is empty. If so, it returns zero.", ipa:"", zh:"它先检查输入是否为空。如果是，返回零。", tip:"edge case = 边界情况。"},
   {en:"The variable count starts at zero and goes up by one each time the condition is true.", ipa:"", zh:"变量 count 从 0 开始，每次条件为真就加一。", tip:""},
   {en:"algorithm, input, output, logic, syntax, indentation, comment", ipa:"", zh:"算法、输入、输出、逻辑、语法、缩进、注释", tip:"syntax 读 SIN-taks。Python 靠缩进。"},
   {en:"Pseudocode: write the steps in plain English before writing real code.", ipa:"", zh:"伪代码：写真正的代码前先用普通英语写步骤。", tip:""}]},
   {h:"错误与调试",p:"",items:[
   {en:"bug, error, crash, debug, syntax error, runtime error, logic error", ipa:"", zh:"漏洞、错误、崩溃、调试、语法错误、运行时错误、逻辑错误", tip:"debug = 找并修 bug。"},
   {en:"SyntaxError: invalid syntax. Usually a missing colon or bracket.", say:"Syntax error: invalid syntax. Usually a missing colon or bracket.", ipa:"", zh:"语法错误：无效语法。通常是缺冒号或括号。", tip:"colon = 冒号。"},
   {en:"NameError: name 'totl' is not defined. You probably misspelled a variable.", say:"Name error: name totl is not defined. You probably misspelled a variable.", ipa:"", zh:"名称错误：totl 未定义。你可能拼错了变量。", tip:"misspelled = 拼错。"},
   {en:"The code runs but gives the wrong answer. That's a logic error, the hardest kind.", ipa:"", zh:"代码能运行但答案错。那是逻辑错误，最难的一种。", tip:""},
   {en:"Read the error message from the bottom up. The last line tells you what; the line number tells you where.", ipa:"", zh:"从下往上读错误信息。最后一行告诉你是什么；行号告诉你在哪。", tip:""},
   {en:"Have you tried printing the value at each step?", ipa:"", zh:"你试过在每一步打印值吗？", tip:"最基本的调试方法。"}]}],
  drills:[["variable, value, string, integer, boolean, list","六个概念"],["A function takes input, does something, and returns output.","函数"],["If age is greater than or equal to 18, print 'adult'; otherwise print 'minor'.","读 if"],["This function loops through the list and returns the largest number.","描述逻辑"],["bug, error, crash, debug, syntax error, logic error","错误词"],["Read the error message from the bottom up. The last line tells you what; the line number tells you where.","调试"]],
  ex:[
   {t:"mc",q:"“boolean” 类型的值是？",opts:["True 或 False","数字","文字","列表"],a:0},
   {t:"listen",q:"听一听，这段代码做什么？",say:"For each item in the list, add it to the total.",opts:["遍历列表求和","找最大值","排序","删除"],a:0},
   {t:"mc",q:"代码能运行但答案错，是哪种错误？",opts:["逻辑错误","语法错误","运行时错误","拼写错误"],a:0},
   {t:"listen",q:"听一听，这是什么错误？",say:"NameError: name 'totl' is not defined.",opts:["变量名拼错/未定义","缺冒号","除以零","文件不存在"],a:0},
   {t:"type",q:"翻译：你试过在每一步打印值吗？",a:"Have you tried printing the value at each step?",alt:["Have you tried printing the value at each step","have you tried printing the value at each step","Did you try printing the value at each step?"]},
   {t:"type",q:"听写这个词（“算法”）。",say:"algorithm",a:"algorithm"}],
  hw:[["读一段代码","找一段 10 行的 Python 代码（网上教程），用英语一行行说出它在做什么。"],["写伪代码","用英语写“做一杯茶”或“找列表最大值”的伪代码，五到八步。"],["修一个错","在 Python 在线编辑器（replit 等）故意写一个有错的程序，用英语读错误信息并修好。"]]
},
{ id:"l26c4", lv:26, title:"算法与数据结构：效率与思维", goal:"掌握算法和数据结构的基本英语（搜索、排序、复杂度、数组、树），能解释为什么一个方法比另一个快，能听懂技术面试的问题。",
  intro:"算法是<b>解决问题的步骤</b>，数据结构是<b>怎么组织数据</b>。这是计算机科学的核心，也是<b>技术面试的核心</b>。本章用生活例子讲：<b>搜索</b>（翻字典为什么快）、<b>排序</b>（整理扑克牌）、<b>复杂度</b>（big O——数据翻倍，时间翻几倍）、<b>数据结构</b>（list、stack、queue、tree、hash table）。学会用英语解释“为什么这个更快”。",
  learn:[{h:"搜索与排序",p:"",items:[
   {en:"Linear search checks every item one by one. Binary search cuts the list in half each step.", ipa:"", zh:"线性搜索一个个检查。二分搜索每步把列表切一半。", tip:"binary 读 BY-nair-ee。"},
   {en:"Looking up a word in a dictionary is binary search: open the middle, go left or right, repeat.", ipa:"", zh:"查字典是二分搜索：翻到中间，往左或右，重复。", tip:""},
   {en:"Binary search only works if the list is sorted.", ipa:"", zh:"二分搜索只在列表已排序时有效。", tip:""},
   {en:"Sorting algorithms: bubble sort is simple but slow; merge sort and quicksort are fast.", ipa:"", zh:"排序算法：冒泡排序简单但慢；归并排序和快速排序快。", tip:""},
   {en:"Merge sort splits the list in half, sorts each half, and merges them back together.", ipa:"", zh:"归并排序把列表分两半，各自排序，再合并。", tip:"divide and conquer = 分治。"}]},
   {h:"复杂度",p:"",items:[
   {en:"Big O notation describes how running time grows as the input grows.", ipa:"", zh:"大 O 表示法描述运行时间随输入增长怎么增长。", tip:"notation 读 no-TAY-shun。"},
   {en:"O of one: constant time. O of n: linear. O of n squared: quadratic. O of log n: logarithmic.", ipa:"", zh:"O(1)：常数时间。O(n)：线性。O(n²)：平方。O(log n)：对数。", tip:"读 O of n。"},
   {en:"If the input doubles and the time doubles, it's linear. If the time quadruples, it's quadratic.", ipa:"", zh:"输入加倍时间加倍，是线性。时间变四倍，是平方。", tip:"quadruples = 变四倍。"},
   {en:"Binary search is O of log n: a million items takes only about twenty steps.", ipa:"", zh:"二分搜索是 O(log n)：一百万项只需约 20 步。", tip:""},
   {en:"We care about the worst case, because that's what breaks at scale.", ipa:"", zh:"我们关心最坏情况，因为那是大规模时会出问题的。", tip:"at scale = 大规模时。"},
   {en:"A nested loop over the same list is usually O of n squared. Try to avoid it.", ipa:"", zh:"对同一列表的嵌套循环通常是 O(n²)。尽量避免。", tip:"nested = 嵌套。"}]},
   {h:"数据结构",p:"",items:[
   {en:"array, list, stack, queue, hash table, tree, graph", ipa:"", zh:"数组、列表、栈、队列、哈希表、树、图", tip:""},
   {en:"A stack is last in, first out, like a pile of plates. A queue is first in, first out, like a lineup.", ipa:"", zh:"栈是后进先出，像一摞盘子。队列是先进先出，像排队。", tip:"LIFO / FIFO。"},
   {en:"A hash table gives you constant-time lookup. That's why dictionaries in Python are so fast.", ipa:"", zh:"哈希表给你常数时间查找。所以 Python 的字典那么快。", tip:"lookup = 查找。"},
   {en:"A tree has a root, branches, and leaves. File systems and family trees are trees.", ipa:"", zh:"树有根、枝和叶。文件系统和家谱是树。", tip:""},
   {en:"A graph is nodes connected by edges: a road map, a social network.", ipa:"", zh:"图是由边连接的节点：路线图、社交网络。", tip:"nodes / edges。"},
   {en:"Choosing the right data structure is half the job. The other half is explaining why.", ipa:"", zh:"选对数据结构是一半的工作。另一半是解释为什么。", tip:"技术面试考的就是解释。"}]}],
  drills:[["Linear search checks every item one by one. Binary search cuts the list in half each step.","两种搜索"],["Binary search only works if the list is sorted.","条件"],["Big O notation describes how running time grows as the input grows.","大 O"],["O of one: constant. O of n: linear. O of n squared: quadratic. O of log n: logarithmic.","四种"],["A stack is last in, first out. A queue is first in, first out.","栈和队列"],["A hash table gives you constant-time lookup.","哈希表"]],
  ex:[
   {t:"mc",q:"查字典用的是哪种搜索？",opts:["二分搜索","线性搜索","冒泡排序","哈希"],a:0},
   {t:"listen",q:"听一听，这是什么复杂度？",say:"If the input doubles and the time quadruples.",opts:["O(n²) 平方","O(n) 线性","O(1) 常数","O(log n) 对数"],a:0},
   {t:"mc",q:"“last in, first out” 是？",opts:["栈","队列","树","图"],a:0},

{ id:"l26c5", lv:26, title:"数据、网络与 AI：现代技术怎么运作", goal:"掌握数据库、网络和人工智能的核心英语，能读懂科技新闻，能解释 AI 模型大致怎么工作以及它的局限。",
  intro:"这一章讲<b>你每天在用的技术</b>背后是什么：<b>数据库</b>（table、query、SQL）、<b>互联网</b>（IP、server、HTTP、cloud）、<b>AI</b>（machine learning、training data、neural network、large language model）。目标是让你能<b>读懂科技新闻</b>、<b>理解 AI 工具的能力和局限</b>（为什么会“一本正经地胡说”）、<b>在工作中和技术人员沟通</b>。我——你的老师——就是一个 large language model，这章也解释我怎么工作。",
  learn:[{h:"数据与网络",p:"",items:[
   {en:"database, table, row, column, query, SQL, primary key", ipa:"", zh:"数据库、表、行、列、查询、SQL、主键", tip:"SQL 读 sequel 或 S-Q-L。"},
   {en:"SELECT name FROM customers WHERE city equals 'Toronto'. That's a query.", ipa:"", zh:"从 customers 表选出城市是多伦多的 name。那是一个查询。", tip:"SQL 几乎就是英语。"},
   {en:"server, client, IP address, domain, HTTP, API, the cloud", ipa:"", zh:"服务器、客户端、IP 地址、域名、HTTP、应用接口、云", tip:"API = 程序之间说话的方式。"},
   {en:"When you open a website, your browser sends a request to a server, which sends back the page.", ipa:"", zh:"你打开网站时，浏览器向服务器发请求，服务器发回页面。", tip:"request / response。"},
   {en:"The cloud just means someone else's computers, rented by the hour.", ipa:"", zh:"云只是别人的电脑，按小时租。", tip:""},
   {en:"encryption, password hashing, two-factor authentication, data breach", ipa:"", zh:"加密、密码哈希、双重验证、数据泄露", tip:"breach 读 /briːtʃ/。"}]},
   {h:"人工智能",p:"",items:[
   {en:"artificial intelligence, machine learning, neural network, training data, model, prediction", ipa:"", zh:"人工智能、机器学习、神经网络、训练数据、模型、预测", tip:""},
   {en:"Machine learning means the program learns patterns from examples instead of being given rules.", ipa:"", zh:"机器学习意味着程序从例子中学习模式，而不是被给定规则。", tip:""},
   {en:"Show it a million photos labelled 'cat' or 'not cat', and it learns to tell the difference.", ipa:"", zh:"给它看一百万张标注“猫”或“非猫”的照片，它就学会区分。", tip:"labelled = 标注。"},
   {en:"A large language model predicts the next word, over and over, based on patterns in a huge amount of text.", ipa:"", zh:"大语言模型基于海量文本中的模式，一遍遍预测下一个词。", tip:"这就是我怎么工作。"},
   {en:"It doesn't look things up. It generates text that sounds right, which is why it can be confidently wrong.", ipa:"", zh:"它不查资料。它生成听起来对的文字，所以它可能自信地出错。", tip:"hallucination = AI 编造。"},
   {en:"Garbage in, garbage out: a model trained on biased data gives biased answers.", ipa:"", zh:"垃圾进垃圾出：用有偏数据训练的模型给出有偏答案。", tip:""}]},
   {h:"读科技新闻与沟通",p:"",items:[
   {en:"The company released a new model that outperforms the previous one on reasoning benchmarks.", ipa:"", zh:"公司发布了新模型，在推理基准测试上超过前一个。", tip:"outperforms = 表现超过；benchmarks = 基准测试。"},
   {en:"Regulators are debating how to govern AI: transparency, safety testing, and liability.", ipa:"", zh:"监管者在讨论如何治理 AI：透明度、安全测试和责任。", tip:""},
   {en:"AI will change many jobs, but mostly by changing tasks within jobs rather than eliminating them.", ipa:"", zh:"AI 会改变很多工作，但主要是改变工作里的任务，而不是消灭工作。", tip:"目前的主流看法。"},
   {en:"Can you explain that in non-technical terms? What does it do for the user?", ipa:"", zh:"能用非技术的话解释吗？它对用户做什么？", tip:"和技术人员沟通的万能句。"},
   {en:"What data does it need, and where does that data come from?", ipa:"", zh:"它需要什么数据，数据从哪来？", tip:"评估任何 AI 产品的第一个问题。"},
   {en:"Always verify important facts from an AI with a reliable source.", ipa:"", zh:"重要的事实永远用可靠来源核实 AI 的回答。", tip:"包括我说的。"}]}],
  drills:[["database, table, row, column, query","数据库"],["When you open a website, your browser sends a request to a server, which sends back the page.","网络"],["artificial intelligence, machine learning, neural network, training data","AI 词"],["Machine learning means the program learns patterns from examples instead of being given rules.","机器学习"],["A large language model predicts the next word, over and over, based on patterns in a huge amount of text.","大语言模型"],["It doesn't look things up. It generates text that sounds right, which is why it can be confidently wrong.","局限"]],
  ex:[
   {t:"mc",q:"“the cloud” 实际上是？",opts:["别人的电脑，按需租用","天上的服务器","无线网络","一种软件"],a:0},
   {t:"listen",q:"听一听，大语言模型怎么工作？",say:"It predicts the next word, over and over, based on patterns in text.",opts:["基于文本模式预测下一个词","查数据库","按规则推理","随机生成"],a:0},
   {t:"mc",q:"AI “confidently wrong” 的原因是？",opts:["它生成听起来对的文字，不查资料","它故意撒谎","它太慢","它没有数据"],a:0},
   {t:"listen",q:"听一听，这是什么意思？",say:"Garbage in, garbage out.",opts:["有偏数据给出有偏答案","垃圾要分类","输入输出一样","数据太多"],a:0},
   {t:"type",q:"翻译：能用非技术的话解释吗？",a:"Can you explain that in non-technical terms?",alt:["Can you explain that in non-technical terms","can you explain that in non-technical terms","Could you explain that in non-technical terms?"]},
   {t:"type",q:"听写这个词（“加密”）。",say:"encryption",a:"encryption"}],
  hw:[["解释 AI","用英语向家人解释大语言模型怎么工作、为什么会出错，三句话。"],["读一条科技新闻","读一条关于 AI 的英文新闻，用英语说出：谁、发布/决定了什么、本章的三个词。"],["问 AI 一个问题","用英语问我（或任何 AI）一个事实问题，然后用可靠来源核实，记下结果。"]]
},
{ id:"l26c6", lv:26, title:"第二十六级结业：做一个小项目并做技术演示", goal:"能完成一个小型工程或编程项目（从需求到测试），并用英语做一次 5 分钟的技术演示（demo），回答技术问题。",
  intro:"结业任务：<b>做一个小项目并演示</b>——可以是编程（一个记账脚本、一个网页）、也可以是工程（修一样东西、做一个支架、改进一个流程）。本章教<b>技术演示的结构</b>（problem → solution → demo → what I learned → next steps）、<b>演示时的语言</b>（Let me show you、As you can see、This part handles…）、<b>回答技术问题</b>（Why did you choose…? What would break it?）和<b>写 README / 项目说明</b>。",
  learn:[{h:"演示的结构",p:"",items:[
   {en:"The problem: I kept forgetting which bills were due, so I built a reminder script.", ipa:"", zh:"问题：我总忘记哪些账单到期，所以做了个提醒脚本。", tip:"问题从真实需求来。"},
   {en:"The solution: a Python script that reads a spreadsheet and sends me a text three days before each due date.", ipa:"", zh:"方案：一个 Python 脚本，读取表格，在每个到期日前三天给我发短信。", tip:""},
   {en:"Let me show you. As you can see, when I add a bill here, it appears in the list.", ipa:"", zh:"我演示一下。如你所见，我在这里加一个账单，它出现在列表里。", tip:"Let me show you / As you can see。"},
   {en:"This part handles the dates; this part sends the message.", ipa:"", zh:"这部分处理日期；这部分发消息。", tip:"handles = 负责。"},
   {en:"What I learned: dates are harder than they look. Time zones broke it twice.", ipa:"", zh:"我学到的：日期比看起来难。时区让它坏了两次。", tip:"诚实的教训最有说服力。"},
   {en:"Next steps: add email, and let my wife use it too.", ipa:"", zh:"下一步：加邮件，让我太太也能用。", tip:""}]},
   {h:"回答技术问题",p:"",items:[
   {en:"Why did you choose Python? — It's easy to read, and it has libraries for everything I needed.", ipa:"", zh:"你为什么选 Python？——它易读，而且我需要的都有库。", tip:"libraries = 库。"},
   {en:"What happens if the spreadsheet is empty? — Good question. Right now it crashes. That's on my list.", ipa:"", zh:"表格是空的会怎样？——好问题。现在会崩溃。在我的待办上。", tip:"承认 edge case。"},
   {en:"How did you test it? — I made a test file with ten fake bills and checked every case.", ipa:"", zh:"你怎么测试的？——我做了一个有十个假账单的测试文件，检查每种情况。", tip:""},
   {en:"What would break it? — A date in the wrong format. I should add validation.", ipa:"", zh:"什么会让它坏？——格式错的日期。我该加验证。", tip:"validation = 验证。"},
   {en:"I don't know, but I can find out and follow up.", ipa:"", zh:"我不知道，但我可以查了再跟进。", tip:""},
   {en:"That's a great suggestion. I hadn't thought of that.", ipa:"", zh:"好建议。我没想到那个。", tip:""}]},
   {h:"项目说明（README）",p:"",items:[
   {en:"What it does. How to install it. How to use it. Known issues. Who made it.", ipa:"", zh:"它做什么。怎么安装。怎么用。已知问题。谁做的。", tip:"README 的五部分。"},
   {en:"Bill Reminder: sends a text message three days before each bill is due.", ipa:"", zh:"账单提醒：在每个账单到期前三天发短信。", tip:"一句话说明。"},
   {en:"To install, run pip install dash r requirements dot txt.", ipa:"", zh:"安装：运行 pip install -r requirements.txt。", tip:"读命令行：dash = -，dot = .。"},
   {en:"Known issue: does not handle time zones correctly.", ipa:"", zh:"已知问题：不能正确处理时区。", tip:""},
   {en:"Contributions welcome. Open an issue or a pull request.", ipa:"", zh:"欢迎贡献。提 issue 或 pull request。", tip:"开源项目的标准结尾。"}]}],
  drills:[["The problem: I kept forgetting which bills were due, so I built a reminder script.","问题"],["Let me show you. As you can see, when I add a bill here, it appears in the list.","演示"],["What I learned: dates are harder than they look. Time zones broke it twice.","教训"],["Why did you choose Python? It's easy to read, and it has libraries for everything I needed.","为什么"],["What happens if the spreadsheet is empty? Good question. Right now it crashes. That's on my list.","边界"],["What it does. How to install it. How to use it. Known issues. Who made it.","README"]],
  ex:[
   {t:"mc",q:"技术演示的结构是？",opts:["问题 → 方案 → 演示 → 教训 → 下一步","代码 → 代码 → 代码","介绍自己 → 结束","只演示"],a:0},
   {t:"listen",q:"听一听，演示者在做什么？",say:"This part handles the dates; this part sends the message.",opts:["解释各部分的功能","道歉","结束","提问"],a:0},
   {t:"mc",q:"被问到一个没处理的情况，最好的回答是？",opts:["承认并说在待办上","说不可能发生","转移话题","否认"],a:0},
   {t:"listen",q:"听一听，这是 README 的哪部分？",say:"Known issue: does not handle time zones correctly.",opts:["已知问题","安装","用法","作者"],a:0},
   {t:"type",q:"翻译：你怎么测试的？",a:"How did you test it?",alt:["How did you test it","how did you test it","How did you test this?"]},
   {t:"type",q:"听写这个词（“验证”）。",say:"validation",a:"validation"}],
  hw:[["选一个项目","选一个一周能做完的小项目（脚本、网页、修理、改进），用英语写下问题和方案。"],["做并写 README","完成项目，用英语写五部分 README（或项目说明）。"],["演示（必做）","对至少两个人做 5 分钟英语演示，回答至少两个技术问题（Why…? What if…?）。记下你答不上来的那个。"]]
},

{ id:"l27c1", lv:27, title:"自然地理：地形、水系与气候带", goal:"掌握自然地理的核心英语（地形、河流、气候带、生态系统），能描述一个地方的地理特征，能读地理教科书。",
  intro:"地理是<b>描述地方的语言</b>：山、河、平原、气候。它的词汇在旅行、新闻、孩子的作业里都出现。本章教<b>地形</b>（mountain range、plateau、valley、coast）、<b>水系</b>（river、watershed、glacier、wetland）、<b>气候带</b>（tropical、temperate、arctic）和<b>生态系统</b>（forest、tundra、prairie）。核心句式：<b>X is located in / bordered by / characterized by</b>。",
  learn:[{h:"地形",p:"",items:[
   {en:"mountain range, peak, plateau, valley, plain, hill, canyon, coast", ipa:"", zh:"山脉、山峰、高原、山谷、平原、丘陵、峡谷、海岸", tip:"plateau 读 pla-TOE。"},
   {en:"The Rocky Mountains run north to south along the border of Alberta and British Columbia.", ipa:"", zh:"落基山脉沿阿尔伯塔和 BC 的边界南北走向。", tip:"run north to south = 南北走向。"},
   {en:"The Canadian Shield is a vast area of ancient rock covering half the country.", ipa:"", zh:"加拿大地盾是覆盖半个国家的广阔古老岩石区。", tip:"vast = 广阔。"},
   {en:"The Prairies are flat, fertile plains ideal for growing wheat.", ipa:"", zh:"草原省是平坦肥沃的平原，适合种小麦。", tip:"fertile 读 FER-tile。"},
   {en:"elevation, altitude, sea level, latitude, longitude", ipa:"", zh:"海拔、高度、海平面、纬度、经度", tip:"latitude 读 LAT-i-tood。"},
   {en:"Toronto is at forty-three degrees north latitude, about the same as Florence, Italy.", ipa:"", zh:"多伦多在北纬 43 度，和意大利的佛罗伦萨差不多。", tip:""}]},
   {h:"水系与气候",p:"",items:[
   {en:"river, lake, watershed, glacier, wetland, delta, tributary", ipa:"", zh:"河、湖、流域、冰川、湿地、三角洲、支流", tip:"tributary 读 TRIB-yoo-tair-ee。"},
   {en:"The Great Lakes hold about twenty percent of the world's fresh surface water.", ipa:"", zh:"五大湖拥有世界约 20% 的地表淡水。", tip:""},
   {en:"Canada has more lakes than the rest of the world combined.", ipa:"", zh:"加拿大的湖比世界其他地方加起来还多。", tip:"combined = 加起来。"},
   {en:"tropical, subtropical, temperate, continental, polar, arctic", ipa:"", zh:"热带、亚热带、温带、大陆性、极地、北极", tip:"temperate 读 TEM-per-it。"},
   {en:"Southern Ontario has a humid continental climate: hot summers, cold winters.", ipa:"", zh:"安省南部是湿润大陆性气候：夏热冬冷。", tip:""},
   {en:"Vancouver is milder and wetter because the Pacific Ocean moderates its temperature.", ipa:"", zh:"温哥华更温和多雨，因为太平洋调节它的温度。", tip:"moderates = 调节。"}]},
   {h:"生态系统与描述",p:"",items:[
   {en:"ecosystem, biome, forest, boreal forest, tundra, grassland, desert, rainforest", ipa:"", zh:"生态系统、生物群系、森林、北方针叶林、苔原、草原、沙漠、雨林", tip:"boreal 读 BOR-ee-al。"},
   {en:"The boreal forest stretches across Canada and is one of the largest forests on Earth.", ipa:"", zh:"北方针叶林横跨加拿大，是地球上最大的森林之一。", tip:"stretches across = 横跨。"},

   {en:"X is located in the north. It is bordered by Y to the east. It is characterized by cold winters.", ipa:"", zh:"X 位于北部。东边与 Y 接壤。特点是寒冷的冬天。", tip:"描述一个地方的三个句式。"},

{ id:"l27c2", lv:27, title:"地图、GIS 与导航", goal:"能读懂各种地图（地形图、专题图、在线地图），掌握 GIS 和导航的英语，能描述位置和路线。",
  intro:"地图是地理的语言。现在人人用 Google Maps，但<b>读懂地图的元素</b>（scale、legend、contour lines、coordinates）在徒步、买房、看新闻时都有用。本章教<b>地图的元素</b>、<b>地图的类型</b>（地形图、专题图、热力图）、<b>GIS</b>（地理信息系统，很多工作用）和<b>描述位置与路线</b>的英语。徒步时读错等高线会很危险，这章也讲。",
  learn:[{h:"地图的元素",p:"",items:[
   {en:"scale, legend, compass rose, grid, coordinates, contour lines, symbols", ipa:"", zh:"比例尺、图例、罗盘玫瑰、网格、坐标、等高线、符号", tip:"legend 在地图里是图例。"},
   {en:"The scale is one to fifty thousand: one centimetre on the map is five hundred metres on the ground.", ipa:"", zh:"比例尺是 1:50,000：图上 1 厘米是地上 500 米。", tip:""},
   {en:"Contour lines connect points of equal elevation. Close together means steep; far apart means flat.", ipa:"", zh:"等高线连接等海拔的点。密集意味着陡；稀疏意味着平。", tip:"steep = 陡。徒步必会。"},
   {en:"North is at the top unless the compass rose says otherwise.", ipa:"", zh:"除非罗盘玫瑰另有标示，北在上方。", tip:""},
   {en:"The coordinates of the CN Tower are 43.64 north, 79.39 west.", ipa:"", zh:"CN 塔的坐标是北纬 43.64，西经 79.39。", tip:"北美经度都是 west。"},

{ id:"l27c3", lv:27, title:"气候变化：科学、影响与争论", goal:"掌握气候变化的科学英语（温室效应、碳排放、升温目标），能读懂气候新闻和报告，能理性地讨论争议。",
  intro:"气候变化是<b>新闻、政治和孩子的学校里都在谈的话题</b>，也是加拿大政策争论的核心（碳税、油砂、管道）。本章先教<b>科学</b>（greenhouse effect、CO2、warming、feedback loops），再教<b>影响</b>（extreme weather、sea level、wildfires——加拿大的切身感受）、<b>减缓与适应</b>（mitigation、adaptation、net zero、carbon tax）和<b>怎么讨论</b>——区分科学共识和政策争议。",
  learn:[{h:"科学",p:"",items:[
   {en:"greenhouse effect, carbon dioxide, methane, emissions, fossil fuels, global warming", ipa:"", zh:"温室效应、二氧化碳、甲烷、排放、化石燃料、全球变暖", tip:"methane 读 METH-ane。"},
   {en:"Greenhouse gases trap heat in the atmosphere. More gas, more heat.", ipa:"", zh:"温室气体在大气中困住热量。气体越多，热越多。", tip:"trap = 困住。"},
   {en:"Burning fossil fuels has raised CO2 from 280 to over 420 parts per million since the industrial revolution.", ipa:"", zh:"自工业革命以来，燃烧化石燃料把 CO2 从 280 提高到 420 ppm 以上。", tip:"parts per million = 百万分之几。"},
   {en:"The planet has warmed about 1.2 degrees Celsius. The Paris Agreement aims to limit warming to 1.5.", ipa:"", zh:"地球已升温约 1.2 摄氏度。《巴黎协定》旨在把升温限制在 1.5 度。", tip:""},
   {en:"Canada is warming at about twice the global rate, and the Arctic at three times.", ipa:"", zh:"加拿大的升温速度约是全球的两倍，北极是三倍。", tip:""},
   {en:"A feedback loop: melting ice exposes dark water, which absorbs more heat, which melts more ice.", ipa:"", zh:"反馈循环：融冰露出深色的水，吸收更多热，融化更多冰。", tip:"absorbs = 吸收。"}]},
   {h:"影响",p:"",items:[
   {en:"extreme weather, heat waves, wildfires, flooding, drought, sea level rise", ipa:"", zh:"极端天气、热浪、野火、洪水、干旱、海平面上升", tip:"drought 读 /draʊt/。"},
   {en:"The 2023 wildfire season was the worst in Canada's history. Smoke reached Toronto and New York.", ipa:"", zh:"2023 年野火季是加拿大历史上最严重的。烟雾到达了多伦多和纽约。", tip:""},
   {en:"Warmer winters let pests like the pine beetle survive and destroy forests.", ipa:"", zh:"更暖的冬天让松甲虫等害虫存活并摧毁森林。", tip:"pests = 害虫。"},
   {en:"Insurance costs are rising because floods and fires are more frequent.", ipa:"", zh:"保险费在涨，因为洪水和火灾更频繁。", tip:"直接影响你的钱。"},
   {en:"Permafrost thaw is damaging roads and buildings in the North.", ipa:"", zh:"永冻土融化正在损坏北方的道路和建筑。", tip:"thaw = 融化。"}]},
   {h:"应对与讨论",p:"",items:[
   {en:"mitigation (cutting emissions) vs adaptation (preparing for impacts)", ipa:"", zh:"减缓（减排）vs 适应（为影响做准备）", tip:""},
   {en:"net zero, carbon tax, carbon capture, renewable energy, electric vehicles", ipa:"", zh:"净零、碳税、碳捕获、可再生能源、电动车", tip:""},
   {en:"The carbon tax puts a price on emissions so that cleaner options become cheaper by comparison.", ipa:"", zh:"碳税给排放定价，让更清洁的选择相比之下更便宜。", tip:"by comparison = 相比之下。"},
   {en:"Canada has committed to net zero by 2050, but it's also a major oil producer. That tension defines the debate.", ipa:"", zh:"加拿大承诺 2050 年净零，但它也是主要产油国。这个张力定义了争论。", tip:"tension = 张力、矛盾。"},
   {en:"The science that humans are warming the planet is settled. How fast to act, and who pays, is political.", ipa:"", zh:"人类正在让地球变暖的科学是确定的。多快行动、谁付钱，是政治问题。", tip:"settled = 有定论。区分两者是讨论的关键。"},
   {en:"I understand the concern about jobs. The question is how to transition without leaving workers behind.", ipa:"", zh:"我理解对工作的担忧。问题是怎么转型而不抛下工人。", tip:"just transition。"}]}],
  drills:[["greenhouse effect, carbon dioxide, methane, emissions, fossil fuels","科学词"],["Greenhouse gases trap heat in the atmosphere. More gas, more heat.","原理"],["Canada is warming at about twice the global rate.","加拿大"],["extreme weather, heat waves, wildfires, flooding, drought, sea level rise","影响"],["mitigation versus adaptation; net zero, carbon tax, renewable energy","应对"],["The science that humans are warming the planet is settled. How fast to act, and who pays, is political.","区分"]],
  ex:[
   {t:"mc",q:"温室气体的作用是？",opts:["在大气中困住热量","反射阳光","降温","制造氧气"],a:0},
   {t:"listen",q:"听一听，这是什么？",say:"Melting ice exposes dark water, which absorbs more heat, which melts more ice.",opts:["反馈循环","碳税","适应","减缓"],a:0},
   {t:"mc",q:"“adaptation” 是？",opts:["为气候影响做准备","减少排放","碳捕获","否认"],a:0},
   {t:"listen",q:"听一听，碳税的原理是？",say:"It puts a price on emissions so that cleaner options become cheaper by comparison.",opts:["给排放定价，让清洁选择相对便宜","禁止排放","补贴石油","降低油价"],a:0},
   {t:"type",q:"翻译：减缓 vs 适应（两个名词）",a:"mitigation versus adaptation",alt:["mitigation vs adaptation","Mitigation versus adaptation","mitigation vs. adaptation"]},
   {t:"type",q:"听写这个词（“排放”，复数）。",say:"emissions",a:"emissions"}],
  hw:[["读一条气候新闻","读一条本周的英文气候新闻，用英语说出：科学事实是什么、政策争议是什么。"],["你的影响","用英语说出气候变化对你生活的三个直接影响（保险、野火烟、暖冬……）。"],["一次讨论","和一位观点不同的人用英语讨论碳税 10 分钟，用上 I understand the concern about… The question is…"]]
},
{ id:"l27c4", lv:27, title:"人文地理：人口、城市与移民", goal:"掌握人文地理的核心英语（人口、城市化、移民、区域发展），能读懂人口统计数据和城市规划新闻。",
  intro:"人文地理研究<b>人在哪、为什么在那、怎么移动</b>——对移民来说这就是你自己的故事。本章教<b>人口</b>（census、density、aging、birth rate）、<b>城市</b>（urbanization、suburb、sprawl、gentrification、zoning）、<b>移民与区域</b>（push and pull factors、settlement patterns、urban-rural divide）。加拿大 2021 年人口普查的数据贯穿本章，让你能用数字说话。",
  learn:[{h:"人口",p:"",items:[
   {en:"population, census, density, birth rate, life expectancy, aging population, median age", ipa:"", zh:"人口、普查、密度、出生率、预期寿命、人口老龄化、中位年龄", tip:"census 读 SEN-sus。加拿大每五年一次。"},
   {en:"Canada's population passed forty million in 2023, driven almost entirely by immigration.", ipa:"", zh:"加拿大人口 2023 年超过四千万，几乎完全由移民驱动。", tip:""},
   {en:"Canada's birth rate is about 1.3 children per woman, well below the replacement rate of 2.1.", ipa:"", zh:"加拿大出生率约每位女性 1.3 个孩子，远低于 2.1 的更替率。", tip:"replacement rate = 维持人口不变的出生率。"},
   {en:"The population is aging: by 2030, one in four Canadians will be over 65.", ipa:"", zh:"人口在老龄化：到 2030 年，四分之一的加拿大人将超过 65 岁。", tip:""},
   {en:"Population density is four people per square kilometre, one of the lowest in the world, but most people live within 200 kilometres of the US border.", ipa:"", zh:"人口密度是每平方公里 4 人，世界最低之一，但大多数人住在离美国边境 200 公里内。", tip:""}]},
   {h:"城市",p:"",items:[
   {en:"urban, suburban, rural; urbanization, sprawl, density, transit-oriented", ipa:"", zh:"城市的、郊区的、农村的；城市化、蔓延、密度、以公交为导向", tip:"sprawl = 低密度扩张。"},
   {en:"Over eighty percent of Canadians live in urban areas. The GTA alone has nearly seven million people.", ipa:"", zh:"超过 80% 的加拿大人住在城市。仅大多伦多就有近七百万人。", tip:""},
   {en:"Zoning rules decide what can be built where: single-family homes, apartments, shops.", ipa:"", zh:"规划规则决定什么能建在哪：独立屋、公寓、商店。", tip:"zoning 是住房辩论的核心。"},
   {en:"Gentrification: a poorer neighbourhood becomes trendy, prices rise, and long-time residents are pushed out.", ipa:"", zh:"绅士化：穷社区变时髦，价格上涨，老居民被挤走。", tip:"gentrification 读 jen-tri-fi-KAY-shun。"},
   {en:"The 'missing middle' is housing between single homes and towers: duplexes, townhouses, small apartments.", ipa:"", zh:"“缺失的中间”是独立屋和高楼之间的住房：双拼、联排、小公寓。", tip:""},
   {en:"A fifteen-minute city is one where daily needs are within a short walk or bike ride.", ipa:"", zh:"15 分钟城市是日常需求在短途步行或骑行内的城市。", tip:""}]},
   {h:"移民与区域",p:"",items:[
   {en:"push factors (war, poverty) and pull factors (jobs, safety, family)", ipa:"", zh:"推力因素（战争、贫困）和拉力因素（工作、安全、家人）", tip:""},
   {en:"Nearly one in four Canadians was born outside the country, the highest share in the G7.", ipa:"", zh:"近四分之一的加拿大人在国外出生，七国集团中最高。", tip:""},
   {en:"Immigrants cluster in Toronto, Vancouver, and Montreal, often near others from the same country. That's a settlement pattern.", ipa:"", zh:"移民聚集在多伦多、温哥华和蒙特利尔，常靠近来自同一国家的人。那是定居模式。", tip:"cluster = 聚集。"},
   {en:"The urban-rural divide shows up in politics, income, and access to services.", ipa:"", zh:"城乡差距体现在政治、收入和服务可及性上。", tip:""},
   {en:"Markham is over sixty percent visible minority, with large Chinese and South Asian communities.", ipa:"", zh:"万锦超过 60% 是可见少数族裔，有大量华人和南亚社区。", tip:"visible minority = 加拿大统计用语。"},
   {en:"Where you settle shapes your opportunities: jobs, schools, and networks.", ipa:"", zh:"你定居的地方塑造你的机会：工作、学校和人脉。", tip:""}]}],
  drills:[["population, census, density, birth rate, life expectancy, aging population","人口词"],["Canada's population passed forty million in 2023, driven almost entirely by immigration.","四千万"],["urban, suburban, rural; urbanization, sprawl, density","城市词"],["Gentrification: a poorer neighbourhood becomes trendy, prices rise, and long-time residents are pushed out.","绅士化"],["push factors and pull factors","推拉"],["Nearly one in four Canadians was born outside the country.","移民比例"]],
  ex:[
   {t:"mc",q:"“replacement rate” 是？",opts:["维持人口不变的出生率","移民率","死亡率","更换率"],a:0},
   {t:"listen",q:"听一听，这是什么现象？",say:"A poorer neighbourhood becomes trendy, prices rise, and long-time residents are pushed out.",opts:["绅士化","城市蔓延","郊区化","人口老龄化"],a:0},
   {t:"mc",q:"“pull factors” 是？",opts:["吸引人来的因素（工作、安全）","迫使人离开的因素","人口密度","定居模式"],a:0},
   {t:"listen",q:"听一听，比例是多少？",say:"Over eighty percent of Canadians live in urban areas.",opts:["超过 80%","超过 18%","约 50%","超过 8%"],a:0},
   {t:"type",q:"翻译：你定居的地方塑造你的机会。",a:"Where you settle shapes your opportunities.",alt:["Where you settle shapes your opportunities","where you settle shapes your opportunities","Where you settle shapes your opportunity."]},
   {t:"type",q:"听写这个词（“普查”）。",say:"census",a:"census"}],
  hw:[["你的推拉","用英语写下你来加拿大的三个推力和三个拉力因素。"],["查普查数据","上 Statistics Canada 查你所在城市的人口、中位年龄、移民比例，用英语说出来。"],["一个规划话题","用英语描述你社区的一个规划问题（缺公寓、交通、绅士化），说出你的看法。"]]
},
{ id:"l27c5", lv:27, title:"环境问题与可持续生活", goal:"掌握环境问题的英语（污染、生物多样性、资源、回收），能读懂环境新闻，能在生活和工作中用英语讨论可持续做法。",
  intro:"除了气候，还有<b>水、空气、垃圾、生物多样性</b>。这些话题在加拿大的日常里很具体：<b>蓝箱绿箱</b>怎么分、<b>塑料禁令</b>、<b>物种保护</b>、<b>水质</b>。本章教<b>环境问题的词</b>（pollution、biodiversity、habitat、conservation）、<b>资源与能源</b>（renewable、non-renewable、hydro）、<b>可持续生活</b>（reduce、reuse、recycle、compost）和<b>加拿大的环保规则与争议</b>。",
  learn:[{h:"环境问题",p:"",items:[
   {en:"pollution, contamination, biodiversity, habitat, endangered species, conservation", ipa:"", zh:"污染、污染（有害物）、生物多样性、栖息地、濒危物种、保护", tip:"biodiversity 读 by-o-dy-VER-si-tee。"},
   {en:"Habitat loss is the biggest threat to wildlife: when forests become farms or suburbs, species disappear.", ipa:"", zh:"栖息地丧失是野生动物最大的威胁：森林变成农场或郊区时，物种消失。", tip:""},
   {en:"Microplastics have been found in the Great Lakes, in fish, and in human blood.", ipa:"", zh:"微塑料已在五大湖、鱼和人血中被发现。", tip:""},
   {en:"Air quality index: when it's over 100, people with asthma should stay inside.", ipa:"", zh:"空气质量指数：超过 100 时，哮喘患者应待在室内。", tip:"野火季要看 AQI。"},
   {en:"Invasive species like zebra mussels and emerald ash borer have no natural predators here.", ipa:"", zh:"斑马贻贝和白蜡窄吉丁等入侵物种在这里没有天敌。", tip:"invasive = 入侵的；predators = 捕食者。"},
   {en:"Canada has over a thousand species at risk, including the caribou and the right whale.", ipa:"", zh:"加拿大有一千多个濒危物种，包括驯鹿和露脊鲸。", tip:"at risk = 濒危。"}]},
   {h:"资源与能源",p:"",items:[
   {en:"renewable vs non-renewable: solar, wind, and hydro vs oil, gas, and coal", ipa:"", zh:"可再生 vs 不可再生：太阳能、风能和水电 vs 石油、天然气和煤", tip:""},
   {en:"About sixty percent of Canada's electricity comes from hydro, which is why it's called 'hydro' here.", ipa:"", zh:"加拿大约 60% 的电来自水电，所以这里把电叫 hydro。", tip:""},
   {en:"Ontario phased out coal power in 2014. Most of its electricity is now nuclear and hydro.", ipa:"", zh:"安省 2014 年淘汰了煤电。现在大部分电是核能和水电。", tip:"phased out = 逐步淘汰。"},
   {en:"The oil sands in Alberta are a major source of jobs and exports, and of emissions.", ipa:"", zh:"阿尔伯塔的油砂是工作和出口的主要来源，也是排放的主要来源。", tip:""},
   {en:"Fresh water seems abundant here, but many Indigenous communities have been under boil-water advisories for years.", ipa:"", zh:"淡水在这里看似充足，但许多原住民社区多年处于烧水令下。", tip:"boil-water advisory = 水不能直接喝的通知。"},
   {en:"sustainable, footprint, consumption, waste, circular economy", ipa:"", zh:"可持续的、足迹、消费、废物、循环经济", tip:""}]},
   {h:"可持续生活",p:"",items:[
   {en:"Reduce, reuse, recycle. In that order: reducing matters most.", ipa:"", zh:"减少、重复使用、回收。按这个顺序：减少最重要。", tip:""},
   {en:"Blue bin for recycling, green bin for food waste and compost, black bin for garbage.", ipa:"", zh:"蓝箱回收，绿箱厨余和堆肥，黑箱垃圾。", tip:"多伦多的三箱。各市不同。"},

{ id:"l27c6", lv:27, title:"第二十七级结业：一次实地考察与一份地理报告", goal:"能规划并完成一次实地考察（自然或城市），记录观察，并用英语写一份带地图的地理报告和做汇报。",
  intro:"结业任务：<b>一次实地考察 + 一份报告</b>。选一个地方——一条河、一个公园、一个社区、一条正在变化的街——去看、去测、去问，然后用英语写报告（带一张你标注的地图）并汇报。本章教<b>野外记录的语言</b>（observe、record、sketch、sample）、<b>报告的结构</b>（location、methods、observations、analysis、conclusion）、<b>描述变化</b>（has changed、used to be、is becoming）。这是把本级所有内容放到真实地方的方式。",
  learn:[{h:"实地考察",p:"",items:[
   {en:"field trip, site, observation, field notes, sketch map, sample, measurement", ipa:"", zh:"实地考察、地点、观察、野外笔记、草图、样本、测量", tip:""},
   {en:"We'll walk the trail from the parking lot to the lookout, stopping at five points to record what we see.", ipa:"", zh:"我们从停车场沿步道走到观景点，在五个点停下记录看到的。", tip:"lookout = 观景点。"},
   {en:"At each stop, note the land use, the vegetation, the slope, and any signs of human impact.", ipa:"", zh:"每个点记录土地利用、植被、坡度和任何人类影响的迹象。", tip:"vegetation 读 vej-e-TAY-shun。"},
   {en:"Take a photo facing north and sketch what's in front of you.", ipa:"", zh:"朝北拍一张照片，画出你面前的东西。", tip:""},
   {en:"Count the cars passing in five minutes. That's a simple traffic survey.", ipa:"", zh:"数五分钟内经过的车。那是简单的交通调查。", tip:""},
   {en:"Ask a local: how has this area changed in the last ten years?", ipa:"", zh:"问一位当地人：这个区域过去十年怎么变的？", tip:""}]},
   {h:"描述变化与分析",p:"",items:[
   {en:"This street used to be mostly warehouses. Now it's condos and coffee shops.", ipa:"", zh:"这条街以前主要是仓库。现在是公寓和咖啡店。", tip:"used to be = 以前是。"},
   {en:"The riverbank has been eroding; you can see exposed tree roots.", ipa:"", zh:"河岸一直在侵蚀；你能看到裸露的树根。", tip:"eroding = 侵蚀。"},
   {en:"The neighbourhood is becoming denser as single homes are replaced by townhouses.", ipa:"", zh:"随着独立屋被联排取代，社区正变得更密集。", tip:"is becoming = 正在变得。"},
   {en:"The pattern suggests that development follows the new transit line.", ipa:"", zh:"这个模式表明开发跟随新的交通线。", tip:""},
   {en:"One possible explanation is zoning changes; another is rising land prices.", ipa:"", zh:"一个可能的解释是规划变更；另一个是地价上涨。", tip:""},
   {en:"Compared with the 2010 satellite image, about a third of the green space is gone.", ipa:"", zh:"与 2010 年的卫星图像相比，约三分之一的绿地消失了。", tip:"Google Earth 有历史图像。"}]},
   {h:"报告与汇报",p:"",items:[
   {en:"Location: the Don River between Pottery Road and the Bloor Viaduct, Toronto.", ipa:"", zh:"地点：多伦多 Pottery 路和 Bloor 高架桥之间的 Don 河。", tip:""},
   {en:"Methods: a two-kilometre walk on March 12, five observation points, photos, a sketch map, and one interview.", ipa:"", zh:"方法：3 月 12 日两公里步行，五个观察点，照片，草图和一次访谈。", tip:""},
   {en:"Observations: heavy erosion on the east bank; new wetland restoration near the bridge; litter concentrated near the parking lot.", ipa:"", zh:"观察：东岸严重侵蚀；桥附近有新的湿地修复；垃圾集中在停车场附近。", tip:"restoration = 修复。"},
   {en:"Analysis: the erosion is likely worsened by spring flooding and the removal of trees upstream.", ipa:"", zh:"分析：侵蚀可能因春季洪水和上游树木的移除而加剧。", tip:""},
   {en:"Conclusion and recommendation: more planting on the east bank, and garbage bins at the lot.", ipa:"", zh:"结论和建议：东岸多种植，停车场加垃圾桶。", tip:""},
   {en:"Here's my annotated map. The red marks show erosion; the green shows the restoration area.", ipa:"", zh:"这是我标注的地图。红色标记显示侵蚀；绿色显示修复区。", tip:"annotated = 标注的。"}]}],
  drills:[["field trip, site, observation, field notes, sketch map, sample, measurement","考察词"],["At each stop, note the land use, the vegetation, the slope, and any signs of human impact.","记录"],["This street used to be mostly warehouses. Now it's condos and coffee shops.","变化"],["The riverbank has been eroding; you can see exposed tree roots.","侵蚀"],["Location. Methods. Observations. Analysis. Conclusion and recommendation.","报告五部分"],["Here's my annotated map. The red marks show erosion; the green shows the restoration area.","地图"]],
  ex:[
   {t:"mc",q:"实地考察在每个点应该记录？",opts:["土地利用、植被、坡度、人类影响","只拍照","只数人","天气"],a:0},
   {t:"listen",q:"听一听，这是描述什么？",say:"This street used to be mostly warehouses. Now it's condos and coffee shops.",opts:["土地利用的变化","交通","侵蚀","植被"],a:0},
   {t:"mc",q:"“annotated map” 是？",opts:["带标注的地图","卫星图","空白地图","路线图"],a:0},
   {t:"listen",q:"听一听，这是报告的哪部分？",say:"More planting on the east bank, and garbage bins at the lot.",opts:["结论和建议","方法","地点","观察"],a:0},
   {t:"type",q:"翻译：与 2010 年相比，约三分之一的绿地消失了。",a:"Compared with 2010, about a third of the green space is gone.",alt:["Compared with 2010, about a third of the green space is gone","Compared to 2010, about a third of the green space is gone.","compared with 2010, about a third of the green space is gone"]},
   {t:"type",q:"听写这个词（“植被”）。",say:"vegetation",a:"vegetation"}],
  hw:[["规划","选一个地方（河、公园、街区），用英语写：地点、路线、五个观察点、要记录什么、要问谁。"],["考察","去一次，做记录（照片、草图、数据、一次访谈），对比 Google Earth 的历史图像。"],["报告与汇报（必做）","用英语写五部分报告加一张标注地图，向至少两个人汇报 5 分钟，回答一个问题。"]]
},
/* ===== 第二十八级 · 逻辑思维与系统思维 Logical & Systems Thinking ===== */
{ id:"l28c1", lv:28, title:"清晰思考：定义、区分与概念", goal:"掌握清晰思考的基本工具（定义术语、区分概念、识别模糊），能用英语把一个模糊的问题变清楚。",
  intro:"大多数争论的根源是<b>两个人用同一个词指不同的东西</b>。清晰思考的第一步是<b>定义</b>（What do you mean by 'fair'?）、<b>区分</b>（necessary vs sufficient、correlation vs causation、fact vs opinion）和<b>识别模糊</b>（ambiguity、vagueness）。本章教这些工具的英语和用法。这些句子在会议、谈判、写作里天天用：<b>Let's define our terms. / Those are two different questions.</b>",
  learn:[{h:"定义与澄清",p:"",items:[
   {en:"define, clarify, distinguish, precise, vague, ambiguous", ipa:"", zh:"定义、澄清、区分、精确、模糊、歧义", tip:"ambiguous 读 am-BIG-yoo-us：有多种意思；vague：边界不清。"},
   {en:"Before we argue, let's define our terms. What do you mean by 'success'?", ipa:"", zh:"争论之前，我们先定义术语。你说的“成功”是什么意思？", tip:"最有用的一句。"},
   {en:"'Soon' is vague. Do you mean today, this week, or this quarter?", ipa:"", zh:"“很快”很模糊。你指今天、这周还是这个季度？", tip:""},
   {en:"'I saw her duck' is ambiguous: a bird, or a movement?", ipa:"", zh:"“I saw her duck”有歧义：一只鸭子，还是一个躲闪动作？", tip:"ambiguity 的经典例子。"},
   {en:"Can you give me a concrete example of what you mean?", ipa:"", zh:"能给我一个你所说的具体例子吗？", tip:"concrete = 具体。"},
   {en:"So, to be precise: you're not against the plan, you're against the timeline.", ipa:"", zh:"所以准确地说：你不是反对计划，你是反对时间表。", tip:"to be precise = 准确地说。"}]},
   {h:"关键区分",p:"",items:[
   {en:"necessary vs sufficient: oxygen is necessary for fire but not sufficient.", ipa:"", zh:"必要 vs 充分：氧气是火的必要条件但不充分。", tip:"sufficient 读 su-FISH-ent。"},
   {en:"fact vs opinion vs value: 'It's 30 degrees' / 'It's hot' / 'We should turn on the AC.'", ipa:"", zh:"事实 vs 看法 vs 价值判断：“30 度”/“很热”/“我们该开空调”。", tip:""},
   {en:"the map is not the territory: a model of something is not the thing itself", ipa:"", zh:"地图不是领土：事物的模型不是事物本身", tip:"所有模型都是简化。"},
   {en:"descriptive vs normative: what is vs what should be", ipa:"", zh:"描述性 vs 规范性：是什么 vs 应该是什么", tip:"normative 读 NOR-ma-tiv。"},
   {en:"Those are two different questions: whether it works, and whether it's worth the cost.", ipa:"", zh:"那是两个不同的问题：它是否有效，和它是否值得成本。", tip:"把混在一起的问题拆开。"},
   {en:"A difference in degree, not in kind.", ipa:"", zh:"程度的差别，不是性质的差别。", tip:"in kind = 性质上。"}]},
   {h:"识别思维的错误",p:"",items:[
   {en:"category error: treating one kind of thing as if it were another", ipa:"", zh:"范畴错误：把一类东西当作另一类", tip:"“大学在哪？”——指着所有楼问“但大学在哪？”"},
   {en:"false precision: '73.2 percent of people' from a survey of eleven", ipa:"", zh:"虚假精确：从 11 人的调查得出“73.2% 的人”", tip:""},
   {en:"equivocation: using a word in two senses in the same argument", ipa:"", zh:"偷换概念：在同一论证中用一个词的两种意思", tip:"equivocation 读 i-kwiv-o-KAY-shun。"},
   {en:"Wait, are we using 'free' to mean no cost, or no restrictions?", ipa:"", zh:"等等，我们用“free”是指免费，还是不受限制？", tip:"抓住偷换概念。"},
   {en:"I think we agree on the facts but disagree on what matters.", ipa:"", zh:"我想我们在事实上一致，但在什么重要上有分歧。", tip:"分歧定位。"}]}],
  drills:[["define, clarify, distinguish, precise, vague, ambiguous","六个词"],["Before we argue, let's define our terms. What do you mean by 'success'?","定义术语"],["necessary versus sufficient: oxygen is necessary for fire but not sufficient.","必要充分"],["fact versus opinion versus value","三种陈述"],["Those are two different questions: whether it works, and whether it's worth the cost.","拆问题"],["I think we agree on the facts but disagree on what matters.","定位分歧"]],
  ex:[
   {t:"mc",q:"“vague” 和 “ambiguous” 的区别？",opts:["模糊（边界不清）/ 歧义（多种意思）","一样","vague 更严重","ambiguous 是褒义"],a:0},
   {t:"listen",q:"听一听，说话者在做什么？",say:"What do you mean by 'success'?",opts:["要求定义术语","反对","同意","举例"],a:0},
   {t:"mc",q:"“氧气是火的必要条件但不充分”意思是？",opts:["没有氧气就没有火，但只有氧气不够","有氧气就有火","氧气和火无关","火不需要氧气"],a:0},
   {t:"listen",q:"听一听，这是哪种陈述？",say:"We should turn on the air conditioning.",opts:["价值判断（应该）","事实","看法","定义"],a:0},
   {t:"type",q:"翻译：那是两个不同的问题。",a:"Those are two different questions.",alt:["Those are two different questions","those are two different questions","These are two different questions."]},
   {t:"type",q:"听写这个词（“充分的”）。",say:"sufficient",a:"sufficient"}],
  hw:[["定义三个词","选三个你常用但模糊的词（成功、好工作、健康），用英语各写一个精确定义。"],["拆一个问题","找一个最近的争论，用英语把它拆成“事实问题”和“价值问题”各一句。"],["用一次","在一次真实对话中用英语问 What do you mean by…?，记下对方的定义和你原来的理解差在哪。"]]
},
{ id:"l28c2", lv:28, title:"演绎与归纳：推理的两种方式", goal:"掌握演绎推理和归纳推理的英语，能判断一个论证是演绎还是归纳、强还是弱，能构建自己的推理链。",
  intro:"第二十五级学了论证的结构，这一章深入<b>推理本身</b>。两种方式：<b>演绎</b>（从一般到特殊，如果前提真结论必真）和<b>归纳</b>（从观察到概括，结论只是可能）。大多数日常推理是归纳的——而且常常太快（“我遇到两个这样的人，所以他们都……”）。本章教两种推理的英语、<b>强弱的判断</b>（sample size、representativeness）和<b>溯因推理</b>（最佳解释）。",
  learn:[{h:"演绎",p:"",items:[
   {en:"deduction, deductive, valid, invalid, necessarily follows", ipa:"", zh:"演绎、演绎的、有效、无效、必然推出", tip:"deductive 读 di-DUK-tiv。"},
   {en:"If all employees must badge in, and Li is an employee, then Li must badge in.", ipa:"", zh:"如果所有员工都必须刷卡，李是员工，那么李必须刷卡。", tip:"前提真，结论必真。"},
   {en:"modus ponens: if P then Q; P; therefore Q.", ipa:"", zh:"肯定前件：如果 P 则 Q；P；所以 Q。", tip:"最基本的推理形式。"},
   {en:"Affirming the consequent is a mistake: if it rains, the ground is wet; the ground is wet; therefore it rained. No: a sprinkler could have done it.", ipa:"", zh:"肯定后件是错误：下雨地就湿；地湿了；所以下雨了。不对：洒水器也能。", tip:"最常见的逻辑错误。"},
   {en:"The conclusion follows necessarily from the premises.", ipa:"", zh:"结论从前提必然推出。", tip:""}]},
   {h:"归纳",p:"",items:[
   {en:"induction, inductive, generalization, probable, strong, weak", ipa:"", zh:"归纳、归纳的、概括、可能的、强、弱", tip:""},
   {en:"Every swan I've seen is white, so probably all swans are white. Then someone found a black one in Australia.", ipa:"", zh:"我见过的每只天鹅都是白的，所以可能所有天鹅都是白的。然后有人在澳大利亚发现了黑的。", tip:"归纳永远只是“可能”。"},
   {en:"A strong induction has a large, representative sample. A weak one generalizes from a few cases.", ipa:"", zh:"强归纳有大而有代表性的样本。弱归纳从几个案例概括。", tip:""},
   {en:"Hasty generalization: 'I had two bad landlords, so all landlords are bad.'", ipa:"", zh:"草率概括：“我遇到两个坏房东，所以所有房东都坏。”", tip:"hasty = 草率。"},
   {en:"The evidence makes the conclusion likely, but not certain.", ipa:"", zh:"证据让结论可能，但不确定。", tip:""},
   {en:"How many cases is that based on? Were they typical?", ipa:"", zh:"那基于多少案例？它们典型吗？", tip:"检验归纳的两个问题。"}]},
   {h:"溯因与推理链",p:"",items:[
   {en:"abduction: inference to the best explanation", ipa:"", zh:"溯因：推断到最佳解释", tip:"医生诊断、侦探破案都是这个。"},
   {en:"The lawn is wet, the sky is clear, and the sprinkler timer is on. The best explanation is the sprinkler.", ipa:"", zh:"草坪湿，天晴，洒水器定时开着。最佳解释是洒水器。", tip:""},
   {en:"What else could explain this? Which explanation requires the fewest assumptions?", ipa:"", zh:"还有什么能解释这个？哪个解释需要最少的假设？", tip:"奥卡姆剃刀。"},
   {en:"Let me walk through my reasoning: first…, which means…, and therefore…", ipa:"", zh:"让我讲一遍我的推理：首先……，这意味着……，因此……", tip:"展示推理链。"},
   {en:"I'm fairly confident, but I'd change my mind if we found that the timer was off.", ipa:"", zh:"我相当有信心，但如果发现定时器是关的我会改变想法。", tip:"说出什么证据会改变你。"}]}],
  drills:[["deduction, induction, abduction","三种推理"],["If all employees must badge in, and Li is an employee, then Li must badge in.","演绎"],["Affirming the consequent is a mistake: the ground is wet; therefore it rained. No: a sprinkler could have done it.","肯定后件"],["A strong induction has a large, representative sample.","强归纳"],["How many cases is that based on? Were they typical?","检验"],["What else could explain this? Which explanation requires the fewest assumptions?","溯因"]],
  ex:[
   {t:"mc",q:"演绎推理的特点是？",opts:["前提真则结论必真","结论只是可能","从几个例子概括","找最佳解释"],a:0},
   {t:"listen",q:"听一听，这是什么错误？",say:"The ground is wet, therefore it rained.",opts:["肯定后件","草率概括","偷换概念","范畴错误"],a:0},
   {t:"mc",q:"“我遇到两个坏房东，所以所有房东都坏”是？",opts:["草率概括（弱归纳）","有效演绎","溯因","强归纳"],a:0},
   {t:"listen",q:"听一听，这是哪种推理？",say:"Inference to the best explanation.",opts:["溯因","演绎","归纳","类比"],a:0},
   {t:"type",q:"翻译：证据让结论可能，但不确定。",a:"The evidence makes the conclusion likely, but not certain.",alt:["The evidence makes the conclusion likely, but not certain","the evidence makes the conclusion likely, but not certain","The evidence makes the conclusion likely but not certain."]},
   {t:"type",q:"听写这个词（“概括”）。",say:"generalization",a:"generalization"}],
  hw:[["分类五个","写下你今天做的五个推断，用英语标出各是演绎、归纳还是溯因。"],["找一个草率概括","在新闻或对话里找一个草率概括，用英语写出它和检验它的两个问题。"],["推理链","用英语讲一遍你最近一个决定的推理链（first…, which means…, therefore…），说出什么证据会改变你。"]]
},
{ id:"l28c3", lv:28, title:"概率思维与决策", goal:"掌握概率思维和决策分析的英语（期望值、基础率、沉没成本、风险 vs 不确定），能用它们分析真实决策。",
  intro:"好的决策不是预测未来，是<b>在不确定下理性地选择</b>。本章教<b>概率思维</b>（base rates、expected value、Bayesian updating）、<b>常见决策错误</b>（sunk cost、loss aversion、overconfidence）、<b>决策工具</b>（pros and cons、expected value、pre-mortem）。衔接第二十二级的统计和第二十四级的认知偏差，这里把它们用到<b>买房、换工作、投资</b>这样的真实决定上。",
  learn:[{h:"概率思维",p:"",items:[
   {en:"probability, odds, base rate, expected value, risk, uncertainty", ipa:"", zh:"概率、赔率、基础率、期望值、风险、不确定性", tip:"risk 是知道概率；uncertainty 是不知道。"},
   {en:"Base rate: before you look at the details, how common is this in general?", ipa:"", zh:"基础率：在看细节之前，这件事一般有多常见？", tip:"忽略基础率是最常见的错误。"},
   {en:"A test is 99 percent accurate, but the disease affects one in ten thousand. Most positive results are still false alarms.", ipa:"", zh:"检测 99% 准确，但疾病万分之一的人有。大多数阳性结果仍是误报。", tip:"基础率的经典例子。"},
   {en:"Expected value: multiply each outcome by its probability and add them up.", ipa:"", zh:"期望值：每个结果乘以概率再相加。", tip:""},
   {en:"A ten percent chance of winning a thousand dollars is worth a hundred dollars on average.", ipa:"", zh:"10% 的机会赢一千元，平均值一百元。", tip:""},
   {en:"Update your beliefs as evidence comes in. Strong priors need strong evidence to move.", ipa:"", zh:"随着证据到来更新信念。强的先验需要强的证据才能改变。", tip:"贝叶斯思维。priors = 先验信念。"}]},
   {h:"决策错误",p:"",items:[
   {en:"sunk cost: money or time already spent shouldn't affect what you do next", ipa:"", zh:"沉没成本：已经花的钱或时间不应影响接下来做什么", tip:""},
   {en:"We've put two years into this project. — That's a sunk cost. The question is whether the next year is worth it.", ipa:"", zh:"我们在这个项目上投了两年。——那是沉没成本。问题是下一年值不值得。", tip:""},
   {en:"Loss aversion: losing a hundred dollars hurts about twice as much as gaining a hundred feels good.", ipa:"", zh:"损失厌恶：失去一百元的痛大约是得到一百元的快乐的两倍。", tip:"aversion 读 a-VER-zhun。"},
   {en:"Overconfidence: most people think they're above-average drivers.", ipa:"", zh:"过度自信：大多数人认为自己的驾驶水平高于平均。", tip:""},
   {en:"The planning fallacy: projects take longer than we expect, even when we know that.", ipa:"", zh:"规划谬误：项目比我们预期的花更长时间，即使我们知道这一点。", tip:"解决：看类似项目实际花了多久。"},
   {en:"Don't confuse a good decision with a good outcome. You can decide well and still lose.", ipa:"", zh:"不要把好决定和好结果混淆。你可以决定得好但还是输。", tip:"扑克玩家的智慧。"}]},
   {h:"决策工具",p:"",items:[
   {en:"What are the options? What's the best and worst case for each? How likely is each?", ipa:"", zh:"有什么选项？每个的最好和最坏情况是什么？各有多可能？", tip:"三个问题。"},
   {en:"Is this decision reversible? If so, decide fast. If not, slow down.", ipa:"", zh:"这个决定可逆吗？可逆就快决定。不可逆就慢下来。", tip:"reversible 读 ri-VER-si-bl。"},
   {en:"Pre-mortem: imagine it's a year later and the plan failed. Why?", ipa:"", zh:"事前验尸：想象一年后计划失败了。为什么？", tip:"比事后复盘更有用。"},
   {en:"What would I advise a friend in this situation?", ipa:"", zh:"如果朋友处在这个情况，我会怎么建议？", tip:"拉开距离。"},
   {en:"I'll set a deadline and a threshold: if it's not at 50 customers by June, we stop.", ipa:"", zh:"我设一个期限和门槛：如果 6 月前没到 50 个客户，我们停。", tip:"threshold = 门槛。提前定退出条件。"},
   {en:"Given what we know, this is the best bet. Let's revisit in three months.", ipa:"", zh:"基于我们知道的，这是最好的赌注。三个月后再看。", tip:"best bet = 最好的选择（承认不确定）。"}]}],
  drills:[["probability, base rate, expected value, risk, uncertainty","五个词"],["Base rate: before you look at the details, how common is this in general?","基础率"],["Expected value: multiply each outcome by its probability and add them up.","期望值"],["That's a sunk cost. The question is whether the next year is worth it.","沉没成本"],["Don't confuse a good decision with a good outcome.","决定 vs 结果"],["Is this decision reversible? If so, decide fast. If not, slow down.","可逆"]],
  ex:[
   {t:"mc",q:"“sunk cost” 的正确态度是？",opts:["已花的不应影响接下来的决定","已花的越多越要坚持","只看已花的","忽略未来"],a:0},
   {t:"listen",q:"听一听，这是什么偏差？",say:"Losing a hundred dollars hurts about twice as much as gaining a hundred feels good.",opts:["损失厌恶","过度自信","规划谬误","沉没成本"],a:0},
   {t:"mc",q:"10% 机会赢 1000 元的期望值是？",opts:["100 元","1000 元","10 元","900 元"],a:0},
   {t:"listen",q:"听一听，这是什么工具？",say:"Imagine it's a year later and the plan failed. Why?",opts:["事前验尸","复盘","期望值","基础率"],a:0},
   {t:"type",q:"翻译：这个决定可逆吗？",a:"Is this decision reversible?",alt:["Is this decision reversible","is this decision reversible","Is the decision reversible?"]},
   {t:"type",q:"听写这个词（“期望值”，两个词）。",say:"expected value",a:"expected value"}],
  hw:[["算一个期望值","选一个有不确定性的决定（买保险、考证），用英语列出结果、概率、期望值。"],["找一个沉没成本","用英语写下你生活中一个因沉没成本而坚持的事，和“只看未来”的分析。"],["事前验尸","对你正在做的一个计划做事前验尸，用英语写三个可能失败的原因和对策。"]]
},
{ id:"l28c4", lv:28, title:"系统思维（一）：整体、反馈与延迟", goal:"掌握系统思维的核心概念和英语（系统、反馈回路、存量与流量、延迟），能画简单的因果回路图，能解释为什么“头痛医头”常常失败。",
  intro:"线性思维：A 导致 B。系统思维：<b>A 影响 B，B 又回来影响 A，中间还有延迟</b>。房价、交通、体重、团队士气都是系统。本章教<b>系统的要素</b>（elements、connections、purpose）、<b>存量与流量</b>（浴缸模型）、<b>两种反馈</b>（reinforcing 放大、balancing 平衡）、<b>延迟</b>（为什么调温器会让你忽冷忽热）和<b>因果回路图</b>的语言。学会了，你会看到问题背后的结构。",
  learn:[{h:"系统的要素",p:"",items:[
   {en:"system, element, connection, purpose, boundary, emergent behaviour", ipa:"", zh:"系统、要素、连接、目的、边界、涌现行为", tip:"emergent = 整体有而部分没有的（交通堵塞没有一辆车“堵”）。"},
   {en:"A system is more than the sum of its parts. A pile of car parts isn't a car.", ipa:"", zh:"系统大于部分之和。一堆汽车零件不是汽车。", tip:""},
   {en:"stock and flow: a bathtub is the stock; the tap and the drain are flows", ipa:"", zh:"存量和流量：浴缸是存量；水龙头和排水口是流量", tip:"stock 这里 = 存量，不是股票。"},
   {en:"Your savings are a stock; income and spending are flows. To grow the stock, the inflow must exceed the outflow.", ipa:"", zh:"你的存款是存量；收入和支出是流量。要增加存量，流入必须超过流出。", tip:"exceed = 超过。"},
   {en:"Stocks change slowly. That's why a problem built up over years can't be fixed in a month.", ipa:"", zh:"存量变化慢。所以多年积累的问题一个月修不好。", tip:""}]},
   {h:"反馈回路",p:"",items:[
   {en:"feedback loop, reinforcing loop, balancing loop, delay", ipa:"", zh:"反馈回路、增强回路、平衡回路、延迟", tip:"reinforcing 读 ree-in-FOR-sing。"},
   {en:"A reinforcing loop amplifies: more customers bring more reviews, which bring more customers.", ipa:"", zh:"增强回路放大：更多客户带来更多评价，带来更多客户。", tip:"amplifies = 放大。滚雪球，好坏都可以。"},
   {en:"A balancing loop stabilizes: when you're cold, you shiver; when you're hot, you sweat.", ipa:"", zh:"平衡回路稳定：冷时你发抖；热时你出汗。", tip:"stabilizes = 稳定。像恒温器。"},
   {en:"Interest on debt is a reinforcing loop. Left alone, it grows exponentially.", ipa:"", zh:"债务利息是增强回路。不管它，它指数增长。", tip:""},
   {en:"Delays cause overshoot: you turn up the shower, nothing happens, you turn it more, then it's scalding.", ipa:"", zh:"延迟造成过冲：你调热淋浴，没反应，再调，然后烫死了。", tip:"overshoot = 过冲；scalding = 烫。"},
   {en:"Most policy mistakes come from reacting to a delayed signal as if it were current.", ipa:"", zh:"大多数政策错误来自把延迟的信号当成当前的来反应。", tip:"房价、招聘、库存都是。"}]},
   {h:"因果回路图与语言",p:"",items:[
   {en:"Draw an arrow from A to B. Plus means same direction; minus means opposite.", ipa:"", zh:"从 A 画一个箭头到 B。加号表示同向；减号表示反向。", tip:""},
   {en:"More stress leads to less sleep, which leads to more stress. That's a vicious cycle.", ipa:"", zh:"压力越大睡眠越少，睡眠越少压力越大。那是恶性循环。", tip:"vicious cycle / virtuous cycle。"},
   {en:"Where's the leverage point? Where can a small change shift the whole system?", ipa:"", zh:"杠杆点在哪？哪里一个小改变能撬动整个系统？", tip:"leverage point = 杠杆点。"},
   {en:"We fixed the symptom, not the structure, so it came back.", ipa:"", zh:"我们修了症状，不是结构，所以它回来了。", tip:""},
   {en:"What are the unintended consequences? Who else does this affect?", ipa:"", zh:"意外后果是什么？这还影响谁？", tip:"unintended consequences = 意外后果。"},
   {en:"Think in loops, not lines.", ipa:"", zh:"用回路思考，不是直线。", tip:"系统思维的口号。"}]}],
  drills:[["system, element, connection, purpose, feedback loop","系统词"],["A system is more than the sum of its parts.","整体"],["Your savings are a stock; income and spending are flows.","存量流量"],["A reinforcing loop amplifies: more customers bring more reviews, which bring more customers.","增强回路"],["A balancing loop stabilizes: when you're cold, you shiver; when you're hot, you sweat.","平衡回路"],["Delays cause overshoot. We fixed the symptom, not the structure, so it came back.","延迟 + 症状"]],
  ex:[
   {t:"mc",q:"浴缸模型里，水龙头是？",opts:["流量","存量","反馈","延迟"],a:0},
   {t:"listen",q:"听一听，这是哪种回路？",say:"When you're cold, you shiver; when you're hot, you sweat.",opts:["平衡回路","增强回路","恶性循环","延迟"],a:0},
   {t:"mc",q:"淋浴调温忽冷忽热是因为？",opts:["延迟造成过冲","水压不稳","阀门坏了","水太少"],a:0},
   {t:"listen",q:"听一听，为什么问题回来了？",say:"We fixed the symptom, not the structure.",opts:["只修了症状，没修结构","修得太慢","没人负责","运气不好"],a:0},
   {t:"type",q:"翻译：用回路思考，不是直线。",a:"Think in loops, not lines.",alt:["Think in loops, not lines","think in loops, not lines","Think in loops not lines."]},
   {t:"type",q:"听写这个词（“放大”，动词第三人称）。",say:"amplifies",a:"amplifies"}],
  hw:[["找三个回路","用英语写下你生活中一个增强回路、一个平衡回路、一个有延迟的系统。"],["画一张图","画一个你关心的问题的因果回路图（至少四个要素），用英语说出每个箭头。"],["找杠杆点","对一个反复出现的问题（迟到、乱花钱、团队争吵），用英语说出症状、结构和一个杠杆点。"]]
},
{ id:"l28c5", lv:28, title:"系统思维（二）：复杂、模式与心智模型", goal:"掌握复杂系统和心智模型的英语（emergence、nonlinearity、mental models、second-order effects），能识别常见的系统原型，能用多个模型看同一个问题。",
  intro:"这一章把系统思维推进一步：<b>复杂系统</b>（小原因大结果、非线性、临界点）、<b>系统原型</b>（反复出现的结构：公地悲剧、增长极限、饮鸩止渴）、<b>心智模型</b>（用多个学科的模型看问题——这正是本课堂第二十到二十八级的意义）和<b>二阶效应</b>（然后呢？）。目标：面对任何复杂问题，能用英语问出<b>对的问题</b>。",
  learn:[{h:"复杂系统",p:"",items:[
   {en:"complexity, nonlinear, tipping point, emergence, resilience, fragility", ipa:"", zh:"复杂性、非线性、临界点、涌现、韧性、脆弱性", tip:"nonlinear = 输入加倍输出不是加倍。"},
   {en:"In a nonlinear system, small causes can have huge effects, and big pushes can do nothing.", ipa:"", zh:"在非线性系统中，小原因可能有巨大效果，大推动可能什么都不做。", tip:""},
   {en:"A tipping point is where a slow change suddenly flips the system: ice to water, a quiet market to a panic.", ipa:"", zh:"临界点是缓慢变化突然翻转系统的地方：冰变水，平静的市场变恐慌。", tip:"flips = 翻转。"},
   {en:"Traffic jams, flocks of birds, and markets are emergent: no one is in charge, yet patterns form.", ipa:"", zh:"交通堵塞、鸟群和市场是涌现的：没人指挥，却形成模式。", tip:""},
   {en:"A resilient system absorbs shocks and recovers. A fragile one looks fine until it breaks.", ipa:"", zh:"有韧性的系统吸收冲击并恢复。脆弱的系统看起来好好的直到崩溃。", tip:""},
   {en:"Efficiency and resilience trade off. A just-in-time supply chain is efficient and fragile.", ipa:"", zh:"效率和韧性是权衡。准时制供应链高效且脆弱。", tip:"疫情时的教训。"}]},
   {h:"系统原型",p:"",items:[
   {en:"The tragedy of the commons: everyone overuses a shared resource because the cost is spread out.", ipa:"", zh:"公地悲剧：每个人过度使用共享资源，因为成本是分摊的。", tip:"渔场、空气、公共厨房。"},
   {en:"Limits to growth: a reinforcing loop runs into a balancing constraint. Growth slows, then stops.", ipa:"", zh:"增长极限：增强回路撞上平衡约束。增长放缓，然后停止。", tip:""},
   {en:"Fixes that fail: the quick fix relieves the symptom but makes the underlying problem worse.", ipa:"", zh:"失败的修补：快速修补缓解症状，但让根本问题更糟。", tip:"借钱还债。"},
   {en:"Shifting the burden: relying on a short-term solution weakens the ability to find the real one.", ipa:"", zh:"转移负担：依赖短期方案削弱找到真正方案的能力。", tip:"咖啡代替睡眠。"},
   {en:"Escalation: each side reacts to the other, and both end up worse off.", ipa:"", zh:"升级：每一方对另一方反应，两方最后都更糟。", tip:"价格战、军备竞赛、家庭争吵。"},
   {en:"Success to the successful: the winner gets more resources, which makes them win more.", ipa:"", zh:"成功者更成功：赢家得到更多资源，让他们赢更多。", tip:""}]},
   {h:"心智模型与二阶效应",p:"",items:[
   {en:"A mental model is a simplified picture of how something works. Everyone has them; good thinkers have many.", ipa:"", zh:"心智模型是事物如何运作的简化图景。人人都有；好的思考者有很多。", tip:""},
   {en:"Look at the problem through several lenses: economics, psychology, biology, engineering.", ipa:"", zh:"通过几个镜头看问题：经济学、心理学、生物学、工程学。", tip:"lenses = 镜头、视角。"},
   {en:"To a person with a hammer, everything looks like a nail.", ipa:"", zh:"对拿锤子的人，一切看起来都像钉子。", tip:"只有一个模型的危险。"},
   {en:"Second-order thinking: and then what? And then what after that?", ipa:"", zh:"二阶思维：然后呢？然后再然后呢？", tip:""},
   {en:"Rent control helps current tenants. And then? Fewer new apartments get built. And then? Future tenants face a shortage.", ipa:"", zh:"租金管制帮助现在的租户。然后呢？新公寓建得更少。然后呢？未来的租户面临短缺。", tip:""},
   {en:"Invert the problem: instead of 'how do I succeed', ask 'what would guarantee failure', and avoid that.", ipa:"", zh:"反转问题：不问“怎么成功”，问“什么保证失败”，然后避免它。", tip:"inversion。"}]}],
  drills:[["complexity, nonlinear, tipping point, emergence, resilience","复杂词"],["A resilient system absorbs shocks and recovers. A fragile one looks fine until it breaks.","韧性"],["The tragedy of the commons: everyone overuses a shared resource because the cost is spread out.","公地悲剧"],["Fixes that fail: the quick fix relieves the symptom but makes the underlying problem worse.","失败的修补"],["Look at the problem through several lenses: economics, psychology, biology, engineering.","多镜头"],["Second-order thinking: and then what? And then what after that?","二阶"]],
  ex:[
   {t:"mc",q:"“tipping point” 是？",opts:["缓慢变化突然翻转系统的点","小费的点","最高点","平衡点"],a:0},
   {t:"listen",q:"听一听，这是哪个原型？",say:"Everyone overuses a shared resource because the cost is spread out.",opts:["公地悲剧","增长极限","升级","转移负担"],a:0},
   {t:"mc",q:"“To a person with a hammer, everything looks like a nail” 警告的是？",opts:["只有一个心智模型的危险","工具不够","要买更多工具","钉子太多"],a:0},
   {t:"listen",q:"听一听，这是什么思维？",say:"And then what? And then what after that?",opts:["二阶思维","反转","一阶思维","溯因"],a:0},
   {t:"type",q:"翻译：效率和韧性是权衡。（用 trade off）",a:"Efficiency and resilience trade off.",alt:["Efficiency and resilience trade off","efficiency and resilience trade off","Efficiency and resilience are a trade-off."]},
   {t:"type",q:"听写这个词（“涌现”）。",say:"emergence",a:"emergence"}],
  hw:[["找一个原型","在新闻或你的生活中找一个系统原型（公地悲剧、失败的修补、升级），用英语描述它的结构。"],["三个镜头","选一个问题（加拿大房价），用三个学科的模型各说一句英语。"],["二阶思维","对一个你支持的政策或决定，用英语做三层“And then what?”。"]]
},
{ id:"l28c6", lv:28, title:"第二十八级结业：分析一个真实的复杂问题", goal:"能用本级全部工具（定义、推理、概率、系统）对一个真实的复杂问题做完整分析，并用英语做一次 10 分钟的汇报，回应质疑。",
  intro:"结业任务：<b>选一个你真正关心的复杂问题</b>——家庭的、工作的、社区的、国家的——做一次完整的分析并汇报 10 分钟。本章给你<b>分析的框架</b>（定义问题 → 拆分 → 找结构 → 列选项 → 评估 → 建议 → 不确定性）、<b>汇报的语言</b>和<b>回应质疑的方式</b>（steel-manning：把对方的观点说到最强再回应）。这是本课堂的最后一章：从一个字母，到能用英语清晰地思考和说服。",
  learn:[{h:"分析框架",p:"",items:[
   {en:"Step one: define the problem precisely. Not 'traffic is bad' but 'commute times on Highway 401 have risen 30 percent since 2015'.", ipa:"", zh:"第一步：精确定义问题。不是“交通很差”，而是“401 公路通勤时间自 2015 年上升 30%”。", tip:""},
   {en:"Step two: break it down. What are the parts? What are the causes, and the causes of the causes?", ipa:"", zh:"第二步：拆分。有哪些部分？原因是什么，原因的原因是什么？", tip:"five whys。"},
   {en:"Step three: find the structure. What loops, delays, and incentives are at work?", ipa:"", zh:"第三步：找结构。有什么回路、延迟和激励在起作用？", tip:""},
   {en:"Step four: list the options, including doing nothing.", ipa:"", zh:"第四步：列出选项，包括什么都不做。", tip:""},

function lvOf(c){ return c.lv||1; }
function lvChapters(l){ return COURSE.filter(c=>lvOf(c)===l); }
function lvDone(l){ return lvChapters(l).every(chapDone); }
function curLevel(){ const c=COURSE.find(x=>!chapDone(x)); return c? lvOf(c) : LEVELS.length; }
function lvIndex(c){ return lvChapters(lvOf(c)).indexOf(c)+1; }
// what the voice actually says for a displayed phrase (arrows, A:/B: labels, blanks, IPA marks removed)
function spokenOf(it){
  if(it.say) return it.say;
  return it.en.replace(/[↗↘]/g,"").replace(/\b[AB]:\s*/g,"").replace(/\s*→\s*/g,", ").replace(/\s*\/\s*/g,". ").replace(/\s*—\s*/g,". ")
    .replace(/_{2,}/g,"blank").replace(/\s*\(DOB\)/,"").replace(/\bN\/A\b/,"N A").replace(/\s+/g," ").replace(/\s+([.,?!])/g,"$1").trim();
}

let faces=[];
function mountFace(el,size){ if(!el) return; faces=faces.filter(f=>f.isConnected); el.classList.add("face"); if(size) el.style.setProperty("--fs",size); el.setAttribute("data-mood","happy"); el.innerHTML=FACE_SVG; faces.push(el); }
const face = {
  mood(m,ms){ faces.forEach(f=>f.setAttribute("data-mood",m)); if(ms) setTimeout(()=>faces.forEach(f=>f.setAttribute("data-mood","happy")),ms); },
  talk(on){ faces.forEach(f=>f.classList.toggle("talking",on)); },
  bounce(){ faces.forEach(f=>{ f.classList.remove("bounce"); void f.offsetWidth; f.classList.add("bounce"); }); },
  hello(){ faces.forEach(f=>{ f.classList.remove("hello"); void f.offsetWidth; f.classList.add("hello"); setTimeout(()=>f.classList.remove("hello"),3000); }); }
};
document.addEventListener("pointermove",e=>{ const dx=(e.clientX/innerWidth-.5)*4, dy=(e.clientY/innerHeight-.5)*3;

const BLANK = ()=>({done:{}, hw:{}, ex:{}, seen:{}, drill:{}, speed:0.95});

function stateKey(){ return "ys-state:"+(me?me.kind+":"+me.id:"anon"); }
function save(){
  try{ localStorage.setItem(stateKey(),JSON.stringify(S)); }catch(e){}
  if(dbRef){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ dbRef.set(Object.assign({},S,{savedAt:Date.now()})).catch(()=>{ dbRef=null; }); },600); }
}
async function loadState(){
  S = BLANK();
  try{ const s=localStorage.getItem(stateKey()); if(s) Object.assign(S,JSON.parse(s)); }catch(e){}
  if(dbRef){ try{ const snap=await dbRef.get(); const d=snap.data(); if(d && (d.savedAt||0) >= (S.savedAt||0)){ delete d.savedAt; Object.assign(S,d); } }catch(e){} }
}
async function sha(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

n't use a person as a means.": "4fa95fbf74", "Most people's moral intuitions mix all three theories.": "1cdbda22aa", "Socrates: 'The unexamined life is not worth living.' He asked questions until people saw their own contradictions.": "10298f73c5", "Aristotle: virtue is a habit, found in the mean between extremes. Courage lies between cowardice and recklessness.": "2e35c5272a", "Confucius: cultivate virtue through ritual, respect, and relationships. He and Aristotle would have agreed on a lot.": "705c966a93", "Kant: act only on principles you could will to be universal laws. Don't lie, even to save a friend.": "a31d0ad626", "Mill: the only reason to limit someone's freedom is to prevent harm to others.": "1f5b181763", "Descartes: 'I think, therefore I am.' The one thing you can't doubt is that you're doubting.": "ea00288938", "Is it ever okay to lie? What if it protects someone?": "5c202547e7", "I see the appeal of that view, but it has a troubling implication: …": "895dac4d5d", "Where do you draw the line?": "433b6104a7", "I don't think there's a clean answer, but here's where I land.": "50c7738403", "Act only on principles you could will to be universal laws.": "b0d548e96b", "virtue": "abb312ffe8", "palette, colour, contrast, light and shadow, brushwork, texture": "dbb762e0c4", "The artist uses warm colours in the foreground and cool colours in the distance.": "265f21ac46", "The loose brushwork gives it a sense of movement.": "52db924bfe", "portrait, landscape, still life, abstract, figurative": "5bf888d797", "Renaissance: realism, perspective, and the human body. Leonardo, Michelangelo.": "da455a6618", "Baroque: drama, movement, and strong contrasts of light. Rembrandt, Caravaggio.": "c68bd41d82", "Impressionism: capturing light and the moment with visible brushstrokes. Monet, Renoir.": "78fe0f0431", "Modern art broke the rules: Picasso's cubism, Kandinsky's abstraction.": "dc1d48f14f", "Contemporary art often asks questions rather than showing beauty. It can be o.": "e0cb19fda1", "Row F, seats twelve and thirteen, in the orchestra.": "2a56580cf0", "improvisation": "7a7c7a92c5", "plot, character, setting, theme, point of view, conflict, climax, resolution": "c745b5e69a", "It's told in the first person, so we only know what the narrator knows.": "8d814a6a9a", "The theme is loss, but it's really about how people rebuild.": "d0811ae0f1", "The character arc: she starts out selfish and learns to care for others.": "2940faca09", "symbol, metaphor, irony, foreshadowing, flashback, unreliable narrator": "66ca38b528", "The storm is a symbol of the family falling apart.": "e32b256dbf", "The irony is that he spends the whole book searching for something he already had.": "e857a69eea", "close-up, wide shot, cut, long take, score, pacing, cinematography": "42e6a63b21", "The score does a lot of the emotional work.": "d7c8ea284e", "Margaret Atwood wrote 'The Handmaid's Tale'. Alice Munro won the Nobel Prize for her short stories.": "2664b63499", "Canadian films are often quiet and character-driven. Try 'Women Talking' or anything by Denis Villeneuve.": "df4b59b31b", "A short review: what it's about in one line, what works, what doesn't, who should see it.": "c7b2e6a285", "Would you like to join our book club? We meet once a month and the reading is about 200 pages.": "a7ab9527f1", "The pacing drags in the middle.": "a8e15df992", "Without giving anything away, the ending is a surprise.": "f8bd4ae113", "protagonist": "4407b588fe", "Can you give an example?. What would be a counterexample?": "a26fa19d94", "So you're saying pleasure is what matters. Does that mean a happy pig has a better life than an unhappy philosopher?": "9273b9a333", "We've found two positions tonight: one says meaning, the other says happiness. Neither is obviously wrong.": "ce8fce6a90", "I'll leave you with this: if you had to choose, which would you give up?": "0b2f452f0a", "I was interested in how the light changes, and how empty the city feels before it wakes up.": " nternationally trained engineers can have their credentials assessed and may need to write exams.": "ec054426b1", "The iron ring is worn by Canadian engineers as a reminder of their responsibility.": "d903a5e950", "prototype": "c18462a35a", "stress is force per area; strain is how much it stretches": "4e9f14c57e", "strength, stiffness, ductile, brittle, elastic, plastic": "a8c62abee7", "Concrete is strong in compression but weak in tension. That's why we put steel rebar inside it.": "bfc1dabd43", "An arch turns the load into compression, which stone handles well. That's why Roman arches still stand.": "e90e2498cc", "A cantilever is supported at only one end, like a balcony or a diving board.": "a66e85a242", "Suspension bridges hang the deck from cables in tension, anchored to towers.": "00b40efa9b", "The deeper a beam, the stiffer it is. Doubling the depth makes it eight times stiffer.": "f13b2a548f", "buckling, fatigue, fracture, corrosion, overload": "61ed800b57", "A long thin column buckles sideways long before it crushes.": "867feb98ff", "Fatigue is failure from repeated loading. A paper clip bent back and forth eventually snaps.": "b5cb7645cf", "The Quebec Bridge collapsed in 1907 during construction, killing 75 workers. The engineers had underestimated its own weight.": "84c36c410e", "The iron ring tradition began after that disaster, as a reminder that engineering mistakes cost lives.": "bc68762099", "Inspections look for cracks, rust, and movement before they become failures.": "0cc603a233", "It bends before it breaks.": "8670b14f84", "A paper clip bent back and forth eventually snaps.": "dff505a249", "truss": "03c7bc1b52", "variable, value, data type: string, integer, float, boolean, list": "f3c6ac6303", "name equals 'Wei'. age equals 35. is_student equals False.": "8cb91a8689", "if, else, while, for, return, print; condition, loop, iteration": "bb05f74ebb", "For each item in the list, add it to the total.": "8e95d6c55a", "First it checks whether the input llows": "c0749f0869", "modus ponens: if P then Q; P; therefore Q.": "2543fa06bd", "Affirming the consequent is a mistake: if it rains, the ground is wet; the ground is wet; therefore it rained. No: a sprinkler could have done it.": "d8882af431", "The conclusion follows necessarily from the premises.": "4f202e8207", "induction, inductive, generalization, probable, strong, weak": "6789102f57", "Every swan I've seen is white, so probably all swans are white. Then someone found a black one in Australia.": "5cf927c5b3", "A strong induction has a large, representative sample. A weak one generalizes from a few cases.": "4ed4cd272e", "Hasty generalization: 'I had two bad landlords, so all landlords are bad.'": "87acbfb6aa", "The evidence makes the conclusion likely, but not certain.": "2469e84dd1", "abduction: inference to the best explanation": "84af3069a0", "The lawn is wet, the sky is clear, and the sprinkler timer is on. The best explanation is the sprinkler.": "7cfff3f13e", "Let me walk through my reasoning: first…, which means…, and therefore…": "d501961e10", "I'm fairly confident, but I'd change my mind if we found that the timer was off.": "2bda913d2b", "The ground is wet, therefore it rained.": "ed9e94bfe2", "Inference to the best explanation.": "15a1925c93", "generalization": "f70cf526b3", "probability, odds, base rate, expected value, risk, uncertainty": "5a46bce366", "A test is 99 percent accurate, but the disease affects one in ten thousand. Most positive results are still false alarms.": "4b09271e3f", "A ten percent chance of winning a thousand dollars is worth a hundred dollars on average.": "c2e27b36ab", "Update your beliefs as evidence comes in. Strong priors need strong evidence to move.": "66ff8dc18d", "sunk cost: money or time already spent shouldn't affect what you do next": "4f38d0d679", "We've put two years into this project.. That's a sunk cost. The question is whether the next year is worth it.": "a4966761a3", "Loss aversion: losing a hundred dollar
