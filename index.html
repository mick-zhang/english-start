{ id:"l11c6", lv:11, title:"第十一级结业：讲一个加拿大故事", goal:"能理解并讲述加拿大文化中的几个重要故事和争议（原住民和解、多元文化、魁北克），并在聚会中讲一段你自己的“加拿大故事”。",
  intro:"真正融入一个国家，是能<b>参与它的大对话</b>。加拿大有几个每个人都在谈的话题：<b>原住民和解</b>（Truth and Reconciliation）、<b>多元文化</b>（mosaic，不是美国的 melting pot）、<b>魁北克和法语</b>、<b>移民</b>。本章给你每个话题的<b>基本事实和常见观点</b>，让你能听懂、能问、能说一两句。结业任务：<b>在一次聚会或对话中，讲一段你自己的“加拿大故事”</b>——你为什么来、最大的意外、现在怎么看。",
  learn:[{h:"原住民和解",p:"",items:[
   {en:"We acknowledge that we are on the traditional territory of the Mississaugas of the Credit.", ipa:"", zh:"我们承认我们身处密西沙加信用河原住民的传统领地。", tip:"土地致谢（land acknowledgement），很多活动开场都说。"},
   {en:"September thirtieth is the National Day for Truth and Reconciliation. People wear orange.", ipa:"", zh:"9 月 30 日是全国真相与和解日。人们穿橙色。", tip:"纪念寄宿学校的受害者。"},
   {en:"The Truth and Reconciliation Commission issued ninety-four calls to action.", ipa:"", zh:"真相与和解委员会发布了 94 项行动呼吁。", tip:"calls to action = 行动呼吁。"},
   {en:"I'm still learning about this history. Could you recommend something to read?", ipa:"", zh:"我还在了解这段历史。能推荐点读的吗？", tip:"诚实的态度比任何观点都好。"}]},
   {h:"多元文化与魁北克",p:"",items:[
   {en:"Canada describes itself as a cultural mosaic, not a melting pot.", ipa:"", zh:"加拿大称自己是文化马赛克，而不是熔炉。", tip:"mosaic = 各自保留特色；melting pot = 融为一体（美国）。"},
   {en:"Multiculturalism became official policy in 1971.", ipa:"", zh:"多元文化主义在 1971 年成为官方政策。", tip:""},
   {en:"Quebec is the only province where French is the sole official language.", ipa:"", zh:"魁北克是唯一以法语为唯一官方语言的省。", tip:"sole = 唯一。"},
   {en:"There were two referendums on Quebec sovereignty, in 1980 and 1995.", ipa:"", zh:"魁北克主权问题有过两次公投，1980 和 1995 年。", tip:"1995 年只差 1%。"},
   {en:"Where are you from originally? — China. I've been here six years now.", ipa:"", zh:"你原本是哪里人？——中国。我来这六年了。", tip:"originally 让这个问题变得礼貌。"},
   {en:"What's been the biggest adjustment for you?", ipa:"", zh:"对你来说最大的适应是什么？", tip:"加拿大人真的想知道。"}]},
   {h:"你的加拿大故事",p:"三段：为什么来、最大的意外、现在怎么看。",items:[
   {en:"I came here in 2019 for my daughter's education. I didn't speak a word of English.", ipa:"", zh:"我 2019 年为了女儿的教育来的。一句英语都不会。", tip:"为什么来。"},
   {en:"The biggest surprise was how much people talk to strangers. In Shanghai, nobody does that.", ipa:"", zh:"最大的意外是人们和陌生人说话那么多。在上海没人那样。", tip:"最大的意外。"},
   {en:"Winter was brutal the first year. Now I actually look forward to skating.", ipa:"", zh:"第一年冬天太难熬了。现在我居然期待滑冰。", tip:"一个变化。"},
   {en:"I still miss home, but this is home too now.", ipa:"", zh:"我还是想家，但这里现在也是家了。", tip:"现在怎么看。"}]}],
  drills:[["September thirtieth is the National Day for Truth and Reconciliation.","和解日"],["Canada describes itself as a cultural mosaic, not a melting pot.","马赛克"],["Quebec is the only province where French is the sole official language.","魁北克"],["Where are you from originally? China. I've been here six years now.","问答"],["I came here in 2019 for my daughter's education. I didn't speak a word of English.","故事开头"],["I still miss home, but this is home too now.","故事结尾"]],

   {t:"type",q:"翻译：对你来说最大的适应是什么？",a:"What's been the biggest adjustment for you?",alt:["What's been the biggest adjustment for you","What has been the biggest adjustment for you?","What was the biggest adjustment for you?"]},

{ id:"l12c1", lv:12, title:"加拿大的政治版图：政党、议员与议题", goal:"认识加拿大主要政党和它们的立场，知道联邦、省、市各管什么，能看懂政治新闻的基本词汇。",
  intro:"第六级学了政府的结构，这一级学<b>政治怎么运作</b>。加拿大联邦有五个主要政党：<b>自由党</b>（Liberals，中间偏左）、<b>保守党</b>（Conservatives，中间偏右）、<b>新民主党</b>（NDP，左）、<b>魁人政团</b>（Bloc，只在魁北克）、<b>绿党</b>（Green）。新闻里天天出现的词：<b>riding</b>（选区）、<b>MP</b>（众议员）、<b>cabinet</b>（内阁）、<b>opposition</b>（反对党）、<b>bill</b>（法案）。本章先把这些词和每个党的大致立场学会——这是<b>描述</b>，不是支持谁。",
  learn:[{h:"政党与立场",p:"大致位置，不是全部。",items:[
   {en:"The Liberal Party is centre-left; the Conservative Party is centre-right.", ipa:"", zh:"自由党中间偏左；保守党中间偏右。", tip:"centre 加拿大拼法。两大党轮流执政。"},
   {en:"The NDP is further left, with strong ties to labour unions.", ipa:"", zh:"新民主党更偏左，和工会关系紧密。", tip:"NDP = New Democratic Party。"},
   {en:"The Bloc Québécois only runs candidates in Quebec.", ipa:"", zh:"魁人政团只在魁北克推候选人。", tip:"run candidates = 推出候选人。"},
   {en:"The Green Party focuses on the environment.", ipa:"", zh:"绿党关注环境。", tip:""},
   {en:"The party with the most seats forms the government; the second-largest is the Official Opposition.", ipa:"", zh:"席位最多的党组建政府；第二大党是官方反对党。", tip:"seats = 席位。"}]},
   {h:"新闻里的政治词汇",p:"",items:[
   {en:"riding, MP, MPP, cabinet minister, backbencher", ipa:"", zh:"选区、联邦众议员、安省省议员、内阁部长、普通议员", tip:"riding = 选区，加拿大特有说法。"},
   {en:"majority government vs minority government", ipa:"", zh:"多数政府 vs 少数政府", tip:"少数政府需要其他党支持才能通过法案。"},
   {en:"a bill is introduced, debated, passed, and receives royal assent", ipa:"", zh:"法案被提出、辩论、通过、获得御准", tip:"royal assent = 总督签字生效。"},
   {en:"The opposition called for the minister to resign.", ipa:"", zh:"反对党要求部长辞职。", tip:"called for = 要求。"},
   {en:"The government tabled the budget on Tuesday.", ipa:"", zh:"政府周二提交了预算。", tip:"table 在加拿大 = 提交（和美国相反！）。"},
   {en:"A confidence vote could trigger an election.", ipa:"", zh:"信任投票可能引发大选。", tip:"trigger = 触发。"}]},
   {h:"谁管什么",p:"投诉要找对人。",items:[

{ id:"l12c2", lv:12, title:"读懂新闻：结构、来源与偏向", goal:"能快速读懂一篇英文新闻，分辨事实与观点，识别来源的可靠性和立场。",
  intro:"第四级学了标题和导语。这一级学<b>整篇</b>：新闻的<b>倒金字塔</b>结构（最重要的在前）、<b>引语</b>（谁说的，怎么说的）、<b>事实 vs 观点</b>（news vs opinion / editorial）。还要学<b>看来源</b>：CBC、Globe and Mail、National Post、Toronto Star 各有什么倾向；社交媒体上的“新闻”怎么验证。目标不是让你相信谁，是让你<b>知道自己在读什么</b>。",
  learn:[{h:"新闻的结构",p:"",items:[
   {en:"The lead answers who, what, when, where, and why in the first paragraph.", ipa:"", zh:"导语在第一段回答谁、什么、何时、何地、为何。", tip:"lead 读 /liːd/。"},
   {en:"According to a spokesperson, the policy will take effect in January.", ipa:"", zh:"据发言人说，该政策将于一月生效。", tip:"take effect = 生效。"},
   {en:"\"We are reviewing the decision,\" the minister said in a statement.", ipa:"", zh:"“我们正在重新审视这个决定，”部长在声明中说。", tip:"直接引语 = 原话。in a statement = 书面声明。"},
   {en:"Critics say the plan doesn't go far enough; supporters argue it's a good first step.", ipa:"", zh:"批评者说计划力度不够；支持者认为这是好的第一步。", tip:"好新闻两边都写。"},
   {en:"The source spoke on condition of anonymity.", ipa:"", zh:"消息来源要求匿名。", tip:"anonymity 读 an-o-NIM-i-tee。"}]},
   {h:"事实、观点与来源",p:"",items:[
   {en:"news article vs opinion piece vs editorial vs analysis", ipa:"", zh:"新闻报道 vs 评论文章 vs 社论 vs 分析", tip:"标着 Opinion 的不是新闻，是作者的看法。"},
   {en:"This is a fact: unemployment rose to 6 percent. This is an opinion: the government has failed on jobs.", ipa:"", zh:"这是事实：失业率升到 6%。这是观点：政府在就业上失败了。", tip:"数字和事件是事实；评价是观点。"},
   {en:"The Globe and Mail and the National Post lean right; the Toronto Star leans left; CBC is public and aims for the centre.", ipa:"", zh:"《环球邮报》和《国家邮报》偏右；《多伦多星报》偏左；CBC 是公共媒体，力求中立。", tip:"lean = 倾向。每家都有偏向，读两家更全面。"},
   {en:"Is this a reliable source? Who funds it? Does it cite evidence?", ipa:"", zh:"这是可靠来源吗？谁出钱？有没有引用证据？", tip:"三个检验问题。"},
   {en:"This claim has been debunked by fact-checkers.", ipa:"", zh:"这个说法已被事实核查者证伪。", tip:"debunked = 被揭穿。"},
   {en:"Before you share it, check the date and the original source.", ipa:"", zh:"转发前，查一下日期和原始来源。", tip:"微信群里很多“新闻”是旧的或假的。"}]},
   {h:"读新闻的句子",p:"",items:[
   {en:"I read that the city is raising property taxes by four percent.", ipa:"", zh:"我读到市里要把地税提高 4%。", tip:"I read that = 我读到。"},
   {en:"Did you see the story about the new transit line?", ipa:"", zh:"你看到关于新交通线的报道了吗？", tip:"story = 新闻报道。"},
   {en:"I'm not sure that's accurate. Where did you see that?", ipa:"", zh:"我不确定那是准确的。你在哪看到的？", tip:"礼貌地质疑。"}]}],
  drills:[["The lead answers who, what, when, where, and why.","导语"],["According to a spokesperson, the policy will take effect in January.","according to"],["Critics say the plan doesn't go far enough; supporters argue it's a good first step.","两边"],["news article versus opinion piece versus editorial","三种"],["Is this a reliable source? Who funds it? Does it cite evidence?","三个检验"],["I'm not sure that's accurate. Where did you see that?","质疑"]],
  ex:[
   {t:"mc",q:"下面哪句是观点而不是事实？",opts:["The government has failed on housing.","Housing starts fell 8 percent last year.","The minister announced the plan on Monday.","The bill passed 180 to 150."],a:0},
   {t:"listen",q:"听一听，这是什么意思？",say:"The source spoke on condition of anonymity.",opts:["消息来源要求匿名","消息来源是名人","消息来源在条件下说话","没有消息来源"],a:0},
   {t:"mc",q:"标着 “Opinion” 的文章是？",opts:["作者的看法，不是新闻报道","最重要的新闻","经过核实的事实","读者来信"],a:0},
   {t:"listen",q:"听一听，他建议什么？",say:"Before you share it, check the date and the original source.",opts:["转发前查日期和来源","马上转发","别看新闻","只看日期"],a:0},
   {t:"type",q:"翻译：你在哪看到的？",a:"Where did you see that?",alt:["Where did you see that","where did you see that","Where did you read that?"]},
   {t:"type",q:"听写这个词（“可靠的”）。",say:"reliable",a:"reliable"}],
  hw:[["同一新闻两家读","选一条新闻，读 CBC 和另一家的版本，用英语写下三处不同。"],["分事实观点","读一篇新闻，把 5 个句子分成事实和观点两列。"],["核查一条","从微信群里挑一条“新闻”，用英语搜原始来源，判断真假，写一句结论。"]]
},
{ id:"l12c3", lv:12, title:"投票：登记、候选人与投票日", goal:"能登记投票、了解候选人、看懂选举新闻、在投票站完成投票。",
  intro:"入籍后你就有<b>投票权</b>——也是责任。流程：<b>登记</b>（Elections Canada 会寄 voter information card）、<b>了解候选人</b>（辩论、问卷、敲门拜访）、<b>投票</b>（投票日、提前投票、邮寄）。投票站的对话很短：出示证件、拿选票、画 X、投入票箱。本章也教<b>和拉票的人对话</b>——他们会来敲门，你可以问问题。",
  learn:[{h:"登记与投票方式",p:"",items:[
   {en:"Am I registered to vote? — You can check online at Elections Canada.", ipa:"", zh:"我登记投票了吗？——可以在加拿大选举局网站上查。", tip:"registered = 已登记。"},

   {en:"You can vote on election day, at advance polls, or by mail.", ipa:"", zh:"你可以在选举日、提前投票站或邮寄投票。", tip:"advance polls = 提前投票，通常选举前一周末。"},
   {en:"Bring one piece of government ID with your photo and address.", ipa:"", zh:"带一份有照片和地址的政府证件。", tip:"驾照最方便。"}]},

   {en:"The party platform promises to cut taxes and build more homes.", ipa:"", zh:"该党纲领承诺减税和多建住房。", tip:"platform = 竞选纲领。"},

   {en:"Thanks for stopping by. I'll think about it.", ipa:"", zh:"谢谢你来。我会考虑。", tip:"对拉票的人礼貌结束。"}]},
   {h:"投票站",p:"",items:[

{ id:"l12c4", lv:12, title:"聊政治而不吵架：表达立场与尊重分歧", goal:"能在饭桌和办公室谈论政治话题，表达自己的看法，理解对方，并在分歧时保持关系。",
  intro:"在加拿大，政治<b>可以聊但要小心</b>。规则：① 先<b>问</b>再<b>说</b>；② 说<b>自己的经历</b>，不说“所有人都……”；③ 用<b>软化词</b>（I tend to think, in my experience）；④ 分歧时<b>找共同点</b>（We both want…）；⑤ 知道<b>什么时候停</b>（Let's agree to disagree）。本章给你一套能聊得深又不翻脸的语言。",
  learn:[{h:"开始与试探",p:"",items:[
   {en:"Do you follow politics much?", ipa:"", zh:"你关注政治吗？", tip:"先试探对方想不想聊。"},
   {en:"What do you make of the new housing plan?", ipa:"", zh:"你怎么看新的住房计划？", tip:"make of = 怎么看。"},
   {en:"I'm curious what people here think about immigration levels.", ipa:"", zh:"我很好奇这里的人怎么看移民数量。", tip:"用“好奇”开头，不带立场。"},
   {en:"I'm still figuring out where I stand on this.", ipa:"", zh:"我还在想清楚我在这个问题上的立场。", tip:"figure out = 想清楚。不表态也是一种表态。"}]},
   {h:"表达立场",p:"软化 + 经历 + 具体。",items:[
   {en:"I tend to think taxes are too high, but I see why we need them.", ipa:"", zh:"我倾向于认为税太高，但我明白为什么需要。", tip:"tend to think = 倾向于认为。"},
   {en:"In my experience as a newcomer, the system worked pretty well.", ipa:"", zh:"以我作为新移民的经历，这个系统运作得挺好。", tip:"经历没人能反驳。"},
   {en:"I lean left on social issues and right on the economy.", ipa:"", zh:"我在社会议题上偏左，经济上偏右。", tip:"lean = 倾向。"},
   {en:"I don't love any of the parties, honestly. I vote for the local candidate.", ipa:"", zh:"说实话我哪个党都不太喜欢。我投本地候选人。", tip:"很多加拿大人这样。"},
   {en:"That's not been my experience, but I can see how you'd think that.", ipa:"", zh:"我的经历不是那样，但我理解你为什么这么想。", tip:"不同意但尊重。"}]},
   {h:"分歧与收尾",p:"",items:[
   {en:"We both want the same thing. We just disagree on how to get there.", ipa:"", zh:"我们想要的一样。只是在怎么实现上有分歧。", tip:"找共同点。"},
   {en:"Can I push back on that a little?", ipa:"", zh:"我能稍微反驳一下吗？", tip:"push back = 反驳。先问再反驳。"},
   {en:"Where did you read that? I'd like to look into it.", ipa:"", zh:"你在哪读到的？我想查一下。", tip:"对不确定的“事实”这样回应。"},
   {en:"Let's agree to disagree. Anyway, how's the new job?", ipa:"", zh:"我们各自保留意见吧。对了，新工作怎么样？", tip:"结束 + 换话题。"},
   {en:"I'd rather not get into politics at work, if that's okay.", ipa:"", zh:"如果可以的话，我不太想在工作场合谈政治。", tip:"get into = 深谈。完全可以拒绝。"}]}],
  drills:[["Do you follow politics much? What do you make of the new housing plan?","开始"],["I'm still figuring out where I stand on this.","不表态"],["I tend to think taxes are too high, but I see why we need them.","软化"],["In my experience as a newcomer, the system worked pretty well.","经历"],["We both want the same thing. We just disagree on how to get there.","共同点"],["Let's agree to disagree. Anyway, how's the new job?","收尾"]],
  ex:[
   {t:"mc",q:"想聊政治，先说哪句试探？",opts:["Do you follow politics much?","The government is terrible.","Who did you vote for?","Politics is stupid."],a:0},
   {t:"listen",q:"听一听，他的立场是？",say:"I lean left on social issues and right on the economy.",opts:["社会议题偏左，经济偏右","全部偏左","全部偏右","没有立场"],a:0},
   {t:"mc",q:"“Let's agree to disagree.” 意思是？",opts:["我们各自保留意见吧","我们同意了","我们不同意","我们再讨论"],a:0},
   {t:"listen",q:"听一听，他想做什么？",say:"Can I push back on that a little?",opts:["稍微反驳一下","把它推回去","退一步","换话题"],a:0},
   {t:"type",q:"翻译：我不太想在工作场合谈政治。（用 get into）",a:"I'd rather not get into politics at work.",alt:["I'd rather not get into politics at work","I would rather not get into politics at work.","I'd rather not get into politics at work, if that's okay."]},
   {t:"type",q:"听写这句话。",say:"What do you make of it?",a:"What do you make of it?",alt:["What do you make of it","what do you make of it"]}],
  hw:[["写你的立场","选一个议题（住房、移民、税），用“软化 + 经历 + 具体”写三句你的看法。"],["听一次","问一位加拿大朋友 What do you make of…?，只听不反驳，最后说 That's interesting, I hadn't thought of that."],["一次分歧","在一次真实对话中遇到分歧时，用 We both want… 或 Let's agree to disagree 收尾，记下结果。"]]

{ id:"l12c5", lv:12, title:"参与社区：市政会议、请愿与义工", goal:"能参加社区会议发言、写请愿或投诉信、联系议员、报名做义工。",
  intro:"政治不只是投票。在加拿大，<b>普通人真的能改变身边的事</b>：去市政会议发言（deputation）、给议员办公室写信、发起或签请愿（petition）、做义工。这些事的英语有固定格式，而且<b>比你想的容易</b>——议员办公室的工作就是帮选民。本章教你每一种参与的说法，结合第三级的邮件和第五级的正式文件。",
  learn:[{h:"联系议员",p:"",items:[
   {en:"I'm a constituent in your riding, and I'm writing about the lack of crosswalks on Main Street.", ipa:"", zh:"我是您选区的选民，我写信是关于 Main 街缺少人行横道的问题。", tip:"constituent = 选民。第一句说明身份和问题。"},
   {en:"Three children have been nearly hit in the past month.", ipa:"", zh:"过去一个月有三个孩子差点被撞。", tip:"具体事实。"},
   {en:"I'd like to know what steps your office is taking to address this.", ipa:"", zh:"我想知道您的办公室正在采取什么措施解决这个问题。", tip:"address = 处理。"},
   {en:"I'd appreciate a response within two weeks.", ipa:"", zh:"希望两周内收到回复。", tip:""},
   {en:"Could I book a meeting with the councillor during constituency hours?", ipa:"", zh:"我能在选民接待时间约见议员吗？", tip:"constituency hours = 议员接待选民的时间。"}]},
   {h:"市政会议与请愿",p:"",items:[
   {en:"I'd like to register to speak at the council meeting on the zoning proposal.", ipa:"", zh:"我想登记在市议会关于规划提案的会议上发言。", tip:"发言叫 deputation，通常 5 分钟。"},
   {en:"Good evening, councillors. My name is Wei Chen and I've lived on Elm Street for six years.", ipa:"", zh:"各位议员晚上好。我叫陈伟，在 Elm 街住了六年。", tip:"发言开头：名字 + 身份。"},
   {en:"I'm here to speak against the proposal because it would remove the only park in our area.", ipa:"", zh:"我来反对这个提案，因为它会拆掉我们区唯一的公园。", tip:"speak for / against = 支持 / 反对。"},
   {en:"We're collecting signatures for a petition to add a stop sign at this corner.", ipa:"", zh:"我们在为在这个路口加停车标志的请愿收集签名。", tip:"petition 读 pe-TISH-un。"},
   {en:"Would you be willing to sign? It takes ten seconds.", ipa:"", zh:"你愿意签名吗？只要十秒。", tip:"willing to = 愿意。"}]},
   {h:"义工",p:"",items:[

{ id:"l12c6", lv:12, title:"第十二级结业：主持一次时事讨论", goal:"能围绕一条时事新闻组织并主持一次 20 分钟的小组讨论：介绍背景、提出问题、平衡发言、总结观点。",
  intro:"结业任务：<b>主持一次时事讨论</b>——在语言交换、读书会、家庭饭桌或同事午餐上，选一条本周新闻，带着 3 到 6 个人讨论 20 分钟。主持人不需要最懂，需要<b>会提问、会平衡、会总结</b>。本章教主持的语言：<b>介绍新闻</b>（一分钟背景）、<b>提问</b>（开放式、有层次）、<b>管理发言</b>（让安静的人说、让说太多的人停）、<b>总结</b>（各方观点 + 共同点）。",
  learn:[{h:"介绍背景",p:"一分钟，只说事实。",items:[
   {en:"Thanks for coming. Today I'd like us to talk about the new rent control proposal.", ipa:"", zh:"谢谢大家来。今天我想和大家聊聊新的租金管制提案。", tip:""},
   {en:"Here's the background in one minute: last week the province announced…", ipa:"", zh:"背景一分钟：上周省政府宣布……", tip:"只说事实，不说立场。"},
   {en:"Supporters say it will protect tenants. Critics say it will reduce new construction.", ipa:"", zh:"支持者说它保护租户。批评者说它会减少新建房屋。", tip:"两边都介绍，主持人才中立。"},
   {en:"I'll ask a few questions, and I'd love to hear from everyone.", ipa:"", zh:"我会问几个问题，希望听到每个人的看法。", tip:""}]},
   {h:"提问与管理发言",p:"",items:[
   {en:"Let's start simple: has this affected anyone here personally?", ipa:"", zh:"从简单的开始：这事影响到在座哪位了吗？", tip:"从个人经历开始，最容易开口。"},
   {en:"What do you think the government should have done instead?", ipa:"", zh:"你觉得政府本应该怎么做？", tip:"should have done = 本应该做。"},
   {en:"Mei, we haven't heard from you yet. What's your take?", ipa:"", zh:"梅，还没听到你的看法。你怎么看？", tip:"take = 看法。拉安静的人进来。"},
   {en:"That's a great point, David. Let me get a few other views before we come back to you.", ipa:"", zh:"David，这点很好。我先听听其他人的，再回到你。", tip:"礼貌地让说太多的人停。"},
   {en:"Let's keep it respectful. We can disagree without getting personal.", ipa:"", zh:"我们保持尊重。可以不同意，但不针对个人。", tip:"getting personal = 人身攻击。"},
   {en:"Interesting, you two see it completely differently. Why do you think that is?", ipa:"", zh:"有意思，你们俩看法完全不同。你们觉得为什么？", tip:"把分歧变成讨论。"}]},
   {h:"总结",p:"",items:[
   {en:"So, to sum up: most of us agree the problem is real, but we're split on the solution.", ipa:"", zh:"总结一下：多数人同意问题是真实的，但在解决办法上有分歧。", tip:"split = 意见分裂。"},
   {en:"Two things stood out to me: first, …; second, …", say:"Two things stood out to me: first, this; and second, that.", ipa:"", zh:"有两点让我印象深刻：第一……第二……", tip:"stood out = 突出、印象深刻。"},
   {en:"I think we all learned something. Thanks, everyone. Same time next week?", ipa:"", zh:"我觉得大家都有收获。谢谢各位。下周同一时间？", tip:""}]}],
  drills:[["Here's the background in one minute: last week the province announced a new rent control proposal.","背景"],["Supporters say it will protect tenants. Critics say it will reduce new construction.","两边"],["Let's start simple: has this affected anyone here personally?","第一个问题"],["Mei, we haven't heard from you yet. What's your take?","拉人"],["That's a great point, David. Let me get a few other views before we come back to you.","控制"],["So, to sum up: most of us agree the problem is real, but we're split on the solution.","总结"]],
  ex:[
   {t:"mc",q:"主持人介绍新闻背景时应该？",opts:["只说事实，两边观点都介绍","先说自己的立场","只介绍支持的一方","越长越好"],a:0},
   {t:"listen",q:"听一听，主持人在做什么？",say:"Mei, we haven't heard from you yet. What's your take?",opts:["邀请安静的人发言","批评梅","结束讨论","换话题"],a:0},
   {t:"mc",q:"有人说得太多，主持人礼貌的做法是？",opts:["肯定他的观点，然后说先听听其他人的","叫他闭嘴","无视他","结束讨论"],a:0},
   {t:"listen",q:"听一听，总结说了什么？",say:"Most of us agree the problem is real, but we're split on the solution.",opts:["都同意问题存在，但解决办法有分歧","都不同意","都同意解决办法","没有人发言"],a:0},
   {t:"type",q:"翻译：你怎么看？（用 take）",a:"What's your take?",alt:["What's your take","What is your take?","What's your take on this?"]},
   {t:"type",q:"听写这句话。",say:"Let's keep it respectful.",a:"Let's keep it respectful.",alt:["Let's keep it respectful","let's keep it respectful"]}],
  hw:[["选新闻写背景","选一条本周的加拿大新闻，用英语写一分钟背景（事实 + 两边观点）和五个讨论问题。"],["演练","对着录音讲一遍背景和问题，计时，不超过两分钟。"],["主持讨论（必做）","组织 3 到 6 个人（语言交换、朋友、同事、家人）讨论 20 分钟，你主持。结束后写下：谁没发言、你怎么拉的；最有意思的一个分歧。"]]
},

{ id:"l13c1", lv:13, title:"报名上学：注册、分班与第一天", goal:"能为孩子注册公立学校、理解年级和分班制度、完成第一天的沟通。",
  intro:"加拿大公立学校<b>免费、按住址分校</b>。注册要带：<b>出生证明、移民文件、地址证明、疫苗记录</b>。年级叫法：JK/SK（幼儿园）、Grade 1 到 12；新移民孩子会先做<b>英语评估</b>（ESL / ELL）。本章教注册、问学校、第一天送孩子的英语，以及学校常用的词：<b>principal、homeroom、recess、pizza day</b>。",
  learn:[{h:"注册",p:"",items:[

   {h:"学校词汇",p:"",items:[

   {en:"indoor shoes, lunch bag, agenda, permission form", ipa:"", zh:"室内鞋、午餐袋、联络本、同意书", tip:"加拿大学校要备一双室内鞋。"}]},
   {h:"第一天",p:"",items:[
   {en:"Hi, I'm Mei's mom. It's her first day. Where should she line up?", ipa:"", zh:"你好，我是梅的妈妈。今天她第一天。她该在哪排队？", tip:"早上孩子在操场按班排队。"},

{ id:"l13c2", lv:13, title:"和老师沟通：家长会、邮件与问题", goal:"能参加家长会、读懂成绩单、给老师写邮件、反映孩子的问题（被欺负、跟不上、特殊需要）。",
  intro:"加拿大的老师<b>希望家长沟通</b>，但方式和中国不同：<b>不要求课外加作业</b>、<b>成绩单看的是进步不是排名</b>、<b>老师说 “doing well” 可能就是一般</b>。家长会只有 10 到 15 分钟，要<b>带着问题去</b>。本章教家长会怎么问、成绩单怎么读、怎么给老师写邮件、怎么反映问题——特别是<b>被欺负（bullying）</b>，学校必须处理。",
  learn:[{h:"家长会",p:"10 到 15 分钟，三个问题。",items:[
   {en:"How is she doing compared to where she should be for her grade?", ipa:"", zh:"和她这个年级应有的水平比，她怎么样？", tip:"这句能逼出真实评价。"},
   {en:"What's one thing we can do at home to support her?", ipa:"", zh:"我们在家能做的一件事是什么？", tip:""},
   {en:"Does she participate in class? Does she have friends?", ipa:"", zh:"她课上参与吗？有朋友吗？", tip:"社交和学习一样重要。"},
   {en:"She's doing well. — Could you be more specific? What are her strengths and weaknesses?", ipa:"", zh:"她表现不错。——能具体一点吗？她的强项和弱项是什么？", tip:"doing well 太笼统，追问。"},
   {en:"I'm concerned about her reading. Is she behind?", ipa:"", zh:"我担心她的阅读。她落后吗？", tip:"behind = 落后。"}]},
   {h:"成绩单与邮件",p:"",items:[
   {en:"Level 1 to 4, or letter grades A to D; E for excellent, G for good, S for satisfactory, N for needs improvement", ipa:"", zh:"1 到 4 级或 A 到 D；学习技能用 E 优秀、G 良好、S 满意、N 需改进", tip:"安省小学成绩单。Level 3 = 达标。"},
   {en:"Learning skills: responsibility, organization, independent work, collaboration, initiative, self-regulation", ipa:"", zh:"学习技能：责任心、组织、独立完成、合作、主动性、自我管理", tip:"加拿大老师很看重这六项。"},
   {en:"Dear Ms. Taylor, I'm Jun's father. I'd like to ask about his math homework.", ipa:"", zh:"Taylor 老师您好，我是俊的父亲。我想问一下他的数学作业。", tip:"邮件开头。老师 24 到 48 小时回。"},
   {en:"Could we set up a quick call or meeting this week?", ipa:"", zh:"我们能这周安排一个简短的电话或见面吗？", tip:"复杂的事别用邮件，约见面。"},
   {en:"Thank you for everything you do for the class.", ipa:"", zh:"感谢您为班级做的一切。", tip:"老师很吃这一套，真的。"}]},
   {h:"反映问题",p:"",items:[
   {en:"Jun told me another student has been pushing him at recess. This has happened three times.", ipa:"", zh:"俊告诉我有个同学课间一直推他。已经三次了。", tip:"具体：谁、什么、几次。"},
   {en:"I want to make sure this is addressed. What's the school's process for bullying?", ipa:"", zh:"我想确保这件事得到处理。学校处理欺凌的流程是什么？", tip:"bullying 读 BUL-ee-ing。学校有法定流程。"},
   {en:"If it continues, I'd like to speak with the principal.", ipa:"", zh:"如果继续，我想和校长谈。", tip:"老师解决不了找校长，再往上是 school board。"},
   {en:"I think he may need extra support. Can he be assessed?", ipa:"", zh:"我觉得他可能需要额外支持。能做评估吗？", tip:"学习困难可以申请 IEP（个别教育计划）。"},
   {en:"He's struggling with English. Is there ESL support available?", ipa:"", zh:"他英语很吃力。有 ESL 支持吗？", tip:"struggling with = 很吃力。"}]}],
  drills:[["How is she doing compared to where she should be for her grade?","家长会第一问"],["What's one thing we can do at home to support her?","第二问"],["Could you be more specific? What are her strengths and weaknesses?","追问"],["Dear Ms. Taylor, I'm Jun's father. Could we set up a quick call this week?","邮件"],["Jun told me another student has been pushing him at recess. This has happened three times.","反映欺凌"],["I want to make sure this is addressed. What's the school's process for bullying?","要求处理"]],
  ex:[
   {t:"mc",q:"老师说 “She's doing well.”，家长应该？",opts:["追问：Could you be more specific?","放心离开","要求加作业","问排名"],a:0},
   {t:"listen",q:"听一听，家长担心什么？",say:"I'm concerned about her reading. Is she behind?",opts:["阅读落后","数学落后","没朋友","迟到"],a:0},
   {t:"mc",q:"安省小学成绩单上 Level 3 表示？",opts:["达到年级标准","不及格","最高","需要改进"],a:0},

   {t:"type",q:"翻译：我们在家能做的一件事是什么？",a:"What's one thing we can do at home to support her?",alt:["What's one thing we can do at home to support her","What is one thing we can do at home to support her?","What's one thing we can do at home?"]},
   {t:"type",q:"听写这个词（“欺凌”）。",say:"bullying",a:"bullying"}],

{ id:"l13c3", lv:13, title:"儿科、疫苗与孩子的健康", goal:"能带孩子看儿科、描述孩子的症状、理解疫苗时间表、处理学校的健康要求。",
  intro:"孩子的看病和大人不同：<b>孩子说不清，你得替他描述</b>；<b>剂量按体重</b>；<b>疫苗有时间表</b>，学校会查。本章教描述孩子的症状（fussy、clingy、not eating）、听懂儿科医生的话、疫苗记录的词汇，以及学校的健康要求（sick policy、allergy plan）。记住 811 护士热线对孩子的问题特别有用——“我需要带他去急诊吗？”",
  learn:[{h:"描述孩子的症状",p:"",items:[
   {en:"He's had a fever of thirty-nine since last night. He's very fussy and won't eat.", ipa:"", zh:"他从昨晚起发烧 39 度。很闹，不肯吃。", tip:"fussy = 烦躁、爱哭闹。"},
   {en:"She's been pulling at her ear and crying.", ipa:"", zh:"她一直拽耳朵、哭。", tip:"典型的耳朵感染迹象。"},
   {en:"He has a rash on his tummy. It's not itchy, but it's spreading.", ipa:"", zh:"他肚子上有疹子。不痒，但在扩散。", tip:"tummy = 肚子（对孩子说）。"},
   {en:"She threw up twice and has diarrhea. I'm worried about dehydration.", ipa:"", zh:"她吐了两次，还拉肚子。我担心脱水。", tip:"dehydration 读 dee-hy-DRAY-shun。"},
   {en:"He's been very clingy and sleeping more than usual.", ipa:"", zh:"他特别粘人，睡得比平时多。", tip:"clingy = 粘人。"},

   {h:"听懂医生",p:"",items:[

   {en:"Give children's Tylenol or Advil for the fever. Check the dose by weight on the box.", ipa:"", zh:"发烧给儿童泰诺或 Advil。按盒子上的体重查剂量。", tip:""},

   {en:"He's at the fiftieth percentile for height and weight. Right on track.", ipa:"", zh:"他的身高体重在第 50 百分位。很正常。", tip:"percentile = 百分位。on track = 正常。"}]},
   {h:"疫苗与学校",p:"",items:[

   {en:"The school requires proof of immunization. Here's her yellow card.", ipa:"", zh:"学校要求疫苗证明。这是她的黄卡。", tip:"安省的疫苗记录叫 yellow card，也可以在网上报。"},

{ id:"l13c4", lv:13, title:"课外活动、玩伴与生日派对", goal:"能为孩子报名课外活动、安排 playdate、办或参加生日派对，和其他家长交朋友。",
  intro:"孩子的社交就是家长的社交。加拿大孩子的生活围绕<b>课外活动</b>（swimming、hockey、piano）、<b>playdate</b>（约玩）、<b>生日派对</b>。规矩：playdate 要家长之间约；生日派对<b>邀请全班或全部同性别</b>，礼物 20 到 30 元，回复 RSVP；接送时间要准。本章教报名的英语、约玩的消息、派对的全流程，以及<b>怎么和其他家长聊天</b>——操场边是交朋友最容易的地方。",
  learn:[{h:"课外活动",p:"",items:[
   {en:"I'd like to sign him up for swimming lessons. What level should he start at?", ipa:"", zh:"我想给他报游泳课。应该从哪个级别开始？", tip:"sign up for = 报名。市政府的课最便宜，开放报名秒光。"},
   {en:"Registration opens online at seven a.m. on the fifteenth.", ipa:"", zh:"15 号早上七点网上开放报名。", tip:"定闹钟。"},
   {en:"Is there a waitlist? Can I get a refund if she doesn't like it?", ipa:"", zh:"有等候名单吗？她不喜欢能退款吗？", tip:""},
   {en:"What does he need to bring? Does he need his own equipment?", ipa:"", zh:"他需要带什么？要自己的装备吗？", tip:"冰球装备很贵，可以买二手。"},
   {en:"Practice is Tuesdays at six. Games are Saturday mornings.", ipa:"", zh:"周二六点训练。周六早上比赛。", tip:""}]},
   {h:"约玩与家长聊天",p:"",items:[
   {en:"Hi, I'm Lily's mom. Our kids seem to get along. Would Emma like to come over for a playdate?", ipa:"", zh:"你好，我是莉莉的妈妈。孩子们好像玩得来。Emma 想来我们家玩吗？", tip:"get along = 合得来。"},
   {en:"Saturday from two to four works for us. Any allergies we should know about?", ipa:"", zh:"周六两点到四点我们可以。有什么过敏需要知道的吗？", tip:""},
   {en:"Feel free to stay or drop her off, whatever you prefer.", ipa:"", zh:"你可以留下也可以放下她就走，随你。", tip:"小的孩子家长常留下。"},
   {en:"They had a great time. Emma's welcome anytime.", ipa:"", zh:"他们玩得很开心。Emma 随时欢迎。", tip:""},
   {en:"Which grade is yours in? Do you live around here?", ipa:"", zh:"你家孩子几年级？你住这附近吗？", tip:"操场边的开场。"},
   {en:"Do you know a good dentist for kids around here?", ipa:"", zh:"你知道这附近有好的儿童牙医吗？", tip:"问推荐 = 最好的搭话方式。"}]},
   {h:"生日派对",p:"",items:[
   {en:"You're invited! Jun's 7th birthday, Saturday March 2, 2 to 4 p.m. at Fun Zone. Please RSVP by Feb 25.", ipa:"", zh:"邀请你！俊的七岁生日，3 月 2 日周六下午 2 到 4 点，在 Fun Zone。请 2 月 25 日前回复。", tip:"邀请卡的标准格式。"},
   {en:"Thanks for the invite! Emma would love to come. Does she need to bring anything?", ipa:"", zh:"谢谢邀请！Emma 很想来。她需要带什么吗？", tip:"回复 RSVP。"},
   {en:"Unfortunately we can't make it that day, but happy birthday to Jun!", ipa:"", zh:"很遗憾那天我们来不了，祝俊生日快乐！", tip:"不能去也要回复。"},
   {en:"Is it a drop-off party, or should parents stay?", ipa:"", zh:"是放下孩子就走的派对，还是家长留下？", tip:"drop-off = 不用家长陪。"},
   {en:"Thank you so much for coming! Here's a loot bag.", ipa:"", zh:"非常感谢你来！这是回礼袋。", tip:"loot bag = 派对结束发给每个孩子的小礼物袋。"}]}],
  drills:[["I'd like to sign him up for swimming lessons. What level should he start at?","报名"],["Is there a waitlist? What does he need to bring?","两个问题"],["Hi, I'm Lily's mom. Our kids seem to get along. Would Emma like to come over for a playdate?","约玩"],["Which grade is yours in? Do you know a good dentist for kids around here?","家长搭话"],["Thanks for the invite! Emma would love to come. Does she need to bring anything?","回复邀请"],["Is it a drop-off party, or should parents stay?","派对"]],
  ex:[
   {t:"mc",q:"“playdate” 是？",opts:["家长约好让孩子一起玩","约会","比赛日期","游戏日"],a:0},
   {t:"listen",q:"听一听，什么时候报名？",say:"Registration opens online at seven a.m. on the fifteenth.",opts:["15 号早上 7 点","7 号早上 15 点","15 号晚上 7 点","7 号"],a:0},
   {t:"mc",q:"收到生日邀请但去不了，应该？",opts:["回复说不能去并祝生日快乐","不回复","去一半","让孩子自己决定"],a:0},
   {t:"listen",q:"听一听，这是什么？",say:"Here's a loot bag.",opts:["派对回礼袋","午餐袋","垃圾袋","书包"],a:0},
   {t:"type",q:"翻译：孩子们好像玩得来。（用 get along）",a:"Our kids seem to get along.",alt:["Our kids seem to get along","The kids seem to get along.","Our kids get along."]},
   {t:"type",q:"听写这个词（“等候名单”）。",say:"waitlist",a:"waitlist"}],
  hw:[["报一个活动","上市政府的活动网站，用英语给孩子查一个课程：时间、费用、报名日期。"],["约一次玩","给孩子一个朋友的家长发英语消息约 playdate。"],["操场搭话","在学校门口或操场和一位家长聊三句（几年级、住附近吗、推荐一个什么）。"]]

{ id:"l13c5", lv:13, title:"管教、安全与法律：加拿大的育儿规则", goal:"了解加拿大关于管教、独处年龄、儿童保护的规则，能和孩子用英语谈规则和情绪，处理儿童保护机构的接触。",
  intro:"这章很重要，因为<b>中国的正常做法在加拿大可能违法</b>：打孩子可能被报告；<b>12 岁以下不能单独在家</b>（各省不同，安省是指导原则）；老师、医生有<b>法定义务</b>报告疑似虐待。本章讲清楚规则，教你和孩子<b>用加拿大学校的方式谈情绪和规矩</b>（time-out、consequences、use your words），以及万一<b>儿童保护机构（CAS）</b>联系你，该怎么说。",
  learn:[{h:"规则",p:"",items:[
   {en:"Physical punishment can be reported. Teachers and doctors are required by law to report suspected abuse.", ipa:"", zh:"体罚可能被举报。老师和医生依法必须报告疑似虐待。", tip:"required by law = 法律要求。"},
   {en:"Children under twelve should not be left home alone.", ipa:"", zh:"12 岁以下的孩子不应单独留在家。", tip:"各省规定不同，这是安省的常见标准。"},
   {en:"Kids must be in a car seat or booster until they're at least eight, or 36 kilograms.", ipa:"", zh:"孩子至少到八岁或 36 公斤前必须用安全座椅或增高垫。", tip:"booster seat = 增高垫。"},
   {en:"A helmet is required for biking, and lifejackets for boats.", ipa:"", zh:"骑车必须戴头盔，坐船必须穿救生衣。", tip:""},
   {en:"Screen time, bedtime, and chores are up to each family.", ipa:"", zh:"屏幕时间、睡觉时间和家务由各家自己定。", tip:"up to = 由……决定。"}]},
   {h:"和孩子谈规矩和情绪",p:"加拿大学校的用语，在家用同一套孩子更容易接受。",items:[
   {en:"Use your words. Tell me what you're feeling.", ipa:"", zh:"用语言说。告诉我你的感受。", tip:"学校老师最常说的一句。"},
   {en:"I can see you're frustrated. It's okay to be angry; it's not okay to hit.", ipa:"", zh:"我看得出你很沮丧。生气可以，打人不行。", tip:"先认可情绪，再说规则。"},
   {en:"That's a consequence: no tablet tonight.", ipa:"", zh:"这是后果：今晚没有平板。", tip:"consequence = 后果，代替惩罚。"},
   {en:"Take a few minutes to calm down, then we'll talk.", ipa:"", zh:"花几分钟冷静一下，然后我们谈。", tip:"time-out 的温和版。"},
   {en:"I'm proud of you for telling the truth.", ipa:"", zh:"你说了实话，我为你骄傲。", tip:"夸具体行为。"},
   {en:"In our family, we speak Chinese at home. It's part of who you are.", ipa:"", zh:"在我们家，我们在家说中文。这是你的一部分。", tip:"保留母语是正常的，老师也会支持。"}]},
   {h:"如果儿童保护机构联系你",p:"保持冷静，合作，有权找律师。",items:[
   {en:"I'm happy to answer your questions. May I ask what this is about?", ipa:"", zh:"我很乐意回答您的问题。能问一下是关于什么的吗？", tip:"冷静、合作。"},
   {en:"I'd like to have an interpreter present.", ipa:"", zh:"我希望有翻译在场。", tip:"你有权要翻译。"},
   {en:"I'd like to speak to a lawyer before I sign anything.", ipa:"", zh:"签任何东西之前我想和律师谈。", tip:"免费法律援助：Legal Aid。"},
   {en:"We discipline with consequences, not physical punishment.", ipa:"", zh:"我们用后果来管教，不体罚。", tip:"discipline 读 DIS-i-plin。"}]}],
  drills:[["Teachers and doctors are required by law to report suspected abuse.","法律"],["Children under twelve should not be left home alone.","独处"],["Use your words. Tell me what you're feeling.","和孩子说"],["It's okay to be angry; it's not okay to hit.","情绪 + 规则"],["Take a few minutes to calm down, then we'll talk.","冷静"],["I'd like to have an interpreter present. I'd like to speak to a lawyer before I sign anything.","权利"]],
  ex:[
   {t:"mc",q:"在加拿大，老师发现孩子身上有伤会？",opts:["依法必须报告","告诉家长就行","不管","扣分"],a:0},
   {t:"listen",q:"听一听，家长在说什么？",say:"It's okay to be angry. It's not okay to hit.",opts:["生气可以，打人不行","不可以生气","打人可以","什么都可以"],a:0},
   {t:"mc",q:"“consequence” 作为管教方式是指？",opts:["行为的后果（如没收平板）","体罚","骂","奖励"],a:0},
   {t:"listen",q:"听一听，这是什么要求？",say:"I'd like to have an interpreter present.",opts:["希望有翻译在场","希望有礼物","希望有律师","希望现在谈"],a:0},
   {t:"type",q:"翻译：用语言说。（学校用语）",a:"Use your words.",alt:["Use your words","use your words"]},
   {t:"type",q:"听写这个词（“头盔”）。",say:"helmet",a:"helmet"}],
  hw:[["查你省的规定","查你所在省关于独处年龄、安全座椅的规定，用英语写下来。"],["一周换说法","一周内用本章的句子代替打骂：Use your words / That's a consequence。记下孩子的反应。"],["家庭规则","和孩子一起用英语写五条家庭规则（Family Rules），贴在冰箱上。"]]
},
{ id:"l13c6", lv:13, title:"第十三级结业：青春期、升学与一次家庭会议", goal:"能和青少年谈敏感话题，了解高中选课和升学路径，并主持一次全英语的家庭会议。",
  intro:"孩子大了，话题变了：<b>高中选课</b>（academic vs applied、credits、co-op）、<b>升学</b>（university vs college——在加拿大 college 不是“大学”）、<b>青春期话题</b>（朋友、手机、恋爱、心理健康）。移民家庭特有的张力：<b>孩子英语比你好，中文比你差</b>。本章的结业任务是<b>一次家庭会议</b>——用英语（孩子的强项语言）谈一件家里的事，让孩子看到你在努力。",
  learn:[{h:"高中与升学",p:"",items:[
   {en:"Students need thirty credits, forty volunteer hours, and the literacy test to graduate.", ipa:"", zh:"学生需要 30 个学分、40 小时义工和读写测试才能毕业。", tip:"安省高中毕业要求。credits = 学分。"},
   {en:"Grade 9 courses are academic or applied. Academic leads to university.", ipa:"", zh:"九年级课程分学术和应用。学术类通向大学。", tip:"选课时问清楚。"},
   {en:"In Canada, college means practical programs; university means degrees.", ipa:"", zh:"在加拿大，college 是实用课程；university 是学位。", tip:"college 两年，university 四年。都好，看目标。"},
   {en:"Co-op lets students earn credits while working.", ipa:"", zh:"合作教育让学生边工作边拿学分。", tip:"co-op 读 CO-op。"},
   {en:"What are her options after Grade 12? Can we meet with the guidance counsellor?", ipa:"", zh:"她 12 年级后有什么选择？我们能见升学顾问吗？", tip:"guidance counsellor = 升学辅导老师，免费。"},
   {en:"OSAP can help with tuition. Let's look at the application together.", ipa:"", zh:"OSAP 能帮付学费。我们一起看申请。", tip:"OSAP = 安省学生资助。"}]},
   {h:"和青少年谈",p:"少问“为什么”，多问“怎么样”。",items:[
   {en:"I'm not here to judge. I just want to understand.", ipa:"", zh:"我不是来评判的。我只是想理解。", tip:"开场。"},
   {en:"How are things with your friends? Anyone giving you a hard time?", ipa:"", zh:"和朋友们怎么样？有人让你不好过吗？", tip:"giving you a hard time = 为难你。"},
   {en:"Let's agree on phone rules together. What do you think is fair?", ipa:"", zh:"我们一起定手机规则。你觉得什么是公平的？", tip:"一起定，孩子才遵守。"},
   {en:"You can always come to me, even if you think I'll be upset.", ipa:"", zh:"你随时可以来找我，即使你觉得我会生气。", tip:""},
   {en:"I know my English isn't perfect. Thanks for being patient with me.", ipa:"", zh:"我知道我的英语不完美。谢谢你对我有耐心。", tip:"孩子会因此尊重你。"},
   {en:"Can you help me with this form? And can I help you with your Chinese homework?", ipa:"", zh:"你能帮我填这个表吗？我能帮你做中文作业吗？", tip:"互相帮助，不是单向的。"}]},
   {h:"家庭会议",p:"",items:[
   {en:"Let's have a family meeting on Sunday. Everyone gets to bring one topic.", ipa:"", zh:"周日我们开个家庭会议。每个人可以带一个话题。", tip:""},
   {en:"First, what went well this week? Then, what do we need to fix?", ipa:"", zh:"首先，这周什么做得好？然后，什么需要改？", tip:"先好的，再问题。"},
   {en:"Let's hear everyone before we decide.", ipa:"", zh:"决定前先听每个人的。", tip:""},
   {en:"Okay, so we agreed: screens off at nine, and Saturday is family day. Deal?", ipa:"", zh:"好，我们同意了：九点关屏幕，周六是家庭日。说定了？", tip:"Deal? = 成交吗？"}]}],
  drills:[["In Canada, college means practical programs; university means degrees.","college vs university"],["What are her options after Grade 12? Can we meet with the guidance counsellor?","升学"],["I'm not here to judge. I just want to understand.","开场"],["Let's agree on phone rules together. What do you think is fair?","一起定规则"],["I know my English isn't perfect. Thanks for being patient with me.","坦诚"],["First, what went well this week? Then, what do we need to fix? Deal?","家庭会议"]],
  ex:[
   {t:"mc",q:"在加拿大，“college” 和 “university” 的区别是？",opts:["college 是实用课程，university 授学位","一样的","college 更高级","college 是高中"],a:0},
   {t:"listen",q:"听一听，家长问的是？",say:"Anyone giving you a hard time?",opts:["有人为难你吗","有人给你时间吗","你有困难的作业吗","你很忙吗"],a:0},
   {t:"mc",q:"和青少年定手机规则，最有效的方式是？",opts:["一起定，问他觉得什么公平","直接没收","不管","让老师定"],a:0},
   {t:"listen",q:"听一听，毕业需要什么？",say:"Students need forty volunteer hours to graduate.",opts:["40 小时义工","40 个学分","4 年","40 门课"],a:0},
   {t:"type",q:"翻译：你随时可以来找我。",a:"You can always come to me.",alt:["You can always come to me","you can always come to me","You can always talk to me."]},
   {t:"type",q:"听写这个词（“学分”，复数）。",say:"credits",a:"credits"}],
  hw:[["查升学路径","用英语写下孩子（或假设的孩子）从现在到大学/college 的路径：年级、选课、毕业要求、申请时间。"],["一次坦诚对话","对孩子用英语说一次 I know my English isn't perfect. Thanks for being patient with me. 看看会发生什么。"],["家庭会议（必做）","主持一次全英语的家庭会议（孩子可以帮忙），每人一个话题，达成至少一个 Deal。写下决定。"]]

{ id:"l14c1", lv:14, title:"租房：找房、看房与申请", goal:"能看懂租房广告、安排看房、提问、填申请并理解押金和首末月租。",
  intro:"第二级学了租房的几句话，这一级学<b>全流程</b>。租房广告有自己的语言：<b>1BR+den</b>、<b>utilities extra</b>、<b>first and last</b>（首末月租金，安省合法的“押金”）、<b>no pets</b>。看房要问的问题比你想的多：<b>谁付暖气、有没有洗衣机、停车要不要钱、上一个租客为什么走</b>。申请要准备：<b>工作证明、信用报告、推荐人</b>——新移民没信用记录，有办法。",
  learn:[{h:"读广告",p:"",items:[
   {en:"2BR, 1 bath, 850 sq ft, 10th floor, $2,400/month, utilities extra, parking $150, no pets, available June 1.", ipa:"", zh:"两室一卫，850 平方英尺，10 楼，每月 2400，水电另算，停车 150，不许宠物，6 月 1 日可入住。", tip:"sq ft = 平方英尺（1 平米 ≈ 10.8 平方英尺）。"},
   {en:"den, ensuite, in-unit laundry, hardwood, walk-out basement", ipa:"", zh:"小书房、主卧卫生间、室内洗衣机、木地板、带独立出口的地下室", tip:"basement apartment 便宜但采光差。"},
   {en:"First and last month's rent required. Credit check and references required.", ipa:"", zh:"需要首末月租金。需要信用检查和推荐人。", tip:"安省不允许额外押金，只能收 last month 作为押金。"},
   {en:"Rent includes heat and water. Hydro is separate.", ipa:"", zh:"租金含暖气和水。电费另算。", tip:""}]},
   {h:"看房提问",p:"",items:[
   {en:"I saw your listing online. Is the unit still available? Could I view it this week?", ipa:"", zh:"我在网上看到你的房源。还有吗？这周能看房吗？", tip:"listing = 房源广告；view = 看房。"},
   {en:"What's included in the rent? Who pays for heat?", ipa:"", zh:"租金包含什么？暖气谁付？", tip:"冬天暖气费可能很高。"},
   {en:"Is there laundry in the unit or in the building?", ipa:"", zh:"洗衣机在房间里还是楼里？", tip:"楼里的要投币。"},
   {en:"How old is the building? Have there been any issues with bugs or noise?", ipa:"", zh:"楼龄多少？有过虫子或噪音问题吗？", tip:"bugs 指蟑螂、臭虫。"},
   {en:"Why is the previous tenant leaving?", ipa:"", zh:"上一个租客为什么走？", tip:"值得问。"},
   {en:"Is the rent going up next year? What's the lease term?", ipa:"", zh:"明年涨租吗？租期多长？", tip:"安省有涨租上限（2018 年后的楼除外）。"}]},
   {h:"申请",p:"",items:[
   {en:"I'd like to apply. I can provide a letter of employment, pay stubs, and references.", ipa:"", zh:"我想申请。我可以提供工作证明信、工资单和推荐人。", tip:"pay stubs = 工资单。"},
   {en:"I'm new to Canada and don't have a credit history yet, but I can offer extra months upfront or a guarantor.", ipa:"", zh:"我刚来加拿大还没有信用记录，但可以多付几个月或提供担保人。", tip:"guarantor = 担保人。房东不能要求超过首末月，但你可以主动提。"},
   {en:"Here's my previous landlord's contact as a reference.", ipa:"", zh:"这是我上一个房东的联系方式作为推荐。", tip:""},
   {en:"When can I expect to hear back?", ipa:"", zh:"我什么时候能收到回复？", tip:""},
   {en:"I'd like to review the lease before signing. Is this the standard Ontario lease?", ipa:"", zh:"签之前我想看一下租约。这是安省标准租约吗？", tip:"安省必须用政府的 Standard Lease。"}]}],
  drills:[["two bedroom, one bath, utilities extra, no pets, available June first","读广告"],["First and last month's rent required.","首末月"],["Is the unit still available? Could I view it this week?","约看房"],["What's included in the rent? Who pays for heat?","必问"],["Why is the previous tenant leaving? What's the lease term?","两个好问题"],["I'm new to Canada and don't have a credit history yet, but I can offer a guarantor.","没信用记录"]],
  ex:[
   {t:"mc",q:"“first and last” 在租房里指？",opts:["首月和末月租金，末月作为押金","第一个和最后一个租客","首尾两个月免租","第一和最后一次看房"],a:0},
   {t:"listen",q:"听一听，什么包含、什么不包含？",say:"Rent includes heat and water. Hydro is separate.",opts:["含暖气和水，电另算","含电，暖气另算","全包","全不包"],a:0},
   {t:"mc",q:"“in-unit laundry” 意思是？",opts:["房间里有洗衣机","楼里有洗衣房","附近有洗衣店","没有洗衣机"],a:0},
   {t:"listen",q:"听一听，他问的是？",say:"Why is the previous tenant leaving?",opts:["上一个租客为什么走","上一个租客是谁","租客什么时候走","租客留下了什么"],a:0},
   {t:"type",q:"翻译：暖气谁付？",a:"Who pays for heat?",alt:["Who pays for heat","who pays for heat","Who pays for the heat?"]},
   {t:"type",q:"听写这个词（“担保人”）。",say:"guarantor",a:"guarantor"}],
  hw:[["读五条广告","在租房网站读五条广告，把每条的缩写和条件用英语完整说出来。"],["看房清单","写一张英语看房问题清单（至少八个问题），打印带着。"],["约一次看房","给一个房源发英语消息约看房（哪怕只是练习），去看，问至少五个问题。"]]
},
{ id:"l14c2", lv:14, title:"租客的权利：租约、维修、涨租与房东纠纷", goal:"理解安省（及各省类似）租客的基本权利，能要求维修、拒绝不合理涨租、处理纠纷并向租务委员会求助。",
  intro:"加拿大<b>租客的保护很强</b>，但你得知道才能用：房东<b>不能</b>随便涨租（有年度上限和 90 天通知）、<b>不能</b>随便进你的房间（24 小时书面通知）、<b>不能</b>因为你投诉而赶你走、<b>必须</b>做维修。出了纠纷找<b>租务委员会</b>（安省叫 LTB）。本章教你<b>用英语说出你的权利</b>——很多房东欺负的就是不会说的新移民。",
  learn:[{h:"基本权利",p:"",items:[
   {en:"The landlord must give twenty-four hours' written notice before entering, except in an emergency.", ipa:"", zh:"除紧急情况外，房东进入前必须提前 24 小时书面通知。", tip:""},
   {en:"Rent can only be increased once every twelve months, with ninety days' notice, within the guideline.", ipa:"", zh:"租金每 12 个月只能涨一次，提前 90 天通知，不超过指导线。", tip:"guideline = 政府每年公布的涨租上限。"},
   {en:"The landlord is responsible for repairs and maintenance.", ipa:"", zh:"房东负责维修和保养。", tip:"maintenance 读 MAIN-ten-ance。"},
   {en:"You can't be evicted without an order from the Landlord and Tenant Board.", ipa:"", zh:"没有租务委员会的命令，你不能被驱逐。", tip:"evicted = 被赶走。房东口头赶人无效。"},
   {en:"A landlord can't refuse you because of your race, religion, family status, or source of income.", ipa:"", zh:"房东不能因为种族、宗教、家庭状况或收入来源拒绝你。", tip:"这是人权法。"}]},
   {h:"要求维修",p:"书面 + 日期 + 期限。",items:[
   {en:"I'm writing to request a repair. The kitchen faucet has been leaking since March 3.", ipa:"", zh:"我写信要求维修。厨房水龙头从 3 月 3 日起一直漏水。", tip:"永远用书面（短信、邮件也算），留记录。"},
   {en:"I've reported this twice by phone. Please fix it within seven days.", ipa:"", zh:"我已经电话报过两次。请在七天内修好。", tip:"给期限。"},
   {en:"There's no heat and it's minus ten outside. This is urgent.", ipa:"", zh:"没有暖气，外面零下十度。这很紧急。", tip:"冬天没暖气可以打市政府投诉。"},
   {en:"If this isn't fixed, I'll file a maintenance application with the LTB.", ipa:"", zh:"如果不修，我会向租务委员会提交维修申请。", tip:"file an application = 提交申请。"}]},
   {h:"处理纠纷",p:"",items:[
   {en:"This increase is above the guideline. I don't have to pay it.", ipa:"", zh:"这个涨幅超过指导线。我不用付。", tip:"2018 年 11 月后首次入住的楼不受指导线限制，要查。"},
   {en:"You can't enter without notice. Please put future requests in writing.", ipa:"", zh:"你不能不通知就进来。以后请书面通知。", tip:"冷静但坚定。"},
   {en:"I'm not moving out. If you want me to leave, you'll need to go through the LTB.", ipa:"", zh:"我不会搬走。如果你要我走，需要通过租务委员会。", tip:""},
   {en:"I'd like to speak to a tenant advocate. Is there free legal help?", ipa:"", zh:"我想找租客权益顾问。有免费法律帮助吗？", tip:"社区法律诊所（community legal clinic）免费。"},
   {en:"I'm giving sixty days' notice. My last day will be August 31.", ipa:"", zh:"我提前 60 天通知。最后一天是 8 月 31 日。", tip:"你要搬走要提前 60 天书面通知，要和月底对齐。"}]}],
  drills:[["The landlord must give twenty-four hours' written notice before entering.","进入"],["Rent can only be increased once every twelve months, with ninety days' notice.","涨租"],["I'm writing to request a repair. The kitchen faucet has been leaking since March 3.","书面报修"],["There's no heat and it's minus ten outside. This is urgent.","紧急"],["You can't enter without notice. Please put future requests in writing.","坚定"],["I'm giving sixty days' notice. My last day will be August 31.","搬走通知"]],
  ex:[
   {t:"mc",q:"房东想进你的房间，必须？",opts:["提前 24 小时书面通知（紧急除外）","随时可以进","提前 1 小时打电话","不需要通知"],a:0},
   {t:"listen",q:"听一听，租客在做什么？",say:"I've reported this twice by phone. Please fix it within seven days.",opts:["要求七天内修好","付房租","搬走","涨租"],a:0},
   {t:"mc",q:"房东口头说“下个月你必须搬走”，你？",opts:["不用搬，没有 LTB 命令不能驱逐","必须搬","交罚款","报警"],a:0},
   {t:"listen",q:"听一听，这是什么权利？",say:"The landlord is responsible for repairs and maintenance.",opts:["房东负责维修","租客负责维修","各付一半","不用维修"],a:0},
   {t:"type",q:"翻译：以后请书面通知。（用 in writing）",a:"Please put future requests in writing.",alt:["Please put future requests in writing","Please put it in writing.","Please put future requests in writing, please"]},
   {t:"type",q:"听写这个词（“驱逐”，过去分词）。",say:"evicted",a:"evicted"}],
  hw:[["查你的省","上你所在省租务委员会的网站，用英语写下今年的涨租指导线和进入通知规定。"],["写一封报修信","就一个真实（或假设）的维修问题，按本章格式写一封英语报修信。"],["存好资源","找出你所在城市的免费社区法律诊所电话，用英语说出它能帮你做什么。"]]
},
{ id:"l14c3", lv:14, title:"买房：贷款预批、看房与出价", goal:"理解加拿大买房流程，能和房贷专员、地产经纪沟通，看懂房源信息，出价和谈判。",
  intro:"买房是最大的一笔钱，英语的每个词都值钱。流程：<b>贷款预批</b>（pre-approval）→ 找经纪 → 看房 → <b>出价</b>（offer，可能有竞价）→ <b>验房</b> → 成交。词汇：<b>down payment</b>（首付，最低 5%）、<b>mortgage</b>（房贷）、<b>fixed vs variable</b>（固定 vs 浮动利率）、<b>closing costs</b>（成交费用，房价的 2 到 4%）、<b>land transfer tax</b>（土地转让税）。本章教和贷款专员、经纪的核心对话。",
  learn:[{h:"贷款",p:"",items:[
   {en:"I'd like to get pre-approved for a mortgage. What documents do you need?", ipa:"", zh:"我想做房贷预批。你需要什么文件？", tip:"pre-approved = 预批。先预批再看房。"},
   {en:"With a twenty percent down payment, you avoid mortgage insurance.", ipa:"", zh:"首付 20% 可以免房贷保险。", tip:"低于 20% 要买 CMHC 保险。"},
   {en:"Would you recommend fixed or variable? What's the rate and the term?", ipa:"", zh:"你推荐固定还是浮动？利率和期限是多少？", tip:"term = 合同期（通常 5 年）；amortization = 总还款期（25 年）。"},
   {en:"What's the penalty if I break the mortgage early?", ipa:"", zh:"提前解约的罚金是多少？", tip:"固定利率的罚金可能很高，一定问。"},
   {en:"How much house can I afford with my income?", ipa:"", zh:"以我的收入能买多少钱的房？", tip:"afford = 负担得起。"},
   {en:"Are there programs for first-time home buyers?", ipa:"", zh:"有首次购房者的项目吗？", tip:"有：首次购房者退税、RRSP 买房计划、FHSA 账户。"}]},
   {h:"经纪与看房",p:"",items:[
   {en:"I'm looking for a three-bedroom in a good school district, under nine hundred thousand.", ipa:"", zh:"我在找好学区的三居室，90 万以下。", tip:"school district = 学区。"},
   {en:"detached, semi-detached, townhouse, condo; freehold vs condo fees", ipa:"", zh:"独立屋、半独立、联排、公寓；永久产权 vs 物业费", tip:"condo fees 每月几百，要算进预算。"},
   {en:"How long has it been on the market? Why are they selling?", ipa:"", zh:"挂牌多久了？为什么卖？", tip:"on the market = 在售。挂久了可以压价。"},
   {en:"What are the property taxes? Any issues with the roof or the basement?", ipa:"", zh:"地税多少？屋顶或地下室有问题吗？", tip:"屋顶和地下室漏水是最贵的问题。"},
   {en:"Can we see the status certificate before offering?", ipa:"", zh:"出价前能看一下物业状况证明吗？", tip:"买 condo 必看：物业的财务、诉讼、特别收费。"}]},
   {h:"出价",p:"",items:[
   {en:"We'd like to put in an offer at eight seventy-five, conditional on financing and inspection.", ipa:"", zh:"我们想出价 87 万 5，以贷款和验房为条件。", tip:"conditional on = 以……为条件。竞价时卖家喜欢无条件，但风险你担。"},
   {en:"There are three other offers. The seller is asking for your best and final.", ipa:"", zh:"还有三个出价。卖家要你的最高最终价。", tip:"best and final = 最后一轮出价。"},
   {en:"We're not comfortable going above nine hundred. We'll walk away if needed.", ipa:"", zh:"我们不愿超过 90 万。需要的话我们放弃。", tip:"walk away = 放弃。敢放弃才不会买贵。"},
   {en:"The inspection found a problem with the furnace. We'd like to renegotiate or have it repaired before closing.", ipa:"", zh:"验房发现暖炉有问题。我们想重新谈价或在成交前修好。", tip:"furnace = 暖炉。"},
   {en:"What are the closing costs? Lawyer, land transfer tax, title insurance?", ipa:"", zh:"成交费用有哪些？律师、土地转让税、产权保险？", tip:"多伦多有市和省两层土地转让税。"}]}],
  drills:[["I'd like to get pre-approved for a mortgage. What documents do you need?","预批"],["Would you recommend fixed or variable? What's the penalty if I break the mortgage early?","利率 + 罚金"],["detached, semi-detached, townhouse, condo","四种房"],["How long has it been on the market? Why are they selling?","压价问题"],["We'd like to put in an offer at eight seventy-five, conditional on financing and inspection.","出价"],["We're not comfortable going above nine hundred. We'll walk away if needed.","底线"]],
  ex:[
   {t:"mc",q:"“down payment” 是？",opts:["首付","月供","定金","地税"],a:0},
   {t:"listen",q:"听一听，出价多少、什么条件？",say:"We'd like to offer seven fifty, conditional on inspection.",opts:["75 万，以验房为条件","57 万，无条件","75 万，以贷款为条件","七百五十元"],a:0},
   {t:"mc",q:"“best and final” 是指？",opts:["最后一轮出最高价","最好的房子","最终成交价","最佳经纪"],a:0},
   {t:"listen",q:"听一听，验房发现什么？",say:"The inspection found a problem with the furnace.",opts:["暖炉有问题","屋顶漏水","地下室潮湿","没问题"],a:0},
   {t:"type",q:"翻译：挂牌多久了？",a:"How long has it been on the market?",alt:["How long has it been on the market","How long has it been listed?","How long has this been on the market?"]},
   {t:"type",q:"听写这个词（“房贷”）。",say:"mortgage",a:"mortgage"}],
  hw:[["算一笔账","用网上的房贷计算器，用英语说出：房价、首付、利率、月供、土地转让税。"],["读三个房源","在 Realtor.ca 读三个房源，用英语说出每个的类型、价格、地税、挂牌天数。"],["打给银行","打给一家银行或房贷经纪，问预批需要什么文件、现在的利率。全程英语。"]]
},
{ id:"l14c4", lv:14, title:"搬家与安家：搬运、开通服务与邻居", goal:"能安排搬家公司、转地址、开通水电网、认识邻居、处理公寓楼的规矩。",
  intro:"搬家是一连串的电话和表格：<b>搬家公司</b>报价、<b>转地址</b>（邮局、银行、政府）、<b>开通服务</b>（hydro、gas、internet）、<b>公寓楼</b>的规矩（预约电梯、搬家押金）。然后是<b>邻居</b>：加拿大人搬进去会主动打招呼，这是建立关系的最好时机。本章把这些电话和对话一次学完。",
  learn:[{h:"搬家公司",p:"",items:[
   {en:"I'd like a quote for a move on June 28, from a two-bedroom apartment to a house about twenty kilometres away.", ipa:"", zh:"我想要 6 月 28 日搬家的报价，从两居室公寓到约 20 公里外的房子。", tip:"quote = 报价。要三家比较。"},
   {en:"Is that an hourly rate or a flat rate? Does it include packing and insurance?", ipa:"", zh:"是按小时还是固定价？包含打包和保险吗？", tip:"flat rate = 一口价。"},
   {en:"There's an elevator, but it needs to be booked. Do you have stairs charges?", ipa:"", zh:"有电梯，但需要预约。你们有楼梯费吗？", tip:""},

   {h:"转地址与开通服务",p:"",items:[

   {en:"I'm moving on the first. Can you transfer my hydro account to the new address?", ipa:"", zh:"我 1 号搬。能把我的电费账户转到新地址吗？", tip:"水电网提前两周办。"},

{ id:"l15c1", lv:15, title:"报税入门：T4、RRSP 与怎么报", goal:"理解加拿大报税的基本概念和时间，看懂 T4 等税表，知道自己报还是找人报，并能和 CRA 沟通。",
  intro:"在加拿大，<b>每个人每年都要报税</b>（file a tax return），即使没收入——因为很多福利（牛奶金、GST 退税）靠报税才能拿到。截止日 <b>4 月 30 日</b>。核心词：<b>T4</b>（雇主给的收入单）、<b>RRSP</b>（退休储蓄，可抵税）、<b>TFSA</b>（免税账户）、<b>refund</b>（退税）、<b>balance owing</b>（欠税）。本章教你看懂这些、选择报税方式、和 CRA 打电话。",
  learn:[{h:"基本概念",p:"",items:[
   {en:"Everyone should file a tax return every year, even with no income, to get benefits.", ipa:"", zh:"每个人每年都应报税，即使没收入，才能拿福利。", tip:"file a return = 报税。"},
   {en:"The deadline is April thirtieth. Self-employed people have until June fifteenth.", ipa:"", zh:"截止日是 4 月 30 日。自雇人士到 6 月 15 日。", tip:"但欠税还是 4 月 30 日前要付。"},
   {en:"Your T4 shows your employment income and the tax already deducted.", ipa:"", zh:"T4 显示你的工作收入和已扣的税。", tip:"雇主 2 月底前给。"},
   {en:"RRSP contributions reduce your taxable income. TFSA growth is tax-free.", ipa:"", zh:"RRSP 供款减少应税收入。TFSA 的增值免税。", tip:"contributions = 供款。"},
   {en:"If you overpaid, you get a refund. If you underpaid, you have a balance owing.", ipa:"", zh:"多付了就退税。少付了就有欠税。", tip:"balance owing = 欠的税。"},
   {en:"Keep your receipts for medical expenses, child care, and donations.", ipa:"", zh:"保留医疗费、托儿费和捐款的收据。", tip:"这些都可以抵税。"}]},
   {h:"怎么报",p:"",items:[
   {en:"You can file online with certified software, or go to a free tax clinic if your income is modest.", ipa:"", zh:"你可以用认证软件网上报，或者收入不高的话去免费报税点。", tip:"modest = 不高。社区中心有免费 tax clinics。"},
   {en:"Register for a CRA My Account to see your tax slips and notices.", ipa:"", zh:"注册 CRA 我的账户，可以看税单和通知。", tip:""},
   {en:"I'd like to have my taxes done. Here are my T4s, my RRSP receipt, and my rent receipts.", ipa:"", zh:"我想请人报税。这是我的 T4、RRSP 收据和租金收据。", tip:"找会计师 50 到 150 元。"},
   {en:"Can I claim my moving expenses? I moved for work.", ipa:"", zh:"我能申报搬家费吗？我是为了工作搬的。", tip:"claim = 申报（抵扣）。搬家 40 公里以上为工作可以。"},
   {en:"You'll receive a Notice of Assessment within two weeks.", ipa:"", zh:"你会在两周内收到评税通知。", tip:"NOA = 官方确认，很多地方要用。"}]},
   {h:"和 CRA 沟通",p:"",items:[
   {en:"I'm calling about my tax return. My social insurance number is…", ipa:"", zh:"我打电话是关于我的报税。我的社会保险号是……", tip:"CRA 会问生日、地址、上年收入来核实身份。"},
   {en:"I received a letter asking for documents. What exactly do you need?", ipa:"", zh:"我收到一封信要求提供文件。具体需要什么？", tip:"CRA 复查很常见，不是出事了。"},
   {en:"I made a mistake on my return. How do I make a change?", ipa:"", zh:"我报税时出了错。怎么修改？", tip:"可以在网上 Change my return。"},
   {en:"Can I set up a payment plan for the balance owing?", ipa:"", zh:"欠税能分期付吗？", tip:"可以，打电话申请。"},
   {en:"The CRA never asks for payment by gift card or e-Transfer. That's a scam.", ipa:"", zh:"CRA 从不要求用礼品卡或 e-Transfer 付款。那是骗局。", tip:"骗子最爱冒充 CRA。"}]}],
  drills:[["Everyone should file a tax return every year, even with no income, to get benefits.","为什么报税"],["The deadline is April thirtieth.","截止日"],["Your T4 shows your employment income and the tax already deducted.","T4"],["If you overpaid, you get a refund. If you underpaid, you have a balance owing.","退税 / 欠税"],["I'd like to have my taxes done. Here are my T4s and my RRSP receipt.","找人报"],["The CRA never asks for payment by gift card. That's a scam.","防骗"]],

   {t:"type",q:"翻译：欠税能分期付吗？（用 payment plan）",a:"Can I set up a payment plan for the balance owing?",alt:["Can I set up a payment plan for the balance owing","Can I set up a payment plan?","Can I set up a payment plan for the balance?"]},

{ id:"l15c2", lv:15, title:"福利与补贴：牛奶金、GST 退税与申请", goal:"了解新移民家庭可以申请的主要联邦和省福利，能填申请、理解通知、处理问题。",
  intro:"加拿大的福利<b>不会自动给你，要申请</b>，而且大多<b>靠报税</b>来算。主要的：<b>Canada Child Benefit（牛奶金）</b>、<b>GST/HST credit</b>（消费税退税）、<b>Ontario Trillium Benefit</b>（安省三合一福利）、<b>EI</b>（失业保险）、<b>CPP / OAS</b>（退休金）。还有低收入的<b>托儿补贴</b>、<b>租房补贴</b>。本章教每个福利的名字、条件和申请的句子。",
  learn:[{h:"家庭福利",p:"",items:[

{ id:"l15c3", lv:15, title:"Service Canada 与 ServiceOntario：证件与登记", goal:"能办理 SIN 卡、健康卡、驾照、车牌、出生登记等政府证件，看懂要求，处理排队和预约。",
  intro:"政府服务分两家：<b>Service Canada</b>（联邦：SIN、EI、护照、养老金）和 <b>ServiceOntario</b>（省：健康卡、驾照、车牌、出生证明、地址更改）。规矩：<b>带对文件</b>（网上查清单）、<b>原件不要复印件</b>、<b>很多可以网上办</b>。排队可能一两个小时，有的要预约。本章教每种办理的对话和常见问题。",
  learn:[{h:"Service Canada",p:"",items:[
   {en:"I'd like to apply for a Social Insurance Number. Here's my permanent resident card.", ipa:"", zh:"我想申请社会保险号。这是我的永久居民卡。", tip:"SIN 是工作和报税必需。当场给。"},
   {en:"Never share your SIN unless it's for work, taxes, or banking.", ipa:"", zh:"除了工作、报税和银行，不要把 SIN 给任何人。", tip:"SIN 泄露 = 身份被盗。"},
   {en:"I'd like to renew my passport. Do I need a guarantor?", ipa:"", zh:"我想续护照。需要担保人吗？", tip:"加拿大护照需要认识两年以上的担保人。"},
   {en:"I'd like to apply for CPP retirement. I'm turning sixty-five in June.", ipa:"", zh:"我想申请 CPP 退休金。我 6 月满 65。", tip:"提前六个月申请。"},
   {en:"Can I do this online instead of in person?", ipa:"", zh:"我能在网上办而不是来现场吗？", tip:"大多数可以。"}]},
   {h:"ServiceOntario",p:"",items:[
   {en:"I'd like to apply for a health card. I have my PR card, a lease, and a bank statement.", ipa:"", zh:"我想申请健康卡。我有 PR 卡、租约和银行对账单。", tip:"需要三类文件：身份、居住、地址。"},
   {en:"I need to renew my driver's licence and update my address.", ipa:"", zh:"我需要续驾照和更新地址。", tip:"驾照 5 年一续，可以网上。"},
   {en:"I just bought a used car. I'd like to register it and get plates.", ipa:"", zh:"我刚买了二手车。我想登记并拿车牌。", tip:"需要 UVIP 包、安检证明、保险。"},
   {en:"I need a copy of my son's birth certificate. He was born in Toronto.", ipa:"", zh:"我需要我儿子的出生证明副本。他在多伦多出生。", tip:"网上申请，几周寄到。"},
   {en:"My health card expired. Can I still see a doctor?", ipa:"", zh:"我的健康卡过期了。还能看医生吗？", tip:"过期的红白卡还能用一段时间，但尽快换。"}]},
   {h:"排队、预约与问题",p:"",items:[
   {en:"Do I need an appointment, or can I walk in?", ipa:"", zh:"需要预约还是可以直接来？", tip:""},
   {en:"How long is the wait right now?", ipa:"", zh:"现在要等多久？", tip:""},

   {en:"I'm sorry, we can't accept a photocopy. We need the original document.", ipa:"", zh:"抱歉，我们不能接受复印件。需要原件。", tip:"带原件！"},
   {en:"Your name on this document doesn't match your passport. Do you have a name change certificate?", ipa:"", zh:"这份文件上的名字和护照不一致。你有更名证明吗？", tip:"中文名拼写不一致是常见问题。"},
   {en:"Could you write down exactly what I need to bring next time?", ipa:"", zh:"能写下我下次具体要带什么吗？", tip:"被打回来时问这句，省一趟。"}]}],

   {t:"listen",q:"听一听，工作人员说什么？",say:"We can't accept a photocopy. We need the original document.",opts:["要原件，不要复印件","要复印件","要翻译件","要照片"],a:0},

   {t:"type",q:"翻译：需要预约还是可以直接来？",a:"Do I need an appointment, or can I walk in?",alt:["Do I need an appointment, or can I walk in","Do I need an appointment or can I walk in?","Do I need an appointment?"]},
   {t:"type",q:"听写这个词（“原件”）。",say:"original",a:"original"}],

{ id:"l15c4", lv:15, title:"移民事务：续 PR 卡、担保父母与 IRCC", goal:"能处理续 PR 卡、申请入籍、担保家人、查申请状态，并和 IRCC 沟通，识别移民骗局。",
  intro:"移民事务是新移民最紧张的政府事务，因为<b>后果大、等得久、规则变</b>。本章不是法律建议，是<b>语言</b>：怎么说清楚你的申请、怎么查状态、怎么回应 IRCC 的信、怎么识别骗局（“交钱保证通过”都是假的）。核心词：<b>IRCC</b>（移民部）、<b>PR card</b>、<b>residency obligation</b>（居住义务，5 年内住满 730 天）、<b>sponsor</b>（担保）、<b>webform</b>（网上查询表）。",
  learn:[{h:"PR 卡与入籍",p:"",items:[
   {en:"My PR card expires in six months. I'd like to renew it.", ipa:"", zh:"我的 PR 卡六个月后过期。我想续。", tip:"过期不等于失去身份，但出国回不来。"},
   {en:"To keep PR status, you must be in Canada for at least seven hundred thirty days in every five years.", ipa:"", zh:"要保持 PR 身份，每五年必须在加拿大住满 730 天。", tip:"residency obligation。"},
   {en:"I've been a permanent resident for four years and I've met the physical presence requirement. I'd like to apply for citizenship.", ipa:"", zh:"我做永久居民四年了，满足实际居住要求。我想申请入籍。", tip:"5 年内住满 1095 天。"},
   {en:"I need to submit a travel history and proof of language ability.", ipa:"", zh:"我需要提交旅行记录和语言能力证明。", tip:"语言：CLB 4，可以用这门课的结业考试之外的正式成绩。"}]},
   {h:"担保家人",p:"",items:[
   {en:"I'd like to sponsor my parents through the Parents and Grandparents Program.", ipa:"", zh:"我想通过父母祖父母项目担保我父母。", tip:"sponsor = 担保。名额有限，抽签。"},
   {en:"What's the minimum income requirement for a family of four?", ipa:"", zh:"四口之家的最低收入要求是多少？", tip:"要看前三年的 NOA。"},
   {en:"The super visa lets parents stay up to five years at a time.", ipa:"", zh:"超级签证让父母一次最长待五年。", tip:"需要买私人医疗保险。"},
   {en:"I'm sponsoring my spouse. We've been married for two years and here's our proof of relationship.", ipa:"", zh:"我在担保我的配偶。我们结婚两年了，这是关系证明。", tip:"照片、聊天记录、共同账单。"}]},
   {h:"查状态、回信与防骗",p:"",items:[
   {en:"I'd like to check the status of my application. My UCI number is…", ipa:"", zh:"我想查申请状态。我的客户号是……", tip:"UCI = Unique Client Identifier。"},
   {en:"It's past the posted processing time. Can I submit a webform?", ipa:"", zh:"已经超过公布的处理时间了。我能提交网上查询吗？", tip:"webform 是官方的催问方式。"},
   {en:"I received a request for additional documents with a thirty-day deadline.", ipa:"", zh:"我收到补件要求，30 天期限。", tip:"错过期限申请会被拒。"},
   {en:"I'd like to request an extension. I'm waiting for a police certificate from China.", ipa:"", zh:"我想申请延期。我在等中国的无犯罪证明。", tip:"extension = 延期。"},
   {en:"Only licensed immigration consultants and lawyers can charge you for advice. Anyone who guarantees approval is a scam.", ipa:"", zh:"只有持牌移民顾问和律师可以收费提供建议。任何保证通过的都是骗局。", tip:"查 CICC 持牌名单。"},
   {en:"IRCC will never call you asking for payment over the phone.", ipa:"", zh:"IRCC 从不会打电话要你付款。", tip:""}]}],

  ex:[
   {t:"mc",q:"保持 PR 身份的居住要求是？",opts:["每 5 年住满 730 天","每年住满 6 个月","永远不能离开","每 5 年住满 365 天"],a:0},
   {t:"listen",q:"听一听，他要做什么？",say:"I'd like to sponsor my spouse.",opts:["担保配偶","担保父母","申请入籍","续 PR 卡"],a:0},

   {t:"type",q:"听写这个词（“担保”，动词）。",say:"sponsor",a:"sponsor"}],

},
{ id:"l15c5", lv:15, title:"法律与警察：小额法庭、交通罚单与法律援助", goal:"能处理交通罚单、小额法庭、和警察的基本对话，知道自己的权利，并找到免费法律帮助。",
  intro:"大多数人一生和法律的接触只有三种：<b>交通罚单</b>（可以争辩）、<b>小额法庭</b>（追讨 35,000 以下的钱，不用律师）、<b>和警察说话</b>（有权利）。本章教这三种的英语，以及<b>免费法律资源</b>：Legal Aid、社区法律诊所、律师协会的半小时免费咨询。原则：<b>冷静、礼貌、不签不懂的东西、可以要翻译和律师</b>。",

   {en:"I'd like to request disclosure of the evidence.", ipa:"", zh:"我想申请披露证据。", tip:"disclosure = 警方的记录。"},
   {en:"I'd like to plead guilty with an explanation.", ipa:"", zh:"我想认罪但做解释。", tip:"plead guilty = 认罪。可以争取减轻。"},

   {h:"小额法庭",p:"",items:[
   {en:"My contractor took a deposit of three thousand and never did the work. I'd like to file a claim in Small Claims Court.", ipa:"", zh:"我的承包商收了 3000 定金没干活。我想在小额法庭起诉。", tip:"安省上限 35,000。"},

{ id:"l15c6", lv:15, title:"第十五级结业：自己报一次税并解决一个政府问题", goal:"能独立完成一次报税（或在报税点全程英语沟通），并通过电话或现场解决一个真实的政府事务问题。",
  intro:"结业任务两件：① <b>报一次税</b>——用软件自己报，或去免费报税点全程英语沟通；② <b>解决一个政府问题</b>——打电话或去现场，处理一件真实的事（福利没到、证件问题、地址更新、申请状态）。本章补上<b>政府电话的套路</b>（语音菜单、等待、核实身份、要参考号）和<b>投诉与升级</b>（找主管、监察员、议员办公室）。",

{ id:"l16c1", lv:16, title:"加拿大简历：格式、动词与“本地经验”", goal:"能写一份加拿大格式的简历（resume），用强动词描述经历，并处理“没有加拿大经验”的问题。",
  intro:"加拿大简历和中国的完全不同：<b>没有照片、年龄、婚姻、国籍</b>；<b>一到两页</b>；每条经历用<b>动作动词 + 数字结果</b>（Reduced wait times by 30%）。最大的坎是“<b>没有加拿大经验</b>”——办法是：义工、合同工、实习、把中国经验用加拿大人懂的词写出来。本章教简历的每一部分和那些<b>强动词</b>。",
  learn:[{h:"格式与禁忌",p:"",items:[
   {en:"Name, city, phone, email, LinkedIn. No photo, no age, no marital status.", ipa:"", zh:"姓名、城市、电话、邮箱、LinkedIn。不放照片、年龄、婚姻状况。", tip:"放了反而被扣分。"},
   {en:"Summary: Licensed electrician with eight years of experience in residential and commercial projects.", ipa:"", zh:"摘要：持牌电工，八年住宅和商业项目经验。", tip:"两到三句，放最上面。"},
   {en:"Reverse chronological order: most recent job first.", ipa:"", zh:"倒序：最近的工作放最前。", tip:""},
   {en:"Keep it to one page if you have under ten years of experience.", ipa:"", zh:"十年以下经验保持一页。", tip:""},
   {en:"Tailor your resume to each job posting. Use their keywords.", ipa:"", zh:"为每个职位定制简历。用他们的关键词。", tip:"tailor = 定制。很多公司用软件筛关键词。"}]},
   {h:"强动词与数字",p:"每条经历：动词 + 做了什么 + 结果。",items:[
   {en:"Managed a team of six cooks and reduced food waste by twenty percent.", ipa:"", zh:"管理六名厨师的团队，减少了 20% 的食物浪费。", tip:"managed、reduced 都是动作动词。"},
   {en:"Increased monthly sales by fifteen percent by introducing a loyalty program.", ipa:"", zh:"通过推出会员计划，月销售额提高 15%。", tip:"by + -ing 说明怎么做到的。"},
   {en:"Led, coordinated, implemented, improved, delivered, trained, resolved, achieved", ipa:"", zh:"领导、协调、实施、改进、交付、培训、解决、达成", tip:"不要用 responsible for、helped with。"},
   {en:"Processed over two hundred customer orders daily with ninety-nine percent accuracy.", ipa:"", zh:"每天处理 200 多个客户订单，准确率 99%。", tip:"数字让人相信。"},
   {en:"Trained twelve new employees on safety procedures.", ipa:"", zh:"培训了 12 名新员工的安全流程。", tip:""}]},
   {h:"“没有加拿大经验”",p:"",items:[
   {en:"My experience in Shanghai involved the same systems used here, including SAP and Excel.", ipa:"", zh:"我在上海的经验涉及这里使用的相同系统，包括 SAP 和 Excel。", tip:"把中国经验翻译成加拿大人认识的工具和标准。"},
   {en:"I've been volunteering at the food bank to build local references.", ipa:"", zh:"我一直在食物银行做义工来积累本地推荐人。", tip:"义工经验写进简历。"},
   {en:"I completed a bridging program for internationally trained accountants.", ipa:"", zh:"我完成了国际培训会计师的衔接项目。", tip:"bridging program = 给海外专业人士的衔接课程，很多免费。"},
   {en:"I'm open to contract or part-time roles to start.", ipa:"", zh:"我愿意从合同或兼职职位开始。", tip:"进门比起点高重要。"},
   {en:"My credentials were assessed by WES as equivalent to a Canadian bachelor's degree.", ipa:"", zh:"我的学历经 WES 评估等同于加拿大本科学位。", tip:"WES = 学历认证机构。credentials = 学历资质。"}]}],
  drills:[["Name, city, phone, email, LinkedIn. No photo, no age, no marital status.","格式"],["Licensed electrician with eight years of experience in residential and commercial projects.","摘要"],["Managed a team of six cooks and reduced food waste by twenty percent.","动词 + 数字"],["Led, coordinated, implemented, improved, delivered, trained","强动词"],["Tailor your resume to each job posting. Use their keywords.","定制"],["I'm open to contract or part-time roles to start.","灵活"]],
  ex:[
   {t:"mc",q:"加拿大简历上不应该有？",opts:["照片、年龄、婚姻状况","电话和邮箱","工作经历","技能"],a:0},
   {t:"listen",q:"听一听，这条经历的结果是？",say:"Increased monthly sales by fifteen percent.",opts:["月销售额提高 15%","月销售额下降 15%","销售了 15 个月","15% 的员工"],a:0},
   {t:"mc",q:"下面哪个是“强动词”写法？",opts:["Reduced wait times by 30%.","Responsible for wait times.","Helped with customers.","Was in charge of things."],a:0},
   {t:"listen",q:"听一听，他怎么处理“没有本地经验”？",say:"I've been volunteering at the food bank to build local references.",opts:["做义工积累本地推荐人","回国工作","等待","付钱买经验"],a:0},
   {t:"type",q:"翻译：为每个职位定制简历。（用 tailor）",a:"Tailor your resume to each job posting.",alt:["Tailor your resume to each job posting","Tailor your resume to each job.","tailor your resume to each job posting"]},
   {t:"type",q:"听写这个词（“学历资质”，复数）。",say:"credentials",a:"credentials"}],
  hw:[["改写三条","把你简历上的三条经历改成“强动词 + 数字结果”的英语。"],["写摘要","写一个三句的英语摘要：职业 + 年数 + 两个强项。"],["做一份简历","用加拿大格式做一份完整英语简历（一页），请一位本地人或 AI 检查。"]]
},
{ id:"l16c2", lv:16, title:"找工作的渠道：招聘网站、人脉与信息面谈", goal:"能看懂招聘广告、用招聘网站和 LinkedIn、通过人脉找工作、安排并进行信息面谈。",
  intro:"加拿大 <b>60% 以上的工作是通过人脉找到的</b>，不是投简历。所以本章一半讲<b>招聘广告和网站</b>（Indeed、LinkedIn、Job Bank），一半讲<b>人脉</b>：怎么请人喝咖啡聊行业（<b>informational interview</b>）、怎么在 LinkedIn 上联系陌生人、怎么让朋友内推（<b>referral</b>）。关键句：<b>I'm not asking for a job, I'd just love your advice.</b>——这句话会打开很多门。",
  learn:[{h:"招聘广告",p:"",items:[
   {en:"full-time, part-time, contract, permanent, temporary, remote, hybrid", ipa:"", zh:"全职、兼职、合同、长期、临时、远程、混合", tip:"hybrid = 部分在家部分在办公室。"},
   {en:"Requirements: three years of experience, valid G licence, ability to lift fifty pounds.", ipa:"", zh:"要求：三年经验、有效 G 驾照、能举 50 磅。", tip:"“要求”不是全部必须，符合 60% 就投。"},
   {en:"Assets: bilingual, forklift certification, experience with Salesforce.", ipa:"", zh:"加分项：双语、叉车证、Salesforce 经验。", tip:"assets = 加分项，不是必须。"},
   {en:"Salary range: fifty-five to sixty-five thousand, plus benefits.", ipa:"", zh:"薪资范围：5.5 到 6.5 万，加福利。", tip:"安省要求广告写薪资范围（部分）。"},
   {en:"To apply, submit your resume and cover letter through our careers page.", ipa:"", zh:"申请请通过我们的招聘页面提交简历和求职信。", tip:""}]},
   {h:"人脉与 LinkedIn",p:"",items:[
   {en:"Hi Sarah, I'm a newcomer accountant and I saw you work at Deloitte. Would you have fifteen minutes for a coffee or a call? I'd love your advice on breaking into the field here.", ipa:"", zh:"Sarah 你好，我是新移民会计师，看到你在德勤工作。能给我 15 分钟喝咖啡或打电话吗？我想请教怎么进入这里的行业。", tip:"LinkedIn 陌生人消息的模板。短、具体、只要建议。"},
   {en:"I'm not asking for a job. I'd just love to hear how you got started.", ipa:"", zh:"我不是在要工作。我只是想听听你是怎么开始的。", tip:"这句降低对方压力。"},
   {en:"Do you know anyone else I should talk to?", ipa:"", zh:"你知道还有谁我应该聊聊吗？", tip:"每次信息面谈结束必问。一个人变三个人。"},
   {en:"Would you be comfortable referring me for the opening on your team?", ipa:"", zh:"你愿意为你团队的空缺内推我吗？", tip:"referring = 内推。认识几次后再问。"},
   {en:"Thank you so much for your time. I'll let you know how it goes.", ipa:"", zh:"非常感谢你的时间。我会告诉你进展。", tip:"之后真的要更新，关系才会持续。"}]},
   {h:"信息面谈的问题",p:"",items:[
   {en:"What does a typical day look like in your role?", ipa:"", zh:"你的岗位平常一天是什么样的？", tip:""},
   {en:"What skills matter most that aren't in the job description?", ipa:"", zh:"职位描述里没写但最重要的技能是什么？", tip:""},
   {en:"How did you get your first job in Canada?", ipa:"", zh:"你在加拿大的第一份工作是怎么找到的？", tip:"对移民问这句，故事都很有用。"},
   {en:"If you were me, what would you do in the next three months?", ipa:"", zh:"如果你是我，接下来三个月你会做什么？", tip:""}]}],
  drills:[["full-time, part-time, contract, permanent, remote, hybrid","工作类型"],["Requirements: three years of experience. Assets: bilingual.","要求 / 加分"],["Would you have fifteen minutes for a coffee or a call? I'd love your advice.","LinkedIn 消息"],["I'm not asking for a job. I'd just love to hear how you got started.","降压"],["Do you know anyone else I should talk to?","必问"],["Would you be comfortable referring me for the opening on your team?","内推"]],

   {t:"listen",q:"听一听，这是什么工作安排？",say:"This is a hybrid role, three days in the office.",opts:["混合办公，三天在办公室","全远程","全职在办公室","三天工作制"],a:0},

{ id:"l16c3", lv:16, title:"求职信与申请：写、投、跟进", goal:"能写一封针对职位的求职信，在线提交申请，并恰当跟进。",
  intro:"求职信（cover letter）很多人不读，但<b>要求提交时不交会被淘汰</b>，而且写得好会被注意到。结构三段：<b>为什么这个公司</b>、<b>为什么是我</b>（两三个匹配的证据）、<b>下一步</b>。然后是<b>在线申请系统</b>（表格、问题、测评）和<b>跟进</b>——一周后一封短邮件，有礼貌有分寸。本章给你模板和每一步的句子。",
  learn:[{h:"求职信三段",p:"",items:[
   {en:"Dear Hiring Manager, I'm writing to apply for the Customer Service Representative position posted on Indeed.", ipa:"", zh:"招聘经理您好，我写信申请在 Indeed 上发布的客服代表职位。", tip:"知道名字就用名字。"},
   {en:"I've followed your company's work in sustainable packaging, and I'd be proud to be part of it.", ipa:"", zh:"我一直关注贵公司在可持续包装方面的工作，能成为其中一员我会很自豪。", tip:"第一段：为什么这个公司。具体一点。"},
   {en:"In my previous role, I handled over fifty calls a day and maintained a ninety-five percent satisfaction score.", ipa:"", zh:"在上一份工作中，我每天处理 50 多个电话，保持 95% 的满意度。", tip:"第二段：证据，和职位要求对应。"},
   {en:"I'm fluent in Mandarin and English, which would help serve your growing customer base.", ipa:"", zh:"我精通普通话和英语，这有助于服务贵公司不断增长的客户群。", tip:"把中文变成优势。"},
   {en:"I'd welcome the chance to discuss how I can contribute. Thank you for your consideration.", ipa:"", zh:"我很愿意有机会讨论我能如何贡献。感谢您的考虑。", tip:"第三段：下一步 + 感谢。"}]},
   {h:"在线申请",p:"",items:[
   {en:"Upload your resume in PDF format. Maximum file size: 5 MB.", ipa:"", zh:"以 PDF 格式上传简历。最大 5 MB。", tip:"永远用 PDF。"},
   {en:"Are you legally entitled to work in Canada? — Yes.", ipa:"", zh:"你是否有在加拿大合法工作的资格？——是。", tip:"PR 和公民都答 Yes。"},

{ id:"l16c4", lv:16, title:"面试进阶：行为面试、STAR 法与难题", goal:"能用 STAR 法回答行为面试题，处理“最大的弱点”“为什么离开”等难题，并在视频和小组面试中表现得体。",
  intro:"第三级学了基础面试，这一级学<b>加拿大公司最常用的行为面试</b>（behavioural interview）：“Tell me about a time when…”——他们要听<b>真实的故事</b>。答案用 <b>STAR</b>：<b>Situation</b>（情况）、<b>Task</b>（任务）、<b>Action</b>（我做了什么）、<b>Result</b>（结果，有数字）。本章还教<b>难题</b>（弱点、离职原因、空档期、薪资）和<b>视频/小组面试</b>的技巧。",
  learn:[{h:"STAR 法",p:"准备五个故事，每个 60 到 90 秒。",items:[
   {en:"Tell me about a time when you dealt with a difficult customer.", ipa:"", zh:"讲一次你处理难缠客户的经历。", tip:"典型的行为面试题。"},
   {en:"Situation: Last year, a customer was upset because her order arrived two days late.", ipa:"", zh:"情况：去年，一位客户因为订单晚到两天很生气。", tip:"一两句，具体。"},
   {en:"Task: As the shift lead, I needed to resolve it without a manager present.", ipa:"", zh:"任务：作为班长，我需要在没有经理在场的情况下解决。", tip:"说明你的责任。"},
   {en:"Action: I listened without interrupting, apologized, and offered a refund on shipping plus a discount on her next order.", ipa:"", zh:"行动：我不打断地听完，道歉，并提供运费退款加下次订单折扣。", tip:"最长的部分。用 I，不用 we。"},
   {en:"Result: She left a five-star review and became a repeat customer.", ipa:"", zh:"结果：她留了五星评价，成了回头客。", tip:"有可衡量的结果。"}]},
   {h:"难题",p:"",items:[
   {en:"What's your biggest weakness? — I used to say yes to everything. I've learned to prioritize and now I use a weekly plan.", ipa:"", zh:"你最大的弱点？——我以前什么都答应。我学会了排优先级，现在用每周计划。", tip:"真实的弱点 + 你怎么改进。不说“我太追求完美”。"},
   {en:"Why did you leave your last job? — I moved to Canada, and I'm looking for a role where I can grow long-term.", ipa:"", zh:"你为什么离开上一份工作？——我搬来了加拿大，在找能长期成长的职位。", tip:"永远不说前雇主坏话。"},
   {en:"There's a gap in your resume. — Yes, I spent that year settling my family and improving my English. I also volunteered.", ipa:"", zh:"你的简历有空档。——是的，那一年我安顿家庭、提高英语。我也做了义工。", tip:"诚实、简短、说做了什么。"},
   {en:"Where do you see yourself in five years? — I'd like to be a team lead here, and I'm willing to get the certifications to get there.", ipa:"", zh:"五年后你想在哪？——我想在这里做团队主管，愿意考相关证书。", tip:"和这家公司有关。"},
   {en:"Can you tell me about your English level? — I'm still improving, but I handle customer calls and emails daily without issues.", ipa:"", zh:"能说说你的英语水平吗？——还在提高，但我每天处理客户电话和邮件没有问题。", tip:"自信 + 证据。"}]},
   {h:"视频与小组面试",p:"",items:[
   {en:"Can you hear me okay? I'll use headphones to make sure the audio is clear.", ipa:"", zh:"能听清我吗？我用耳机确保声音清晰。", tip:"视频面试：看摄像头，背景干净。"},
   {en:"I'd like to build on what Maria said and add one point.", ipa:"", zh:"我想在 Maria 说的基础上补充一点。", tip:"小组面试：引用别人 + 补充，比打断好。"},
   {en:"That's a good question. Let me think for a second.", ipa:"", zh:"好问题。让我想一下。", tip:"停两秒比乱答好。"},
   {en:"Could you repeat that? I want to make sure I understand.", ipa:"", zh:"能再说一遍吗？我想确保理解。", tip:""},
   {en:"What does success look like in this role in the first ninety days?", ipa:"", zh:"这个职位头 90 天的成功是什么样的？", tip:"反问面试官最好的问题之一。"}]}],
  drills:[["Tell me about a time when you dealt with a difficult customer.","行为面试题"],["Situation: a customer was upset because her order arrived two days late. Task: I needed to resolve it without a manager present.","S + T"],["Action: I listened, apologized, and offered a refund on shipping. Result: She became a repeat customer.","A + R"],["What's your biggest weakness? I used to say yes to everything. I've learned to prioritize.","弱点"],["Why did you leave your last job? I moved to Canada, and I'm looking for a role where I can grow long-term.","离职原因"],["What does success look like in this role in the first ninety days?","反问"]],
  ex:[
   {t:"mc",q:"STAR 的四部分是？",opts:["Situation, Task, Action, Result","Start, Talk, Answer, Repeat","Skill, Team, Attitude, Role","Story, Time, Age, Reason"],a:0},
   {t:"listen",q:"听一听，这是 STAR 的哪部分？",say:"She left a five-star review and became a repeat customer.",opts:["Result（结果）","Situation（情况）","Task（任务）","Action（行动）"],a:0},
   {t:"mc",q:"被问“最大的弱点”，最好的回答方式是？",opts:["真实的弱点 + 你怎么改进","说没有弱点","说“我太追求完美”","说前老板的问题"],a:0},
   {t:"listen",q:"听一听，他对英语水平怎么说？",say:"I'm still improving, but I handle customer calls and emails daily without issues.",opts:["还在提高，但每天处理电话邮件没问题","英语很差","英语完美","不想说"],a:0},
   {t:"type",q:"翻译：好问题。让我想一下。",a:"That's a good question. Let me think for a second.",alt:["That's a good question. Let me think for a second","Good question. Let me think for a second.","That's a good question, let me think for a second."]},
   {t:"type",q:"听写这个词（“排优先级”）。",say:"prioritize",a:"prioritize"}],
  hw:[["五个 STAR","写五个 STAR 故事（难缠客户、解决问题、团队冲突、学新东西、犯错改正），各 60 到 90 秒。"],["难题答案","写下四个难题的答案（弱点、离职、空档、五年），录音听自己是否自然。"],["模拟面试（必做）","请朋友用行为面试题面试你 20 分钟（视频也行），要求对方问至少一个追问 Why?"]]
},
{ id:"l16c5", lv:16, title:"录用、薪资谈判与入职", goal:"能理解录用信（offer letter），谈判薪资和待遇，办理入职文件，了解试用期和福利。",
  intro:"拿到录用（offer）是开始，不是结束。<b>录用信要读懂</b>：薪资、福利、假期、试用期、开始日期。<b>可以谈</b>——加拿大雇主预期你会谈，谈得礼貌不会收回录用。<b>入职文件</b>：TD1（税表）、直接存款、SIN。<b>试用期</b>（probation，通常三个月）内被解雇没有补偿。本章教读 offer、谈薪、入职和第一周的英语。",
  learn:[{h:"读懂录用信",p:"",items:[
   {en:"We're pleased to offer you the position of Account Coordinator at an annual salary of fifty-two thousand dollars.", ipa:"", zh:"我们很高兴为你提供客户协调员职位，年薪 5.2 万。", tip:"annual = 年。"},
   {en:"Benefits include extended health and dental after three months, and three weeks of vacation.", ipa:"", zh:"福利包括三个月后的扩展医疗和牙科，以及三周假期。", tip:"安省法定最少两周。三周算好。"},
   {en:"This offer is conditional on a background check and references.", ipa:"", zh:"此录用以背景调查和推荐人核实为条件。", tip:""},
   {en:"Your start date is March fourth. The first three months are a probationary period.", ipa:"", zh:"你的开始日期是 3 月 4 日。头三个月是试用期。", tip:"probationary 读 pro-BAY-shun-air-ee。"},
   {en:"Please sign and return this letter by February twentieth.", ipa:"", zh:"请在 2 月 20 日前签字并寄回。", tip:"可以要求几天考虑。"}]},
   {h:"谈薪资",p:"礼貌、有依据、谈整体。",items:[
   {en:"Thank you so much. I'm excited about the role. Could I have a couple of days to review the offer?", ipa:"", zh:"非常感谢。我对这个职位很兴奋。能给我几天看一下录用信吗？", tip:"先热情，再要时间。"},
   {en:"Based on my research and my experience, I was hoping for something closer to fifty-eight thousand. Is there flexibility?", ipa:"", zh:"根据我的调查和经验，我希望接近 5.8 万。有灵活空间吗？", tip:"给一个具体数字和依据。"},
   {en:"If the salary is fixed, would you consider an extra week of vacation or a signing bonus?", ipa:"", zh:"如果薪资固定，你们会考虑多一周假期或签约奖金吗？", tip:"谈不了钱谈别的。"},
   {en:"Could we schedule a salary review after six months?", ipa:"", zh:"我们能安排六个月后的薪资回顾吗？", tip:"要写进 offer。"},
   {en:"That works for me. I'm happy to accept. Could you send the updated letter?", ipa:"", zh:"可以。我很高兴接受。能发更新的录用信吗？", tip:"谈成要书面。"}]},
   {h:"入职与第一周",p:"",items:[
   {en:"Please bring your SIN, a void cheque for direct deposit, and two pieces of ID.", ipa:"", zh:"请带 SIN、用于直接存款的作废支票和两份证件。", tip:"void cheque = 写了 VOID 的支票，银行 App 能下载。"},
   {en:"Fill out the TD1 forms so we can calculate your tax deductions.", ipa:"", zh:"填 TD1 表，我们好计算你的扣税。", tip:"联邦和省各一张。基本填法：只填基本额度。"},
   {en:"Who should I go to if I have questions in my first week?", ipa:"", zh:"第一周有问题我该找谁？", tip:""},
   {en:"I'd like to set up a quick check-in with you at the end of each week for the first month.", ipa:"", zh:"我想在第一个月每周末和你做个简短的检查。", tip:"主动要反馈，试用期更安全。"},
   {en:"Thanks for showing me around. I'm looking forward to working with everyone.", ipa:"", zh:"谢谢带我参观。期待和大家一起工作。", tip:"第一天对每个人说。"}]}],
  drills:[["We're pleased to offer you the position at an annual salary of fifty-two thousand dollars.","录用"],["The first three months are a probationary period.","试用期"],["Thank you so much. I'm excited about the role. Could I have a couple of days to review the offer?","要时间"],["Based on my research and my experience, I was hoping for something closer to fifty-eight thousand. Is there flexibility?","谈薪"],["If the salary is fixed, would you consider an extra week of vacation?","谈福利"],["Who should I go to if I have questions in my first week?","入职"]],
  ex:[
   {t:"listen",q:"听一听，年薪多少？",say:"We're pleased to offer you the position at an annual salary of forty-eight thousand dollars.",opts:["4.8 万","8.4 万","4 万 8 百","48 万"],a:0},
   {t:"mc",q:"“probationary period” 是？",opts:["试用期","假期","培训期","合同期"],a:0},
   {t:"listen",q:"听一听，他在谈什么？",say:"Would you consider an extra week of vacation or a signing bonus?",opts:["多一周假期或签约奖金","涨薪","换职位","远程工作"],a:0},
   {t:"mc",q:"收到 offer 后想谈薪资，第一句应该？",opts:["先表达感谢和兴奋，再要几天时间","直接说太低","马上签","不回复"],a:0},
   {t:"type",q:"翻译：有灵活空间吗？",a:"Is there flexibility?",alt:["Is there flexibility","Is there any flexibility?","is there flexibility"]},
   {t:"type",q:"听写这个词（“福利”，复数）。",say:"benefits",a:"benefits"}],
  hw:[["读一封 offer","找一封英文录用信样本，用英语读出：薪资、福利、假期、试用期、开始日期、条件。"],["查市场价","在 Glassdoor 或 Job Bank 查你职位的薪资范围，用英语写下一句谈薪的依据。"],["演练谈薪","请朋友扮演 HR，你用本章句子谈一次薪资（要求一个数字 + 一个福利）。"]]
},
{ id:"l16c6", lv:16, title:"第十六级结业：一次完整的求职", goal:"完成一次真实的求职流程：找职位、定制简历和求职信、申请、人脉联系、面试、跟进，并复盘。",
  intro:"结业任务：<b>一次真实、完整的求职</b>——不一定要拿到，但每一步都要做。本章补上<b>被拒后的复盘</b>（要反馈、改简历）、<b>在职找工作</b>（保密、推荐人）和<b>职业发展</b>（证书、行业协会、加薪谈判）。加拿大找工作平均要三到六个月，<b>被拒 20 次很正常</b>；每次被拒都是改进简历和面试的数据。",
  learn:[{h:"被拒与复盘",p:"",items:[
   {en:"Thank you for letting me know. Could you share any feedback on my interview?", ipa:"", zh:"谢谢告知。能分享一下对我面试的反馈吗？", tip:"三分之一的人会回。"},
   {en:"The feedback was that I needed more examples with numbers. I've rewritten my STAR stories.", ipa:"", zh:"反馈是我需要更多带数字的例子。我重写了 STAR 故事。", tip:"把反馈变成行动。"},
   {en:"I've applied to forty jobs, had six interviews, and two second rounds. The numbers are improving.", ipa:"", zh:"我投了 40 份，六次面试，两次二面。数字在变好。", tip:"追踪数字，不是感觉。"},
   {en:"Please keep me in mind if something opens up.", ipa:"", zh:"如果有空缺请记得我。", tip:"对面试过你的公司说。"}]},
   {h:"在职找工作与推荐人",p:"",items:[
   {en:"I'm currently employed, so I'd appreciate it if you kept my application confidential.", ipa:"", zh:"我目前在职，希望你们对我的申请保密。", tip:"confidential = 保密。"},
   {en:"Would you be willing to be a reference for me? I'll let you know when to expect a call.", ipa:"", zh:"你愿意做我的推荐人吗？我会告诉你什么时候会接到电话。", tip:"先问，再给对方信息。"},
   {en:"My references are my former manager and a colleague. Their contact details are attached.", ipa:"", zh:"我的推荐人是前经理和一位同事。联系方式附上。", tip:"三个推荐人，提前通知。"},
   {en:"I'd like to give two weeks' notice. My last day will be the fifteenth.", ipa:"", zh:"我想提前两周通知。最后一天是 15 号。", tip:"辞职的标准说法。书面。"}]},
   {h:"职业发展",p:"",items:[
   {en:"I'm working toward my PMP certification to move into project management.", ipa:"", zh:"我在考 PMP 证书，想转向项目管理。", tip:"working toward = 正在努力争取。"},
   {en:"I joined the professional association to meet people in the field.", ipa:"", zh:"我加入了行业协会来认识同行。", tip:""},
   {en:"I've taken on more responsibility this year. I'd like to discuss adjusting my salary to reflect that.", ipa:"", zh:"今年我承担了更多责任。我想讨论调整薪资来反映这一点。", tip:"加薪谈判开场。带证据。"},
   {en:"What would I need to demonstrate to be considered for the senior role?", ipa:"", zh:"我需要展示什么才能被考虑升到高级职位？", tip:"问清路径。"},
   {en:"I've grown a lot here, and I'm ready for the next challenge.", ipa:"", zh:"我在这里成长了很多，准备好迎接下一个挑战了。", tip:"内部晋升或离职都能用。"}]}],
  drills:[["Thank you for letting me know. Could you share any feedback on my interview?","要反馈"],["I've applied to forty jobs, had six interviews, and two second rounds.","追踪数字"],["I'm currently employed, so I'd appreciate it if you kept my application confidential.","保密"],["Would you be willing to be a reference for me?","推荐人"],["I'd like to give two weeks' notice. My last day will be the fifteenth.","辞职"],["I've taken on more responsibility this year. I'd like to discuss adjusting my salary to reflect that.","加薪"]],
  ex:[
   {t:"mc",q:"被拒后最有用的做法是？",opts:["礼貌地要反馈并改进","放弃","争辩","再投同一个职位"],a:0},
   {t:"listen",q:"听一听，他要求什么？",say:"I'd appreciate it if you kept my application confidential.",opts:["对申请保密","加快流程","涨薪","远程面试"],a:0},
   {t:"mc",q:"加拿大辞职的标准通知期是？",opts:["两周","一天","三个月","不用通知"],a:0},
   {t:"listen",q:"听一听，他在做什么？",say:"I'm working toward my PMP certification.",opts:["在考 PMP 证书","已经有 PMP","放弃 PMP","教 PMP"],a:0},
   {t:"type",q:"翻译：如果有空缺请记得我。",a:"Please keep me in mind if something opens up.",alt:["Please keep me in mind if something opens up","Keep me in mind if something opens up.","Please keep me in mind."]},
   {t:"type",q:"听写这个词（“保密的”）。",say:"confidential",a:"confidential"}],
  hw:[["建一个追踪表","用英语建一个求职追踪表：公司、职位、日期、状态、联系人、下一步。"],["完整求职（必做）","在四周内完成：10 份定制申请、3 次人脉联系、至少 1 次面试（真实或模拟）、1 次跟进、1 次要反馈。"],["复盘","四周后用英语写一页复盘：数字、最有用的一句话、最大的改进、下一步计划。"]]
